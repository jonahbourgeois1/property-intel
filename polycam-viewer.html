<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Polycam viewer</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%;
    background: #0e1218; color: #e7ecf2;
    font-family: "Segoe UI", system-ui, sans-serif;
  }
  body { display: flex; flex-direction: column; }
  header {
    display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
    padding: 12px 16px; background: #141a22;
    border-bottom: 1px solid rgba(255,255,255,0.08);
  }
  h1 { font-size: 16px; font-weight: 650; margin: 0 4px 0 0; }
  #build {
    font-family: ui-monospace, Consolas, monospace;
    font-size: 11px; color: #8b97a8;
    border: 1px solid rgba(255,255,255,0.14);
    border-radius: 999px; padding: 3px 8px;
  }
  .tabs { display: flex; gap: 4px; }
  button {
    font: inherit; color: inherit; background: #1c2531;
    border: 1px solid rgba(255,255,255,0.14);
    border-radius: 8px; padding: 7px 12px; cursor: pointer;
  }
  button.on { background: #1d4e89; border-color: #1d4e89; }
  #status { margin-left: auto; font-size: 13px; color: #f0c36a; }
  #layout {
    flex: 1; min-height: 0;
    display: grid; grid-template-columns: minmax(280px, 42%) 1fr;
  }
  #plan, #model { min-height: 0; min-width: 0; position: relative; }
  #plan {
    background: #f4f1ea; border-right: 1px solid rgba(255,255,255,0.08);
    overflow: hidden; cursor: grab;
  }
  #plan.dragging { cursor: grabbing; }
  #plan-stage {
    width: 100%; height: 100%;
    display: flex; align-items: center; justify-content: center;
  }
  #plan-img {
    width: 92%; height: 92%; object-fit: contain;
    transform-origin: center center; user-select: none;
    pointer-events: none;
  }
  #model { background: #111318; overflow: hidden; }
  #model canvas { display: block; width: 100%; height: 100%; }
  #loading, #err {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 8px; color: #8b97a8; font-size: 13px; pointer-events: none;
  }
  #loading[hidden], #err[hidden] { display: none; }
  #err { color: #f0a8a8; pointer-events: auto; padding: 24px; text-align: center; }
  body.mode-plan #layout,
  body.mode-model #layout { grid-template-columns: 1fr; }
  body.mode-plan #model { display: none; }
  body.mode-model #plan { display: none; }
  @media (max-width: 800px) {
    #layout { grid-template-columns: 1fr; }
    #status { margin-left: 0; flex-basis: 100%; }
  }
</style>
</head>
<body>
<header>
  <h1>Interior scan</h1>
  <span id="build">polycam-viewer 3</span>
  <div class="tabs">
    <button id="tab-both" class="on" type="button">Both</button>
    <button id="tab-plan" type="button">Floor plan</button>
    <button id="tab-model" type="button">3D</button>
  </div>
  <button id="ceiling" type="button">Hide ceiling</button>
  <button id="plan3d" type="button">3D plan</button>
  <button id="top" type="button">Top</button>
  <button id="reset" type="button">Reset</button>
  <span id="status"></span>
</header>
<div id="layout">
  <section id="plan" aria-label="Floor plan">
    <div id="plan-stage"><img id="plan-img" alt="Floor plan" src="polycam/floorplan.svg" draggable="false"></div>
  </section>
  <section id="model" aria-label="3D model">
    <div id="loading">Loading model… <span id="progress"></span></div>
    <div id="err" hidden></div>
  </section>
</div>
<script type="importmap">
{ "imports": { "three": "https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.module.js" } }
</script>
<script type="module">
const BUILD = 'polycam-viewer 3';
import * as THREE from 'three';
const BASE = 'https://cdn.jsdelivr.net/npm/three@0.128.0/examples/jsm';
const { GLTFLoader } = await import(BASE + '/loaders/GLTFLoader.js');
const { OrbitControls } = await import(BASE + '/controls/OrbitControls.js');

const $ = (id) => document.getElementById(id);
const statusEl = $('status');
const plan = $('plan');
const planImg = $('plan-img');
const modelEl = $('model');

function setMode(mode) {
  document.body.classList.remove('mode-both', 'mode-plan', 'mode-model');
  document.body.classList.add('mode-' + mode);
  ['both', 'plan', 'model'].forEach((name) => {
    $('tab-' + name).classList.toggle('on', name === mode);
  });
  requestAnimationFrame(function () { requestAnimationFrame(resize); });
}
$('tab-both').addEventListener('click', () => setMode('both'));
$('tab-plan').addEventListener('click', () => setMode('plan'));
$('tab-model').addEventListener('click', () => setMode('model'));
setMode('both');

let planScale = 1, planX = 0, planY = 0;
function applyPlan() {
  planImg.style.transform = 'translate(' + planX + 'px,' + planY + 'px) scale(' + planScale + ')';
}
plan.addEventListener('wheel', (e) => {
  e.preventDefault();
  const next = planScale * (e.deltaY < 0 ? 1.12 : 1 / 1.12);
  planScale = Math.min(8, Math.max(0.4, next));
  applyPlan();
}, { passive: false });
let drag = null;
plan.addEventListener('pointerdown', (e) => {
  drag = { x: e.clientX, y: e.clientY, px: planX, py: planY };
  plan.classList.add('dragging');
  plan.setPointerCapture(e.pointerId);
});
plan.addEventListener('pointermove', (e) => {
  if (!drag) return;
  planX = drag.px + (e.clientX - drag.x);
  planY = drag.py + (e.clientY - drag.y);
  applyPlan();
});
function endDrag() { drag = null; plan.classList.remove('dragging'); }
plan.addEventListener('pointerup', endDrag);
plan.addEventListener('pointercancel', endDrag);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.5));
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.localClippingEnabled = true;
renderer.setClearColor(0x111318);
modelEl.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, 1, 0.05, 500);
camera.up.set(0, 1, 0);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
scene.add(new THREE.HemisphereLight(0xffffff, 0x445566, 0.9));
const sun = new THREE.DirectionalLight(0xffffff, 0.65);
sun.position.set(2, 4, 3);
scene.add(sun);

let home = null;
let frame = null;
let materials = [];
let ceilingOff = false;
const ceilingPlane = new THREE.Plane(new THREE.Vector3(0, -1, 0), 0);
function resize() {
  const w = modelEl.clientWidth, h = modelEl.clientHeight;
  if (w < 2 || h < 2) return;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);

function remember() {
  home = {
    pos: camera.position.clone(),
    target: controls.target.clone(),
    up: camera.up.clone()
  };
}
function goHome() {
  if (!home) return;
  camera.up.copy(home.up);
  camera.position.copy(home.pos);
  controls.target.copy(home.target);
  camera.updateProjectionMatrix();
  controls.update();
}
function look(pos, target, up) {
  camera.up.copy(up);
  camera.position.copy(pos);
  controls.target.copy(target);
  camera.updateProjectionMatrix();
  controls.update();
}
function setCeiling(off) {
  if (!frame) return;
  ceilingOff = off;
  ceilingPlane.constant = frame.cutY;
  materials.forEach((m) => {
    m.clippingPlanes = off ? [ceilingPlane] : null;
  });
  $('ceiling').classList.toggle('on', off);
  $('ceiling').textContent = off ? 'Show ceiling' : 'Hide ceiling';
}
function goTop() {
  if (!frame) return;
  $('plan3d').classList.remove('on');
  const c = frame.center;
  look(
    new THREE.Vector3(c.x, c.y + frame.dist, c.z),
    c,
    new THREE.Vector3(0, 0, -1)
  );
}
function goPlan3d() {
  if (!frame) return;
  setCeiling(true);
  if (document.body.classList.contains('mode-plan')) setMode('both');
  $('plan3d').classList.add('on');
  const c = frame.center;
  const eye = frame.floorY + frame.height * 0.35;
  look(
    new THREE.Vector3(c.x + frame.dist * 0.08, frame.cutY + frame.dist * 0.55, c.z + frame.dist * 0.72),
    new THREE.Vector3(c.x, eye, c.z),
    new THREE.Vector3(0, 1, 0)
  );
}
$('reset').addEventListener('click', () => {
  $('plan3d').classList.remove('on');
  setCeiling(false);
  goHome();
});
$('top').addEventListener('click', goTop);
$('ceiling').addEventListener('click', () => setCeiling(!ceilingOff));
$('plan3d').addEventListener('click', goPlan3d);

function showErr(msg) {
  $('loading').hidden = true;
  $('err').hidden = false;
  $('err').textContent = msg;
  statusEl.textContent = '';
}

const loader = new GLTFLoader();
loader.load('polycam/model.glb', (gltf) => {
  const root = gltf.scene;
  const seen = new Set();
  root.traverse((o) => {
    if (!o.isMesh) return;
    const list = Array.isArray(o.material) ? o.material : [o.material];
    list.forEach((m) => {
      if (!m || seen.has(m)) return;
      seen.add(m);
      m.side = THREE.DoubleSide;
      if (m.isMeshStandardMaterial) {
        m.metalness = 0;
        m.roughness = 1;
      }
      materials.push(m);
    });
  });
  scene.add(root);
  const box = new THREE.Box3().setFromObject(root);
  const center = box.getCenter(new THREE.Vector3());
  const size = box.getSize(new THREE.Vector3());
  const span = Math.max(size.x, size.y, size.z, 0.01);
  const dist = (span / 2) / Math.tan((camera.fov * Math.PI / 180) / 2) * 1.4;
  camera.near = Math.max(0.01, span / 200);
  camera.far = span * 30;
  camera.position.set(center.x + dist * 0.55, center.y + dist * 0.42, center.z + dist * 0.75);
  camera.lookAt(center);
  controls.target.copy(center);
  controls.update();
  const floorY = box.min.y;
  const height = Math.max(size.y, 0.01);
  frame = { center, dist, floorY, height, cutY: floorY + height * 0.55 };
  remember();
  $('loading').hidden = true;
  let count = 0;
  root.traverse((o) => {
    if (!o.isMesh || !o.geometry) return;
    const g = o.geometry;
    count += g.index ? g.index.count / 3 : (g.attributes.position ? g.attributes.position.count / 3 : 0);
  });
  statusEl.textContent = Math.round(count).toLocaleString() + ' triangles';
  statusEl.style.color = '#9fb0c3';
  resize();
}, (e) => {
  if (!e.lengthComputable || !e.total) return;
  $('progress').textContent = Math.round(100 * e.loaded / e.total) + '%';
}, (err) => {
  showErr('Could not load polycam/model.glb. ' + (err && err.message ? err.message : ''));
});

function tick() {
  requestAnimationFrame(tick);
  controls.update();
  renderer.render(scene, camera);
}
resize();
tick();
window.__polycamViewer = BUILD;
</script>
</body>
</html>

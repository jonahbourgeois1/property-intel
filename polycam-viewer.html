<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Polycam viewer</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%;
    background: #0e1218; color: #e7ecf2;
    font-family: "Segoe UI", system-ui, sans-serif;
  }
  body { display: flex; flex-direction: column; }
  header {
    display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
    padding: 12px 16px; background: #141a22;
    border-bottom: 1px solid rgba(255,255,255,0.08);
  }
  h1 { font-size: 16px; font-weight: 650; margin: 0 4px 0 0; }
  #build {
    font-family: ui-monospace, Consolas, monospace;
    font-size: 11px; color: #8b97a8;
    border: 1px solid rgba(255,255,255,0.14);
    border-radius: 999px; padding: 3px 8px;
  }
  .tabs { display: flex; gap: 4px; }
  button {
    font: inherit; color: inherit; background: #1c2531;
    border: 1px solid rgba(255,255,255,0.14);
    border-radius: 8px; padding: 7px 12px; cursor: pointer;
  }
  button.on { background: #1d4e89; border-color: #1d4e89; }
  #status { margin-left: auto; font-size: 13px; color: #f0c36a; }
  #layout {
    flex: 1; min-height: 0;
    display: grid; grid-template-columns: minmax(280px, 42%) 1fr;
  }
  #plan, #model { min-height: 0; min-width: 0; position: relative; }
  #plan {
    background: #f4f1ea; border-right: 1px solid rgba(255,255,255,0.08);
    overflow: hidden; cursor: grab;
  }
  #plan.dragging { cursor: grabbing; }
  #plan-stage {
    width: 100%; height: 100%;
    display: flex; align-items: center; justify-content: center;
  }
  #plan-img {
    width: 92%; height: 92%; object-fit: contain;
    transform-origin: center center; user-select: none;
    pointer-events: none;
  }
  #model { background: #111318; overflow: hidden; }
  #model canvas { display: block; width: 100%; height: 100%; }
  #loading, #err {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 8px; color: #8b97a8; font-size: 13px; pointer-events: none;
  }
  #loading[hidden], #err[hidden] { display: none; }
  #err { color: #f0a8a8; pointer-events: auto; padding: 24px; text-align: center; }
  body.mode-plan #layout,
  body.mode-model #layout { grid-template-columns: 1fr; }
  body.mode-plan #model { display: none; }
  body.mode-model #plan { display: none; }
  @media (max-width: 800px) {
    #layout { grid-template-columns: 1fr; }
    #status { margin-left: 0; flex-basis: 100%; }
  }
</style>
</head>
<body>
<header>
  <h1>Interior scan</h1>
  <span id="build">polycam-viewer 4</span>
  <div class="tabs">
    <button id="tab-both" class="on" type="button">Both</button>
    <button id="tab-plan" type="button">Floor plan</button>
    <button id="tab-model" type="button">3D</button>
  </div>
  <button id="ceiling" type="button">Hide ceiling</button>
  <button id="plan3d" type="button">3D floor plan</button>
  <button id="top" type="button">Top</button>
  <button id="reset" type="button">Reset</button>
  <span id="status"></span>
</header>
<div id="layout">
  <section id="plan" aria-label="Floor plan">
    <div id="plan-stage"><img id="plan-img" alt="Floor plan" src="polycam/floorplan.svg" draggable="false"></div>
  </section>
  <section id="model" aria-label="3D model">
    <div id="loading">Loading model… <span id="progress"></span></div>
    <div id="err" hidden></div>
  </section>
</div>
<script type="importmap">
{ "imports": { "three": "https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.module.js" } }
</script>
<script type="module">
const BUILD = 'polycam-viewer 4';
import * as THREE from 'three';
const BASE = 'https://cdn.jsdelivr.net/npm/three@0.128.0/examples/jsm';
const { GLTFLoader } = await import(BASE + '/loaders/GLTFLoader.js');
const { OrbitControls } = await import(BASE + '/controls/OrbitControls.js');

const $ = (id) => document.getElementById(id);
const statusEl = $('status');
const plan = $('plan');
const planImg = $('plan-img');
const modelEl = $('model');

function setMode(mode) {
  document.body.classList.remove('mode-both', 'mode-plan', 'mode-model');
  document.body.classList.add('mode-' + mode);
  ['both', 'plan', 'model'].forEach((name) => {
    $('tab-' + name).classList.toggle('on', name === mode);
  });
  requestAnimationFrame(function () { requestAnimationFrame(resize); });
}
$('tab-both').addEventListener('click', () => setMode('both'));
$('tab-plan').addEventListener('click', () => setMode('plan'));
$('tab-model').addEventListener('click', () => setMode('model'));
setMode('both');

let planScale = 1, planX = 0, planY = 0;
function applyPlan() {
  planImg.style.transform = 'translate(' + planX + 'px,' + planY + 'px) scale(' + planScale + ')';
}
plan.addEventListener('wheel', (e) => {
  e.preventDefault();
  const next = planScale * (e.deltaY < 0 ? 1.12 : 1 / 1.12);
  planScale = Math.min(8, Math.max(0.4, next));
  applyPlan();
}, { passive: false });
let drag = null;
plan.addEventListener('pointerdown', (e) => {
  drag = { x: e.clientX, y: e.clientY, px: planX, py: planY };
  plan.classList.add('dragging');
  plan.setPointerCapture(e.pointerId);
});
plan.addEventListener('pointermove', (e) => {
  if (!drag) return;
  planX = drag.px + (e.clientX - drag.x);
  planY = drag.py + (e.clientY - drag.y);
  applyPlan();
});
function endDrag() { drag = null; plan.classList.remove('dragging'); }
plan.addEventListener('pointerup', endDrag);
plan.addEventListener('pointercancel', endDrag);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.5));
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.localClippingEnabled = true;
renderer.setClearColor(0x111318);
modelEl.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, 1, 0.05, 500);
camera.up.set(0, 1, 0);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
scene.add(new THREE.HemisphereLight(0xffffff, 0x445566, 0.9));
const sun = new THREE.DirectionalLight(0xffffff, 0.65);
sun.position.set(2, 4, 3);
scene.add(sun);

let home = null;
let scanFrame = null;
let planFrame = null;
let planMode = false;
let wantPlan = false;
let triLabel = '';
let materials = [];
let ceilingOff = false;
const ceilingPlane = new THREE.Plane(new THREE.Vector3(0, -1, 0), 0);
const scanRoot = new THREE.Group();
const planRoot = new THREE.Group();
const ceilingGroup = new THREE.Group();
scene.add(scanRoot);
scene.add(planRoot);
planRoot.add(ceilingGroup);
planRoot.visible = false;
function resize() {
  const w = modelEl.clientWidth, h = modelEl.clientHeight;
  if (w < 2 || h < 2) return;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);

function remember() {
  home = {
    pos: camera.position.clone(),
    target: controls.target.clone(),
    up: camera.up.clone()
  };
}
function look(pos, target, up) {
  const dist = Math.max(pos.distanceTo(target), 0.2);
  camera.near = Math.max(0.02, dist / 200);
  camera.far = dist * 40;
  camera.up.copy(up);
  camera.position.copy(pos);
  controls.target.copy(target);
  camera.updateProjectionMatrix();
  controls.update();
}
function goHome() {
  if (!home) return;
  look(home.pos, home.target, home.up);
}
function setCeiling(off) {
  ceilingOff = off;
  if (planMode) {
    ceilingGroup.visible = !off;
  } else if (scanFrame) {
    ceilingPlane.constant = scanFrame.cutY;
    materials.forEach((m) => {
      m.clippingPlanes = off ? [ceilingPlane] : null;
    });
  }
  $('ceiling').classList.toggle('on', off);
  $('ceiling').textContent = off ? 'Show ceiling' : 'Hide ceiling';
}
function activeFrame() {
  return planMode ? planFrame : scanFrame;
}
function goTop() {
  const framed = activeFrame();
  if (!framed) return;
  if (!planMode) $('plan3d').classList.remove('on');
  const c = framed.center;
  look(
    new THREE.Vector3(c.x, c.y + framed.dist, c.z),
    c,
    new THREE.Vector3(0, 0, -1)
  );
}
function showScan() {
  planMode = false;
  wantPlan = false;
  scanRoot.visible = true;
  planRoot.visible = false;
  $('plan3d').classList.remove('on');
  setCeiling(false);
  if (triLabel) statusEl.textContent = triLabel;
  goHome();
}
function enterPlan() {
  if (!planFrame) return;
  planMode = true;
  wantPlan = false;
  scanRoot.visible = false;
  planRoot.visible = true;
  setMode('model');
  $('plan3d').classList.add('on');
  setCeiling(true);
  const framed = planFrame;
  const c = framed.center;
  look(
    new THREE.Vector3(c.x + framed.dist * 0.2, framed.floorY + framed.dist * 0.72, c.z + framed.dist * 0.85),
    new THREE.Vector3(c.x, framed.floorY + framed.height * 0.28, c.z),
    new THREE.Vector3(0, 1, 0)
  );
  statusEl.textContent = '3D floor plan';
  statusEl.style.color = '#9fb0c3';
}
function goPlan3d() {
  if (planMode) {
    showScan();
    return;
  }
  if (!planFrame) {
    wantPlan = true;
    statusEl.textContent = 'Opening the 3D floor plan…';
    return;
  }
  enterPlan();
}
$('reset').addEventListener('click', () => {
  if (document.body.classList.contains('mode-plan')) setMode('both');
  showScan();
});
$('top').addEventListener('click', goTop);
$('ceiling').addEventListener('click', () => setCeiling(!ceilingOff));
$('plan3d').addEventListener('click', goPlan3d);

function showErr(msg) {
  $('loading').hidden = true;
  $('err').hidden = false;
  $('err').textContent = msg;
  statusEl.textContent = '';
}

function solid(color, extra) {
  return new THREE.MeshStandardMaterial(Object.assign({
    color: color,
    roughness: 1,
    metalness: 0,
    side: THREE.DoubleSide
  }, extra || {}));
}
function ringMesh(ring, height, material, y) {
  const shape = new THREE.Shape();
  shape.moveTo(ring[0][0], ring[0][1]);
  for (let i = 1; i < ring.length; i++) shape.lineTo(ring[i][0], ring[i][1]);
  const geo = new THREE.ExtrudeGeometry(shape, { depth: height, bevelEnabled: false });
  const mesh = new THREE.Mesh(geo, material);
  mesh.rotation.x = -Math.PI / 2;
  mesh.position.y = y;
  return mesh;
}
function addRings(rings, height, material, y, parent) {
  (rings || []).forEach((ring) => {
    if (!ring || ring.length < 3) return;
    try { parent.add(ringMesh(ring, height, material, y)); }
    catch (err) { /* a bad outline is skipped */ }
  });
}
function measure(object) {
  const box = new THREE.Box3().setFromObject(object);
  const center = box.getCenter(new THREE.Vector3());
  const size = box.getSize(new THREE.Vector3());
  const span = Math.max(size.x, size.y, size.z, 0.01);
  const dist = (span / 2) / Math.tan((camera.fov * Math.PI / 180) / 2) * 1.45;
  return {
    center: center,
    dist: dist,
    floorY: box.min.y,
    height: Math.max(size.y, 0.01),
    cutY: box.min.y + size.y * 0.55
  };
}
function buildPlan(data) {
  const wallH = data.wallHeight || 2.45;
  const floorColors = [0xf3efe6, 0xe4eef3, 0xf7efe4, 0xe7f0e8, 0xf6eee8];
  (data.floors || []).forEach((ring, i) => {
    try { planRoot.add(ringMesh(ring, 0.04, solid(floorColors[i % floorColors.length]), -0.04)); }
    catch (err) { /* a bad outline is skipped */ }
  });
  addRings(data.walls, wallH, solid(0xf7f8f6), 0, planRoot);
  addRings(data.doors, 2.05, solid(0xd7c4a3), 0, planRoot);
  addRings(data.windows, 1.15, solid(0x9ec9e0, { transparent: true, opacity: 0.45 }), 0.95, planRoot);
  (data.objects || []).forEach((obj) => {
    try { planRoot.add(ringMesh(obj.ring, obj.h || 0.6, solid(0xd5dbe3), 0)); }
    catch (err) { /* a bad outline is skipped */ }
  });
  addRings(data.floors, 0.05, solid(0xfbfbfb), wallH, ceilingGroup);
  ceilingGroup.visible = false;
  planFrame = measure(planRoot);
  if (wantPlan) enterPlan();
}
fetch('polycam/floorplan-3d.json')
  .then((res) => {
    if (!res.ok) throw new Error('HTTP ' + res.status);
    return res.json();
  })
  .then(buildPlan)
  .catch(() => {
    if (!triLabel && !planMode) statusEl.textContent = '3D floor plan failed to load';
  });

const loader = new GLTFLoader();
loader.load('polycam/model.glb', (gltf) => {
  const root = gltf.scene;
  const seen = new Set();
  root.traverse((o) => {
    if (!o.isMesh) return;
    const list = Array.isArray(o.material) ? o.material : [o.material];
    list.forEach((m) => {
      if (!m || seen.has(m)) return;
      seen.add(m);
      m.side = THREE.DoubleSide;
      if (m.isMeshStandardMaterial) {
        m.metalness = 0;
        m.roughness = 1;
      }
      materials.push(m);
    });
  });
  scanRoot.add(root);
  const box = new THREE.Box3().setFromObject(root);
  const center = box.getCenter(new THREE.Vector3());
  const size = box.getSize(new THREE.Vector3());
  const span = Math.max(size.x, size.y, size.z, 0.01);
  const dist = (span / 2) / Math.tan((camera.fov * Math.PI / 180) / 2) * 1.4;
  camera.near = Math.max(0.01, span / 200);
  camera.far = span * 30;
  camera.position.set(center.x + dist * 0.55, center.y + dist * 0.42, center.z + dist * 0.75);
  camera.lookAt(center);
  controls.target.copy(center);
  controls.update();
  const floorY = box.min.y;
  const height = Math.max(size.y, 0.01);
  scanFrame = { center, dist, floorY, height, cutY: floorY + height * 0.55 };
  remember();
  $('loading').hidden = true;
  let count = 0;
  root.traverse((o) => {
    if (!o.isMesh || !o.geometry) return;
    const g = o.geometry;
    count += g.index ? g.index.count / 3 : (g.attributes.position ? g.attributes.position.count / 3 : 0);
  });
  triLabel = Math.round(count).toLocaleString() + ' triangles';
  if (planMode) enterPlan();
  else {
    statusEl.textContent = triLabel;
    statusEl.style.color = '#9fb0c3';
  }
  resize();
}, (e) => {
  if (!e.lengthComputable || !e.total) return;
  $('progress').textContent = Math.round(100 * e.loaded / e.total) + '%';
}, (err) => {
  showErr('Could not load polycam/model.glb. ' + (err && err.message ? err.message : ''));
});

function tick() {
  requestAnimationFrame(tick);
  controls.update();
  renderer.render(scene, camera);
}
resize();
tick();
window.__polycamViewer = BUILD;
</script>
</body>
</html>

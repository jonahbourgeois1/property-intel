<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Named Review — Property Intel</title>
<!--
  golf-named.html — typed-label golf pins (v1.0.0)

  Sibling of golf-review.html. No catalog. Type a name (Green 1,
  Fairway 3, Clubhouse), click the map, drag to move.

  Saved as [{name, lat, lng}] in Golf column K only. Column H is
  untouched. Break out course sheet reads column K.

  Query params (same as the Golf Review link):
    site_no, lat, lng, addr
-->
<style>
  :root {
    --ground:    #1b2027;
    --panel:     #232a33;
    --panel-2:   #2b333e;
    --line:      #3a444f;
    --ink:       #eef2f6;
    --ink-dim:   #9aa7b4;
    --ink-faint: #667380;
    --marker:    #ffd23f;
    --marker-ink:#1b2027;
    --hot:       #4fd1c5;
    --bad:       #ef6f6f;
    --good:      #6ee7a8;
    --radius:    10px;
    --mono: ui-monospace, "SF Mono", "Cascadia Code", "Roboto Mono", Menlo, monospace;
    --sans: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; }
  body {
    background: var(--ground); color: var(--ink);
    font-family: var(--sans); font-size: 15px; line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  header {
    display: flex; align-items: baseline; gap: 14px;
    padding: 14px 20px; border-bottom: 1px solid var(--line); background: var(--panel);
  }
  header .kicker {
    font-family: var(--mono); font-size: 11px; letter-spacing: 0.18em;
    text-transform: uppercase; color: var(--ink-faint);
  }
  header h1 { font-size: 15px; font-weight: 600; margin: 0; }
  header .addr { color: var(--ink-dim); font-weight: 400; }
  header .count { margin-left: auto; font-family: var(--mono); font-size: 12px; color: var(--ink-dim); }
  header .count b { color: var(--marker); font-weight: 600; }
  header .build {
    font-family: var(--mono); font-size: 10px; letter-spacing: 0.08em;
    color: var(--ink-faint); border: 1px solid var(--line);
    border-radius: 5px; padding: 2px 6px; margin-left: 10px;
  }
  main {
    display: grid; grid-template-columns: minmax(0, 1fr) 360px;
    height: calc(100% - 51px);
  }
  @media (max-width: 900px) {
    html, body { height: auto; overflow: auto; }
    main { grid-template-columns: 1fr; height: auto; }
    .stage { min-height: 60vh; }
  }
  .stage { position: relative; overflow: hidden; background: #0a0c0f; }
  #map { position: absolute; inset: 0; }
  .stage.placing #map { cursor: crosshair; }
  .map-loading {
    position: absolute; inset: 0; z-index: 6;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
    background: #0a0c0f;
  }
  .map-loading.off { display: none; }
  .spinner {
    width: 32px; height: 32px; border: 2px solid var(--line); border-top-color: var(--hot);
    border-radius: 50%; animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .map-loading-text { font-family: var(--mono); font-size: 12px; color: var(--ink-faint); }
  .place-hint {
    position: absolute; left: 50%; top: 14px; transform: translateX(-50%);
    z-index: 7; display: none; padding: 8px 14px; border-radius: 8px;
    background: var(--hot); color: #10221f; font-size: 13px; font-weight: 600;
    max-width: calc(100% - 32px); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .place-hint.on { display: block; }
  .panel {
    background: var(--panel); border-left: 1px solid var(--line);
    display: flex; flex-direction: column; min-height: 0; min-width: 0;
  }
  .panel h2 {
    margin: 0; padding: 14px 18px 10px;
    font-family: var(--mono); font-size: 11px; letter-spacing: 0.16em;
    text-transform: uppercase; color: var(--ink-faint); border-bottom: 1px solid var(--line);
  }
  .panel-scroll { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 12px 18px 8px; }
  .hint {
    margin: 0 0 12px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 7px;
    background: var(--panel-2); font-size: 12px; color: var(--ink-dim); line-height: 1.45;
  }
  label.f { display: block; margin: 0 0 12px; }
  label.f span {
    display: block; font-family: var(--mono); font-size: 10px; letter-spacing: 0.12em;
    text-transform: uppercase; color: var(--ink-faint); margin-bottom: 4px;
  }
  input[type="text"] {
    width: 100%; height: 34px; padding: 6px 9px;
    background: var(--ground); color: var(--ink);
    border: 1px solid var(--line); border-radius: 7px;
    font-family: var(--sans); font-size: 14px;
  }
  input[type="text"]:focus { outline: none; border-color: var(--hot); }
  .placed-head {
    font-family: var(--mono); font-size: 10px; letter-spacing: 0.12em;
    text-transform: uppercase; color: var(--ink-faint); margin: 8px 0;
  }
  #pinList { list-style: none; margin: 0; padding: 0; }
  #pinList li {
    display: flex; align-items: flex-start; gap: 8px;
    padding: 7px 0; border-bottom: 1px solid var(--line);
  }
  #pinList .num {
    flex: 0 0 22px; font-family: var(--mono); font-size: 11px; font-weight: 700;
    color: var(--marker-ink); background: var(--marker); border-radius: 10px;
    text-align: center; line-height: 18px; margin-top: 8px;
  }
  #pinList .body { flex: 1 1 auto; min-width: 0; }
  #pinList input[type="text"] { height: 30px; font-size: 13px; }
  #pinList .meta { font-size: 11px; color: var(--ink-faint); margin-top: 3px; }
  #pinList .mini {
    margin-left: auto; margin-top: 4px;
    background: transparent; border: 1px solid var(--line);
    color: var(--ink-dim); border-radius: 6px; padding: 2px 7px; cursor: pointer; font-size: 12px;
  }
  #pinList .mini:hover { border-color: var(--bad); color: var(--bad); }
  .submit-bar {
    display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
    padding: 12px 18px; border-top: 1px solid var(--line);
  }
  .btn {
    background: var(--panel-2); color: var(--ink); border: 1px solid var(--line);
    border-radius: 8px; padding: 8px 14px; font-size: 13px; cursor: pointer;
  }
  .btn:hover { border-color: var(--hot); }
  .btn.primary { background: var(--hot); border-color: var(--hot); color: #10221f; font-weight: 600; }
  .btn[disabled] { opacity: 0.45; cursor: default; }
  .status {
    flex: 1 1 100%; font-family: var(--mono); font-size: 11px; line-height: 1.45;
    color: var(--ink-faint); word-break: break-word;
  }
  .status.ok { color: var(--good); }
  .status.err { color: var(--bad); }
  .error { padding: 40px 28px; color: var(--ink-dim); font-size: 15px; }
  .error code { display: block; margin-top: 10px; font-family: var(--mono); font-size: 12px; color: var(--bad); }
</style>
</head>
<body>
  <header>
    <span class="kicker">Golf · Named Review</span>
    <h1>Labels <span class="addr" id="addr"></span></h1>
    <span class="count" id="count"></span>
    <span class="build" id="build"></span>
  </header>
  <main>
    <section class="stage" id="stage">
      <div id="map"></div>
      <div class="map-loading" id="mapLoading">
        <div class="spinner"></div>
        <div class="map-loading-text">Loading map…</div>
      </div>
      <div class="place-hint" id="placeHint"></div>
    </section>
    <aside class="panel">
      <h2>Place a label</h2>
      <div class="panel-scroll">
        <div class="hint">Type a specific name, then click the map. Examples: Green 1, Fairway 3, Clubhouse. Drag a marker to move it. This saves to column K and does not change the catalog review.</div>
        <label class="f">
          <span>Name</span>
          <input type="text" id="nameInput" maxlength="80" placeholder="Green 1" autocomplete="off">
        </label>
        <div class="placed-head">Placed</div>
        <ol id="pinList"></ol>
      </div>
      <div class="submit-bar">
        <button type="button" class="btn primary" id="saveBtn">Save labels</button>
        <div class="status" id="status"></div>
      </div>
    </aside>
  </main>
<script>
(function () {
  var BUILD = 'v1.0.0';
  var PIN_HARD_LIMIT = 200;
  var NAME_MAX = 80;
  var GOLF_API_URL = 'https://script.google.com/macros/s/AKfycbzHkj4fNRBJ7839babxL2Gp1A2ka9Em05rOQRZUNg_X0lMrOAMEKtEXEXxuU9_u7iKERA/exec';
  var ER_MAPS_KEY = 'AIzaSyD2tWrnRhCaicAwtp_32xe5zG5YGuntfuI';

  function qp(name) {
    var m = new RegExp('[?&]' + name + '=([^&]*)').exec(window.location.search);
    return m ? decodeURIComponent(m[1].replace(/\+/g, ' ')) : null;
  }
  function escapeHtml(s) {
    return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;');
  }
  function round6(n) { return Math.round(Number(n) * 1e6) / 1e6; }
  function labelOf(raw) { return String(raw || '').replace(/\s+/g, ' ').trim(); }

  var siteNo = String(qp('site_no') || qp('site') || '').trim();
  var addr = qp('addr') || '';
  var startLat = parseFloat(qp('lat'));
  var startLng = parseFloat(qp('lng'));
  var placed = [];
  var map = null;
  var mapReady = false;
  var mapsStarted = false;
  var sheetApplied = false;
  var dirty = false;

  var buildEl = document.getElementById('build');
  if (buildEl) buildEl.textContent = BUILD;
  var addrEl = document.getElementById('addr');
  if (addrEl && addr) addrEl.textContent = addr;

  function setStatus(msg, kind) {
    var el = document.getElementById('status');
    if (!el) return;
    el.textContent = msg || '';
    el.className = 'status' + (kind ? ' ' + kind : '');
  }
  function hideMapLoading() {
    var el = document.getElementById('mapLoading');
    if (el) el.classList.add('off');
  }
  function fail(msg, detail) {
    var stage = document.getElementById('stage');
    if (stage) {
      stage.innerHTML = '<div class="error">' + escapeHtml(msg) +
        (detail ? '<code>' + escapeHtml(detail) + '</code>' : '') + '</div>';
    }
    setStatus(msg, 'err');
  }
  function updateCount() {
    var el = document.getElementById('count');
    if (el) el.innerHTML = '<b>' + placed.length + '</b> of ' + PIN_HARD_LIMIT;
  }
  function markerIcon() {
    return {
      path: google.maps.SymbolPath.CIRCLE,
      scale: 12,
      fillColor: '#ffd23f',
      fillOpacity: 1,
      strokeColor: '#1b2027',
      strokeWeight: 2
    };
  }
  function typedName() {
    var input = document.getElementById('nameInput');
    return labelOf(input ? input.value : '');
  }
  function refreshHint() {
    var hint = document.getElementById('placeHint');
    var stage = document.getElementById('stage');
    var name = typedName();
    if (!hint || !stage) return;
    if (name) {
      hint.textContent = 'Click the map to place “' + name + '”';
      hint.className = 'place-hint on';
      stage.className = 'stage placing';
    } else {
      hint.textContent = '';
      hint.className = 'place-hint';
      stage.className = 'stage';
    }
  }

  function renumber() {
    placed.forEach(function (rec, i) {
      rec.seq = i + 1;
      if (rec.marker) {
        rec.marker.setLabel({
          text: String(rec.seq),
          color: '#1b2027',
          fontSize: '11px',
          fontWeight: '700'
        });
        rec.marker.setZIndex(10 + rec.seq);
        rec.marker.setTitle(rec.name);
      }
    });
    renderList();
    updateCount();
  }

  function renderList() {
    var host = document.getElementById('pinList');
    if (!host) return;
    host.innerHTML = '';
    placed.forEach(function (rec, i) {
      var li = document.createElement('li');
      li.innerHTML =
        '<span class="num">' + rec.seq + '</span>' +
        '<span class="body"><input type="text" maxlength="' + NAME_MAX + '" value="' + escapeHtml(rec.name) + '">' +
        '<div class="meta">' + rec.lat.toFixed(6) + ', ' + rec.lng.toFixed(6) + '</div></span>' +
        '<button type="button" class="mini" title="Remove this pin">x</button>';
      var input = li.querySelector('input');
      input.addEventListener('click', function (e) { e.stopPropagation(); });
      input.addEventListener('input', function () {
        rec.name = labelOf(input.value);
        if (rec.marker) rec.marker.setTitle(rec.name || ('Pin ' + rec.seq));
        dirty = true;
      });
      input.addEventListener('keydown', function (e) { e.stopPropagation(); });
      li.addEventListener('click', function (e) {
        if (e.target && (e.target.tagName === 'INPUT' || e.target.classList.contains('mini'))) return;
        if (map && rec.marker) {
          map.panTo(rec.marker.getPosition());
          rec.marker.setAnimation(google.maps.Animation.BOUNCE);
          setTimeout(function () { rec.marker.setAnimation(null); }, 700);
        }
      });
      li.querySelector('.mini').addEventListener('click', function (e) {
        e.stopPropagation();
        removePin(i);
      });
      host.appendChild(li);
    });
  }

  function attachMarker(rec) {
    if (!map || rec.marker) return;
    rec.marker = new google.maps.Marker({
      map: map,
      position: { lat: rec.lat, lng: rec.lng },
      draggable: true,
      optimized: false,
      zIndex: 10 + rec.seq,
      icon: markerIcon(),
      label: {
        text: String(rec.seq),
        color: '#1b2027',
        fontSize: '11px',
        fontWeight: '700'
      },
      title: rec.name
    });
    rec.marker.addListener('dragend', function () {
      var pos = rec.marker.getPosition();
      rec.lat = round6(pos.lat());
      rec.lng = round6(pos.lng());
      dirty = true;
      renderList();
    });
  }

  function addPin(name, lat, lng) {
    if (placed.length >= PIN_HARD_LIMIT) {
      setStatus(PIN_HARD_LIMIT + ' pin limit reached.', 'err');
      return;
    }
    name = labelOf(name);
    if (!name) {
      setStatus('Type a name first.', 'err');
      return;
    }
    if (name.length > NAME_MAX) {
      setStatus('Name is longer than ' + NAME_MAX + ' characters.', 'err');
      return;
    }
    if (!isFinite(lat) || !isFinite(lng)) return;
    var rec = {
      name: name,
      lat: round6(lat),
      lng: round6(lng),
      seq: placed.length + 1,
      marker: null
    };
    placed.push(rec);
    if (mapReady) attachMarker(rec);
    dirty = true;
    var input = document.getElementById('nameInput');
    if (input) {
      input.value = '';
      input.focus();
    }
    refreshHint();
    renumber();
    setStatus('Placed ' + name + '.');
  }

  function removePin(index) {
    var rec = placed[index];
    if (!rec) return;
    if (rec.marker) rec.marker.setMap(null);
    placed.splice(index, 1);
    dirty = true;
    renumber();
  }

  function collectPins() {
    var bad = '';
    var pins = placed.map(function (p, i) {
      var name = labelOf(p.name);
      if (!name && !bad) bad = 'Pin ' + (i + 1) + ' needs a name.';
      return { name: name, lat: round6(p.lat), lng: round6(p.lng) };
    });
    return { pins: pins, bad: bad };
  }

  function savePins() {
    var collected = collectPins();
    if (collected.bad) {
      setStatus(collected.bad, 'err');
      return;
    }
    if (collected.pins.length > PIN_HARD_LIMIT) {
      setStatus('Refused: more than ' + PIN_HARD_LIMIT + ' pins.', 'err');
      return;
    }
    var body = {
      source: 'golf-named',
      version: BUILD,
      view: 'golf-named',
      route: 'golf-named-save',
      site_no: siteNo,
      address: addr || '',
      pins: collected.pins
    };
    setStatus('Saving…');
    var btn = document.getElementById('saveBtn');
    if (btn) btn.disabled = true;
    fetch(GOLF_API_URL + '?route=golf-named-save', {
      method: 'POST',
      redirect: 'follow',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(body)
    }).then(function (r) { return r.text(); })
      .then(function (t) {
        var j;
        try { j = JSON.parse(t); } catch (e) { throw new Error('Save did not return JSON'); }
        if (j && j.ok === false) throw new Error(j.error || 'Save failed');
        dirty = false;
        setStatus('Saved ' + ((j && j.count) || body.pins.length) + ' label(s) to column K.', 'ok');
      })
      .catch(function (err) {
        setStatus(String(err.message || err), 'err');
      })
      .then(function () {
        if (btn) btn.disabled = false;
      });
  }

  function initMap() {
    if (map) return;
    if (!isFinite(startLat) || !isFinite(startLng)) return;
    var g = google.maps;
    map = new g.Map(document.getElementById('map'), {
      center: { lat: startLat, lng: startLng },
      zoom: 16,
      mapTypeId: 'satellite',
      tilt: 0,
      rotateControl: false,
      streetViewControl: false,
      fullscreenControl: false,
      mapTypeControl: false,
      gestureHandling: 'greedy',
      clickableIcons: false
    });
    map.setTilt(0);
    new g.Marker({
      map: map,
      position: { lat: startLat, lng: startLng },
      draggable: false,
      clickable: false,
      zIndex: 1,
      title: 'Geocoded address',
      icon: {
        path: g.SymbolPath.CIRCLE,
        scale: 7,
        fillColor: '#3b82f6',
        fillOpacity: 1,
        strokeColor: '#ffffff',
        strokeWeight: 2
      }
    });
    g.event.addListenerOnce(map, 'tilesloaded', hideMapLoading);
    g.event.addListenerOnce(map, 'idle', hideMapLoading);
    setTimeout(hideMapLoading, 12000);
    map.addListener('click', function (e) {
      if (!e || !e.latLng) return;
      addPin(typedName(), e.latLng.lat(), e.latLng.lng());
    });
    mapReady = true;
    placed.forEach(function (rec) { attachMarker(rec); });
    renumber();
  }

  function loadMaps() {
    if (!isFinite(startLat) || !isFinite(startLng)) return;
    if (window.google && window.google.maps) { initMap(); return; }
    if (mapsStarted) return;
    mapsStarted = true;
    window.golfNamedMapsReady = function () { initMap(); };
    var sc = document.createElement('script');
    sc.async = true;
    sc.defer = true;
    sc.src = 'https://maps.googleapis.com/maps/api/js?key=' + ER_MAPS_KEY + '&callback=golfNamedMapsReady';
    sc.onerror = function () {
      hideMapLoading();
      fail('Google Maps failed to load.');
    };
    document.head.appendChild(sc);
  }

  function applyPins(list) {
    if (sheetApplied) return;
    var before = placed.length;
    sheetApplied = true;
    (list || []).forEach(function (p) {
      var name = labelOf(p && p.name);
      var lat = parseFloat(p && p.lat);
      var lng = parseFloat(p && p.lng);
      if (!name || !isFinite(lat) || !isFinite(lng)) return;
      var rec = { name: name, lat: round6(lat), lng: round6(lng), seq: placed.length + 1, marker: null };
      placed.push(rec);
      if (mapReady) attachMarker(rec);
    });
    if (!before) dirty = false;
    renumber();
  }

  document.getElementById('saveBtn').addEventListener('click', savePins);
  document.getElementById('nameInput').addEventListener('input', refreshHint);
  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Escape') return;
    var input = document.getElementById('nameInput');
    if (input && document.activeElement !== input) return;
    if (input) input.value = '';
    refreshHint();
  });

  if (!siteNo) {
    fail('This page needs ?site_no= so it can save against the Golf tab.');
    return;
  }
  if (isFinite(startLat) && isFinite(startLng)) loadMaps();
  else setStatus('This row has no map coordinates.', 'err');

  fetch(GOLF_API_URL + '?route=golf-named&site_no=' + encodeURIComponent(siteNo) + '&_=' + Date.now(), {
    redirect: 'follow'
  }).then(function (r) { return r.text(); })
    .then(function (t) {
      var j;
      try { j = JSON.parse(t); } catch (e) { throw new Error('API did not return JSON'); }
      if (!j || j.ok === false) throw new Error((j && j.error) || 'API error');
      if (typeof j.max_pins === 'number' && j.max_pins > 0) PIN_HARD_LIMIT = j.max_pins;
      if (typeof j.max_name === 'number' && j.max_name > 0) NAME_MAX = j.max_name;
      if (!isFinite(startLat) || !isFinite(startLng)) {
        startLat = parseFloat(j.lat);
        startLng = parseFloat(j.lng);
        loadMaps();
      }
      applyPins(j.pins);
    })
    .catch(function (err) {
      setStatus(String(err.message || err), 'err');
    });
})();
</script>
</body>
</html>

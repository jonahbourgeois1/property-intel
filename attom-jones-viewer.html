  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font: 15px/1.45 "Segoe UI", system-ui, sans-serif;
    color: var(--ink);
    background: var(--paper);
  }
  header {
    display: flex; justify-content: space-between; gap: 24px;
    padding: 18px 22px 14px; border-bottom: 1px solid var(--line); background: var(--card);
  }
  header h1 { margin: 0; font-size: 22px; font-weight: 650; letter-spacing: -0.02em; }
  header p { margin: 4px 0 0; color: var(--muted); }
  header .ids { text-align: right; color: var(--muted); font-size: 13px; }
  header .ids b { color: var(--ink); font-weight: 600; }
  .layout { display: grid; grid-template-columns: minmax(420px, 1.15fr) minmax(340px, 0.85fr); min-height: 560px; }
  #map { min-height: 560px; background: #d9e2d4; }
  aside { padding: 16px; overflow: auto; max-height: calc(100vh - 78px); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; margin-bottom: 12px; }
  .card h2 { margin: 0 0 8px; font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent); }
  .row { display: flex; justify-content: space-between; gap: 16px; padding: 3px 0; border-top: 1px solid #f0ebe4; }
  .row:first-of-type { border-top: 0; }
  .row span { color: var(--muted); }
  .row b { font-weight: 600; text-align: right; }
  .value { font-size: 28px; font-weight: 680; letter-spacing: -0.03em; }
  .sub { color: var(--muted); margin-top: 2px; }
  .note { font-size: 13px; color: var(--muted); }
  section.fields { padding: 8px 22px 28px; }
  section.fields h2 { font-size: 16px; margin: 8px 0; }
  .tools { display: flex; gap: 10px; align-items: center; margin-bottom: 8px; }
  input[type="search"] {
    flex: 1; font: inherit; padding: 8px 10px; border: 1px solid var(--line);
    border-radius: 8px; background: var(--card);
  }
  table { width: 100%; border-collapse: collapse; background: var(--card); }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { font-size: 12px; color: var(--muted); font-weight: 600; position: sticky; top: 0; background: #f3efe8; }
  td.name { font-family: ui-monospace, Consolas, monospace; font-size: 12px; width: 42%; }
  #map { height: 100%; }
  @media (max-width: 900px) {
    .layout { grid-template-columns: 1fr; }
    header { flex-direction: column; }
    header .ids { text-align: left; }
    aside { max-height: none; }
    #map { min-height: 420px; }
  }

function initMap() {
  const path = DATA.parcel.latlngs.map(function (p) { return { lat: p[0], lng: p[1] }; });
  const bounds = new google.maps.LatLngBounds();
  path.forEach(function (p) { bounds.extend(p); });
  const map = new google.maps.Map(document.getElementById("map"), {
    mapTypeId: "hybrid",
    tilt: 0,
    rotateControl: false,
    mapTypeControl: true,
    streetViewControl: false,
    fullscreenControl: true
  });
  map.setTilt(0);
  map.fitBounds(bounds, 28);
  google.maps.event.addListenerOnce(map, "idle", function () { map.setTilt(0); });
  const lot = new google.maps.Polygon({
    paths: path,
    strokeColor: "#2f6f4e",
    strokeWeight: 2,
    fillColor: "#2f6f4e",
    fillOpacity: 0.18,
    map: map
  });
  const info = new google.maps.InfoWindow();
  lot.addListener("click", function (e) {
    info.setContent("Taxlot 181102C000600<br>Two ATTOM source ids, one ring.");
    info.setPosition(e.latLng);
    info.open(map);
  });
  function dot(lat, lng, stroke, fill, title, html) {
    const marker = new google.maps.Marker({
      position: { lat: lat, lng: lng },
      map: map,
      title: title,
      icon: {
        path: google.maps.SymbolPath.CIRCLE,
        scale: 7,
        fillColor: fill,
        fillOpacity: 1,
        strokeColor: stroke,
        strokeWeight: 2
      }
    });
    marker.addListener("click", function () {
      info.setContent(html);
      info.open(map, marker);
    });
  }
  dot(Number(field("LATITUDE")), Number(field("LONGITUDE")), "#8c4a2f", "#e7b89a", "Assessor point",
    "Assessor point<br>" + field("LATITUDE") + ", " + field("LONGITUDE"));
  dot(DATA.parcel.lat, DATA.parcel.lng, "#1c1915", "#ffffff", "Parcel centroid", "Parcel centroid");
}

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Property 3D Viewer</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; background: #111318; overflow: hidden; font-family: monospace; }
  canvas { display: block; }
  #loading {
    position: fixed; inset: 0; background: #111318;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 16px; z-index: 100; transition: opacity 0.5s ease;
  }
  #loading.hidden { opacity: 0; pointer-events: none; }
  .spin {
    width: 36px; height: 36px;
    border: 2px solid rgba(168,85,247,0.2);
    border-top-color: #a855f7;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .load-text { font-size: 12px; color: #555f6e; }
  #progress { font-size: 11px; color: #3d4752; margin-top: 4px; }
  #err {
    display: none; position: fixed; inset: 0;
    align-items: center; justify-content: center; flex-direction: column;
    gap: 12px; background: #0a0c0f; color: #8a93a2;
    font-size: 13px; text-align: center; padding: 32px; z-index: 200;
  }
  #err.visible { display: flex; }
  #err strong { color: #ef4444; font-size: 15px; }
  #hint {
    position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
    background: rgba(0,0,0,0.5); color: #555f6e; font-size: 11px;
    padding: 6px 14px; border-radius: 20px; pointer-events: none;
    transition: opacity 1s ease; z-index: 50;
  }
  #hint.hidden { opacity: 0; }
  /* ── Responder Directions ─────────────────────────────────────────────── */
  /* ── Tab rail ───────────────────────────────────────────────────────
     Both panel toggles live in one vertical rail. When a panel opens the rail
     slides left by exactly the panel width, so the buttons end up sitting
     beside the open panel instead of floating on top of its header - which is
     what forced the header text to dodge them before. The transition matches
     the panel's 0.28s so they travel together. */
  :root { --panel-w: 340px; }
  #tab-rail {
    position: fixed; top: 16px; right: 16px; z-index: 60;
    display: flex; flex-direction: column; align-items: flex-end; gap: 8px;
    transition: transform 0.28s ease;
  }
  #tab-rail.shifted { transform: translateX(calc(-1 * var(--panel-w))); }
  .dp-head {
    padding: 14px 16px; border-bottom: 1px solid rgba(255,255,255,0.08);
    flex-shrink: 0; display: flex; align-items: flex-start; gap: 8px;
  }
  .dp-title { font-size: 13px; font-weight: 600; color: #f0f2f5; }
  .dp-sub { font-size: 10.5px; color: #555f6e; font-family: monospace; margin-top: 3px; }
  .dp-close {
    margin-left: auto; background: none; border: none; color: #555f6e;
    font-size: 15px; cursor: pointer; line-height: 1; padding: 0 2px;
  }
  .dp-close:hover { color: #f0f2f5; }
  .dp-body { overflow-y: auto; flex: 1; scrollbar-width: thin; }
  .dp-note {
    margin: 12px 16px 0; font-size: 10.5px; color: #555f6e;
    font-family: monospace; line-height: 1.55;
  }
  .rd-card {
    margin: 12px 16px; border: 1px solid rgba(255,255,255,0.14);
    border-radius: 10px; background: #1a1f27; overflow: hidden;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  .rd-card.on { border-color: #f59e0b; box-shadow: 0 0 0 1px rgba(245,158,11,0.28); }
  .rd-head { padding: 12px 14px; display: flex; align-items: flex-start; gap: 10px; }
  .rd-num {
    width: 22px; height: 22px; border-radius: 50%; background: #f59e0b;
    color: #0b0e12; display: flex; align-items: center; justify-content: center;
    font-family: monospace; font-size: 10px; font-weight: 700;
    flex-shrink: 0; margin-top: 1px;
  }
  .rd-titles { flex: 1; min-width: 0; }
  .rd-name { font-size: 12.5px; font-weight: 600; color: #f0f2f5; line-height: 1.35; overflow-wrap: anywhere; }
  .rd-meta { font-size: 10.5px; color: #555f6e; font-family: monospace; margin-top: 4px; line-height: 1.55; overflow-wrap: anywhere; }
  .rd-body { padding: 0 14px 14px; }
  .rd-trigger { font-size: 11.5px; color: #8a93a2; line-height: 1.65; margin-bottom: 10px; }
  .rd-figure {
    position: relative; border-radius: 8px; overflow: hidden;
    border: 1px solid rgba(255,255,255,0.10); line-height: 0; background: #0b0e12;
  }
  .rd-figure img { width: 100%; display: block; }
  .rd-figure svg { position: absolute; left: 0; top: 0; width: 100%; height: 100%; pointer-events: none; }
  .rd-wp {
    position: absolute; transform: translate(-50%, -50%);
    width: 18px; height: 18px; border-radius: 50%; background: #f59e0b;
    color: #0b0e12; border: 2px solid #0b0e12; display: flex;
    align-items: center; justify-content: center;
    font-family: monospace; font-size: 9px; font-weight: 700; line-height: 1;
  }
  .rd-wp.start { background: #22c55e; }
  .rd-wp.end   { background: #ef4444; color: #fff; }
  .rd-wp.el { background: #22c55e; }
  .rd-wp.co { background: #ef4444; color: #fff; }
  .rd-btn {
    width: 100%; margin-top: 10px; padding: 8px 10px; border-radius: 7px;
    border: 1px solid rgba(255,255,255,0.14); background: #12161b;
    color: #f0f2f5; font-size: 11.5px; font-weight: 600; cursor: pointer;
    font-family: inherit; transition: all 0.15s;
  }
  .rd-btn:hover:not([disabled]) { background: #1a1f27; border-color: #f59e0b; }
  .rd-btn.on { background: rgba(245,158,11,0.14); border-color: #f59e0b; color: #f59e0b; }
  .rd-btn[disabled] { opacity: 0.4; cursor: not-allowed; }
  .rd-progress { font-size: 10.5px; color: #f59e0b; font-family: monospace; margin-top: 7px; }
  .rd-num.pin { background: #22c55e; }
  .rd-note { font-size: 10.5px; color: #555f6e; font-family: monospace; margin-top: 8px; line-height: 1.55; }
  .pin-group-label { font-size: 10px; font-weight: 600; color: #555f6e; letter-spacing: 0.08em; text-transform: uppercase; font-family: monospace; margin: 10px 0 6px; }
  .pin-row { display: flex; align-items: flex-start; gap: 9px; padding: 4px 0; }
  .pin-badge { width: 19px; height: 19px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 9px; font-weight: 700; color: #0b0e12; flex-shrink: 0; font-family: monospace; margin-top: 1px; }
  .pin-badge.green { background: #22c55e; }
  .pin-badge.red   { background: #ef4444; color: #fff; }
  .pin-name { font-size: 11.5px; color: #8a93a2; line-height: 1.5; overflow-wrap: anywhere; }
  .vw-section { margin-top: 12px; }
  .vw-head { display: flex; align-items: center; gap: 8px; margin-bottom: 7px; }
  .vw-badge { width: 20px; height: 20px; border-radius: 5px; background: #3b82f6; color: #fff; display: flex; align-items: center; justify-content: center; font-family: monospace; font-size: 9px; font-weight: 700; flex-shrink: 0; }
  .vw-badge.nadir { background: #8b5cf6; }
  .vw-label { font-size: 11.5px; font-weight: 600; color: #f0f2f5; }
  .vw-img { width: 100%; display: block; border-radius: 8px; border: 1px solid rgba(255,255,255,0.10); cursor: zoom-in; }
  .vw-bullets { margin: 7px 0 0 16px; padding: 0; }
  .vw-bullets li { font-size: 11px; color: #8a93a2; line-height: 1.6; margin-bottom: 3px; }
  /* Full-width panels on a phone would push the rail off-screen, so it is
     hidden while a panel is open - each panel has its own close button. */
  @media (max-width: 640px) {
    #wx-panel { width: 100%; }
    #tab-rail.shifted { display: none; }
  }
  /* ── View preset bar (storyboard: alpha/ent params from the sheet) ────── */
  #preset-bar {
    display: none; position: fixed; bottom: 48px; left: 50%;
    transform: translateX(-50%); gap: 6px; z-index: 50;
  }
  .pv-btn {
    background: rgba(0,0,0,0.6); color: #8a93a2; border: 1px solid #2a3040;
    font-family: monospace; font-size: 11px; padding: 6px 12px;
    border-radius: 6px; cursor: pointer; transition: color 0.2s, border-color 0.2s;
  }
  .pv-btn:hover:not([disabled]) { color: #fff; }
  .pv-btn.active { color: #f59e0b; border-color: #f59e0b; }
  .pv-btn[disabled] { opacity: 0.35; cursor: not-allowed; }
  /* ── Pin click label ───────────────────────────────────────────────────── */
  #pin-label {
    display: none; position: fixed; z-index: 70; pointer-events: none;
    background: rgba(10,12,15,0.95); color: #f0f2f5;
    border: 1px solid #f59e0b; border-radius: 6px; padding: 5px 10px;
    font-family: monospace; font-size: 11px; white-space: nowrap;
    transform: translate(-50%, -100%); box-shadow: 0 3px 14px rgba(0,0,0,0.5);
  }
  /* ── Security cameras ──────────────────────────────────────────────────── */
  .rd-num.cam { background: #38bdf8; }
  .rd-wp.cam  { background: #38bdf8; color: #0b0e12; }
  .cam-grid {
    display: grid; grid-template-columns: repeat(3, 1fr);
    gap: 6px; margin-top: 10px;
  }
  .cam-thumb {
    position: relative; border-radius: 6px; overflow: hidden; cursor: pointer;
    border: 1px solid rgba(255,255,255,0.12); background: #0b0e12;
    aspect-ratio: 3 / 4; line-height: 0;
  }
  .cam-thumb:hover { border-color: #38bdf8; }
  .cam-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .cam-thumb-n {
    position: absolute; left: 4px; top: 4px; min-width: 15px; height: 15px;
    padding: 0 3px; border-radius: 4px; background: #38bdf8; color: #0b0e12;
    font-family: monospace; font-size: 9px; font-weight: 700;
    display: flex; align-items: center; justify-content: center; line-height: 1;
  }
  #cam-lightbox {
    display: none; position: fixed; inset: 0; z-index: 90;
    background: rgba(6,8,11,0.92); padding: 24px;
    align-items: center; justify-content: center; flex-direction: column; gap: 12px;
  }
  #cam-lightbox.open { display: flex; }
  #cam-lb-img {
    max-width: min(92vw, 900px); max-height: 74vh; border-radius: 10px;
    border: 1px solid rgba(255,255,255,0.14); display: block;
  }
  #cam-lb-video {
    max-width: min(92vw, 900px); max-height: 74vh; border-radius: 10px;
    border: 1px solid rgba(255,255,255,0.14); display: none; background: #000;
  }
  .gw-row {
    display: flex; align-items: center; gap: 9px; padding: 5px 0;
  }
  .gw-row img {
    width: 64px; height: 36px; object-fit: cover; border-radius: 5px;
    border: 1px solid rgba(255,255,255,0.10); flex-shrink: 0;
  }
  .gw-name { font-size: 11.5px; color: #8a93a2; line-height: 1.4; min-width: 0; overflow-wrap: anywhere; }
  .gw-dot { width: 7px; height: 7px; border-radius: 50%; background: #22c55e; flex-shrink: 0; }
  .gw-dot.off { background: #ef4444; }
  .gw-watch {
    margin-left: auto; flex-shrink: 0; background: #12161b; color: #f0f2f5;
    border: 1px solid rgba(255,255,255,0.16); font-family: monospace;
    font-size: 10px; padding: 4px 10px; border-radius: 6px; cursor: pointer;
  }
  .gw-watch:hover { border-color: #38bdf8; color: #38bdf8; }
  #cam-quad {
    display: none; position: fixed; inset: 0; z-index: 95;
    background: rgba(6,8,11,0.95); padding: 46px 16px 16px; gap: 10px;
    grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr;
  }
  #cam-quad.open { display: grid; }
  .quad-cell {
    position: relative; background: #000; border-radius: 10px; overflow: hidden;
    border: 1px solid rgba(255,255,255,0.14); min-height: 0;
  }
  .quad-cell img { width: 100%; height: 100%; object-fit: contain; display: block; }
  .quad-name {
    position: absolute; left: 8px; top: 8px; padding: 3px 8px; border-radius: 5px;
    background: rgba(10,12,15,0.8); color: #f0f2f5; font-size: 11px; font-weight: 600;
    font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
  }
  .quad-state {
    position: absolute; right: 8px; top: 8px; padding: 2px 7px; border-radius: 4px;
    font-family: monospace; font-size: 9px; font-weight: 700; letter-spacing: 0.07em;
    color: #ef4444; border: 1px solid #ef4444; background: rgba(239,68,68,0.12);
  }
  .quad-state.bad { color: #f59e0b; border-color: rgba(245,158,11,0.6); background: none; }
  #cam-quad-close {
    position: fixed; top: 10px; right: 14px; z-index: 96; width: 28px; height: 28px;
    border-radius: 6px; border: 1px solid rgba(255,255,255,0.2);
    background: rgba(10,12,15,0.85); color: #f0f2f5; font-size: 15px;
    line-height: 1; cursor: pointer; display: none;
  }
  #cam-quad.open ~ #cam-quad-close, #cam-quad-close.open { display: block; }
  /* ── Live feed mode ─────────────────────────────────────────────────
     A vertical tab on the LEFT edge - deliberately apart from the right-hand
     data rail, because this is a mode switch, not another panel. Opening it
     swaps the whole screen: streams fill the main area, clips down the side. */
  #live-tab {
    display: none; position: fixed; left: 0; top: 50%;
    transform: translateY(-50%); z-index: 60;
    writing-mode: vertical-rl; text-orientation: mixed;
    background: rgba(0,0,0,0.6); color: #ef4444; border: 1px solid #ef4444;
    border-left: none; border-radius: 0 8px 8px 0;
    font-family: monospace; font-size: 11px; letter-spacing: 0.14em;
    padding: 14px 7px; cursor: pointer; transition: background 0.15s;
  }
  #live-tab:hover { background: rgba(239,68,68,0.16); }
  #live-tab.on { background: rgba(239,68,68,0.22); }
  #live-mode {
    display: none; position: fixed; inset: 0; z-index: 80;
    background: #0a0c0f;
  }
  #live-mode.open { display: flex; }
  #lm-main {
    flex: 1; display: grid; gap: 10px; padding: 16px;
    grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; min-width: 0;
  }
  #lm-side {
    width: 320px; flex-shrink: 0; background: #12161b;
    border-left: 1px solid rgba(255,255,255,0.10);
    display: flex; flex-direction: column; overflow: hidden;
    font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
  }
  #lm-clips { overflow-y: auto; flex: 1; padding: 0 14px 14px; scrollbar-width: thin; }
  .lm-clip {
    margin: 12px 0; border: 1px solid rgba(255,255,255,0.12); border-radius: 9px;
    overflow: hidden; background: #0b0e12;
  }
  .lm-clip video {
    width: 100%; display: block; aspect-ratio: 16 / 9; background: #000;
  }
  .lm-clip-meta { padding: 8px 10px 9px; }
  .lm-clip-name { font-size: 12px; font-weight: 600; color: #f0f2f5; line-height: 1.35; }
  .lm-clip-line {
    font-family: monospace; font-size: 10px; color: #8a93a2; margin-top: 3px;
    line-height: 1.5; overflow-wrap: anywhere;
  }
  @media (max-width: 800px) {
    #live-mode.open { flex-direction: column; }
    #lm-side { width: 100%; height: 40%; border-left: none;
               border-top: 1px solid rgba(255,255,255,0.10); }
  }
  #cam-lb-title {
    font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
    font-size: 14px; font-weight: 600; color: #f0f2f5; text-align: center;
  }
  #cam-lb-meta { font-family: monospace; font-size: 11px; color: #8a93a2; }
  #cam-lb-actions { display: flex; gap: 8px; }
  .cam-lb-btn {
    background: #12161b; color: #f0f2f5; border: 1px solid rgba(255,255,255,0.16);
    font-family: monospace; font-size: 11px; padding: 7px 14px;
    border-radius: 6px; cursor: pointer;
  }
  .cam-lb-btn:hover { border-color: #38bdf8; color: #38bdf8; }
  /* ── Camera popup (small, anchored, non-blocking) ───────────────────────
     Deliberately NOT built like #pin-label. That label is screen-static and
     has to be dismissed on the first interaction, because a fixed position
     would drift away from its pin the moment the view moved. This card is
     re-projected from its marker's world position every frame instead, so it
     tracks the marker and can stay open while the user keeps orbiting. */
  #cam-popup {
    display: none; position: fixed; z-index: 71;
    transform: translate(-50%, -100%);
    width: 210px; background: rgba(10,12,15,0.96);
    border: 1px solid #38bdf8; border-radius: 8px; overflow: hidden;
    box-shadow: 0 4px 18px rgba(0,0,0,0.6);
  }
  #cam-pop-img {
    width: 100%; height: 150px; object-fit: cover; display: block;
    cursor: zoom-in; border-bottom: 1px solid rgba(255,255,255,0.10);
  }
  #cam-pop-body { padding: 6px 8px 7px; }
  #cam-pop-name {
    font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
    font-size: 11.5px; font-weight: 600; color: #f0f2f5; line-height: 1.35;
  }
  #cam-pop-meta {
    font-family: monospace; font-size: 9.5px; color: #8a93a2; margin-top: 3px;
  }
  #cam-pop-hint {
    font-family: monospace; font-size: 9px; color: #555f6e; margin-top: 4px;
  }
  /* Live controls. Red rather than the camera layer's blue: this is the one
     thing on the card that is happening RIGHT NOW, and it should not read as
     just another camera affordance. */
  .cam-live-tag {
    display: none; font-family: monospace; font-size: 9px; font-weight: 700;
    letter-spacing: 0.08em; padding: 2px 6px; border-radius: 4px;
    border: 1px solid rgba(255,255,255,0.18); color: #8a93a2; margin-top: 4px;
  }
  .cam-live-tag.on  { color: #ef4444; border-color: #ef4444;
                      background: rgba(239,68,68,0.12); }
  .cam-live-tag.bad { color: #f59e0b; border-color: rgba(245,158,11,0.5); }
  #cam-pop-live-btn {
    display: none; width: 100%; margin-top: 6px; padding: 5px 8px;
    border-radius: 6px; border: 1px solid rgba(255,255,255,0.16);
    background: #12161b; color: #f0f2f5; font-family: monospace;
    font-size: 10px; cursor: pointer;
  }
  #cam-pop-live-btn:hover { border-color: #38bdf8; color: #38bdf8; }
  #cam-pop-live-btn.on { background: rgba(239,68,68,0.14);
                         border-color: #ef4444; color: #ef4444; }
  #cam-pop-close {
    position: absolute; right: 4px; top: 4px; width: 18px; height: 18px;
    border: none; border-radius: 4px; background: rgba(10,12,15,0.75);
    color: #8a93a2; font-size: 12px; line-height: 1; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  #cam-pop-close:hover { color: #f0f2f5; }
  /* ── Weather panel ─────────────────────────────────────────────────────
     Its own slide-out rather than another card in the property panel: active
     alerts and wind are operational information a responder wants in one
     click, not scrolled past pins, cameras, obliques and routes. */
  #wx-toggle {
    display: none;
    background: rgba(0,0,0,0.6); color: #38bdf8; border: 1px solid #38bdf8;
    font-family: monospace; font-size: 11px; padding: 7px 13px;
    border-radius: 6px; cursor: pointer; transition: background 0.15s;
  }
  #wx-toggle:hover { background: rgba(56,189,248,0.16); }
  #wx-toggle.on { background: rgba(56,189,248,0.22); }
  #wx-panel {
    position: fixed; top: 0; right: 0; bottom: 0; width: var(--panel-w); z-index: 56;
    background: #12161b; border-left: 1px solid rgba(255,255,255,0.10);
    transform: translateX(100%); transition: transform 0.28s ease;
    display: flex; flex-direction: column; overflow: hidden;
    font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
  }
  #wx-panel.open { transform: translateX(0); }

  #wx-body { overflow-y: auto; flex: 1; scrollbar-width: thin; padding-bottom: 16px; }
  .wx-note {
    margin: 14px 16px; font-size: 11px; color: #8a93a2;
    font-family: monospace; line-height: 1.6;
  }
  .wx-note a { color: #38bdf8; }
  .wx-alert {
    margin: 12px 16px; border: 1px solid #ef4444; border-radius: 9px;
    background: rgba(239,68,68,0.10); padding: 11px 13px;
  }
  .wx-alert.moderate { border-color: #f59e0b; background: rgba(245,158,11,0.10); }
  .wx-alert-ev {
    font-size: 12.5px; font-weight: 700; color: #fca5a5; line-height: 1.35;
  }
  .wx-alert.moderate .wx-alert-ev { color: #fcd34d; }
  .wx-alert-hd { font-size: 11px; color: #d5dae2; line-height: 1.55; margin-top: 5px; }
  .wx-alert-tm { font-size: 10px; color: #8a93a2; font-family: monospace; margin-top: 5px; }
  .wx-alert-row { display: flex; align-items: flex-start; gap: 8px; }
  .wx-alert-row.can-open { cursor: pointer; }
  .wx-alert-caret {
    margin-left: auto; flex-shrink: 0; color: #8a93a2; font-size: 10px;
    font-family: monospace; transition: transform 0.15s; line-height: 1.6;
  }
  .wx-alert-caret.open { transform: rotate(180deg); }
  .wx-alert-more { font-size: 9.5px; color: #8a93a2; font-family: monospace; margin-top: 6px; }
  .wx-alert-detail {
    display: none; margin-top: 9px; padding-top: 9px;
    border-top: 1px solid rgba(255,255,255,0.14);
    font-family: monospace; font-size: 10.5px; color: #d5dae2; line-height: 1.62;
    /* NWS ships these as hard-wrapped plain text; pre-wrap keeps the agency's
       own paragraphing instead of collapsing it into a wall. */
    white-space: pre-wrap; overflow-wrap: anywhere;
    max-height: 300px; overflow-y: auto; scrollbar-width: thin;

<script type="module">

const entYParam  = parseFloat(params.get('ent_y'));

const DT_VIEW    = 'drone-test';
const ROUTE_HEX  = '#f59e0b';

// &chekt=<jwt>   the CHEKT access token. Never committed to the record - a

// &proxy=<base>  optional same-origin proxy, if the browser refuses the

  for (let i = 0; i < zs.length; i++) { if (zs[i] === null) zs[i] = seen; else seen = zs[i]; }
  seen = null;
  for (let i = zs.length - 1; i >= 0; i--) { if (zs[i] === null) zs[i] = seen; else seen = zs[i]; }

  for (let i = 0; i < zs.length; i++) { if (zs[i] === null) zs[i] = floor; }

function numberSprite(text, bg, fg, worldSize) {
  const S  = 128;
  const cv = document.createElement('canvas');
  cv.width = cv.height = S;
  const g = cv.getContext('2d');
  g.beginPath(); g.arc(S / 2, S / 2, S / 2 - 10, 0, Math.PI * 2);
  g.fillStyle = bg; g.fill();
  g.lineWidth = 10; g.strokeStyle = '#0b0e12'; g.stroke();
  g.fillStyle = fg; g.font = 'bold 60px monospace';
  g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillText(text, S / 2, S / 2 + 3);
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({
    map: new THREE.CanvasTexture(cv), depthTest: false, transparent: true }));
  sp.scale.set(worldSize, worldSize, 1);
  sp.renderOrder = 3;
  return sp;
}
function disposeLayer(layer) {
  if (!layer) return;
  scene.remove(layer);
  layer.traverse(function (o) {
    if (o.geometry) o.geometry.dispose();
    if (o.material) {
      if (o.material.map) o.material.map.dispose();
      o.material.dispose();
    }
  });
}

// A camera marker is permanent scenery like the pins; the wedge on the
// ground is its coverage. Heading is degrees clockwise from TRUE north and
// the local frame is +Y north / +X east, so the maths angle is (90 - heading).

function cameraSprite(text, worldSize) {
  const S = 128, cv = document.createElement('canvas');
  cv.width = cv.height = S;
  const g = cv.getContext('2d');
  g.beginPath(); g.arc(S / 2, S / 2, S / 2 - 10, 0, Math.PI * 2);
  g.fillStyle = '#38bdf8'; g.fill();
  g.lineWidth = 10; g.strokeStyle = '#0b0e12'; g.stroke();
  g.fillStyle = '#0b0e12';
  g.fillRect(S * 0.28, S * 0.30, S * 0.30, S * 0.22);
  g.beginPath();
  g.moveTo(S * 0.60, S * 0.37); g.lineTo(S * 0.74, S * 0.29);
  g.lineTo(S * 0.74, S * 0.55); g.lineTo(S * 0.60, S * 0.47);
  g.closePath(); g.fill();
  g.font = 'bold 40px monospace';
  g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillText(text, S / 2, S * 0.74);

    map: new THREE.CanvasTexture(cv), depthTest: false, transparent: true }));
  sp.scale.set(worldSize, worldSize, 1);

function coverageWedge(cam, gz, lift) {
  const h = Number(cam.heading);

  const rng = isFinite(Number(cam.range)) ? Number(cam.range) : 25;
  const start = THREE.MathUtils.degToRad(90 - h - fov / 2);
  const geo = new THREE.CircleGeometry(rng, 48, start,
                                       THREE.MathUtils.degToRad(fov));

      if (o.isSprite && o.userData && o.userData.camera === cam) found = o;
    });
  }
  return found;
}
// ── Live camera layer ─────────────────────────────────────────────────
// Two live sources, tried in this order:
//   1. GATEWAY (preferred) - our chekt-viewer-gateway Lambda returns per-camera
//      MJPEG URLs. MJPEG is multipart JPEG that a browser <img> renders
//      natively: set src once and frames flow. No timer, no polling, no JSON.
//   2. TOKEN fallback (&chekt=) - the original snapshot poller, kept for
//      testing without the gateway. One JPEG per request, unwrapped from a
//      JSON envelope into a data: URL.
// Either way the viewer never holds the dealer key; the worst a leaked page
// URL exposes is nothing, and a leaked stream URL dies inside the hour.

function gwPasscode(force) {
  let k = null;
  try { k = sessionStorage.getItem('vyViewerKey'); } catch (e) {}
  if (!k || force) {
    k = window.prompt('Viewer passcode');
    if (k) { k = k.trim(); try { sessionStorage.setItem('vyViewerKey', k); } catch (e) {} }
  }
  return (k || '').trim();
}
// One retry on 401: a mistyped passcode re-prompts once instead of dying.
async function gwGet(path) {
  if (GW_OFF) throw new Error('gateway disabled by &gw=0');
  let k = gwPasscode(false);
  if (!k) throw new Error('no passcode entered');
  let r = await fetch(GW_URL + path, { headers: { 'x-viewer-key': k } });
  if (r.status === 401) {
    try { sessionStorage.removeItem('vyViewerKey'); } catch (e) {}
    k = gwPasscode(true);
    if (!k) throw new Error('no passcode entered');
    r = await fetch(GW_URL + path, { headers: { 'x-viewer-key': k } });
  }
  if (!r.ok) throw new Error('gateway HTTP ' + r.status);
  return await r.json();
}
// The camera list is cached for 50 minutes - the embedded stream tokens live
// for 60, so a refetch always lands before the URLs in hand go stale.
let gwLiveMap = null, gwLiveAt = 0;
async function gwEnsureLive() {
  if (gwLiveMap && (Date.now() - gwLiveAt) < 50 * 60 * 1000) return gwLiveMap;
  const j = await gwGet('/live?property=' + encodeURIComponent(propertyId));
  const m = {};
  (j.cameras || []).forEach(function (c) {
    if (c && c.mac) m[String(c.mac).toUpperCase()] = c;
  });
  gwLiveMap = m; gwLiveAt = Date.now();
  dbg('Gateway: ' + Object.keys(m).length + ' live camera(s) for this property', 'ok');
  return m;
}

let liveTimer = null, liveSeq = 0, liveIdx = -1, liveBusy = false,
    liveFrames = 0, liveMode = '', lbStandaloneLive = false;

// Which CHEKT camera does this record entry point at? URL override first,
// then the token's own sub claim, then the record. A token is OPTIONAL now -
// with the gateway on, the record's device MAC is enough.
function camLive(cam) {
  const l = cam && cam.live;
  const device = chektDevice || (chektClaims && chektClaims.sub) || (l && l.device);
  if (!device) return null;
  const ch = (chektChannel !== null && chektChannel !== '') ? Number(chektChannel)
           : (chektClaims && chektClaims.channel !== undefined) ? chektClaims.channel
           : (l && l.channel !== undefined && l.channel !== null) ? l.channel : 0;
  return { device: String(device).toUpperCase(), channel: isFinite(ch) ? ch : 0 };
}
function tokenSnapshotUrl(cam) {
  if (!chektToken) return '';
  const l = camLive(cam);
  if (!l) return '';
  const path = encodeURIComponent(l.device) + '/' + encodeURIComponent(l.channel);
  return (chektProxy ? chektProxy + '/' : CHEKT_API) +
         path + '?access_token=' + encodeURIComponent(chektToken);
}
function liveAvailable(cam) {
  if (!camLive(cam)) return false;
  return (!GW_OFF && !!propertyId) || !!chektToken;
}

// The live picture paints into whichever view is on screen: the full-size one
// if it is open, otherwise the small card. This is what lets expand carry the
// feed across instead of dropping back to the still.
function liveImgEl() {
  const lb = document.getElementById('cam-lightbox');
  return document.getElementById(
    lb && lb.classList.contains('open') ? 'cam-lb-img' : 'cam-pop-img');
}
function setLiveStatus(text, cls) {
  ['cam-pop-live', 'cam-lb-live'].forEach(function (id) {
    const el = document.getElementById(id);
    if (!el) return;
    el.textContent = text || '';
    el.className = 'cam-live-tag' + (cls ? ' ' + cls : '');
    el.style.display = text ? 'inline-block' : 'none';
  });
}
function clearImgHooks() {
  ['cam-pop-img', 'cam-lb-img'].forEach(function (id) {
    const el = document.getElementById(id);
    if (el) { el.onload = null; el.onerror = null; }

}

function stopLive() {
  liveSeq++;
  if (liveTimer) { clearInterval(liveTimer); liveTimer = null; }
  clearImgHooks();
  liveIdx = -1; liveBusy = false; liveFrames = 0; liveMode = '';
  const b = document.getElementById('cam-pop-live-btn');
  if (b) { b.classList.remove('on'); b.textContent = 'Go live'; }
  setLiveStatus('', '');
}

function liveFail(msg, why) {
  dbg('Live view stopped - ' + msg + (why ? ' (' + why + ')' : ''), 'warn');
  const i = liveIdx;
  stopLive();
  setLiveStatus('live unavailable', 'bad');
  const cam = camList[i], img = liveImgEl();
  if (cam && img) img.src = cam.photo || '';   // fall back to the still

// ── Source 2: the snapshot poller (token mode only) ───────────────────
async function liveTick() {
  if (liveBusy || liveIdx < 0 || liveMode !== 'poll') return;
  if (document.hidden) return;      // never poll a tab nobody is looking at
  const mySeq = liveSeq, cam = camList[liveIdx];
  const url = tokenSnapshotUrl(cam);
  if (!url) { liveFail('no live endpoint for this camera'); return; }
  liveBusy = true;
  try {
    const r = await fetch(url, { mode: 'cors', cache: 'no-store' });
    if (mySeq !== liveSeq) return;
    if (r.status === 401) {
      liveFail('CHEKT rejected the token - expired or malformed', 'HTTP 401');
      return;
    }
    if (r.status === 403) {
      const want = (camLive(cam) || {}).device;
      liveFail('that token is valid but belongs to a different camera - its ' +
               'sub claim has to equal ' + want, 'HTTP 403');
      return;
    }
    if (!r.ok) { liveFail('CHEKT returned an error', 'HTTP ' + r.status); return; }
    const j = await r.json();
    if (mySeq !== liveSeq) return;
    if (!j || !j.data) { liveFail('CHEKT returned no image data'); return; }
    const img = liveImgEl();
    if (img) {
      img.src = (j.base64Encoded === false) ? j.data
                                            : 'data:image/jpeg;base64,' + j.data;
    }
    liveFrames++;
    setLiveStatus('LIVE', 'on');
    if (liveFrames === 1) {
      dbg('Live view (snapshot polling): ' + camName(cam, liveIdx) + ' at ' +
          Math.round(1000 / LIVE_MS) + ' fps', 'ok');
    }
  } catch (e) {
    if (mySeq !== liveSeq) return;
    liveFail(chektProxy
      ? 'could not reach the proxy'
      : 'the browser blocked the call to api.chekt.com - that is CORS, so ' +
        'this camera needs a proxy in front of it', e.message);
  } finally {
    liveBusy = false;
  }
}

// ── Source 1: MJPEG via the gateway ───────────────────────────────────
function startMjpeg(idx, url) {
  liveMode = 'mjpeg';
  const img = liveImgEl();
  if (!img) return;
  img.onload = function () {
    if (liveIdx === idx && liveMode === 'mjpeg') {
      liveFrames++;
      setLiveStatus('LIVE', 'on');
      if (liveFrames === 1) dbg('Live (MJPEG stream): ' + camName(camList[idx], idx), 'ok');
    }
  };
  img.onerror = function () {
    if (liveIdx !== idx) return;
    dbg('MJPEG stream failed - trying snapshot fallback', 'warn');
    clearImgHooks();
    startPollerOrFail(idx);
  };
  img.src = url;
}
function startPollerOrFail(idx) {
  if (tokenSnapshotUrl(camList[idx])) {
    liveMode = 'poll';
    liveTick();
    liveTimer = setInterval(liveTick, LIVE_MS);
  } else {
    liveFail('no live source for this camera');
  }
}

async function startLive(idx) {
  stopLive();
  const cam = camList[idx], l = camLive(cam);
  if (!cam || !l) return;
  liveIdx = idx;
  const b = document.getElementById('cam-pop-live-btn');
  if (b) { b.classList.add('on'); b.textContent = 'Stop live'; }
  setLiveStatus('connecting…', '');
  if (!GW_OFF && propertyId) {
    try {
      const m = await gwEnsureLive();
      if (liveIdx !== idx) return;
      const g = m[l.device];
      if (g && g.mjpeg_url) { startMjpeg(idx, g.mjpeg_url); return; }
      dbg('Gateway has no camera ' + l.device + ' at this property - trying token fallback', 'warn');
    } catch (e) {
      if (liveIdx !== idx) return;
      dbg('Gateway unavailable: ' + e.message, 'warn');
    }
  }
  startPollerOrFail(idx);
}

window.toggleLive = function () {
  if (liveIdx >= 0) {
    const i = liveIdx;
    stopLive();
    const cam = camList[i], img = liveImgEl();
    if (cam && img) img.src = cam.photo || '';

  }

// ── Quad view: every camera at the site, streaming at once ────────────

async function renderLmClips() {
  const div = document.getElementById('lm-clips');

  try {
    const j = await gwGet('/clips?property=' + encodeURIComponent(propertyId) + '&days=7');
    lmClipList = j.events || [];
    // Inline players, not buttons: every clip sits in the rail ready to play,
    // poster = the event thumbnail, with whatever metadata the gateway sent
    // underneath. preload="metadata" keeps N clips from downloading N mp4s
    // up front while the live streams are running.
    div.innerHTML = lmClipList.length ? lmClipList.map(function (e, i) {
      const meta = [];
      if (e.trigger) meta.push(escHtml(String(e.trigger)));

  }

// Sourced from the National Weather Service JSON API (api.weather.gov), NOT
// from forecast.weather.gov. That page is HTML and cross-origin, so a browser
// cannot read it; the API serves the same underlying data as JSON with
// Access-Control-Allow-Origin set, needs no key, and is free of rate limits
// for this volume.
//
// Three calls, chained off one lookup:
//   /points/{lat},{lon}            -> the grid cell, plus URLs for the rest
//   .properties.forecast           -> the multi-day period forecast
//   .properties.observationStations-> nearest station, then its latest obs
// plus /alerts/active?point= for warnings in force right now.
//
// NOTE the API rejects coordinates with more than 4 decimal places, hence the
// toFixed(4) below - a full-precision lat/lng returns 404 rather than data.

async function wxJson(url) {

  if (!r.ok) throw new Error('HTTP ' + r.status + ' from ' + url);

async function loadWeather() {

  wxLoading = true;
  const body = document.getElementById('wx-body');
  body.innerHTML = '<div class="wx-note">Loading forecast&hellip;</div>';
  const pt = wxLat.toFixed(4) + ',' + wxLng.toFixed(4);
  try {
    const point = await wxJson(WX_API + '/points/' + pt);
    const pp = (point && point.properties) || {};
    // The three follow-ups are independent, so fire them together. Each is
    // caught on its own: a dead observation station must not cost us the
    // forecast, which is the part that matters most.
    const [fc, alerts, stations] = await Promise.all([
      pp.forecast ? wxJson(pp.forecast).catch(function (e) { dbg('Forecast failed: ' + e.message, 'warn'); return null; }) : null,
      wxJson(WX_API + '/alerts/active?point=' + pt).catch(function () { return null; }),
      pp.observationStations ? wxJson(pp.observationStations).catch(function () { return null; }) : null

      const list = await wxJson(WX_API + '/stations/' + sp.stationIdentifier +

// a single point routinely sits in several overlapping zones (a county zone and
// a fire-weather zone, say). The same Air Quality Alert then comes back two or
// three times, identical except for `areaDesc` and `id`. Separately, an UPDATE
// can arrive alongside the alert it supersedes.
//
// So two passes:
//   1. drop anything cancelled, already replaced, or referenced as the older
//      version by a sibling in this same response
//   2. collapse by content signature - event + text + time window, DELIBERATELY
//      excluding areaDesc/id, since those are exactly what differs between
//      zone copies. The surviving copy's areas are unioned so coverage
//      information is not thrown away.

function dedupeAlerts(features) {
  const list = (features || []).filter(function (f) {
    const a = (f && f.properties) || {};
    if (String(a.messageType || '') === 'Cancel') return false;
    if (a.replacedBy) return false;
    return true;
  });

  // Every id any sibling claims to supersede.
  const superseded = {};
  list.forEach(function (f) {
    const refs = (f.properties && f.properties.references) || [];
    refs.forEach(function (r) {
      if (!r) return;
      if (r.identifier) superseded[r.identifier] = true;
      if (r['@id'])     superseded[r['@id']] = true;
    });
  });
  function isSuperseded(f) {
    const a = f.properties || {};
    return !!(superseded[f.id] || superseded[a.id] || superseded[a.identifier]);
  }

  const order = [], bySig = {};
  list.forEach(function (f) {
    if (isSuperseded(f)) return;
    const a = f.properties || {};
    const sig = [wxNorm(a.event), wxNorm(a.description), wxNorm(a.instruction),
                 a.onset || a.effective || '', a.ends || a.expires || ''].join('|');
    if (!bySig[sig]) { bySig[sig] = f; order.push(sig); return; }
    // Duplicate zone copy: keep the first, union the areas onto it.
    const keep = bySig[sig].properties;
    const seen = {}, areas = [];
    [keep.areaDesc, a.areaDesc].forEach(function (str) {
      String(str || '').split(';').forEach(function (x) {
        const v = x.trim();
        if (v && !seen[v.toLowerCase()]) { seen[v.toLowerCase()] = true; areas.push(v); }

  if (s < 5400)  return hzPlural(Math.round(s / 60), 'minute') + ' ago';
  if (s < 86400) return hzPlural(Math.round(s / 3600), 'hour') + ' ago';
  const d = Math.round(s / 86400);
  if (d < 45)  return hzPlural(d, 'day') + ' ago';
  if (d < 400) return hzPlural(Math.round(d / 30), 'month') + ' ago';
  return hzPlural(Math.round(d / 365), 'year') + ' ago';

// County identity, needed by both FEMA and Drought (each is keyed on county,
// not on a coordinate). Derived from the NWS points response we already rely
// on: its `county` property is a zone URL ending in e.g. ORC017 - state OR,
// county 017 - which with the state FIPS gives 41017. Resolved once, cached.
const STATE_FIPS = {AL:'01',AK:'02',AZ:'04',AR:'05',CA:'06',CO:'08',CT:'09',DE:'10',
 DC:'11',FL:'12',GA:'13',HI:'15',ID:'16',IL:'17',IN:'18',IA:'19',KS:'20',KY:'21',
 LA:'22',ME:'23',MD:'24',MA:'25',MI:'26',MN:'27',MS:'28',MO:'29',MT:'30',NE:'31',
 NV:'32',NH:'33',NJ:'34',NM:'35',NY:'36',NC:'37',ND:'38',OH:'39',OK:'40',OR:'41',
 PA:'42',RI:'44',SC:'45',SD:'46',TN:'47',TX:'48',UT:'49',VT:'50',VA:'51',WA:'53',

let hzCounty = null;
async function resolveCounty(lat, lng) {
  if (hzCounty) return hzCounty;
  const pt = await wxJson(WX_API + '/points/' + lat.toFixed(4) + ',' + lng.toFixed(4));
  const pp = (pt && pt.properties) || {};
  const zone = String(pp.county || '').split('/').pop();      // e.g. ORC017
  const m = /^([A-Z]{2})C(\d{3})$/.exec(zone);
  const rl = (pp.relativeLocation && pp.relativeLocation.properties) || {};
  hzCounty = {
    state: m ? m[1] : (rl.state || ''),
    countyFips: m ? m[2] : '',
    stateFips: m ? (STATE_FIPS[m[1]] || '') : '',
    city: rl.city || ''
  };
  hzCounty.fips = hzCounty.stateFips + hzCounty.countyFips;

// ── 1. USGS earthquakes ───────────────────────────────────────────────
async function loadQuakes(lat, lng, hz) {
  const url = 'https://earthquake.usgs.gov/fdsnws/event/1/query?format=geojson' +
    '&latitude=' + lat.toFixed(4) + '&longitude=' + lng.toFixed(4) +
    '&maxradiuskm=300&minmagnitude=2.5&orderby=time&limit=30';
  const j = await wxJson(url);
  const f = ((j && j.features) || []).map(function (q) {
    const p = q.properties || {}, c = (q.geometry && q.geometry.coordinates) || [];
    return { mag: Number(p.mag), place: p.place || 'Unknown location', time: Number(p.time),
             depth: c[2], url: p.url, lat: Number(c[1]), lng: Number(c[0]),
             km: kmBetween(lat, lng, c[1], c[0]) };
  });
  if (!f.length) {
    return hzHead('0', 'No recorded quakes', [['Search', 'M2.5+ within 300 km']]) +
           hzFoot(hz, 'Nothing in the USGS catalog for this area.');
  }
  const nearest = f.slice().sort(function (a, b) { return a.km - b.km; })[0];
  const largest = f.slice().sort(function (a, b) { return b.mag - a.mag; })[0];
  let h = hzHead(
    isFinite(nearest.km) ? Math.round(nearest.km) + '<span class="hz-unit">km</span>' : '--',
    'to the nearest recorded quake',
    [['Nearest', 'M' + nearest.mag.toFixed(1) + ' &middot; ' + hzAgo(nearest.time)],
     ['Largest', 'M' + largest.mag.toFixed(1) + ' &middot; ' + escHtml(shortPlace(largest.place)) +
                 ' &middot; ' + hzAgo(largest.time), largest.mag >= 5 ? 'wind' : ''],
     ['Total',   hzPlural(f.length, 'event') + ' in the search window']],
    'M2.5+ within 300 km of the property');
  h += hzSec('Where they were');
  h += hzTileMap(lat, lng, f.map(function (q) {
    return { lat: q.lat, lng: q.lng, km: q.km,
             r: Math.max(3.5, Math.min(14, Math.pow(Math.max(1, q.mag), 1.9) / 2.6)),
             fill: q.mag >= 5 ? 'rgba(239,68,68,0.45)' : 'rgba(249,115,22,0.38)',
             stroke: q.mag >= 5 ? '#ef4444' : '#f97316',
             label: 'M' + q.mag.toFixed(1) + ' — ' + q.place };
  }), 'dot size is magnitude');
  h += hzSec('Most recent first');
  f.forEach(function (q) {
    const cls = q.mag >= 5 ? 'big' : (q.mag >= 4 ? 'mid' : '');
    const meta = [];
    if (isFinite(q.km)) meta.push(Math.round(q.km) + ' km away');
    if (q.depth !== undefined && q.depth !== null) meta.push(Math.round(q.depth) + ' km deep');
    meta.push(hzAgo(q.time));
    h += hzRow(isFinite(q.mag) ? q.mag.toFixed(1) : '?', cls,
               escHtml(q.place), escHtml(meta.join('  ·  ')));

}
function shortPlace(p) {
  const s = String(p || '');

    'WFIGS_Interagency_Perimeters_Current/FeatureServer/0/query?f=json&returnGeometry=false' +
    '&returnCentroid=true&outSR=4326' +
    '&outFields=poly_IncidentName,poly_GISAcres,attr_FireDiscoveryDateTime,attr_POOState,attr_IncidentTypeCategory' +
    '&where=1%3D1&geometryType=esriGeometryEnvelope&inSR=4326' +
    '&spatialRel=esriSpatialRelIntersects&resultRecordCount=40' +
    '&geometry=' + encodeURIComponent(JSON.stringify(env));

    return { lat: f.lat, lng: f.lng, km: f.km,

  h += hzSec('Closest first');

// Markers are an SVG overlay positioned by the same Web Mercator maths the

  const z = zoomFor(lat, far, Math.min(W, H));

  const n = Math.pow(2, z);

  for (let ty = Math.floor(top / 256); ty <= Math.floor((top + H) / 256); ty++) {
    if (ty < 0 || ty >= n) continue;
    for (let tx = Math.floor(left / 256); tx <= Math.floor((left + W) / 256); tx++) {
      const wx = ((tx % n) + n) % n;   // wrap at the date line

               TILE_BASE + z + '/' + ty + '/' + wx + '" style="left:' +
               Math.round(tx * 256 - left) + 'px;top:' + Math.round(ty * 256 - top) + 'px">';
    }

  let ov = '<svg class="hz-ov" viewBox="0 0 ' + W + ' ' + H + '">';

    if (!isFinite(pt.lat) || !isFinite(pt.lng)) return;
    const x = mercX(pt.lng, z) - left, y = mercY(pt.lat, z) - top;
    if (x < -20 || y < -20 || x > W + 20 || y > H + 20) return;
    ov += '<circle cx="' + x.toFixed(1) + '" cy="' + y.toFixed(1) + '" r="' +
          (pt.r || 5).toFixed(1) + '" fill="' + pt.fill + '" stroke="' + pt.stroke +
          '" stroke-width="1.3"><title>' + escHtml(pt.label || '') + '</title></circle>';
  });

  ov += '<circle cx="' + (W / 2) + '" cy="' + (H / 2) + '" r="9" fill="none" ' +
        'stroke="#38bdf8" stroke-opacity="0.5"></circle>' +
        '<circle cx="' + (W / 2) + '" cy="' + (H / 2) + '" r="4.5" fill="#38bdf8" ' +
        'stroke="#0b0e12" stroke-width="1.4"></circle></svg>';

  return '<div class="hz-map"><div class="hz-tiles" style="width:' + W + 'px;height:' + H + 'px">' +

         escHtml('about ' + across + ' km across · property at center' +
                 (capExtra ? ' · ' + capExtra : '')) +

  const newest = femaRows[0];

        return escHtml(k) + ' (' + byType[k] + ')'; }).join(', ')]]);
  h += hzSec('Newest first — click for detail');
  femaRows.forEach(function (d, i) {
    const meta = [];
    if (d.femaDeclarationString) meta.push(d.femaDeclarationString);
    if (d.incidentType) meta.push(d.incidentType);

               escHtml(d.declarationTitle || d.incidentType || 'Declaration'),

// Spread RAY_BUDGET samples over the polyline in proportion to segment
// length, so a long straight run gets the intermediate ground samples a short
// turn does not need. Every original waypoint is always a sample.
function densify(pts) {
  const seg = [];
  for (let i = 0; i < pts.length - 1; i++) {
    seg.push(Math.hypot(pts[i + 1].x - pts[i].x, pts[i + 1].y - pts[i].y));
  }
  const total = seg.reduce(function (a, b) { return a + b; }, 0) || 1;
  const extra = Math.max(0, RAY_BUDGET - pts.length);
  const out = [];
  for (let i = 0; i < pts.length - 1; i++) {
    out.push({ x: pts[i].x, y: pts[i].y, wp: i });
    const n = Math.round(extra * seg[i] / total);
    for (let k = 1; k <= n; k++) {
      const t = k / (n + 1);
      out.push({ x: pts[i].x + (pts[i + 1].x - pts[i].x) * t,
                 y: pts[i].y + (pts[i + 1].y - pts[i].y) * t, wp: -1 });
    }
  }
  const lastPt = pts[pts.length - 1];
  out.push({ x: lastPt.x, y: lastPt.y, wp: pts.length - 1 });
  return out;
}
function drapeRoute(pts, idx) {

function buildRouteObjects(samples, zs, pts, idx) {

// ── Route flythrough ──────────────────────────────────────────────────
// The Entrance button flies to one point. This flies the whole route: the
// camera rides the SAME CatmullRom curve the tube is built from, sitting a few
// metres behind and above the moving point. Riding the curve rather than
// hopping between waypoints is what makes it read as following the path instead
// of a slideshow of pins - and using the tube's own curve means the camera can
// never drift off the line that is drawn.
//
// Where the camera GOES and what it LOOKS AT are decided separately. It travels
// the route, but it holds on the front of the house for the whole approach and
// only hands over to the destination on the last leg - so a responder watching
// keeps the building oriented in front of them the entire way in, then arrives
// looking at the thing they were sent for.
//
// getPointAt (not getPoint) is arc-length parameterised, so the pace stays even
// through tight turns instead of racing the straights and crawling the corners.
function beginTour(i) {
  if (!routeCurve) return;
  cancelFly();
  const len = routeCurve.getLength();
  // A single flight altitude for the whole run. The route is draped on terrain,
  // so its z rises and falls with the ground; feeding that straight into the
  // camera height made the shot bob. Sampling the curve once and flying a fixed
  // height above its highest point turns the move into pure horizontal
  // translation and yaw - which is what makes drone footage read as steady.
  let topZ = -Infinity;
  for (let n = 0; n <= 32; n++) topZ = Math.max(topZ, routeCurve.getPointAt(n / 32).z);
  // WHAT THE CAMERA FACES ON THE APPROACH - the front of the house.
  // Three ways to know where that is, best first: the storyboard's entrance
  // point IS the front door in local metres; failing that, the residence pin
  // pushed out along the frontage bearing (alpha is the azimuth the FRONT
  // elevation was shot from, so stepping that way from the centre of the house
  // lands on its front face); failing both, the residence pin itself.
  const p0 = pinSets.element[0];
  const fl = p0 ? toLocal(p0) : null;
  const face = routeCurve.getPointAt(0.5).clone();
  let faceSrc = 'route midpoint';
  if (hasEnt) {
    face.x = entXParam; face.y = entYParam; faceSrc = 'entrance point';
  } else if (fl) {
    face.x = fl.x; face.y = fl.y; faceSrc = 'residence pin';
    if (hasAlpha) {
      const a = THREE.MathUtils.degToRad(alphaParam);
      const off = Math.max(6, modelSpan * 0.04);
      face.x += off * Math.sin(a); face.y += off * Math.cos(a);
      faceSrc = 'front of the residence (bearing ' + alphaParam.toFixed(0) + '°)';
    }
  }
  face.z = topZ;
  // WHERE IT HANDS OVER - the second-to-last waypoint. The last waypoint is the
  // destination. Waypoints do not sit at even arc fractions of the curve (a
  // long driveway leg eats more length than a short one round the house), so
  // the handover point is found by walking the curve rather than assumed.
  const wps = metreRoute(dirList[i]) || [];
  const goal = face.clone();
  let kSwitch = 1;
  if (wps.length >= 2) {
    const g = wps[wps.length - 1];
    goal.set(g.x, g.y, topZ);
    const h = wps[wps.length - 2];
    let best = Infinity;
    for (let n = 0; n <= 240; n++) {
      const q = routeCurve.getPointAt(n / 240);
      const d2 = (q.x - h.x) * (q.x - h.x) + (q.y - h.y) * (q.y - h.y);
      if (d2 < best) { best = d2; kSwitch = n / 240; }
    }
  }
  // THE CAMERA PATH IS WORKED OUT HERE, ONCE, as a function of how far along
  // the route we are. Nothing chases anything at run time.
  //
  // That is the whole reason the motion is fluid. The previous versions damped
  // the camera toward an ideal derived from the route's tangent, and a tangent
  // is discontinuous at a corner - it rotates ninety degrees in the space of a
  // couple of metres. A follower will always show that corner no matter how
  // heavily it is damped, because the thing it is following jumps. Smoothing
  // the schedule up front instead means there is nothing left to show.
  const R0 = tourRange();
  const N = 64;
  const bear = [];
  for (let n = 0; n <= N; n++) {
    const t = n / N;
    const q  = routeCurve.getPointAt(t);
    // The bearing is the route point's own bearing from the aim point - NOT the
    // route's tangent. The tangent was the source of every version of the
    // snapping: it is the derivative of the path, so it swings hardest exactly
    // where the path bends, and multiplying it by a range of a couple of
    // hundred metres threw the camera right across the property at each corner.
    // A position's bearing from a fixed point turns gently even when the path
    // it belongs to turns sharply. It also puts the camera on the same side as
    // the route, so the leg being flown reads in the foreground with the
    // building behind it - the way the reference stills are composed.
    const uu = kSwitch >= 1 ? 0
             : Math.min(1, Math.max(0, (t - kSwitch) / (1 - kSwitch)));
    const c  = face.clone().lerp(goal, ease(uu));
    // Close to the aim point there is no meaningful bearing - and the end of a
    // route is exactly that case, since the destination IS the aim by then. The
    // raw angle spins through most of a turn over the last few samples, and
    // with the ends pinned that garbage was being locked in as the schedule's
    // finish. Hold the last good heading instead: the camera simply keeps its
    // approach bearing and closes in, which is how the arrival should read.
    const dx = q.x - c.x, dy = q.y - c.y;
    let a = (n && dx * dx + dy * dy < (R0 * 0.08) * (R0 * 0.08))
          ? bear[n - 1]
          : Math.atan2(dy, dx);
    // Unwrap as we go: a raw atan2 series jumps by a full turn at the cut, and
    // smoothing across that jump would swing the camera the wrong way round.
    if (n) {
      while (a - bear[n - 1] >  Math.PI) a -= 2 * Math.PI;
      while (a - bear[n - 1] < -Math.PI) a += 2 * Math.PI;
    }
    bear.push(a);
  }
  // Diffuse. Each corner shows up in the raw series as a near-vertical step;
  // forty passes of a [1 2 1] kernel with the ends pinned turns each into a
  // gentle S, so the sweep still follows the route without reproducing its
  // kinks. Cheap - 64 samples, done once per press of the button.
  for (let pass = 0; pass < 40; pass++) {
    const cp = bear.slice();
    for (let n = 1; n < N; n++) bear[n] = 0.25 * cp[n - 1] + 0.5 * cp[n] + 0.25 * cp[n + 1];
  }
  // Then pull the schedule most of the way toward a CONSTANT-RATE sweep.
  // Diffusion alone still leaves the pan bunched wherever the route happens to
  // bend - dead flat down a long driveway, then most of the turn crammed into
  // two seconds. Blending toward a straight ramp keeps the direction and the
  // start and end headings the route implies, but spreads the movement evenly
  // across the run. An even rate is what actually reads as fluid; the eye
  // notices a pan speeding up and slowing down far more than it notices the
  // camera being a little ahead of or behind the leg being flown.
  const b0 = bear[0], b1 = bear[N], RAMP = 0.75;
  for (let n = 0; n <= N; n++) {
    bear[n] = bear[n] * (1 - RAMP) + (b0 + (b1 - b0) * (n / N)) * RAMP;
  }
  tour = { i: i, t0: performance.now(), baseZ: topZ, bear: bear,
           face: face, goal: goal, kSwitch: kSwitch,
           r0: R0, r1: tourRangeIn(),
           ms: Math.max(6000, Math.min(14000, len / 21 * 1000)) };
  const rise0 = tourRangeIn() * Math.sin(TOUR_ELEV);
  const b = document.getElementById('rd-tour-' + i);
  if (b) { b.classList.add('on'); b.textContent = 'Stop flythrough'; }
  dbg('Route flythrough: ' + Math.round(len) + ' m over ' +
      (tour.ms / 1000).toFixed(0) + ' s, closing from ' + Math.round(R0) + ' m to ' +
      Math.round(tour.r1) + ' m (' + Math.round(rise0) + ' m up), facing the ' +
      faceSrc + ' until ' + Math.round(kSwitch * 100) + '% then the target', 'info');
}
function stopTour() {

  const b = document.getElementById('rd-tour-' + i);

  const p = document.getElementById('rd-prog-' + i);

// Framed like the reference drone footage rather than like a body camera: the
// camera trails the moving point from an elevated oblique far enough out that
// the whole property stays in shot, so the route is read IN CONTEXT - which
// building it passes, which side of the drive it runs down - instead of a
// close-up of ground texture.
//
// The angle and the range are not tuned by eye - they are the SAME numbers the
// Alpha/Bravo/Charlie/Delta view buttons use (`computeCompassPos(center, az, 25,
// maxSpan * 0.718)`), because those four presets are the framings Jonah picked
// out as the look he wants. Matching them here means the flythrough reads as a
// moving version of the stills a responder already knows, and a change to the
// preset framing later only has to be made in one more place.
// TOUR_ELEV is the angle above horizontal and tourRange() the slant range, so
// the two decompose into a horizontal radius and a height. Range scales with
// the model, which keeps the framing consistent across a small lot and a large
// one; the 70 m floor stops a tiny parcel from putting the camera inside the
// roof.
const TOUR_ELEV = 25 * Math.PI / 180;
// Opens at the preset framing - the whole property in shot, the angle of the
// Alpha/Bravo/Charlie/Delta stills - and closes to well inside the Entrance
// button's range by the end, so the shot ARRIVES at the destination instead of
// stopping short of it.
function tourRange()  { return Math.max(70, modelSpan * 0.718); }
function tourRangeIn() { return Math.max(45, modelSpan * 0.26); }
// Smoothstep. Used for the timing of the whole move, for the crossfade from the
// house to the destination, and for the push-in - so every one of them starts
// and ends at zero rate instead of stepping into motion.
function ease(t) { return t * t * (3 - 2 * t); }
// The bearing schedule is precomputed per run and sampled here.
function tourBearing(t) {

function stepTour() {

  // the move breathes in and out instead of starting and stopping at speed.
  const e = ease(k);

  const range  = tour.r0 + (tour.r1 - tour.r0) * ease(e);
  const radius = range * Math.cos(TOUR_ELEV);
  const ang    = tourBearing(e);
  camera.position.set(aim.x + Math.cos(ang) * radius,
                      aim.y + Math.sin(ang) * radius,
                      tour.baseZ + range * Math.sin(TOUR_ELEV));
  camera.up.set(0, 0, 1);
  controls.target.copy(aim);
  camera.lookAt(controls.target);
  const prog = document.getElementById('rd-prog-' + tour.i);
  if (prog) prog.textContent = 'following the route… ' + Math.round(e * 100) + '%';
  if (k >= 1) stopTour();
}
// Drawing the route is a chunked raycast that finishes whenever it finishes, so
// if the path is not on screen yet, start it and wait for the curve to appear
// rather than assuming it is ready.
window.tourRoute = function (i) {
  if (tour) { stopTour(); return; }
  if (routeCurveIdx === i && routeCurve) { beginTour(i); return; }
  if (activeDir !== i) toggleRoute3D(i);
  const btn = document.getElementById('rd-tour-' + i);
  if (btn) btn.textContent = 'Preparing…';
  (function waitForPath(n) {
    n = n || 0;
    if (routeCurveIdx === i && routeCurve) {
      if (btn) btn.textContent = 'Fly the route';
      beginTour(i);
      return;
    }
    if (n > 150) {
      if (btn) btn.textContent = 'Fly the route';
      dbg('Route flythrough: path never became ready', 'warn');
      return;
    }
    setTimeout(function () { waitForPath(n + 1); }, 100);
  })();
};
function frameRoute(vecs) {
  const b = new THREE.Box3();
  vecs.forEach(function (v) { b.expandByPoint(v); });
  const c = b.getCenter(new THREE.Vector3());
  const s = b.getSize(new THREE.Vector3());
  const d = Math.max(s.x, s.y, 20) * 1.7;
  flyTo(new THREE.Vector3(c.x, c.y - d * 0.8, c.z + d * 0.8), c);
}
function showErr(msg) {
  document.getElementById('loading').classList.add('hidden');
  document.getElementById('err-msg').textContent = msg;
  document.getElementById('err').classList.add('visible');
}
</script>

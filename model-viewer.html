<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Property 3D Viewer</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; background: #111318; overflow: hidden; font-family: monospace; }
  canvas { display: block; }
  #loading {
    position: fixed; inset: 0; background: #111318;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 16px; z-index: 100; transition: opacity 0.5s ease;
  }
  #loading.hidden { opacity: 0; pointer-events: none; }
  .spin {
    width: 36px; height: 36px;
    border: 2px solid rgba(168,85,247,0.2);
    border-top-color: #a855f7;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .load-text { font-size: 12px; color: #555f6e; }
  #progress { font-size: 11px; color: #3d4752; margin-top: 4px; }
  #err {
    display: none; position: fixed; inset: 0;
    align-items: center; justify-content: center; flex-direction: column;
    gap: 12px; background: #0a0c0f; color: #8a93a2;
    font-size: 13px; text-align: center; padding: 32px; z-index: 200;
  }
  #err.visible { display: flex; }
  #err strong { color: #ef4444; font-size: 15px; }
  #hint {
    position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
    background: rgba(0,0,0,0.5); color: #555f6e; font-size: 11px;
    padding: 6px 14px; border-radius: 20px; pointer-events: none;
    transition: opacity 1s ease; z-index: 50;
  }
  #hint.hidden { opacity: 0; }

  /* ── Responder Directions ─────────────────────────────────────────────── */
  #dir-toggle {
    display: none; position: fixed; top: 16px; right: 16px; z-index: 60;
    background: rgba(0,0,0,0.6); color: #f59e0b; border: 1px solid #f59e0b;
    font-family: monospace; font-size: 11px; padding: 7px 13px;
    border-radius: 6px; cursor: pointer; transition: background 0.15s;
  }
  #dir-toggle:hover { background: rgba(245,158,11,0.16); }
  #dir-toggle.on { background: rgba(245,158,11,0.22); }
  #dir-panel {
    position: fixed; top: 0; right: 0; bottom: 0; width: 340px; z-index: 55;
    background: #12161b; border-left: 1px solid rgba(255,255,255,0.10);
    transform: translateX(100%); transition: transform 0.28s ease;
    display: flex; flex-direction: column; overflow: hidden;
    font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
  }
  #dir-panel.open { transform: translateX(0); }
  .dp-head {
    padding: 14px 16px; border-bottom: 1px solid rgba(255,255,255,0.08);
    flex-shrink: 0; display: flex; align-items: flex-start; gap: 8px;
  }
  .dp-title { font-size: 13px; font-weight: 600; color: #f0f2f5; }
  .dp-sub { font-size: 10.5px; color: #555f6e; font-family: monospace; margin-top: 3px; }
  .dp-close {
    margin-left: auto; background: none; border: none; color: #555f6e;
    font-size: 15px; cursor: pointer; line-height: 1; padding: 0 2px;
  }
  .dp-close:hover { color: #f0f2f5; }
  .dp-body { overflow-y: auto; flex: 1; scrollbar-width: thin; }
  .dp-note {
    margin: 12px 16px 0; font-size: 10.5px; color: #555f6e;
    font-family: monospace; line-height: 1.55;
  }
  .rd-card {
    margin: 12px 16px; border: 1px solid rgba(255,255,255,0.14);
    border-radius: 10px; background: #1a1f27; overflow: hidden;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  .rd-card.on { border-color: #f59e0b; box-shadow: 0 0 0 1px rgba(245,158,11,0.28); }
  .rd-head { padding: 12px 14px; display: flex; align-items: flex-start; gap: 10px; }
  .rd-num {
    width: 22px; height: 22px; border-radius: 50%; background: #f59e0b;
    color: #0b0e12; display: flex; align-items: center; justify-content: center;
    font-family: monospace; font-size: 10px; font-weight: 700;
    flex-shrink: 0; margin-top: 1px;
  }
  .rd-titles { flex: 1; min-width: 0; }
  .rd-name { font-size: 12.5px; font-weight: 600; color: #f0f2f5; line-height: 1.35; overflow-wrap: anywhere; }
  .rd-meta { font-size: 10.5px; color: #555f6e; font-family: monospace; margin-top: 4px; line-height: 1.55; overflow-wrap: anywhere; }
  .rd-body { padding: 0 14px 14px; }
  .rd-trigger { font-size: 11.5px; color: #8a93a2; line-height: 1.65; margin-bottom: 10px; }
  .rd-figure {
    position: relative; border-radius: 8px; overflow: hidden;
    border: 1px solid rgba(255,255,255,0.10); line-height: 0; background: #0b0e12;
  }
  .rd-figure img { width: 100%; display: block; }
  .rd-figure svg { position: absolute; left: 0; top: 0; width: 100%; height: 100%; pointer-events: none; }
  .rd-wp {
    position: absolute; transform: translate(-50%, -50%);
    width: 18px; height: 18px; border-radius: 50%; background: #f59e0b;
    color: #0b0e12; border: 2px solid #0b0e12; display: flex;
    align-items: center; justify-content: center;
    font-family: monospace; font-size: 9px; font-weight: 700; line-height: 1;
  }
  .rd-wp.start { background: #22c55e; }
  .rd-wp.end   { background: #ef4444; color: #fff; }
  .rd-wp.el { background: #22c55e; }
  .rd-wp.co { background: #ef4444; color: #fff; }
  .rd-btn {
    width: 100%; margin-top: 10px; padding: 8px 10px; border-radius: 7px;
    border: 1px solid rgba(255,255,255,0.14); background: #12161b;
    color: #f0f2f5; font-size: 11.5px; font-weight: 600; cursor: pointer;
    font-family: inherit; transition: all 0.15s;
  }
  .rd-btn:hover:not([disabled]) { background: #1a1f27; border-color: #f59e0b; }
  .rd-btn.on { background: rgba(245,158,11,0.14); border-color: #f59e0b; color: #f59e0b; }
  .rd-btn[disabled] { opacity: 0.4; cursor: not-allowed; }
  .rd-progress { font-size: 10.5px; color: #f59e0b; font-family: monospace; margin-top: 7px; }
  .rd-num.pin { background: #22c55e; }
  .rd-note { font-size: 10.5px; color: #555f6e; font-family: monospace; margin-top: 8px; line-height: 1.55; }
  .pin-group-label { font-size: 10px; font-weight: 600; color: #555f6e; letter-spacing: 0.08em; text-transform: uppercase; font-family: monospace; margin: 10px 0 6px; }
  .pin-row { display: flex; align-items: flex-start; gap: 9px; padding: 4px 0; }
  .pin-badge { width: 19px; height: 19px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 9px; font-weight: 700; color: #0b0e12; flex-shrink: 0; font-family: monospace; margin-top: 1px; }
  .pin-badge.green { background: #22c55e; }
  .pin-badge.red   { background: #ef4444; color: #fff; }
  .pin-name { font-size: 11.5px; color: #8a93a2; line-height: 1.5; overflow-wrap: anywhere; }
  .vw-section { margin-top: 12px; }
  .vw-head { display: flex; align-items: center; gap: 8px; margin-bottom: 7px; }
  .vw-badge { width: 20px; height: 20px; border-radius: 5px; background: #3b82f6; color: #fff; display: flex; align-items: center; justify-content: center; font-family: monospace; font-size: 9px; font-weight: 700; flex-shrink: 0; }
  .vw-badge.nadir { background: #8b5cf6; }
  .vw-label { font-size: 11.5px; font-weight: 600; color: #f0f2f5; }
  .vw-img { width: 100%; display: block; border-radius: 8px; border: 1px solid rgba(255,255,255,0.10); cursor: zoom-in; }
  .vw-bullets { margin: 7px 0 0 16px; padding: 0; }
  .vw-bullets li { font-size: 11px; color: #8a93a2; line-height: 1.6; margin-bottom: 3px; }
  @media (max-width: 640px) { #dir-panel { width: 100%; } }

  /* ── View preset bar (storyboard: alpha/ent params from the sheet) ────── */
  #preset-bar {
    display: none; position: fixed; bottom: 48px; left: 50%;
    transform: translateX(-50%); gap: 6px; z-index: 50;
  }
  .pv-btn {
    background: rgba(0,0,0,0.6); color: #8a93a2; border: 1px solid #2a3040;
    font-family: monospace; font-size: 11px; padding: 6px 12px;
    border-radius: 6px; cursor: pointer; transition: color 0.2s, border-color 0.2s;
  }
  .pv-btn:hover:not([disabled]) { color: #fff; }
  .pv-btn.active { color: #f59e0b; border-color: #f59e0b; }
  .pv-btn[disabled] { opacity: 0.35; cursor: not-allowed; }

  /* ── Pin click label ───────────────────────────────────────────────────── */
  #pin-label {
    display: none; position: fixed; z-index: 70; pointer-events: none;
    background: rgba(10,12,15,0.95); color: #f0f2f5;
    border: 1px solid #f59e0b; border-radius: 6px; padding: 5px 10px;
    font-family: monospace; font-size: 11px; white-space: nowrap;
    transform: translate(-50%, -100%); box-shadow: 0 3px 14px rgba(0,0,0,0.5);
  }

  /* ── Debug console — same shape as viewer.html's ──────────────────────── */
  #debug-panel { position: fixed; bottom: 70px; left: 12px; width: 340px; max-height: 220px; background: rgba(10,12,15,0.97); border: 1px solid rgba(59,130,246,0.4); border-radius: 8px; z-index: 999; font-family: monospace; font-size: 11px; overflow: hidden; display: flex; flex-direction: column; box-shadow: 0 4px 20px rgba(0,0,0,0.6); }
  #debug-panel.collapsed #debug-log, #debug-panel.collapsed #debug-clear { display: none; }
  #debug-header { display: flex; align-items: center; justify-content: space-between; padding: 6px 10px; background: rgba(59,130,246,0.12); border-bottom: 1px solid rgba(59,130,246,0.2); cursor: pointer; user-select: none; }
  #debug-header span { color: #3b82f6; font-size: 10px; font-weight: 500; letter-spacing: 0.05em; }
  #debug-toggle-btn { color: #3b82f6; font-size: 10px; background: none; border: none; cursor: pointer; }
  #debug-log { overflow-y: auto; padding: 6px 10px; max-height: 180px; scrollbar-width: thin; scrollbar-color: rgba(255,255,255,0.14) transparent; }
  .debug-line { padding: 2px 0; border-bottom: 1px solid rgba(255,255,255,0.03); line-height: 1.5; }
  .debug-line.info  { color: #8a93a2; }
  .debug-line.ok    { color: #22c55e; }
  .debug-line.warn  { color: #f59e0b; }
  .debug-line.error { color: #ef4444; }
  .debug-time { color: #555f6e; margin-right: 6px; }
  #debug-clear { padding: 4px 10px; border-top: 1px solid rgba(255,255,255,0.05); background: none; border: none; color: #555f6e; font-size: 10px; font-family: monospace; cursor: pointer; text-align: left; width: 100%; }
  #debug-clear:hover { color: #8a93a2; }
</style>
</head>
<body>
<div id="loading">
  <div class="spin"></div>
  <div class="load-text">Loading property model...</div>
  <div id="progress"></div>
</div>
<div id="err">
  <strong>Could not load model</strong>
  <span id="err-msg" style="font-size:11px;opacity:0.6;margin-top:6px;"></span>
</div>
<div id="hint">Left drag to pan · Middle drag to rotate · Right drag to zoom</div>
<button id="dir-toggle" onclick="toggleDirPanel()">Directions</button>
<div id="pin-label"></div>
<div id="preset-bar">
  <button class="pv-btn" id="pv-alpha"    onclick="goToView('alpha')">Alpha</button>
  <button class="pv-btn" id="pv-bravo"    onclick="goToView('bravo')">Bravo</button>
  <button class="pv-btn" id="pv-charlie"  onclick="goToView('charlie')">Charlie</button>
  <button class="pv-btn" id="pv-delta"    onclick="goToView('delta')">Delta</button>
  <button class="pv-btn" id="pv-entrance" onclick="goToEntrance()">Entrance</button>
</div>
<div id="debug-panel">
  <div id="debug-header" onclick="toggleDebug()"><span>DEBUG CONSOLE</span><button id="debug-toggle-btn">▼</button></div>
  <div id="debug-log"></div>
  <button id="debug-clear" onclick="clearDebug()">clear log</button>
</div>
<div id="dir-panel">
  <div class="dp-head">
    <div>
      <div class="dp-title">Responder Directions</div>
      <div class="dp-sub" id="dp-sub"></div>
    </div>
    <button class="dp-close" onclick="toggleDirPanel()">&#10005;</button>
  </div>
  <div class="dp-body" id="dp-body"></div>
</div>
<button id="resetBtn" onclick="resetView()" style="
  position: fixed; bottom: 48px; right: 16px; z-index: 50;
  background: rgba(0,0,0,0.6); color: #8a93a2; border: 1px solid #2a3040;
  font-family: monospace; font-size: 11px; padding: 6px 12px;
  border-radius: 6px; cursor: pointer; transition: color 0.2s;
" onmouseover="this.style.color='#fff'" onmouseout="this.style.color='#8a93a2'">
  ↑ Reset View
</button>

<script type="importmap">
{
  "imports": {
    "three": "https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.module.js"
  }
}
</script>

<script type="module">
import * as THREE from 'three';

// Load GLTFLoader and OrbitControls from three.js examples CDN
const BASE = 'https://cdn.jsdelivr.net/npm/three@0.128.0/examples/jsm';

const { GLTFLoader }     = await import(`${BASE}/loaders/GLTFLoader.js`);
const { DRACOLoader }    = await import(`${BASE}/loaders/DRACOLoader.js`);
const { OrbitControls }  = await import(`${BASE}/controls/OrbitControls.js`);

// ── URL param ─────────────────────────────────────────────────────────
const params  = new URLSearchParams(window.location.search);
const glbUrl  = params.get('model');

// ── Optional property record ──────────────────────────────────────────
// This file's contract has always been `?model=<glb>` plus the headless
// capture params, and that path is untouched: `?property=<id>` is purely
// additive and everything it adds is gated on `!autocapture`, so a capture
// run can never be slowed or broken by a failed fetch.
const propertyId = params.get('property');

// ── Storyboard params (written into the 360 URL by the sheet) ─────────
// alpha is the property's frontage bearing — the compass azimuth the FRONT
// (alpha) render was captured from. bravo/charlie/delta are +90/+180/+270
// from it, the same convention 5-render uses. ent_x/ent_y are the entrance
// point in the GLB's local frame; they are null for frontage tiers 3/4
// (a bearing but no point), in which case the Entrance button disables —
// same contract the storyboard record documents.
const alphaParam = parseFloat(params.get('alpha'));
const entXParam  = parseFloat(params.get('ent_x'));
const entYParam  = parseFloat(params.get('ent_y'));
const hasAlpha   = !isNaN(alphaParam);
const hasEnt     = !isNaN(entXParam) && !isNaN(entYParam);
const wantView   = (params.get('view') || params.get('tab') || '').trim();
const DT_VIEW    = 'drone-test';
const ROUTE_HEX  = '#f59e0b';
const DATA_ROOT  = (function () {
  const explicit = params.get('dataRoot');
  if (explicit) return explicit.replace(/\/*$/, '/');
  // Relative to wherever this page is served, so one file works on GitHub
  // Pages and on responder-intel.vyanet.com with no edit.
  if (window.location.protocol === 'file:') {
    return 'https://responder-intel.vyanet.com/data/';
  }
  return new URL('data/', window.location.href).href;
})();

// ── Debug console ─────────────────────────────────────────────────────
// Same shape and behaviour as viewer.html's, so one habit works in both.
// Hidden in autocapture so it can never appear in a rendered oblique.
window.dbg = function (msg, type) {
  type = type || 'info';
  const log = document.getElementById('debug-log');
  if (!log) return;
  const now = new Date();
  const t = [now.getHours(), now.getMinutes(), now.getSeconds()]
    .map(function (n) { return String(n).padStart(2, '0'); }).join(':');
  const line = document.createElement('div');
  line.className = 'debug-line ' + type;
  line.innerHTML = '<span class="debug-time">' + t + '</span>' + msg;
  log.appendChild(line);
  log.scrollTop = log.scrollHeight;
};
window.toggleDebug = function () {
  const p = document.getElementById('debug-panel');
  const b = document.getElementById('debug-toggle-btn');
  p.classList.toggle('collapsed');
  b.textContent = p.classList.contains('collapsed') ? '▲' : '▼';
};
window.clearDebug = function () {
  const l = document.getElementById('debug-log');
  if (l) l.innerHTML = '';
};

// Optional programmatic camera positioning for headless capture
// (see capture_obliques.py). azimuth/polar are compass bearing + elevation
// angle in degrees, both measured the same way compute_frontage.py's
// output uses them: azimuth 0=north/90=east/180=south/270=west, polar =
// elevation of the camera above the horizon (45 matches the default
// hand-tuned "DJI-style" framing already used below).
const autocapture = params.get('autocapture') === '1';
const azimuthParam = parseFloat(params.get('azimuth'));
const polarParam   = parseFloat(params.get('polar'));
const hasCaptureAngles = !isNaN(azimuthParam) && !isNaN(polarParam);

if (!glbUrl) {
  showErr('No model URL provided. Add ?model=https://... to the URL.');
}

if (autocapture) {
  // Headless Chromium has no mouse — hide interactive chrome so it never
  // shows up in a screenshot, and don't wait on the 4s hint fade timer.
  document.getElementById('hint').classList.add('hidden');
  document.getElementById('resetBtn').style.display = 'none';
  document.getElementById('debug-panel').style.display = 'none';
}

// Same axis convention as positionCameraForDefaultView below: Z-up,
// +Y = north, +X = east (confirmed by the existing default view's
// "-Y (south)" camera offset). azimuth = compass bearing of the camera's
// position relative to the model center (i.e. an azimuth of 180/south
// reproduces this file's original default view when polar=45).
function positionCameraCompass(camera, center, azimuthDeg, elevationDeg, distance) {
  const az = THREE.MathUtils.degToRad(azimuthDeg);
  const el = THREE.MathUtils.degToRad(elevationDeg);
  const horiz = distance * Math.cos(el);
  const up = distance * Math.sin(el);
  const east = horiz * Math.sin(az);
  const north = horiz * Math.cos(az);

  camera.position.set(center.x + east, center.y + north, center.z + up);
  camera.up.set(0, 0, 1);
  camera.lookAt(center);
}

// ── Scene setup ───────────────────────────────────────────────────────
// ── Property fetch ────────────────────────────────────────────────────
async function fetchJson(url) {
  const res = await fetch(url);
  if (res.status === 404) return null;
  if (!res.ok) throw new Error('HTTP ' + res.status);
  return await res.json();
}

// data/index/{id}.json is the folder index viewer.html already resolves
// through: it maps a PROPERTY id to a per-view record id. Same identity
// model here, so one link format serves every viewer.
async function resolveViaIndex(hash, view) {
  let idx = null;
  try { idx = await fetchJson(DATA_ROOT + 'index/' + hash + '.json'); }
  catch (e) { return null; }
  if (!idx || !idx.views || !idx.views[view]) return null;
  return await fetchJson(DATA_ROOT + view + '/' + idx.views[view] + '.json');
}

// Same resolution order responder-intel.html uses, so any link form works.
async function loadProperty() {
  if (!propertyId || autocapture) return null;
  if (wantView) {
    const byView = await resolveViaIndex(propertyId, wantView);
    if (byView) return byView;
  }
  const byDefault = await resolveViaIndex(propertyId, DT_VIEW);
  if (byDefault) return byDefault;
  const direct = await fetchJson(DATA_ROOT + DT_VIEW + '/' + propertyId + '.json');
  if (direct) return direct;
  return await fetchJson(DATA_ROOT + 'responder-drone/' + propertyId + '.json');
}

const propertyPromise = loadProperty().catch(function (e) {
  dbg('Property load FAILED: ' + e.message, 'error');
  console.warn('[directions] property load failed:', e.message);
  return null;
});
if (propertyId && !autocapture) dbg('Resolving property ' + propertyId.substring(0, 12) + '…', 'info');

// The shared 239-entry pin catalog, resolved exactly as viewer.html resolves
// it: published pins carry only {id,x,y}, and the id names them.
const catalogPromise = (propertyId && !autocapture)
  ? fetch(DATA_ROOT + 'pin-catalog/pins-catalog.json')
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (c) {
        if (!c || !c.pins) { dbg('Pin catalog unavailable', 'warn'); return null; }
        const byId = {};
        c.pins.forEach(function (p) { byId[p.id] = p; });
        dbg('Pin catalog loaded: ' + c.pin_count + ' pins', 'ok');
        return byId;
      })
      .catch(function (e) { dbg('Pin catalog FAILED: ' + e.message, 'warn'); return null; })
  : Promise.resolve(null);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(window.devicePixelRatio);
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color('#111318');

const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100000);
// Z-up BEFORE OrbitControls is constructed. OrbitControls caches the camera's
// up-frame at construction and re-derives orientation from it on every
// update(), so a camera made Z-up afterwards has minPolarAngle/maxPolarAngle
// applied in the WRONG frame: the intended "-Y (south) and +Z (up)" opening
// offset reads as below-horizon, gets clamped, and the viewer silently opens
// straight down instead of at 45 degrees. Same failure render-viewer.html
// documents in its AUTOCAPTURE CONTRACT, fixed here by ordering.
camera.up.set(0, 0, 1);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.screenSpacePanning = true;
controls.minDistance = 10;
controls.maxDistance = 5000;
controls.mouseButtons = {
  LEFT: THREE.MOUSE.PAN,
  MIDDLE: THREE.MOUSE.ROTATE,
  RIGHT: THREE.MOUSE.DOLLY
};
controls.enableZoom = true;
controls.zoomSpeed = 1.0;
// Hard lock: camera can only go from straight down (0) to horizon (90°)
// Cannot go underneath — matches DJI viewer behavior
controls.minPolarAngle = 0;
controls.maxPolarAngle = Math.PI / 2;

// Lighting
const ambient = new THREE.AmbientLight(0xffffff, 0.7);
scene.add(ambient);
const sun = new THREE.DirectionalLight(0xffffff, 1.2);
sun.position.set(1, 2, 2);
scene.add(sun);

// ── Load GLB ─────────────────────────────────────────────────────────
const dracoLoader = new DRACOLoader();
dracoLoader.setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.5.6/');

const loader = new GLTFLoader();
loader.setDRACOLoader(dracoLoader);

// Filled once the GLB is in the scene; the directions layer needs all three
// to drape a route (raycast origin height, tube radius, marker size).
let modelRoot = null, modelBox = null, modelSpan = 0;

loader.load(
  glbUrl,
  function(gltf) {
    const model = gltf.scene;
    scene.add(model);

    // Compute bounding box
    const box = new THREE.Box3().setFromObject(model);
    const center = box.getCenter(new THREE.Vector3());
    const size = box.getSize(new THREE.Vector3());

    // DJI Terra OBJ uses Z-up.
    // Open at ~45° angle matching DJI viewer style — camera offset in Y and Z
    const maxSpan = Math.max(size.x, size.y);
    const camDist = maxSpan * 1.4;

    if (autocapture && hasCaptureAngles) {
      // Programmatic framing for oblique capture (alpha/bravo/charlie/delta).
      // Same camDist basis as the default view for consistent scale/crop.
      positionCameraCompass(camera, center, azimuthParam, polarParam, camDist * Math.SQRT2 * 0.8);
      controls.enabled = false;
    } else {
      // Pull camera back and up at ~45° — offset in -Y (south) and +Z (up)
      camera.position.set(
        center.x,
        center.y - camDist * 0.8,  // back
        center.z + camDist * 0.8   // up
      );
      camera.up.set(0, 0, 1);
      camera.lookAt(center);
    }
    camera.updateProjectionMatrix();

    // Orbit target = model center
    controls.target.copy(center);
    controls.update();

    // Store initial camera state for reset
    const initPos = camera.position.clone();
    const initTarget = controls.target.clone();

    // ── View presets (storyboard) ─────────────────────────────────────
    // Same camera math as the autocapture path: positionCameraCompass at
    // the requested bearing, then hand the orbit target back to controls
    // so interaction continues from the preset instead of snapping away.
    if (!autocapture && hasAlpha) {
      const VIEW_OFFSETS = { alpha: 0, bravo: 90, charlie: 180, delta: 270 };
      let entranceMarker = null;

      // The entrance marker is permanent scenery, not button feedback: it is
      // placed as soon as the model is ready so the entrance reads at a
      // glance, and clicking it (like any pin) names it.
      function ensureEntranceMarker() {
        if (entranceMarker || !hasEnt) return entranceMarker;
        const ray = new THREE.Raycaster();
        ray.set(new THREE.Vector3(entXParam, entYParam, box.max.z + 100),
                new THREE.Vector3(0, 0, -1));
        const hit = ray.intersectObject(model, true)[0];
        const ez  = hit ? hit.point.z : center.z;
        const S = 128, cv = document.createElement('canvas');
        cv.width = cv.height = S;
        const g = cv.getContext('2d');
        g.beginPath(); g.arc(S / 2, S / 2, S / 2 - 10, 0, Math.PI * 2);
        g.fillStyle = '#22c55e'; g.fill();
        g.lineWidth = 10; g.strokeStyle = '#0b0e12'; g.stroke();
        g.fillStyle = '#0b0e12'; g.font = 'bold 58px monospace';
        g.textAlign = 'center'; g.textBaseline = 'middle';
        g.fillText('E', S / 2, S / 2 + 3);
        entranceMarker = new THREE.Sprite(new THREE.SpriteMaterial({
          map: new THREE.CanvasTexture(cv), depthTest: false, transparent: true }));
        const ms = Math.max(3.0, maxSpan * 0.022);
        entranceMarker.scale.set(ms, ms, 1);
        entranceMarker.renderOrder = 3;
        entranceMarker.position.set(entXParam, entYParam, ez + ms * 0.6);
        entranceMarker.name = 'Entrance';
        entranceMarker.userData.groundZ = ez;
        scene.add(entranceMarker);
        registerLabelTarget(entranceMarker);
        return entranceMarker;
      }
      // Same framing distance the render pipeline was calibrated to
      // (PARCEL_SIZE_FACTOR 0.718: ~205 m for a 285 m parcel, "confirmed
      // visually correct") — so a preset matches the rendered oblique's crop
      // instead of the much wider default-view distance.
      const presetDist = maxSpan * 0.718;

      function setActivePreset(id) {
        ['pv-alpha', 'pv-bravo', 'pv-charlie', 'pv-delta', 'pv-entrance']
          .forEach(function (b) {
            document.getElementById(b).classList.toggle('active', b === id);
          });
      }

      window.goToView = function (which) {
        const az = (alphaParam + VIEW_OFFSETS[which]) % 360;
        positionCameraCompass(camera, center, az, 25, presetDist);
        controls.target.copy(center);
        controls.update();
        setActivePreset('pv-' + which);
        dbg('View preset: ' + which + ' (azimuth ' + az.toFixed(1) + '°)', 'info');
      };

      window.goToEntrance = function () {
        if (!hasEnt) return;
        const m  = ensureEntranceMarker();
        const ez = m ? m.userData.groundZ : center.z;
        const tgt = new THREE.Vector3(entXParam, entYParam, ez);
        positionCameraCompass(camera, tgt, alphaParam, 32,
                              Math.max(60, maxSpan * 0.35));
        controls.target.copy(tgt);
        controls.update();
        setActivePreset('pv-entrance');
        dbg('Entrance view: (' + entXParam.toFixed(1) + ', ' + entYParam.toFixed(1) +
            ') from bearing ' + alphaParam.toFixed(1) + '°', 'info');
      };

      const bar = document.getElementById('preset-bar');
      bar.style.display = 'flex';
      if (hasEnt) ensureEntranceMarker();
      if (!hasEnt) {
        const eb = document.getElementById('pv-entrance');
        eb.disabled = true;
        eb.title = 'No entrance point for this property (frontage tier 3/4)';
      }
      dbg('Storyboard presets on — alpha ' + alphaParam.toFixed(2) + '°' +
          (hasEnt ? ', entrance (' + entXParam + ', ' + entYParam + ')'
                  : ', no entrance point'), 'ok');
    }

    // Expose reset function to the button
    window.resetView = function() {
      camera.position.copy(initPos);
      controls.target.copy(initTarget);
      controls.update();
    };

    // Hand the loaded scene to the directions layer. No-op when the URL
    // carries no ?property= — the record promise resolves to null.
    modelRoot = model; modelBox = box; modelSpan = maxSpan;
    dbg('Model ready — span ' + maxSpan.toFixed(1) + ' m, ' +
        'z ' + box.min.z.toFixed(1) + '…' + box.max.z.toFixed(1) + ' m', 'ok');
    Promise.all([propertyPromise, catalogPromise]).then(function (r) {
      pinCatalogById = r[1];
      if (r[0]) initDirections(r[0]); else if (propertyId) dbg('No record found for this property', 'warn');
    });

    // Fade in
    document.getElementById('loading').classList.add('hidden');
    if (!autocapture) {
      setTimeout(() => document.getElementById('hint').classList.add('hidden'), 4000);
    }

    // Signal readiness for capture_obliques.py — wait two frames so the
    // canvas has actually painted the positioned view before a screenshot
    // is taken, not just the first uninitialized frame.
    requestAnimationFrame(() => {
      requestAnimationFrame(() => {
        window.__viewerReady = true;
      });
    });
  },
  function(xhr) {
    if (xhr.total) {
      const pct = Math.round(xhr.loaded / xhr.total * 100);
      document.getElementById('progress').textContent = pct + '%';
    }
  },
  function(err) {
    showErr(err.message || String(err));
  }
);

// ── Render loop ───────────────────────────────────────────────────────
function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// ── Responder Directions + property pins ──────────────────────────────
// A direction is {name, trigger, target, start, route:[{seq,x,y[,mx,my]}]}.
// A pin is {id,x,y}; the id resolves to a name through the shared 239-entry
// pin catalog, exactly as viewer.html resolves it.
//
// x,y are PERCENTAGES on the nadir image and always present — they drive the
// 2D previews. To place the same point in the 3D model we need metres in the
// GLB's local frame. Two sources, in order:
//   1. mx,my on a waypoint, written by the sync (drone-test.gs).
//   2. nadir.local — the nadir crop's four corners in local metres, published
//      by the render Lambda. Bilinear interpolation of those corners maps ANY
//      percentage into the model, which is why pins need no sync change.
// Four corners rather than two: the local frame is ENU about the CAPTURE's
// origin, so it is only near-north-up over one parcel. Bilinear absorbs the
// residual skew (under a centimetre across a 340 x 295 m nadir) exactly.
//
// Drawing on the mesh means finding the ground under each point. The mesh has
// no height field, so we raycast straight down. That is O(triangles) per ray
// with no BVH in three.js r128, so ray counts are budgeted and spread across
// animation frames — the canvas keeps rendering and the panel shows progress
// instead of the tab locking up.

const RAY_BUDGET = 40;
const ELEMENT_LABELS = ['1','2','3','4','5','6','7','8','9','0'];
const CONCERN_LABELS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');

let dirList = [], dirNadir = '', dirCorners = null;
let dirLayer = null, activeDir = -1, dirBusy = false;
let pinSets = { element: [], concern: [] }, pinLayers = { element: null, concern: null };
let pinCatalogById = null;
let groundJobSeq = 0;

// ── Click a marker, read its name ─────────────────────────────────────
// Every placed sprite (pins, entrance, route waypoints) registers here.
// A click (pointerup within 5 px of pointerdown, so drags don't trigger)
// raycasts the sprites and shows the full catalog name in a small label.
let labelTargets = [];
function registerLabelTarget(sp) { if (sp && sp.name) labelTargets.push(sp); }
function unregisterLayerTargets(layer) {
  if (!layer) return;
  const gone = new Set();
  layer.traverse(function (o) { gone.add(o); });
  labelTargets = labelTargets.filter(function (t) { return !gone.has(t); });
}
(function wirePinLabels() {
  const el = document.getElementById('pin-label');
  let dx = 0, dy = 0;
  renderer.domElement.addEventListener('pointerdown', function (e) {
    dx = e.clientX; dy = e.clientY;
    el.style.display = 'none';
  });
  renderer.domElement.addEventListener('pointerup', function (e) {
    if (Math.hypot(e.clientX - dx, e.clientY - dy) > 5 || !labelTargets.length) return;
    const r = renderer.domElement.getBoundingClientRect();
    const m = new THREE.Vector2(((e.clientX - r.left) / r.width) * 2 - 1,
                                -((e.clientY - r.top) / r.height) * 2 + 1);
    const rc = new THREE.Raycaster();
    rc.setFromCamera(m, camera);
    const hits = rc.intersectObjects(labelTargets, false);
    if (!hits.length) return;
    el.textContent = hits[0].object.name;
    el.style.left = e.clientX + 'px';
    el.style.top  = (e.clientY - 14) + 'px';
    el.style.display = 'block';
    dbg('Pin: ' + hits[0].object.name, 'info');
  });
})();

function escHtml(t) {
  return String(t == null ? '' : t)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

// ── Percentage -> local metres ────────────────────────────────────────
function cornersOf(d) {
  const c = d && d.nadir && d.nadir.local;
  if (!c) return null;
  const ok = ['nw', 'ne', 'sw', 'se'].every(function (k) {
    return Array.isArray(c[k]) && c[k].length >= 2 &&
           isFinite(Number(c[k][0])) && isFinite(Number(c[k][1]));
  });
  return ok ? c : null;
}
function localFromPct(x, y, c) {
  const u = Number(x) / 100, v = Number(y) / 100;
  const w = [(1 - u) * (1 - v), u * (1 - v), (1 - u) * v, u * v];
  const k = [c.nw, c.ne, c.sw, c.se];
  let mx = 0, my = 0;
  for (let i = 0; i < 4; i++) { mx += w[i] * Number(k[i][0]); my += w[i] * Number(k[i][1]); }
  return { x: mx, y: my };
}
// mx,my when the sync wrote them; otherwise interpolate from the corners.
function toLocal(p) {
  if (isFinite(Number(p.mx)) && isFinite(Number(p.my))) {
    return { x: Number(p.mx), y: Number(p.my) };
  }
  return dirCorners ? localFromPct(p.x, p.y, dirCorners) : null;
}

function orderedRoute(d) {
  return (d && Array.isArray(d.route) ? d.route : [])
    .filter(function (w) { return isFinite(Number(w.x)) && isFinite(Number(w.y)); })
    .slice()
    .sort(function (a, b) { return (Number(a.seq) || 0) - (Number(b.seq) || 0); });
}
function metreRoute(d) {
  const pts = orderedRoute(d).map(toLocal).filter(Boolean);
  return pts.length >= 2 ? pts : null;
}

// ── Shared chunked ground raycast ─────────────────────────────────────
function cancelGroundJobs() { groundJobSeq++; dirBusy = false; }
function raycastGround(pts, progressEl, onDone) {
  const token = ++groundJobSeq;
  const zTop  = modelBox.max.z + Math.max(50, modelSpan * 0.5);
  const ray   = new THREE.Raycaster();
  const down  = new THREE.Vector3(0, 0, -1);
  const zs    = new Array(pts.length).fill(null);
  let i = 0;
  dirBusy = true;
  (function step() {
    if (token !== groundJobSeq) return;   // superseded; the new job owns dirBusy
    const end = Math.min(pts.length, i + 4);
    for (; i < end; i++) {
      ray.set(new THREE.Vector3(pts[i].x, pts[i].y, zTop), down);
      const hit = ray.intersectObject(modelRoot, true)[0];
      zs[i] = hit ? hit.point.z : null;
    }
    if (progressEl) progressEl.textContent =
      'placing on the mesh… ' + Math.round(i / pts.length * 100) + '%';
    if (i < pts.length) { requestAnimationFrame(step); return; }
    if (progressEl) progressEl.textContent = '';
    dirBusy = false;
    onDone(zs);
  })();
}
// A ray can miss where the clip cut a hole in the mesh. Fill from the nearest
// hit on either side rather than dropping the point, so one hole cannot break
// a route into pieces or drop a pin to the floor.
function fillGaps(zs) {
  let seen = null;
  for (let i = 0; i < zs.length; i++) { if (zs[i] === null) zs[i] = seen; else seen = zs[i]; }
  seen = null;
  for (let i = zs.length - 1; i >= 0; i--) { if (zs[i] === null) zs[i] = seen; else seen = zs[i]; }
  const floor = modelBox.min.z;
  for (let i = 0; i < zs.length; i++) { if (zs[i] === null) zs[i] = floor; }
  return zs;
}

// ── Panel ─────────────────────────────────────────────────────────────
function pinDisplay(p) {
  if (p.label) return { name: p.label, def: '' };
  const c = pinCatalogById && pinCatalogById[p.id];
  return { name: c ? c.name : ('Pin ' + p.id), def: c ? (c.definition || '') : '' };
}
function nadirPinSets(d) {
  const n = (d && d.nadir) || {};
  if (Array.isArray(n.element_pins) || Array.isArray(n.concern_pins)) {
    return { element: n.element_pins || [], concern: n.concern_pins || [] };
  }
  return { element: Array.isArray(n.pins) ? n.pins : [], concern: [] };
}

function initDirections(d) {
  dirCorners = cornersOf(d);
  dirNadir   = (d.nadir && d.nadir.url) || '';
  dirList    = (d.directions || []).filter(function (x) { return orderedRoute(x).length >= 2; });
  pinSets    = nadirPinSets(d);
  const nPins = pinSets.element.length + pinSets.concern.length;
  if (!dirList.length && !nPins) { dbg('Record has no pins and no directions', 'warn'); return; }

  dbg('Record: ' + (d.name || '(unnamed)') + ' — ' + dirList.length + ' route(s), ' +
      pinSets.element.length + ' element pin(s), ' + pinSets.concern.length + ' concern pin(s)', 'ok');
  dbg(dirCorners ? 'nadir.local present — percentages map to model metres'
                 : 'nadir.local MISSING — 3D placement unavailable', dirCorners ? 'ok' : 'warn');

  let html = '';
  if (!dirCorners) {
    html += '<div class="dp-note">This record has no <code>nadir.local</code>, so nothing ' +
            'can be placed in the 3D model — deploy the render patch, re-run Generate ' +
            'Property Images, then sync again. The 2D previews below work either way.</div>';
  }

  // Pins card first: it is the property's vocabulary, and the routes below
  // are described in terms of it ("TO Pool").
  if (nPins) {
    html += '<div class="rd-card" id="pin-card">' +
              '<div class="rd-head"><div class="rd-num pin">P</div>' +
                '<div class="rd-titles"><div class="rd-name">Property Pins</div>' +
                '<div class="rd-meta">' + pinSets.element.length + ' element' +
                  (pinSets.element.length === 1 ? '' : 's') + ' &middot; ' +
                  pinSets.concern.length + ' concern' +
                  (pinSets.concern.length === 1 ? '' : 's') + '</div></div></div>' +
              '<div class="rd-body">';
    // The nadir with every pin ON it — the list below is the legend for this.
    if (dirNadir) {
      html += '<div class="rd-figure"><img src="' + escHtml(dirNadir) + '" alt="Property pins" ' +
                'loading="lazy" onerror="this.parentNode.style.display=\'none\'">' +
              pinSets.element.map(function (p, i) {
                return '<div class="rd-wp el" style="left:' + Number(p.x) + '%;top:' +
                       Number(p.y) + '%">' + (ELEMENT_LABELS[i] || (i + 1)) + '</div>';
              }).join('') +
              pinSets.concern.map(function (p, i) {
                return '<div class="rd-wp co" style="left:' + Number(p.x) + '%;top:' +
                       Number(p.y) + '%">' + (CONCERN_LABELS[i] || (i + 1)) + '</div>';
              }).join('') +
              '</div>';
    }
    if (pinSets.element.length) {
      html += '<div class="pin-group-label">Elements</div>';
      pinSets.element.forEach(function (p, i) {
        const disp = pinDisplay(p);
        html += '<div class="pin-row"><span class="pin-badge green">' +
                (ELEMENT_LABELS[i] || (i + 1)) + '</span><span class="pin-name">' +
                escHtml(disp.name) + '</span></div>';
      });
    }
    if (pinSets.concern.length) {
      html += '<div class="pin-group-label">Concerns</div>';
      pinSets.concern.forEach(function (p, i) {
        const disp = pinDisplay(p);
        html += '<div class="pin-row"><span class="pin-badge red">' +
                (CONCERN_LABELS[i] || (i + 1)) + '</span><span class="pin-name">' +
                escHtml(disp.name) + '</span></div>';
      });
    }
    html += '<button class="rd-btn" id="pin-btn" onclick="togglePins3D()"' +
              (dirCorners ? '' : ' disabled') + '>Show pins in 3D</button>' +
            '<div class="rd-progress" id="pin-prog"></div>' +
            (dirCorners ? '' : '<div class="rd-note">3D placement needs nadir.local — ' +
              're-run Generate Property Images, then sync again.</div>') +
            '</div></div>';
  }

  // Oblique views — the four rendered sides plus the overhead, with the
  // analyst descriptions the sync published. Click an image to open it
  // full-size in a new tab.
  const views = [
    { label: 'Overhead View', badge: 'N', cls: ' nadir', data: d.nadir },
    { label: 'Alpha Side',    badge: 'A', cls: '', data: d.alpha },
    { label: 'Bravo Side',    badge: 'B', cls: '', data: d.bravo },
    { label: 'Charlie Side',  badge: 'C', cls: '', data: d.charlie },
    { label: 'Delta Side',    badge: 'D', cls: '', data: d.delta }
  ].filter(function (v) { return v.data && v.data.url; });
  if (views.length) {
    html += '<div class="rd-card" id="vw-card">' +
              '<div class="rd-head"><div class="rd-num" style="background:#3b82f6;color:#fff">V</div>' +
                '<div class="rd-titles"><div class="rd-name">Oblique Views</div>' +
                '<div class="rd-meta">' + views.length + ' rendered view' +
                (views.length === 1 ? '' : 's') + '</div></div></div>' +
              '<div class="rd-body">' +
              views.map(function (v) {
                const bullets = String(v.data.desc || '').split('|')
                  .map(function (t) { return t.trim(); })
                  .filter(function (t) { return t.length > 2; });
                return '<div class="vw-section">' +
                  '<div class="vw-head"><div class="vw-badge' + v.cls + '">' + v.badge +
                    '</div><div class="vw-label">' + escHtml(v.label) + '</div></div>' +
                  '<img class="vw-img" src="' + escHtml(v.data.url) + '" alt="' + escHtml(v.label) +
                    '" loading="lazy" onclick="window.open(this.src, \'_blank\')" ' +
                    'onerror="this.style.display=\'none\'">' +
                  (bullets.length ? '<ul class="vw-bullets">' + bullets.map(function (b) {
                    return '<li>' + escHtml(b) + '</li>'; }).join('') + '</ul>' : '') +
                  '</div>';
              }).join('') +
              '</div></div>';
  }

  dirList.forEach(function (dir, i) {
    const pts  = orderedRoute(dir);
    const last = pts.length - 1;
    const poly = pts.map(function (w) { return Number(w.x) + ',' + Number(w.y); }).join(' ');
    const meta = [];
    if (dir.start)  meta.push('FROM ' + escHtml(dir.start));
    if (dir.target) meta.push('TO ' + escHtml(dir.target));
    meta.push(pts.length + ' waypoint' + (pts.length === 1 ? '' : 's'));

    let fig = '';
    if (dirNadir) {
      fig = '<div class="rd-figure"><img src="' + escHtml(dirNadir) + '" alt="Route ' + (i + 1) +
            '" loading="lazy" onerror="this.parentNode.style.display=\'none\'">' +
            '<svg viewBox="0 0 100 100" preserveAspectRatio="none">' +
              '<polyline points="' + poly + '" fill="none" stroke="#0b0e12" stroke-opacity="0.75" ' +
                'stroke-width="5" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"></polyline>' +
              '<polyline points="' + poly + '" fill="none" stroke="' + ROUTE_HEX + '" ' +
                'stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"></polyline>' +
            '</svg>' +
            pts.map(function (w, k) {
              const cls = k === 0 ? ' start' : (k === last ? ' end' : '');
              return '<div class="rd-wp' + cls + '" style="left:' + Number(w.x) +
                     '%;top:' + Number(w.y) + '%">' + (k + 1) + '</div>';
            }).join('') +
            '</div>';
    }

    const drawable = !!metreRoute(dir);
    html += '<div class="rd-card" id="rd-card-' + i + '">' +
              '<div class="rd-head"><div class="rd-num">' + (i + 1) + '</div>' +
                '<div class="rd-titles">' +
                  '<div class="rd-name">' + escHtml(dir.name || ('Route ' + (i + 1))) + '</div>' +
                  '<div class="rd-meta">' + meta.join(' &middot; ') + '</div>' +
                '</div></div>' +
              '<div class="rd-body">' +
                (dir.trigger ? '<div class="rd-trigger">' + escHtml(dir.trigger) + '</div>' : '') +
                fig +
                '<button class="rd-btn" id="rd-btn-' + i + '" onclick="toggleRoute3D(' + i + ')"' +
                  (drawable ? '' : ' disabled') + '>Show in 3D</button>' +
                '<div class="rd-progress" id="rd-prog-' + i + '"></div>' +
                (drawable ? '' : '<div class="rd-note">No model coordinates for this route.</div>') +
              '</div>' +
            '</div>';
  });

  document.getElementById('dp-body').innerHTML = html;
  document.getElementById('dp-sub').textContent = d.name || '';
  const btn = document.getElementById('dir-toggle');
  btn.textContent = 'Pins & Directions';
  btn.style.display = 'block';

  // Pins are permanent scenery, like the entrance marker: place them on load
  // whenever the record can be placed at all. The panel button stays a toggle
  // for hiding them.
  if (dirCorners && nPins && modelRoot) togglePins3D();
}

window.toggleDirPanel = function () {
  const open = document.getElementById('dir-panel').classList.toggle('open');
  document.getElementById('dir-toggle').classList.toggle('on', open);
};

// ── Markers ───────────────────────────────────────────────────────────
function numberSprite(text, bg, fg, worldSize) {
  const S  = 128;
  const cv = document.createElement('canvas');
  cv.width = cv.height = S;
  const g = cv.getContext('2d');
  g.beginPath(); g.arc(S / 2, S / 2, S / 2 - 10, 0, Math.PI * 2);
  g.fillStyle = bg; g.fill();
  g.lineWidth = 10; g.strokeStyle = '#0b0e12'; g.stroke();
  g.fillStyle = fg; g.font = 'bold 60px monospace';
  g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillText(text, S / 2, S / 2 + 3);
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({
    map: new THREE.CanvasTexture(cv), depthTest: false, transparent: true }));
  sp.scale.set(worldSize, worldSize, 1);
  sp.renderOrder = 3;
  return sp;
}
function disposeLayer(layer) {
  if (!layer) return;
  scene.remove(layer);
  layer.traverse(function (o) {
    if (o.geometry) o.geometry.dispose();
    if (o.material) {
      if (o.material.map) o.material.map.dispose();
      o.material.dispose();
    }
  });
}
function markerSize() { return Math.max(3.0, modelSpan * 0.022); }
function liftBy()     { return Math.max(0.35, modelSpan * 0.0022); }

// ── Pins in 3D ────────────────────────────────────────────────────────
function pinsShown() { return !!(pinLayers.element || pinLayers.concern); }
function clearPins3D() {
  unregisterLayerTargets(pinLayers.element); unregisterLayerTargets(pinLayers.concern);
  disposeLayer(pinLayers.element); disposeLayer(pinLayers.concern);
  pinLayers = { element: null, concern: null };
  const b = document.getElementById('pin-btn');
  const c = document.getElementById('pin-card');
  if (b) { b.classList.remove('on'); b.textContent = 'Show pins in 3D'; }
  if (c) c.classList.remove('on');
  const p = document.getElementById('pin-prog');
  if (p) p.textContent = '';
}
window.togglePins3D = function () {
  if (dirBusy) { dbg('Busy placing another layer — try again in a moment', 'warn'); return; }
  if (pinsShown()) { clearPins3D(); dbg('Pins hidden', 'info'); return; }
  if (!modelRoot || !dirCorners) return;

  const all = pinSets.element.map(function (p, i) {
        return { p: p, kind: 'element', label: ELEMENT_LABELS[i] || String(i + 1) }; })
    .concat(pinSets.concern.map(function (p, i) {
        return { p: p, kind: 'concern', label: CONCERN_LABELS[i] || String(i + 1) }; }));
  const local = all.map(function (e) { return localFromPct(e.p.x, e.p.y, dirCorners); });
  if (!local.length) return;

  const prog = document.getElementById('pin-prog');
  raycastGround(local, prog, function (zs) {
    fillGaps(zs);
    const lift = liftBy(), mark = markerSize();
    pinLayers.element = new THREE.Group();
    pinLayers.concern = new THREE.Group();
    all.forEach(function (e, i) {
      const isConcern = e.kind === 'concern';
      const sp = numberSprite(e.label, isConcern ? '#ef4444' : '#22c55e',
                              isConcern ? '#ffffff' : '#0b0e12', mark);
      sp.position.set(local[i].x, local[i].y, zs[i] + lift + mark * 0.5);
      sp.name = pinDisplay(e.p).name;
      registerLabelTarget(sp);
      (isConcern ? pinLayers.concern : pinLayers.element).add(sp);
    });
    scene.add(pinLayers.element); scene.add(pinLayers.concern);
    window.__pinLayers = pinLayers;
    const b = document.getElementById('pin-btn');
    const c = document.getElementById('pin-card');
    if (b) { b.classList.add('on'); b.textContent = 'Hide pins from 3D'; }
    if (c) c.classList.add('on');
    dbg('Pins placed: ' + pinSets.element.length + ' element, ' +
        pinSets.concern.length + ' concern', 'ok');
  });
};

// ── Route in 3D ───────────────────────────────────────────────────────
function markCard(i, on) {
  const c = document.getElementById('rd-card-' + i);
  const b = document.getElementById('rd-btn-' + i);
  if (c) c.classList.toggle('on', on);
  if (b) { b.classList.toggle('on', on); b.textContent = on ? 'Hide from 3D' : 'Show in 3D'; }
}
function clearRoute3D() {
  unregisterLayerTargets(dirLayer);
  disposeLayer(dirLayer);
  dirLayer = null;
  if (activeDir >= 0) {
    markCard(activeDir, false);
    const p = document.getElementById('rd-prog-' + activeDir);
    if (p) p.textContent = '';
  }
  activeDir = -1;
}
window.toggleRoute3D = function (i) {
  if (dirBusy) { dbg('Busy placing another layer — try again in a moment', 'warn'); return; }
  const wasActive = (activeDir === i);
  clearRoute3D();
  if (wasActive) { dbg('Route hidden', 'info'); return; }
  const pts = metreRoute(dirList[i]);
  if (!pts || !modelRoot) return;
  activeDir = i;
  markCard(i, true);
  drapeRoute(pts, i);
};

// Spread RAY_BUDGET samples over the polyline in proportion to segment
// length, so a long straight run gets the intermediate ground samples a short
// turn does not need. Every original waypoint is always a sample.
function densify(pts) {
  const seg = [];
  for (let i = 0; i < pts.length - 1; i++) {
    seg.push(Math.hypot(pts[i + 1].x - pts[i].x, pts[i + 1].y - pts[i].y));
  }
  const total = seg.reduce(function (a, b) { return a + b; }, 0) || 1;
  const extra = Math.max(0, RAY_BUDGET - pts.length);
  const out = [];
  for (let i = 0; i < pts.length - 1; i++) {
    out.push({ x: pts[i].x, y: pts[i].y, wp: i });
    const n = Math.round(extra * seg[i] / total);
    for (let k = 1; k <= n; k++) {
      const t = k / (n + 1);
      out.push({ x: pts[i].x + (pts[i + 1].x - pts[i].x) * t,
                 y: pts[i].y + (pts[i + 1].y - pts[i].y) * t, wp: -1 });
    }
  }
  const lastPt = pts[pts.length - 1];
  out.push({ x: lastPt.x, y: lastPt.y, wp: pts.length - 1 });
  return out;
}

function drapeRoute(pts, idx) {
  const samples = densify(pts);
  const prog    = document.getElementById('rd-prog-' + idx);
  raycastGround(samples, prog, function (zs) {
    if (activeDir !== idx) return;
    fillGaps(zs);
    buildRouteObjects(samples, zs, pts, idx);
  });
}

function buildRouteObjects(samples, zs, pts, idx) {
  const lift   = liftBy();
  const radius = Math.max(0.22, modelSpan * 0.0020);
  const mark   = markerSize();
  const vecs   = samples.map(function (s, i) {
    return new THREE.Vector3(s.x, s.y, zs[i] + lift);
  });

  dirLayer = new THREE.Group();

  const curve = new THREE.CatmullRomCurve3(vecs, false, 'catmullrom', 0.15);
  const tube  = new THREE.TubeGeometry(curve, Math.max(32, vecs.length * 6), radius, 8, false);
  dirLayer.add(new THREE.Mesh(tube, new THREE.MeshBasicMaterial({ color: ROUTE_HEX })));
  // Ghost copy with depth testing off, so the path stays legible where the
  // residence or a tree stands between it and the camera.
  const ghost = new THREE.Mesh(tube, new THREE.MeshBasicMaterial({
    color: ROUTE_HEX, transparent: true, opacity: 0.28, depthTest: false }));
  ghost.renderOrder = 2;
  dirLayer.add(ghost);

  const last = pts.length - 1;
  samples.forEach(function (s, i) {
    if (s.wp < 0) return;
    const isStart = s.wp === 0, isEnd = s.wp === last;
    const bg = isStart ? '#22c55e' : (isEnd ? '#ef4444' : ROUTE_HEX);
    const fg = isEnd ? '#ffffff' : '#0b0e12';
    const sp = numberSprite(String(s.wp + 1), bg, fg, mark);
    sp.position.set(s.x, s.y, zs[i] + lift + mark * 0.5);
    sp.name = (isStart ? 'Start — ' : (isEnd ? 'Target — ' : 'Waypoint ' + (s.wp + 1) + ' — ')) +
              (dirList[idx].name || ('Route ' + (idx + 1)));
    registerLabelTarget(sp);
    dirLayer.add(sp);
  });

  scene.add(dirLayer);
  frameRoute(vecs);
  dbg('Route drawn: ' + (dirList[idx].name || ('#' + (idx + 1))) +
      ' (' + pts.length + ' waypoints, ' + samples.length + ' ground samples)', 'ok');
}

function frameRoute(vecs) {
  const b = new THREE.Box3();
  vecs.forEach(function (v) { b.expandByPoint(v); });
  const c = b.getCenter(new THREE.Vector3());
  const s = b.getSize(new THREE.Vector3());
  const d = Math.max(s.x, s.y, 20) * 1.7;
  camera.position.set(c.x, c.y - d * 0.8, c.z + d * 0.8);
  camera.up.set(0, 0, 1);
  controls.target.copy(c);
  controls.update();
}

function showErr(msg) {
  document.getElementById('loading').classList.add('hidden');
  document.getElementById('err-msg').textContent = msg;
  document.getElementById('err').classList.add('visible');
}
</script>

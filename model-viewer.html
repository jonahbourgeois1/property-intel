<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Property 3D Viewer Test</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; background: #111318; overflow: hidden; font-family: monospace; }
  canvas { display: block; }
  #loading {
    position: fixed; inset: 0; background: #111318;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 16px; z-index: 100; transition: opacity 0.5s ease;
  }
  #loading.hidden { opacity: 0; pointer-events: none; }
  .spin {
    width: 36px; height: 36px;
    border: 2px solid rgba(168,85,247,0.2);
    border-top-color: #a855f7;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .load-text { font-size: 12px; color: #555f6e; }
  #progress { font-size: 11px; color: #3d4752; margin-top: 4px; }
  #err {
    display: none; position: fixed; inset: 0;
    align-items: center; justify-content: center; flex-direction: column;
    gap: 12px; background: #0a0c0f; color: #8a93a2;
    font-size: 13px; text-align: center; padding: 32px; z-index: 200;
  }
  #err.visible { display: flex; }
  #err strong { color: #ef4444; font-size: 15px; }
  #hint {
    position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
    background: rgba(0,0,0,0.5); color: #555f6e; font-size: 11px;
    padding: 6px 14px; border-radius: 20px; pointer-events: none;
    transition: opacity 1s ease; z-index: 50;
  }
  #hint.hidden { opacity: 0; }
  /* view buttons (vantages) + the separate Entrance action */
  #viewButtons {
    position: fixed; bottom: 16px; left: 16px; z-index: 50;
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center;
  }
  .view-btn {
    background: rgba(0,0,0,0.6); color: #8a93a2; border: 1px solid #2a3040;
    font-family: monospace; font-size: 11px; padding: 7px 14px;
    border-radius: 6px; cursor: pointer; transition: color 0.2s, border-color 0.2s;
  }
  .view-btn:hover { color: #fff; border-color: #3d4657; }
  .view-btn:disabled { opacity: 0.35; cursor: default; }
  /* the Entrance button is an action, not a vantage -- set it apart */
  .entrance-btn { margin-left: 8px; border-color: #3d5a8a; color: #9db8e0; }
  .entrance-btn:hover { color: #fff; border-color: #5a82c0; }
  /* element-pin hover tooltip */
  #pinTip {
    position: fixed; z-index: 60; pointer-events: none; display: none;
    background: rgba(0,0,0,0.82); color: #e6ebf2; font-family: monospace;
    font-size: 12px; padding: 4px 8px; border-radius: 5px;
    border: 1px solid #2a3040; white-space: nowrap;
  }
  #pinTip.visible { display: block; }
  /* debug console overlay */
  #dbg {
    position: fixed; top: 10px; left: 10px; z-index: 300;
    width: 420px; max-width: 46vw; max-height: 70vh; overflow: auto;
    background: rgba(6,8,11,0.86); color: #b9c2d0; border: 1px solid #2a3040;
    border-radius: 6px; padding: 8px 10px; font-size: 11px; line-height: 1.45;
    white-space: pre-wrap; word-break: break-all;
  }
  #dbg .h { color: #a855f7; font-weight: bold; }
  #dbg .ok { color: #4ade80; }
  #dbg .warn { color: #f5a524; }
  #dbg .err { color: #ef4444; }
  #dbg .dim { color: #6b7688; }
  #dbgToggle {
    position: fixed; top: 10px; left: 10px; z-index: 301; display: none;
    background: rgba(0,0,0,0.6); color: #a855f7; border: 1px solid #3d4657;
    font-family: monospace; font-size: 11px; padding: 5px 10px;
    border-radius: 6px; cursor: pointer;
  }
</style>
</head>
<body>
<div id="loading">
  <div class="spin"></div>
  <div class="load-text">Loading property model...</div>
  <div id="progress"></div>
</div>
<div id="err">
  <strong>Could not load model</strong>
  <span id="err-msg" style="font-size:11px;opacity:0.6;margin-top:6px;"></span>
</div>
<div id="hint">Left drag to pan - Middle drag to rotate - Right drag to zoom - Wheel to zoom</div>
<div id="pinTip"></div>
<div id="dbg"><span class="h">DEBUG</span>  <span class="dim">(press D to hide)</span>
</div>
<button id="dbgToggle" onclick="document.getElementById('dbg').style.display='block';this.style.display='none';">DEBUG</button>
<button id="resetBtn" onclick="resetView()" style="
  position: fixed; bottom: 56px; right: 16px; z-index: 50;
  background: rgba(0,0,0,0.6); color: #8a93a2; border: 1px solid #2a3040;
  font-family: monospace; font-size: 11px; padding: 6px 12px;
  border-radius: 6px; cursor: pointer; transition: color 0.2s;
" onmouseover="this.style.color='#fff'" onmouseout="this.style.color='#8a93a2'">
  Reset View
</button>
<div id="viewButtons">
  <button class="view-btn" data-view="nadir"   onclick="playView('nadir')">Nadir</button>
  <button class="view-btn" data-view="alpha"   onclick="playView('alpha')">Alpha</button>
  <button class="view-btn" data-view="bravo"   onclick="playView('bravo')">Bravo</button>
  <button class="view-btn" data-view="charlie" onclick="playView('charlie')">Charlie</button>
  <button class="view-btn" data-view="delta"   onclick="playView('delta')">Delta</button>
  <button class="view-btn entrance-btn" data-view="entrance" onclick="playView('entrance')">Entrance</button>
</div>

<script>
// -- Debug console (plain script so it exists before the module runs) -----
(function () {
  var box = document.getElementById('dbg');
  var seq = 0;
  window.dbg = function (msg, cls) {
    seq++;
    var line = document.createElement('div');
    if (cls) line.className = cls;
    line.textContent = String(msg);
    box.appendChild(line);
    box.scrollTop = box.scrollHeight;
    try { console.log('[dbg] ' + msg); } catch (e) {}
  };
  window.addEventListener('error', function (e) {
    window.dbg('JS ERROR: ' + (e.message || e) + (e.filename ? ' @ ' + e.filename + ':' + e.lineno : ''), 'err');
  });
  window.addEventListener('unhandledrejection', function (e) {
    window.dbg('PROMISE REJECTION: ' + ((e.reason && e.reason.message) || e.reason), 'err');
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'd' || e.key === 'D') {
      var hidden = box.style.display === 'none';
      box.style.display = hidden ? 'block' : 'none';
      document.getElementById('dbgToggle').style.display = hidden ? 'none' : 'block';
    }
  });
})();
</script>

<script type="importmap">
{
  "imports": {
    "three": "https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.module.js"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
dbg('module: three r' + (THREE.REVISION || '?') + ' imported', 'ok');

const BASE = 'https://cdn.jsdelivr.net/npm/three@0.128.0/examples/jsm';
let GLTFLoader, DRACOLoader, OrbitControls;
try {
  ({ GLTFLoader }   = await import(`${BASE}/loaders/GLTFLoader.js`));
  ({ DRACOLoader }  = await import(`${BASE}/loaders/DRACOLoader.js`));
  ({ OrbitControls } = await import(`${BASE}/controls/OrbitControls.js`));
  dbg('module: GLTFLoader/DRACOLoader/OrbitControls loaded', 'ok');
} catch (e) {
  dbg('module: loader import FAILED -> ' + (e.message || e), 'err');
  throw e;
}

// -- URL params -----------------------------------------------------------
const params   = new URLSearchParams(window.location.search);
const glbUrl   = params.get('model');
const alphaParam = parseFloat(params.get('alpha'));
const hasAlpha   = !isNaN(alphaParam);
const entXParam  = parseFloat(params.get('ent_x'));
const entYParam  = parseFloat(params.get('ent_y'));
const hasEntrance = !isNaN(entXParam) && !isNaN(entYParam);
const pinsUrl    = params.get('pins');

dbg('params: model=' + (glbUrl ? 'set' : 'MISSING') + '  alpha=' + params.get('alpha') +
    '  ent=(' + params.get('ent_x') + ',' + params.get('ent_y') + ')');
dbg('params: pins=' + (pinsUrl || '(none)'), pinsUrl ? 'ok' : 'warn');
if (pinsUrl) {
  try { dbg('pins: resolves to ' + new URL(pinsUrl, window.location.href).href, 'dim'); }
  catch (e) { dbg('pins: bad URL -> ' + (e.message || e), 'err'); }
}

const num = (k, d) => { const v = parseFloat(params.get(k)); return isNaN(v) ? d : v; };
const POLAR_VIEW = num('polar', 25);
const POLAR_ENT  = num('polar_end', 15);
const END_RADIUS = num('end_radius', 45);
const FLY_MS     = parseInt(params.get('dur_ms') || '1600', 10);

if (!glbUrl) {
  showErr('No model URL provided. Add ?model=https://... to the URL.');
}

function viewAzimuths(alpha) {
  return { alpha: alpha % 360, bravo: (alpha + 90) % 360,
           charlie: (alpha + 180) % 360, delta: (alpha + 270) % 360 };
}

function camPos(target, azimuthDeg, elevationDeg, distance) {
  const az = THREE.MathUtils.degToRad(azimuthDeg);
  const el = THREE.MathUtils.degToRad(elevationDeg);
  const horiz = distance * Math.cos(el);
  const up = distance * Math.sin(el);
  return new THREE.Vector3(target.x + horiz * Math.sin(az),
                           target.y + horiz * Math.cos(az),
                           target.z + up);
}

function exactFitDistance(box, center, azimuthDeg, elevationDeg) {
  const azr = THREE.MathUtils.degToRad(azimuthDeg);
  const elr = THREE.MathUtils.degToRad(elevationDeg);
  const dirCam = new THREE.Vector3(Math.sin(azr)*Math.cos(elr), Math.cos(azr)*Math.cos(elr), Math.sin(elr));
  const fwd = dirCam.clone().negate();
  const rightV = new THREE.Vector3().crossVectors(fwd, new THREE.Vector3(0,0,1)).normalize();
  const upV = new THREE.Vector3().crossVectors(rightV, fwd).normalize();
  const tanV = Math.tan(THREE.MathUtils.degToRad(camera.fov/2));
  const tanH = tanV * camera.aspect;
  let need = 0;
  for (const sx of [box.min.x, box.max.x])
  for (const sy of [box.min.y, box.max.y])
  for (const sz of [box.min.z, box.max.z]) {
    const rel = new THREE.Vector3(sx, sy, sz).sub(center);
    const along = rel.dot(dirCam);
    need = Math.max(need, along + Math.abs(rel.dot(rightV))/tanH,
                          along + Math.abs(rel.dot(upV))/tanV);
  }
  return need * 1.04;
}

function findStructureNearPoint(model, allPoints, focusX, focusY, searchRadius, percentile) {
  const rSq = searchRadius * searchRadius;
  const nearby = [];
  for (let i = 0; i < allPoints.length; i += 3) {
    const dx = allPoints[i] - focusX, dy = allPoints[i + 1] - focusY;
    if (dx * dx + dy * dy <= rSq) {
      nearby.push(allPoints[i], allPoints[i + 1], allPoints[i + 2]);
    }
  }
  if (nearby.length === 0) return null;
  const zs = [];
  for (let i = 2; i < nearby.length; i += 3) zs.push(nearby[i]);
  zs.sort((a, b) => a - b);
  const heightThreshold = zs[Math.floor(percentile * (zs.length - 1))];
  let sumX = 0, sumY = 0, sumZ = 0, n = 0;
  for (let i = 0; i < nearby.length; i += 3) {
    const x = nearby[i], y = nearby[i + 1], z = nearby[i + 2];
    if (z < heightThreshold) continue;
    sumX += x; sumY += y; sumZ += z; n++;
  }
  if (n === 0) return null;
  return { center: new THREE.Vector3(sumX / n, sumY / n, sumZ / n) };
}

function getAllModelPoints(model) {
  const pts = [];
  model.updateMatrixWorld(true);
  const v = new THREE.Vector3();
  model.traverse((child) => {
    if (!child.isMesh || !child.geometry) return;
    const posAttr = child.geometry.attributes.position;
    if (!posAttr) return;
    for (let i = 0; i < posAttr.count; i++) {
      v.fromBufferAttribute(posAttr, i);
      v.applyMatrix4(child.matrixWorld);
      pts.push(v.x, v.y, v.z);
    }
  });
  return pts;
}

// -- Scene setup ----------------------------------------------------------
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(window.devicePixelRatio);
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color('#111318');

const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100000);
camera.up.set(0, 0, 1);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.screenSpacePanning = true;
controls.minDistance = 10;
controls.maxDistance = 5000;
controls.mouseButtons = { LEFT: THREE.MOUSE.PAN, MIDDLE: THREE.MOUSE.ROTATE, RIGHT: THREE.MOUSE.DOLLY };
controls.zoomSpeed = 1.0;
controls.minPolarAngle = 0;
controls.maxPolarAngle = Math.PI / 2;

controls.enableZoom = false;
renderer.domElement.addEventListener('wheel', (ev) => {
  ev.preventDefault();
  if (playing) return;
  const step = Math.pow(0.95, controls.zoomSpeed || 1.0);
  const factor = ev.deltaY < 0 ? step : 1 / step;
  const off = camera.position.clone().sub(controls.target);
  let dist = off.length() * factor;
  dist = Math.min(Math.max(dist, controls.minDistance), controls.maxDistance);
  off.setLength(dist);
  camera.position.copy(controls.target).add(off);
  controls.update();
}, { passive: false });

const ambient = new THREE.AmbientLight(0xffffff, 0.7);
scene.add(ambient);
const sun = new THREE.DirectionalLight(0xffffff, 1.2);
sun.position.set(1, 2, 2);
scene.add(sun);

// -- Element pins ---------------------------------------------------------
const PIN_PX      = 9;
const ROLE_COLORS = { primary: '#a855f7', concern: '#f5a524' };
const pinGroup    = new THREE.Group();
scene.add(pinGroup);

const _pinTexCache = {};
function pinTexture(hex) {
  if (_pinTexCache[hex]) return _pinTexCache[hex];
  const s = 64, c = document.createElement('canvas');
  c.width = c.height = s;
  const g = c.getContext('2d');
  g.beginPath(); g.arc(s / 2, s / 2, s / 2 - 7, 0, Math.PI * 2);
  g.fillStyle = hex; g.fill();
  g.lineWidth = 7; g.strokeStyle = 'rgba(255,255,255,0.92)'; g.stroke();
  const t = new THREE.CanvasTexture(c);
  _pinTexCache[hex] = t;
  return t;
}

// First surface hit straight down through (x, y). Returns {z, hit}.
function surfaceZ(x, y) {
  const rc = new THREE.Raycaster(
    new THREE.Vector3(x, y, BOX.max.z + 1000),
    new THREE.Vector3(0, 0, -1));
  const hits = rc.intersectObject(MODEL, true);
  return hits.length ? { z: hits[0].point.z, hit: 'ray' } : { z: BOX.min.z, hit: 'floor' };
}

async function loadPins(url) {
  dbg('--- pins ---', 'h');
  let pins;
  try {
    const resp = await fetch(url);
    dbg('fetch: HTTP ' + resp.status + (resp.ok ? ' OK' : ' FAIL') +
        '  type=' + (resp.headers.get('content-type') || '?'), resp.ok ? 'ok' : 'err');
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    const text = await resp.text();
    dbg('body: ' + text.length + ' chars', 'dim');
    pins = JSON.parse(text);
  } catch (e) {
    dbg('LOAD FAILED -> ' + (e.message || e), 'err');
    dbg('(a 404 here = file not committed / wrong path; a CORS/type error = served wrong)', 'dim');
    return;
  }
  if (!Array.isArray(pins)) { dbg('parsed JSON is not an array (got ' + typeof pins + ')', 'err'); return; }
  dbg('parsed ' + pins.length + ' pin(s)', 'ok');
  dbg('model box  min(' + BOX.min.x.toFixed(1) + ',' + BOX.min.y.toFixed(1) + ',' + BOX.min.z.toFixed(1) +
      ')  max(' + BOX.max.x.toFixed(1) + ',' + BOX.max.y.toFixed(1) + ',' + BOX.max.z.toFixed(1) + ')', 'dim');

  let added = 0, outside = 0;
  for (const p of pins) {
    if (typeof p.x !== 'number' || typeof p.y !== 'number') {
      dbg('skip id=' + p.id + ': x/y not numbers', 'warn'); continue;
    }
    const color = ROLE_COLORS[p.role] || ROLE_COLORS.primary;
    const mat = new THREE.SpriteMaterial({
      map: pinTexture(color), transparent: true, depthTest: false, depthWrite: false });
    const spr = new THREE.Sprite(mat);
    let z, hit;
    if (typeof p.z === 'number') { z = p.z; hit = 'given'; }
    else { const s = surfaceZ(p.x, p.y); z = s.z; hit = s.hit; }
    spr.position.set(p.x, p.y, z);
    spr.renderOrder = 999;
    spr.userData = { name: p.name || ('#' + p.id), id: p.id, role: p.role };
    pinGroup.add(spr);
    added++;
    const inX = p.x >= BOX.min.x && p.x <= BOX.max.x;
    const inY = p.y >= BOX.min.y && p.y <= BOX.max.y;
    if (!(inX && inY)) outside++;
    dbg('  + ' + (p.name || ('#' + p.id)) + '  xy(' + p.x + ',' + p.y + ') z=' + z.toFixed(1) +
        ' [' + hit + ']' + ((inX && inY) ? '' : '  <-- OUTSIDE model box'), (inX && inY) ? '' : 'warn');
  }
  dbg('sprites added = ' + added + '  (group=' + pinGroup.children.length + ')', added ? 'ok' : 'err');
  if (outside) dbg(outside + ' pin(s) fall OUTSIDE the model footprint -> frame/coord mismatch', 'warn');
  if (added && !outside) dbg('pins are inside the model box; if you cannot see them, orbit/zoom or check render order', 'dim');
}

// -- Camera-move state ----------------------------------------------------
let MODEL = null, BOX = null, CENTER = null, VIEWS = null, playing = false;

function poseFor(name) {
  if (name === 'nadir') {
    const az = hasAlpha ? VIEWS.alpha : 0, el = 89;
    return { target: CENTER.clone(), pos: camPos(CENTER, az, el, exactFitDistance(BOX, CENTER, az, el)) };
  }
  if (name === 'entrance') {
    const allPoints = getAllModelPoints(MODEL);
    const ground = findStructureNearPoint(MODEL, allPoints, entXParam, entYParam, 8.0, 0.0);
    const target = ground ? ground.center : new THREE.Vector3(entXParam, entYParam, BOX.min.z);
    const endBox = new THREE.Box3(
      new THREE.Vector3(target.x - END_RADIUS, target.y - END_RADIUS, BOX.min.z),
      new THREE.Vector3(target.x + END_RADIUS, target.y + END_RADIUS, BOX.max.z));
    const az = VIEWS.alpha, el = POLAR_ENT;
    return { target, pos: camPos(target, az, el, exactFitDistance(endBox, target, az, el)) };
  }
  const az = VIEWS[name], el = POLAR_VIEW;
  return { target: CENTER.clone(), pos: camPos(CENTER, az, el, exactFitDistance(BOX, CENTER, az, el)) };
}

function flyTo(pose, durationMs) {
  const p0 = camera.position.clone();
  const t0v = controls.target.clone();
  controls.enabled = false;
  playing = true;
  const t0 = performance.now();
  const tmpP = new THREE.Vector3(), tmpT = new THREE.Vector3();
  function step(now) {
    const t = Math.min((now - t0) / durationMs, 1);
    const e = t * t * (3 - 2 * t);
    tmpP.lerpVectors(p0, pose.pos, e);
    tmpT.lerpVectors(t0v, pose.target, e);
    camera.position.copy(tmpP);
    camera.up.set(0, 0, 1);
    camera.lookAt(tmpT);
    camera.updateProjectionMatrix();
    if (t < 1) {
      requestAnimationFrame(step);
    } else {
      controls.target.copy(pose.target);
      controls.enabled = true;
      controls.update();
      playing = false;
    }
  }
  requestAnimationFrame(step);
}

window.playView = function(name) {
  if (!MODEL || playing) return;
  if (name === 'nadir') { flyTo(poseFor('nadir'), FLY_MS); return; }
  if (name === 'entrance') {
    if (!hasAlpha || !hasEntrance) { dbg('entrance needs alpha + ent_x/ent_y', 'warn'); return; }
    flyTo(poseFor('entrance'), FLY_MS); return;
  }
  if (!hasAlpha) { dbg('no alpha bearing in URL; vantage views unavailable', 'warn'); return; }
  flyTo(poseFor(name), FLY_MS);
};

// -- Load GLB -------------------------------------------------------------
const dracoLoader = new DRACOLoader();
dracoLoader.setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.5.6/');
const loader = new GLTFLoader();
loader.setDRACOLoader(dracoLoader);

dbg('loading GLB...', 'dim');
loader.load(
  glbUrl,
  function(gltf) {
    const model = gltf.scene;
    scene.add(model);
    const box = new THREE.Box3().setFromObject(model);
    const center = box.getCenter(new THREE.Vector3());
    const size = box.getSize(new THREE.Vector3());
    MODEL = model; BOX = box; CENTER = center;
    VIEWS = hasAlpha ? viewAzimuths(alphaParam) : null;
    dbg('GLB loaded  size(' + size.x.toFixed(1) + ',' + size.y.toFixed(1) + ',' + size.z.toFixed(1) +
        ')  center(' + center.x.toFixed(1) + ',' + center.y.toFixed(1) + ',' + center.z.toFixed(1) + ')', 'ok');

    const camDist = Math.max(size.x, size.y) * 1.4;
    camera.position.set(center.x, center.y - camDist * 0.8, center.z + camDist * 0.8);
    camera.up.set(0, 0, 1);
    camera.lookAt(center);
    camera.updateProjectionMatrix();
    controls.target.copy(center);
    controls.update();

    const initPos = camera.position.clone();
    const initTarget = controls.target.clone();
    window.resetView = function() {
      if (playing) return;
      camera.position.copy(initPos);
      camera.up.set(0, 0, 1);
      controls.target.copy(initTarget);
      controls.enabled = true;
      controls.update();
    };

    const disable = (v) => { const b = document.querySelector('.view-btn[data-view="' + v + '"]'); if (b) b.disabled = true; };
    if (!hasAlpha) { ['alpha','bravo','charlie','delta','entrance'].forEach(disable); }
    else if (!hasEntrance) { disable('entrance'); }

    if (pinsUrl) loadPins(pinsUrl);
    else dbg('no pins= param -> pin layer skipped', 'warn');

    document.getElementById('loading').classList.add('hidden');
    setTimeout(() => document.getElementById('hint').classList.add('hidden'), 4000);
    requestAnimationFrame(() => {
      requestAnimationFrame(() => { window.__viewerReady = true; });
    });
  },
  function(xhr) {
    if (xhr.total) {
      document.getElementById('progress').textContent =
        Math.round(xhr.loaded / xhr.total * 100) + '%';
    }
  },
  function(err) {
    dbg('GLB load FAILED -> ' + (err.message || err), 'err');
    showErr(err.message || String(err));
  }
);

// -- Render loop ----------------------------------------------------------
function animate() {
  requestAnimationFrame(animate);
  if (!playing) controls.update();
  if (pinGroup.children.length) {
    const wpp = 2 * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)) / window.innerHeight;
    for (const spr of pinGroup.children) {
      const d = camera.position.distanceTo(spr.position);
      spr.scale.setScalar(wpp * d * PIN_PX * 2);
    }
  }
  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

function showErr(msg) {
  document.getElementById('loading').classList.add('hidden');
  document.getElementById('err-msg').textContent = msg;
  document.getElementById('err').classList.add('visible');
}
</script>
</body>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Property 3D Viewer</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; background: #111318; overflow: hidden; font-family: monospace; }
  canvas { display: block; }
  #loading {
    position: fixed; inset: 0; background: #111318;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 16px; z-index: 100; transition: opacity 0.5s ease;
  }
  #loading.hidden { opacity: 0; pointer-events: none; }
  .spin {
    width: 36px; height: 36px;
    border: 2px solid rgba(168,85,247,0.2);
    border-top-color: #a855f7;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .load-text { font-size: 12px; color: #555f6e; }
  #progress { font-size: 11px; color: #3d4752; margin-top: 4px; }
  #err {
    display: none; position: fixed; inset: 0;
    align-items: center; justify-content: center; flex-direction: column;
    gap: 12px; background: #0a0c0f; color: #8a93a2;
    font-size: 13px; text-align: center; padding: 32px; z-index: 200;
  }
  #err.visible { display: flex; }
  #err strong { color: #ef4444; font-size: 15px; }
  #hint {
    position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
    background: rgba(0,0,0,0.5); color: #555f6e; font-size: 11px;
    padding: 6px 14px; border-radius: 20px; pointer-events: none;
    transition: opacity 1s ease; z-index: 50;
  }
  #hint.hidden { opacity: 0; }
  /* view buttons (Nadir + the four approaches) */
  #viewButtons {
    position: fixed; bottom: 16px; left: 16px; z-index: 50;
    display: flex; gap: 8px; flex-wrap: wrap;
  }
  .view-btn {
    background: rgba(0,0,0,0.6); color: #8a93a2; border: 1px solid #2a3040;
    font-family: monospace; font-size: 11px; padding: 7px 14px;
    border-radius: 6px; cursor: pointer; transition: color 0.2s, border-color 0.2s;
  }
  .view-btn:hover { color: #fff; border-color: #3d4657; }
  .view-btn:disabled { opacity: 0.35; cursor: default; }
</style>
</head>
<body>
<div id="loading">
  <div class="spin"></div>
  <div class="load-text">Loading property model...</div>
  <div id="progress"></div>
</div>
<div id="err">
  <strong>Could not load model</strong>
  <span id="err-msg" style="font-size:11px;opacity:0.6;margin-top:6px;"></span>
</div>
<div id="hint">Left drag to pan - Middle drag to rotate - Right drag to zoom</div>
<button id="resetBtn" onclick="resetView()" style="
  position: fixed; bottom: 56px; right: 16px; z-index: 50;
  background: rgba(0,0,0,0.6); color: #8a93a2; border: 1px solid #2a3040;
  font-family: monospace; font-size: 11px; padding: 6px 12px;
  border-radius: 6px; cursor: pointer; transition: color 0.2s;
" onmouseover="this.style.color='#fff'" onmouseout="this.style.color='#8a93a2'">
  Reset View
</button>
<div id="viewButtons">
  <button class="view-btn" onclick="playView('nadir')">Nadir</button>
  <button class="view-btn" onclick="playView('alpha')">Alpha</button>
  <button class="view-btn" onclick="playView('bravo')">Bravo</button>
  <button class="view-btn" onclick="playView('charlie')">Charlie</button>
  <button class="view-btn" onclick="playView('delta')">Delta</button>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.module.js"
  }
}
</script>

<script type="module">
import * as THREE from 'three';

const BASE = 'https://cdn.jsdelivr.net/npm/three@0.128.0/examples/jsm';
const { GLTFLoader }    = await import(`${BASE}/loaders/GLTFLoader.js`);
const { DRACOLoader }   = await import(`${BASE}/loaders/DRACOLoader.js`);
const { OrbitControls } = await import(`${BASE}/controls/OrbitControls.js`);

// -- URL params -----------------------------------------------------------
// Interactive responder viewer. It is fed the SAME geometry the render/video
// pipeline computes: a clipped GLB, the entrance bearing (alpha), and the
// entrance point in the GLB's local frame. From alpha alone it derives the
// four approach azimuths; the buttons fly the camera along the same 2-keyframe
// path the approach videos use (start on the view's oblique, end on the
// entrance), so the live flight matches the rendered clip.
const params   = new URLSearchParams(window.location.search);
const glbUrl   = params.get('model');
const alphaParam = parseFloat(params.get('alpha'));      // entrance bearing, deg
const hasAlpha   = !isNaN(alphaParam);
const entXParam  = parseFloat(params.get('ent_x'));
const entYParam  = parseFloat(params.get('ent_y'));
const hasEntrance = !isNaN(entXParam) && !isNaN(entYParam);

const num = (k, d) => { const v = parseFloat(params.get(k)); return isNaN(v) ? d : v; };
const POLAR_START = num('polar', 25);
const POLAR_END   = num('polar_end', 15);
const END_RADIUS  = num('end_radius', 45);
const PATH_FRAMES = parseInt(params.get('frames') || '60', 10);
const PATH_HOLD   = parseInt(params.get('hold')   || '8',  10);
const FLIGHT_MS   = parseInt(params.get('dur_ms') || '4000', 10);

if (!glbUrl) {
  showErr('No model URL provided. Add ?model=https://... to the URL.');
}

// Every approach ENDS facing the entrance (alpha); each STARTS on its own
// oblique: alpha+0/90/180/270.
function viewAzimuths(alpha) {
  return { alpha: alpha % 360, bravo: (alpha + 90) % 360,
           charlie: (alpha + 180) % 360, delta: (alpha + 270) % 360 };
}

// -- Engine (reused verbatim from the capture viewer, render-viewer.html) --
// Z-up, +Y = north, +X = east. azimuth = compass bearing of the camera's
// position relative to the target point.
function positionCameraCompass(camera, center, azimuthDeg, elevationDeg, distance) {
  const az = THREE.MathUtils.degToRad(azimuthDeg);
  const el = THREE.MathUtils.degToRad(elevationDeg);
  const horiz = distance * Math.cos(el);
  const up = distance * Math.sin(el);
  const east = horiz * Math.sin(az);
  const north = horiz * Math.cos(az);
  camera.position.set(center.x + east, center.y + north, center.z + up);
  camera.up.set(0, 0, 1);
  camera.lookAt(center);
}

// Exact-fit distance: smallest distance keeping every bounding-box corner in
// the viewport, plus a 4% margin. Reads module-scope `camera` for fov/aspect;
// only ever called after load, so no TDZ concern.
function exactFitDistance(box, center, azimuthDeg, elevationDeg) {
  const azr = THREE.MathUtils.degToRad(azimuthDeg);
  const elr = THREE.MathUtils.degToRad(elevationDeg);
  const dirCam = new THREE.Vector3(Math.sin(azr)*Math.cos(elr), Math.cos(azr)*Math.cos(elr), Math.sin(elr));
  const fwd = dirCam.clone().negate();
  const rightV = new THREE.Vector3().crossVectors(fwd, new THREE.Vector3(0,0,1)).normalize();
  const upV = new THREE.Vector3().crossVectors(rightV, fwd).normalize();
  const tanV = Math.tan(THREE.MathUtils.degToRad(camera.fov/2));
  const tanH = tanV * camera.aspect;
  let need = 0;
  for (const sx of [box.min.x, box.max.x])
  for (const sy of [box.min.y, box.max.y])
  for (const sz of [box.min.z, box.max.z]) {
    const rel = new THREE.Vector3(sx, sy, sz).sub(center);
    const along = rel.dot(dirCam);
    need = Math.max(need, along + Math.abs(rel.dot(rightV))/tanH,
                          along + Math.abs(rel.dot(upV))/tanV);
  }
  return need * 1.04;
}

function findStructureNearPoint(model, allPoints, focusX, focusY, searchRadius, percentile) {
  const rSq = searchRadius * searchRadius;
  const nearby = [];
  for (let i = 0; i < allPoints.length; i += 3) {
    const dx = allPoints[i] - focusX, dy = allPoints[i + 1] - focusY;
    if (dx * dx + dy * dy <= rSq) {
      nearby.push(allPoints[i], allPoints[i + 1], allPoints[i + 2]);
    }
  }
  if (nearby.length === 0) return null;
  const zs = [];
  for (let i = 2; i < nearby.length; i += 3) zs.push(nearby[i]);
  zs.sort((a, b) => a - b);
  const heightThreshold = zs[Math.floor(percentile * (zs.length - 1))];
  let sumX = 0, sumY = 0, sumZ = 0, n = 0;
  for (let i = 0; i < nearby.length; i += 3) {
    const x = nearby[i], y = nearby[i + 1], z = nearby[i + 2];
    if (z < heightThreshold) continue;
    sumX += x; sumY += y; sumZ += z; n++;
  }
  if (n === 0) return null;
  return { center: new THREE.Vector3(sumX / n, sumY / n, sumZ / n) };
}

function getAllModelPoints(model) {
  const pts = [];
  model.updateMatrixWorld(true);
  const v = new THREE.Vector3();
  model.traverse((child) => {
    if (!child.isMesh || !child.geometry) return;
    const posAttr = child.geometry.attributes.position;
    if (!posAttr) return;
    for (let i = 0; i < posAttr.count; i++) {
      v.fromBufferAttribute(posAttr, i);
      v.applyMatrix4(child.matrixWorld);
      pts.push(v.x, v.y, v.z);
    }
  });
  return pts;
}

// -- Scene setup ----------------------------------------------------------
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(window.devicePixelRatio);
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color('#111318');

const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100000);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.screenSpacePanning = true;
controls.minDistance = 10;
controls.maxDistance = 5000;
controls.mouseButtons = { LEFT: THREE.MOUSE.PAN, MIDDLE: THREE.MOUSE.ROTATE, RIGHT: THREE.MOUSE.DOLLY };
controls.enableZoom = true;
controls.zoomSpeed = 1.0;
controls.minPolarAngle = 0;
controls.maxPolarAngle = Math.PI / 2;

const ambient = new THREE.AmbientLight(0xffffff, 0.7);
scene.add(ambient);
const sun = new THREE.DirectionalLight(0xffffff, 1.2);
sun.position.set(1, 2, 2);
scene.add(sun);

// -- Live-flight state ----------------------------------------------------
// While a flight runs, OrbitControls is detached (see the !playing gate in
// animate) and the camera is owned by setFrame; on arrival we re-seat the
// orbit target on the end look-at and hand control back.
let MODEL = null, BOX = null, CENTER = null, VIEWS = null, playing = false;

// Build the 2-keyframe approach path for one view and install window.setFrame.
// START = the view's oblique (exact-fit on the whole parcel at startAz).
// END   = framed on the entrance point from the alpha bearing, lower polar.
function buildApproachPath(startAz, endAz, spin) {
  const startTarget = CENTER.clone();
  const startDist = exactFitDistance(BOX, startTarget, startAz, POLAR_START);
  let endTarget;
  if (hasEntrance) {
    const allPoints = getAllModelPoints(MODEL);
    const ground = findStructureNearPoint(MODEL, allPoints, entXParam, entYParam, 8.0, 0.0);
    endTarget = ground ? ground.center : new THREE.Vector3(entXParam, entYParam, BOX.min.z);
  } else {
    endTarget = startTarget.clone();   // no entrance point: swing + push-in only
  }
  const endBox = new THREE.Box3(
    new THREE.Vector3(endTarget.x - END_RADIUS, endTarget.y - END_RADIUS, BOX.min.z),
    new THREE.Vector3(endTarget.x + END_RADIUS, endTarget.y + END_RADIUS, BOX.max.z));
  const endDist = exactFitDistance(endBox, endTarget, endAz, POLAR_END);
  let dAz = ((endAz - startAz + 540) % 360) - 180;   // shortest arc
  if (Math.abs(Math.abs(dAz) - 180) < 1e-6 && spin) dAz = 180 * Math.sign(spin);
  const total = Math.max(2, PATH_FRAMES);
  const hold  = Math.min(Math.max(0, PATH_HOLD), total - 2);
  window.__pathInfo = { endTarget: endTarget.toArray() };
  window.pathFrames = total;
  const tmp = new THREE.Vector3();
  window.setFrame = function(i) {
    const t = Math.min(Math.max((i - hold) / (total - hold - 1), 0), 1);
    const e = t * t * (3 - 2 * t);   // smoothstep
    tmp.lerpVectors(startTarget, endTarget, e);
    positionCameraCompass(camera, tmp, startAz + dAz * e,
                          POLAR_START + (POLAR_END - POLAR_START) * e,
                          startDist + (endDist - startDist) * e);
    camera.updateProjectionMatrix();
  };
}

// Fly the currently-built path from wall-clock time, then hand back to orbit.
function playPath(durationMs) {
  if (!window.setFrame || !window.pathFrames) return;
  const total = window.pathFrames;
  controls.enabled = false;
  playing = true;
  const t0 = performance.now();
  function step(now) {
    const t = Math.min((now - t0) / durationMs, 1);
    window.setFrame(Math.round(t * (total - 1)));
    if (t < 1) {
      requestAnimationFrame(step);
    } else {
      const end = window.__pathInfo.endTarget;
      controls.target.set(end[0], end[1], end[2]);
      controls.enabled = true;
      controls.update();
      playing = false;
    }
  }
  requestAnimationFrame(step);
}

// Nadir: instant top-down. Polar 89 (not 90) keeps camera.up = +Z valid, so
// OrbitControls' frame stays consistent with the obliques (a true straight-
// down view with up=Z is a gimbal singularity).
function snapNadir() {
  if (playing) return;
  const az = 0, el = 89;
  positionCameraCompass(camera, CENTER, az, el, exactFitDistance(BOX, CENTER, az, el));
  camera.updateProjectionMatrix();
  controls.target.copy(CENTER);
  controls.enabled = true;
  controls.update();
}

// Public: play a named view (called from the buttons).
window.playView = function(name) {
  if (!MODEL || playing) return;
  if (name === 'nadir') { snapNadir(); return; }
  if (!hasAlpha) { console.warn('[viewer] no alpha bearing in URL; approach views unavailable'); return; }
  const spin = (name === 'charlie') ? 1 : 0;
  buildApproachPath(VIEWS[name], VIEWS.alpha, spin);
  playPath(FLIGHT_MS);
};

// -- Load GLB -------------------------------------------------------------
const dracoLoader = new DRACOLoader();
dracoLoader.setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.5.6/');
const loader = new GLTFLoader();
loader.setDRACOLoader(dracoLoader);

loader.load(
  glbUrl,
  function(gltf) {
    const model = gltf.scene;
    scene.add(model);
    const box = new THREE.Box3().setFromObject(model);
    const center = box.getCenter(new THREE.Vector3());
    const size = box.getSize(new THREE.Vector3());
    MODEL = model; BOX = box; CENTER = center;
    VIEWS = hasAlpha ? viewAzimuths(alphaParam) : null;

    // Default resting view: pulled back and up at ~45 deg.
    const camDist = Math.max(size.x, size.y) * 1.4;
    camera.position.set(center.x, center.y - camDist * 0.8, center.z + camDist * 0.8);
    camera.up.set(0, 0, 1);
    camera.lookAt(center);
    camera.updateProjectionMatrix();
    controls.target.copy(center);
    controls.update();

    const initPos = camera.position.clone();
    const initTarget = controls.target.clone();
    window.resetView = function() {
      if (playing) return;
      camera.position.copy(initPos);
      camera.up.set(0, 0, 1);
      controls.target.copy(initTarget);
      controls.enabled = true;
      controls.update();
    };

    // Disable approach buttons if no entrance bearing was supplied.
    if (!hasAlpha) {
      document.querySelectorAll('.view-btn').forEach((b) => {
        if (b.textContent.trim() !== 'Nadir') b.disabled = true;
      });
    }

    document.getElementById('loading').classList.add('hidden');
    setTimeout(() => document.getElementById('hint').classList.add('hidden'), 4000);
    requestAnimationFrame(() => {
      requestAnimationFrame(() => { window.__viewerReady = true; });
    });
  },
  function(xhr) {
    if (xhr.total) {
      document.getElementById('progress').textContent =
        Math.round(xhr.loaded / xhr.total * 100) + '%';
    }
  },
  function(err) {
    showErr(err.message || String(err));
  }
);

// -- Render loop ----------------------------------------------------------
function animate() {
  requestAnimationFrame(animate);
  if (!playing) controls.update();
  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

function showErr(msg) {
  document.getElementById('loading').classList.add('hidden');
  document.getElementById('err-msg').textContent = msg;
  document.getElementById('err').classList.add('visible');
}
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Property 3D Viewer</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; background: #111318; overflow: hidden; font-family: monospace; }
  canvas { display: block; }
  #loading {
    position: fixed; inset: 0; background: #111318;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 16px; z-index: 100; transition: opacity 0.5s ease;
  }
  #loading.hidden { opacity: 0; pointer-events: none; }
  .spin {
    width: 36px; height: 36px;
    border: 2px solid rgba(168,85,247,0.2);
    border-top-color: #a855f7;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .load-text { font-size: 12px; color: #555f6e; }
  #progress { font-size: 11px; color: #3d4752; margin-top: 4px; }
  #err {
    display: none; position: fixed; inset: 0;
    align-items: center; justify-content: center; flex-direction: column;
    gap: 12px; background: #0a0c0f; color: #8a93a2;
    font-size: 13px; text-align: center; padding: 32px; z-index: 200;
  }
  #err.visible { display: flex; }
  #err strong { color: #ef4444; font-size: 15px; }
  #hint {
    position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
    background: rgba(0,0,0,0.5); color: #555f6e; font-size: 11px;
    padding: 6px 14px; border-radius: 20px; pointer-events: none;
    transition: opacity 1s ease; z-index: 50;
  }
  #hint.hidden { opacity: 0; }
  /* ── Responder Directions ─────────────────────────────────────────────── */
  /* ── Tab rail ───────────────────────────────────────────────────────
     Both panel toggles live in one vertical rail. When a panel opens the rail
     slides left by exactly the panel width, so the buttons end up sitting
     beside the open panel instead of floating on top of its header - which is
     what forced the header text to dodge them before. The transition matches
     the panel's 0.28s so they travel together. */
  :root { --panel-w: 340px; }
  #tab-rail {
    position: fixed; top: 16px; right: 16px; z-index: 60;
    display: flex; flex-direction: column; align-items: flex-end; gap: 8px;
    transition: transform 0.28s ease;
  }
  #tab-rail.shifted { transform: translateX(calc(-1 * var(--panel-w))); }
  #dir-toggle {
    display: none;
    background: rgba(0,0,0,0.6); color: #f59e0b; border: 1px solid #f59e0b;
    font-family: monospace; font-size: 11px; padding: 7px 13px;
    border-radius: 6px; cursor: pointer; transition: background 0.15s;
  }
  #dir-toggle:hover { background: rgba(245,158,11,0.16); }
  #dir-toggle.on { background: rgba(245,158,11,0.22); }
  #dir-panel {
    position: fixed; top: 0; right: 0; bottom: 0; width: var(--panel-w); z-index: 55;
    background: #12161b; border-left: 1px solid rgba(255,255,255,0.10);
    transform: translateX(100%); transition: transform 0.28s ease;
    display: flex; flex-direction: column; overflow: hidden;
    font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
  }
  #dir-panel.open { transform: translateX(0); }
  .dp-head {
    padding: 14px 16px; border-bottom: 1px solid rgba(255,255,255,0.08);
    flex-shrink: 0; display: flex; align-items: flex-start; gap: 8px;
  }
  .dp-title { font-size: 13px; font-weight: 600; color: #f0f2f5; }
  .dp-sub { font-size: 10.5px; color: #555f6e; font-family: monospace; margin-top: 3px; }
  .dp-close {
    margin-left: auto; background: none; border: none; color: #555f6e;
    font-size: 15px; cursor: pointer; line-height: 1; padding: 0 2px;
  }
  .dp-close:hover { color: #f0f2f5; }
  .dp-body { overflow-y: auto; flex: 1; scrollbar-width: thin; }
  .dp-note {
    margin: 12px 16px 0; font-size: 10.5px; color: #555f6e;
    font-family: monospace; line-height: 1.55;
  }
  .rd-card {
    margin: 12px 16px; border: 1px solid rgba(255,255,255,0.14);
    border-radius: 10px; background: #1a1f27; overflow: hidden;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  .rd-card.on { border-color: #f59e0b; box-shadow: 0 0 0 1px rgba(245,158,11,0.28); }
  .rd-head { padding: 12px 14px; display: flex; align-items: flex-start; gap: 10px; }
  .rd-num {
    width: 22px; height: 22px; border-radius: 50%; background: #f59e0b;
    color: #0b0e12; display: flex; align-items: center; justify-content: center;
    font-family: monospace; font-size: 10px; font-weight: 700;
    flex-shrink: 0; margin-top: 1px;
  }
  .rd-titles { flex: 1; min-width: 0; }
  .rd-name { font-size: 12.5px; font-weight: 600; color: #f0f2f5; line-height: 1.35; overflow-wrap: anywhere; }
  .rd-meta { font-size: 10.5px; color: #555f6e; font-family: monospace; margin-top: 4px; line-height: 1.55; overflow-wrap: anywhere; }
  .rd-body { padding: 0 14px 14px; }
  .rd-trigger { font-size: 11.5px; color: #8a93a2; line-height: 1.65; margin-bottom: 10px; }
  .rd-figure {
    position: relative; border-radius: 8px; overflow: hidden;
    border: 1px solid rgba(255,255,255,0.10); line-height: 0; background: #0b0e12;
  }
  .rd-figure img { width: 100%; display: block; }
  .rd-figure svg { position: absolute; left: 0; top: 0; width: 100%; height: 100%; pointer-events: none; }
  .rd-wp {
    position: absolute; transform: translate(-50%, -50%);
    width: 18px; height: 18px; border-radius: 50%; background: #f59e0b;
    color: #0b0e12; border: 2px solid #0b0e12; display: flex;
    align-items: center; justify-content: center;
    font-family: monospace; font-size: 9px; font-weight: 700; line-height: 1;
  }
  .rd-wp.start { background: #22c55e; }
  .rd-wp.end   { background: #ef4444; color: #fff; }
  .rd-wp.el { background: #22c55e; }
  .rd-wp.co { background: #ef4444; color: #fff; }
  .rd-btn {
    width: 100%; margin-top: 10px; padding: 8px 10px; border-radius: 7px;
    border: 1px solid rgba(255,255,255,0.14); background: #12161b;
    color: #f0f2f5; font-size: 11.5px; font-weight: 600; cursor: pointer;
    font-family: inherit; transition: all 0.15s;
  }
  .rd-btn:hover:not([disabled]) { background: #1a1f27; border-color: #f59e0b; }
  .rd-btn.on { background: rgba(245,158,11,0.14); border-color: #f59e0b; color: #f59e0b; }
  .rd-btn[disabled] { opacity: 0.4; cursor: not-allowed; }
  .rd-progress { font-size: 10.5px; color: #f59e0b; font-family: monospace; margin-top: 7px; }
  .rd-num.pin { background: #22c55e; }
  .rd-note { font-size: 10.5px; color: #555f6e; font-family: monospace; margin-top: 8px; line-height: 1.55; }
  .pin-group-label { font-size: 10px; font-weight: 600; color: #555f6e; letter-spacing: 0.08em; text-transform: uppercase; font-family: monospace; margin: 10px 0 6px; }
  .pin-row { display: flex; align-items: flex-start; gap: 9px; padding: 4px 0; }
  .pin-badge { width: 19px; height: 19px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 9px; font-weight: 700; color: #0b0e12; flex-shrink: 0; font-family: monospace; margin-top: 1px; }
  .pin-badge.green { background: #22c55e; }
  .pin-badge.red   { background: #ef4444; color: #fff; }
  .pin-name { font-size: 11.5px; color: #8a93a2; line-height: 1.5; overflow-wrap: anywhere; }
  .vw-section { margin-top: 12px; }
  .vw-head { display: flex; align-items: center; gap: 8px; margin-bottom: 7px; }
  .vw-badge { width: 20px; height: 20px; border-radius: 5px; background: #3b82f6; color: #fff; display: flex; align-items: center; justify-content: center; font-family: monospace; font-size: 9px; font-weight: 700; flex-shrink: 0; }
  .vw-badge.nadir { background: #8b5cf6; }
  .vw-label { font-size: 11.5px; font-weight: 600; color: #f0f2f5; }
  .vw-img { width: 100%; display: block; border-radius: 8px; border: 1px solid rgba(255,255,255,0.10); cursor: zoom-in; }
  .vw-bullets { margin: 7px 0 0 16px; padding: 0; }
  .vw-bullets li { font-size: 11px; color: #8a93a2; line-height: 1.6; margin-bottom: 3px; }
  /* Full-width panels on a phone would push the rail off-screen, so it is
     hidden while a panel is open - each panel has its own close button. */
  @media (max-width: 640px) {
    #dir-panel, #wx-panel { width: 100%; }
    #tab-rail.shifted { display: none; }
  }
  /* ── View preset bar (storyboard: alpha/ent params from the sheet) ────── */
  #preset-bar {
    display: none; position: fixed; bottom: 48px; left: 50%;
    transform: translateX(-50%); gap: 6px; z-index: 50;
  }
  .pv-btn {
    background: rgba(0,0,0,0.6); color: #8a93a2; border: 1px solid #2a3040;
    font-family: monospace; font-size: 11px; padding: 6px 12px;
    border-radius: 6px; cursor: pointer; transition: color 0.2s, border-color 0.2s;
  }
  .pv-btn:hover:not([disabled]) { color: #fff; }
  .pv-btn.active { color: #f59e0b; border-color: #f59e0b; }
  .pv-btn[disabled] { opacity: 0.35; cursor: not-allowed; }
  /* ── Pin click label ───────────────────────────────────────────────────── */
  #pin-label {
    display: none; position: fixed; z-index: 70; pointer-events: none;
    background: rgba(10,12,15,0.95); color: #f0f2f5;
    border: 1px solid #f59e0b; border-radius: 6px; padding: 5px 10px;
    font-family: monospace; font-size: 11px; white-space: nowrap;
    transform: translate(-50%, -100%); box-shadow: 0 3px 14px rgba(0,0,0,0.5);
  }
  /* ── Security cameras ──────────────────────────────────────────────────── */
  .rd-num.cam { background: #38bdf8; }
  .rd-wp.cam  { background: #38bdf8; color: #0b0e12; }
  .cam-grid {
    display: grid; grid-template-columns: repeat(3, 1fr);
    gap: 6px; margin-top: 10px;
  }
  .cam-thumb {
    position: relative; border-radius: 6px; overflow: hidden; cursor: pointer;
    border: 1px solid rgba(255,255,255,0.12); background: #0b0e12;
    aspect-ratio: 3 / 4; line-height: 0;
  }
  .cam-thumb:hover { border-color: #38bdf8; }
  .cam-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .cam-thumb-n {
    position: absolute; left: 4px; top: 4px; min-width: 15px; height: 15px;
    padding: 0 3px; border-radius: 4px; background: #38bdf8; color: #0b0e12;
    font-family: monospace; font-size: 9px; font-weight: 700;
    display: flex; align-items: center; justify-content: center; line-height: 1;
  }
  #cam-lightbox {
    display: none; position: fixed; inset: 0; z-index: 90;
    background: rgba(6,8,11,0.92); padding: 24px;
    align-items: center; justify-content: center; flex-direction: column; gap: 12px;
  }
  #cam-lightbox.open { display: flex; }
  #cam-lb-img {
    max-width: min(92vw, 900px); max-height: 74vh; border-radius: 10px;
    border: 1px solid rgba(255,255,255,0.14); display: block;
  }
  #cam-lb-title {
    font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
    font-size: 14px; font-weight: 600; color: #f0f2f5; text-align: center;
  }
  #cam-lb-meta { font-family: monospace; font-size: 11px; color: #8a93a2; }
  #cam-lb-actions { display: flex; gap: 8px; }
  .cam-lb-btn {
    background: #12161b; color: #f0f2f5; border: 1px solid rgba(255,255,255,0.16);
    font-family: monospace; font-size: 11px; padding: 7px 14px;
    border-radius: 6px; cursor: pointer;
  }
  .cam-lb-btn:hover { border-color: #38bdf8; color: #38bdf8; }
  /* ── Camera popup (small, anchored, non-blocking) ───────────────────────
     Deliberately NOT built like #pin-label. That label is screen-static and
     has to be dismissed on the first interaction, because a fixed position
     would drift away from its pin the moment the view moved. This card is
     re-projected from its marker's world position every frame instead, so it
     tracks the marker and can stay open while the user keeps orbiting. */
  #cam-popup {
    display: none; position: fixed; z-index: 71;
    transform: translate(-50%, -100%);
    width: 210px; background: rgba(10,12,15,0.96);
    border: 1px solid #38bdf8; border-radius: 8px; overflow: hidden;
    box-shadow: 0 4px 18px rgba(0,0,0,0.6);
  }
  #cam-pop-img {
    width: 100%; height: 150px; object-fit: cover; display: block;
    cursor: zoom-in; border-bottom: 1px solid rgba(255,255,255,0.10);
  }
  #cam-pop-body { padding: 6px 8px 7px; }
  #cam-pop-name {
    font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
    font-size: 11.5px; font-weight: 600; color: #f0f2f5; line-height: 1.35;
  }
  #cam-pop-meta {
    font-family: monospace; font-size: 9.5px; color: #8a93a2; margin-top: 3px;
  }
  #cam-pop-hint {
    font-family: monospace; font-size: 9px; color: #555f6e; margin-top: 4px;
  }
  #cam-pop-close {
    position: absolute; right: 4px; top: 4px; width: 18px; height: 18px;
    border: none; border-radius: 4px; background: rgba(10,12,15,0.75);
    color: #8a93a2; font-size: 12px; line-height: 1; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  #cam-pop-close:hover { color: #f0f2f5; }
  /* ── Weather panel ─────────────────────────────────────────────────────
     Its own slide-out rather than another card in the property panel: active
     alerts and wind are operational information a responder wants in one
     click, not scrolled past pins, cameras, obliques and routes. */
  #wx-toggle {
    display: none;
    background: rgba(0,0,0,0.6); color: #38bdf8; border: 1px solid #38bdf8;
    font-family: monospace; font-size: 11px; padding: 7px 13px;
    border-radius: 6px; cursor: pointer; transition: background 0.15s;
  }
  #wx-toggle:hover { background: rgba(56,189,248,0.16); }
  #wx-toggle.on { background: rgba(56,189,248,0.22); }
  #wx-panel {
    position: fixed; top: 0; right: 0; bottom: 0; width: var(--panel-w); z-index: 56;
    background: #12161b; border-left: 1px solid rgba(255,255,255,0.10);
    transform: translateX(100%); transition: transform 0.28s ease;
    display: flex; flex-direction: column; overflow: hidden;
    font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
  }
  #wx-panel.open { transform: translateX(0); }

  #wx-body { overflow-y: auto; flex: 1; scrollbar-width: thin; padding-bottom: 16px; }
  .wx-note {
    margin: 14px 16px; font-size: 11px; color: #8a93a2;
    font-family: monospace; line-height: 1.6;
  }
  .wx-note a { color: #38bdf8; }
  .wx-alert {
    margin: 12px 16px; border: 1px solid #ef4444; border-radius: 9px;
    background: rgba(239,68,68,0.10); padding: 11px 13px;
  }
  .wx-alert.moderate { border-color: #f59e0b; background: rgba(245,158,11,0.10); }
  .wx-alert-ev {
    font-size: 12.5px; font-weight: 700; color: #fca5a5; line-height: 1.35;
  }
  .wx-alert.moderate .wx-alert-ev { color: #fcd34d; }
  .wx-alert-hd { font-size: 11px; color: #d5dae2; line-height: 1.55; margin-top: 5px; }
  .wx-alert-tm { font-size: 10px; color: #8a93a2; font-family: monospace; margin-top: 5px; }
  .wx-alert-row { display: flex; align-items: flex-start; gap: 8px; }
  .wx-alert-row.can-open { cursor: pointer; }
  .wx-alert-caret {
    margin-left: auto; flex-shrink: 0; color: #8a93a2; font-size: 10px;
    font-family: monospace; transition: transform 0.15s; line-height: 1.6;
  }
  .wx-alert-caret.open { transform: rotate(180deg); }
  .wx-alert-more { font-size: 9.5px; color: #8a93a2; font-family: monospace; margin-top: 6px; }
  .wx-alert-detail {
    display: none; margin-top: 9px; padding-top: 9px;
    border-top: 1px solid rgba(255,255,255,0.14);
    font-family: monospace; font-size: 10.5px; color: #d5dae2; line-height: 1.62;
    /* NWS ships these as hard-wrapped plain text; pre-wrap keeps the agency's
       own paragraphing instead of collapsing it into a wall. */
    white-space: pre-wrap; overflow-wrap: anywhere;
    max-height: 300px; overflow-y: auto; scrollbar-width: thin;
  }
  .wx-alert-detail.open { display: block; }
  .wx-alert-lbl {
    display: block; font-size: 9.5px; letter-spacing: 0.07em; text-transform: uppercase;
    color: #8a93a2; margin: 11px 0 3px; font-family: monospace;
  }
  .wx-alert-lbl:first-child { margin-top: 0; }
  .wx-now {
    margin: 12px 16px; border: 1px solid rgba(255,255,255,0.14);
    border-radius: 10px; background: #1a1f27; padding: 13px 14px;
  }
  .wx-now-top { display: flex; align-items: baseline; gap: 10px; }
  .wx-temp { font-size: 30px; font-weight: 700; color: #f0f2f5; line-height: 1; }
  .wx-cond { font-size: 12px; color: #d5dae2; line-height: 1.4; }
  .wx-rows { margin-top: 11px; display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; }
  .wx-k { font-family: monospace; font-size: 10px; color: #555f6e; text-transform: uppercase; letter-spacing: 0.06em; }
  .wx-v { font-family: monospace; font-size: 11px; color: #d5dae2; }
  .wx-v.wind { color: #38bdf8; font-weight: 700; }
  .wx-obs-src { font-family: monospace; font-size: 9.5px; color: #555f6e; margin-top: 9px; }
  .wx-period {
    margin: 0 16px; padding: 11px 0;
    border-bottom: 1px solid rgba(255,255,255,0.06);
    display: flex; gap: 11px; align-items: flex-start;
  }
  .wx-period:last-child { border-bottom: none; }
  .wx-ico {
    width: 42px; height: 42px; border-radius: 7px; flex-shrink: 0;
    background: #0b0e12; border: 1px solid rgba(255,255,255,0.10);
  }
  .wx-pd { flex: 1; min-width: 0; }
  .wx-pd-name { font-size: 11.5px; font-weight: 600; color: #f0f2f5; }
  .wx-pd-name.night { color: #8a93a2; }
  .wx-pd-short { font-size: 11px; color: #d5dae2; margin-top: 3px; line-height: 1.45; }
  .wx-pd-meta { font-family: monospace; font-size: 10px; color: #8a93a2; margin-top: 4px; }
  .wx-pd-t { font-family: monospace; font-size: 15px; font-weight: 700; color: #f0f2f5; flex-shrink: 0; }
  .wx-sec {
    font-size: 10px; font-weight: 600; color: #555f6e; letter-spacing: 0.08em;
    text-transform: uppercase; font-family: monospace; margin: 16px 16px 2px;
  }
  /* ── Regional hazard panels ────────────────────────────────────────── */
  .hz-toggle {
    display: none; background: rgba(0,0,0,0.6); border: 1px solid;
    font-family: monospace; font-size: 11px; padding: 7px 13px;
    border-radius: 6px; cursor: pointer; transition: background 0.15s;
  }
  .hz-toggle:hover { background: rgba(255,255,255,0.08); }
  .hz-toggle.on    { background: rgba(255,255,255,0.14); }
  .hz-panel {
    position: fixed; top: 0; right: 0; bottom: 0; width: var(--panel-w); z-index: 56;
    background: #12161b; border-left: 1px solid rgba(255,255,255,0.10);
    transform: translateX(100%); transition: transform 0.28s ease;
    display: flex; flex-direction: column; overflow: hidden;
    font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
  }
  .hz-panel.open { transform: translateX(0); }
  .hz-body { overflow-y: auto; flex: 1; padding-bottom: 16px; scrollbar-width: thin; }
  .hz-row {
    display: flex; gap: 11px; align-items: flex-start; margin: 0 16px; padding: 10px 0;
    border-bottom: 1px solid rgba(255,255,255,0.06);
  }
  .hz-row:last-child { border-bottom: none; }
  .hz-badge {
    min-width: 38px; height: 26px; padding: 0 6px; border-radius: 6px;
    background: #1a1f27; border: 1px solid rgba(255,255,255,0.14); color: #d5dae2;
    font-family: monospace; font-size: 12px; font-weight: 700;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .hz-badge.mid  { border-color: #f59e0b; color: #f59e0b; }
  .hz-badge.big  { border-color: #ef4444; color: #ef4444; background: rgba(239,68,68,0.14); }
  .hz-badge.fire { border-color: #ef4444; }
  .hz-badge.yr   { font-size: 11px; }
  .hz-main { flex: 1; min-width: 0; }
  .hz-t { font-size: 11.5px; color: #f0f2f5; line-height: 1.4; overflow-wrap: anywhere; }
  .hz-m { font-family: monospace; font-size: 10px; color: #8a93a2; margin-top: 3px; }
  .hz-dim { color: #555f6e; }
  @media (max-width: 640px) { .hz-panel { width: 100%; } }
  /* ── Debug console — same shape as viewer.html's ──────────────────────── */
  /* Hidden by default — append &debug=1 to the URL to show it. */
  #debug-panel { position: fixed; bottom: 70px; left: 12px; width: 340px; max-height: 220px; background: rgba(10,12,15,0.97); border: 1px solid rgba(59,130,246,0.4); border-radius: 8px; z-index: 999; font-family: monospace; font-size: 11px; overflow: hidden; display: none; flex-direction: column; box-shadow: 0 4px 20px rgba(0,0,0,0.6); }
  #debug-panel.collapsed #debug-log, #debug-panel.collapsed #debug-clear { display: none; }

<script type="module">

      const cls = (sev === 'extreme' || sev === 'severe') ? '' : ' moderate';
      // The full text is the useful part of an air-quality or red-flag alert -
      // who it affects, what to do - but it runs to several hundred words, so
      // it is collapsed behind the headline and opens on click.
      let detail = '';
      if (a.areaDesc) {
        detail += '<span class="wx-alert-lbl">Area</span>' + escHtml(a.areaDesc);
      }
      if (a.description) {
        detail += '<span class="wx-alert-lbl">Details</span>' + escHtml(a.description.trim());
      }
      if (a.instruction) {
        detail += '<span class="wx-alert-lbl">What to do</span>' + escHtml(a.instruction.trim());
      }
      const meta = [];
      if (a.effective) meta.push('from ' + wxTime(a.effective));
      if (a.senderName) meta.push(a.senderName);
      if (meta.length) {
        detail += '<span class="wx-alert-lbl">Issued</span>' + escHtml(meta.join('  ·  '));
      }
      const canOpen = !!detail;
      h += '<div class="wx-alert' + cls + '">' +
             '<div class="wx-alert-row' + (canOpen ? ' can-open" onclick="toggleAlert(' + i + ')' : '') + '">' +
               '<div class="wx-alert-ev">' + escHtml(a.event || 'Alert') + '</div>' +
               (canOpen ? '<span class="wx-alert-caret" id="wx-al-c-' + i + '">&#9660;</span>' : '') +
             '</div>' +
             (a.headline ? '<div class="wx-alert-hd">' + escHtml(a.headline) + '</div>' : '') +
             '<div class="wx-alert-tm">' +
               (a.severity ? escHtml(a.severity) + ' &middot; ' : '') +
               (a.ends || a.expires ? 'until ' + escHtml(wxTime(a.ends || a.expires)) : '') +
             '</div>' +
             (canOpen ? '<div class="wx-alert-more" id="wx-al-m-' + i + '">click for full text</div>' +
                        '<div class="wx-alert-detail" id="wx-al-d-' + i + '">' + detail + '</div>'
                      : '') +
           '</div>';
    });
  }
  // ── Current conditions
  const o = (obs && obs.properties) || null;
  if (o) {
    const tF  = cToF(o.temperature && o.temperature.value);
    const wF  = cToF(o.windChill && o.windChill.value);
    const hI  = cToF(o.heatIndex && o.heatIndex.value);
    const spd = kmhToMph(o.windSpeed && o.windSpeed.value);
    const gst = kmhToMph(o.windGust && o.windGust.value);
    const dir = o.windDirection && o.windDirection.value;
    const rh  = o.relativeHumidity && o.relativeHumidity.value;
    h += '<div class="wx-sec">Now</div><div class="wx-now"><div class="wx-now-top">' +
         '<div class="wx-temp">' + (tF === null ? '--' : Math.round(tF) + '&deg;') + '</div>' +
         '<div class="wx-cond">' + escHtml(o.textDescription || '') + '</div></div>' +
         '<div class="wx-rows">';
    // Wind is called out because it drives fire behaviour and drone launch
    // decisions - the two operational questions this layer exists to answer.
    h += '<div class="wx-k">Wind</div><div class="wx-v wind">' +
         (spd === null ? 'unknown'
            : (Math.round(spd) === 0 ? 'calm'
               : degToCompass(dir) + ' ' + Math.round(spd) + ' mph')) +
         (gst !== null && gst > 0 ? ' (gusting ' + Math.round(gst) + ')' : '') +
         '</div>';
    if (rh !== null && rh !== undefined) {
      h += '<div class="wx-k">Humidity</div><div class="wx-v">' + Math.round(rh) + '%</div>';
    }
    if (wF !== null) h += '<div class="wx-k">Wind chill</div><div class="wx-v">' + Math.round(wF) + '&deg;</div>';
    if (hI !== null) h += '<div class="wx-k">Heat index</div><div class="wx-v">' + Math.round(hI) + '&deg;</div>';
    h += '</div><div class="wx-obs-src">' +
         escHtml(stationName || 'station') +
         (o.timestamp ? ' &middot; ' + escHtml(wxTime(o.timestamp)) : '') +
         '</div></div>';
  }
  // ── Forecast periods
  const periods = (fc && fc.properties && fc.properties.periods) || [];
  if (periods.length) {
    h += '<div class="wx-sec">Forecast</div>';
    periods.slice(0, 8).forEach(function (p) {
      const pop = p.probabilityOfPrecipitation && p.probabilityOfPrecipitation.value;
      const meta = [];
      if (p.windSpeed) meta.push((p.windDirection || '') + ' ' + p.windSpeed);
      if (pop) meta.push(pop + '% precip');
      h += '<div class="wx-period">' +
             (p.icon ? '<img class="wx-ico" src="' + escHtml(p.icon) +
                       '" alt="" loading="lazy" onerror="this.style.visibility=\'hidden\'">'
                     : '<div class="wx-ico"></div>') +
             '<div class="wx-pd">' +
               '<div class="wx-pd-name' + (p.isDaytime ? '' : ' night') + '">' +
                 escHtml(p.name || '') + '</div>' +
               '<div class="wx-pd-short">' + escHtml(p.shortForecast || '') + '</div>' +
               (meta.length ? '<div class="wx-pd-meta">' + escHtml(meta.join('  ·  ')) + '</div>' : '') +
             '</div>' +
             '<div class="wx-pd-t">' + (p.temperature !== undefined && p.temperature !== null
                ? p.temperature + '&deg;' + (p.temperatureUnit || '') : '') + '</div>' +
           '</div>';
    });
  }
  if (!h) {
    h = '<div class="wx-note">The National Weather Service returned no data for ' +
        'this location.</div>';
  }
  h += '<div class="wx-note">' +
       (pp.relativeLocation && pp.relativeLocation.properties
          ? escHtml(pp.relativeLocation.properties.city || '') +
            (pp.relativeLocation.properties.state ? ', ' + escHtml(pp.relativeLocation.properties.state) : '') + ' &middot; '
          : '') +
       (pp.gridId ? escHtml(pp.gridId + ' ' + pp.gridX + ',' + pp.gridY) + '<br>' : '') +
       escHtml(wxLat.toFixed(4) + ', ' + wxLng.toFixed(4)) +
       '<br><a href="https://forecast.weather.gov/MapClick.php?lat=' + wxLat.toFixed(4) +
       '&amp;lon=' + wxLng.toFixed(4) + '" target="_blank" rel="noopener">Full NWS forecast page</a>' +
       ' &middot; <a href="#" onclick="refreshWeather();return false;">Refresh</a>' +
       '</div>';
  return h;
}
// ── Regional hazard panels ────────────────────────────────────────────
// Five public, key-free sources, each in its own panel. They are declared as a
// registry rather than hand-built one by one: the rail buttons, the panel
// divs and the lazy-load bookkeeping are all generated from this list, so a
// sixth source is one entry plus a loader, not five edits in five places.
//
// Every loader returns an HTML string or throws. Throwing is fine and expected
// - openHazard catches it and renders the source's own link plus a retry, so a
// CORS refusal or an outage degrades to "here is where to look" instead of a
// blank panel. That matters because CORS could NOT be tested before shipping:
// the build sandbox has no outbound internet, so the first real load is the
// first proof that a browser is allowed to read each of these cross-origin.
const HAZARDS = [
  { id: 'quake',   label: 'Earthquakes', accent: '#f97316',
    site: 'https://earthquake.usgs.gov/earthquakes/map/', siteName: 'USGS earthquake map' },
  { id: 'fire',    label: 'Wildfire',    accent: '#ef4444',
    site: 'https://www.nifc.gov/fire-information/nfn', siteName: 'NIFC fire information' },
  { id: 'drought', label: 'Drought',     accent: '#eab308',
    site: 'https://droughtmonitor.unl.edu/', siteName: 'US Drought Monitor' },
  { id: 'fema',    label: 'FEMA',        accent: '#a78bfa',
    site: 'https://www.fema.gov/disaster/declarations', siteName: 'FEMA declarations' },
  { id: 'space',   label: 'Space Wx',    accent: '#2dd4bf',
    site: 'https://www.spaceweather.gov/', siteName: 'NOAA Space Weather' }
];
const hzState = {};   // id -> {loaded, loading}

// ── shared bits ───────────────────────────────────────────────────────
function hzSec(t)   { return '<div class="wx-sec">' + escHtml(t) + '</div>'; }
function hzNote(t)  { return '<div class="wx-note">' + t + '</div>'; }
function hzEmpty(t) { return hzNote(escHtml(t)); }
function hzLink(url, label) {
  return hzNote('<a href="' + escHtml(url) + '" target="_blank" rel="noopener">' +
                escHtml(label) + '</a>');
}
function kmBetween(la1, lo1, la2, lo2) {
  if (![la1, lo1, la2, lo2].every(function (v) { return isFinite(Number(v)); })) return NaN;
  const R = 6371.0088, r = Math.PI / 180;
  const p1 = la1 * r, p2 = la2 * r;
  const dp = (la2 - la1) * r, dl = (lo2 - lo1) * r;
  const a = Math.sin(dp / 2) * Math.sin(dp / 2) +
            Math.cos(p1) * Math.cos(p2) * Math.sin(dl / 2) * Math.sin(dl / 2);
  return 2 * R * Math.asin(Math.min(1, Math.sqrt(a)));
}
function hzAgo(ms) {
  const s = (Date.now() - ms) / 1000;
  if (!isFinite(s)) return '';
  if (s < 3600)  return Math.max(1, Math.round(s / 60)) + ' min ago';
  if (s < 86400) return Math.round(s / 3600) + ' hr ago';
  return Math.round(s / 86400) + ' days ago';
}
function hzRow(badge, badgeCls, title, meta) {
  return '<div class="hz-row">' +
           '<div class="hz-badge ' + badgeCls + '">' + badge + '</div>' +
           '<div class="hz-main"><div class="hz-t">' + title + '</div>' +
             (meta ? '<div class="hz-m">' + meta + '</div>' : '') +
           '</div></div>';
}

// County identity, needed by both FEMA and Drought (each is keyed on county,
// not on a coordinate). Derived from the NWS points response we already rely
// on: its `county` property is a zone URL ending in e.g. ORC017 - state OR,
// county 017 - which combined with the state FIPS gives 41017. Resolved once
// and cached, so opening both panels costs one lookup.
const STATE_FIPS = {AL:'01',AK:'02',AZ:'04',AR:'05',CA:'06',CO:'08',CT:'09',DE:'10',
 DC:'11',FL:'12',GA:'13',HI:'15',ID:'16',IL:'17',IN:'18',IA:'19',KS:'20',KY:'21',
 LA:'22',ME:'23',MD:'24',MA:'25',MI:'26',MN:'27',MS:'28',MO:'29',MT:'30',NE:'31',
 NV:'32',NH:'33',NJ:'34',NM:'35',NY:'36',NC:'37',ND:'38',OH:'39',OK:'40',OR:'41',
 PA:'42',RI:'44',SC:'45',SD:'46',TN:'47',TX:'48',UT:'49',VT:'50',VA:'51',WA:'53',
 WV:'54',WI:'55',WY:'56',PR:'72'};
let hzCounty = null;
async function resolveCounty(lat, lng) {
  if (hzCounty) return hzCounty;
  const pt = await wxJson(WX_API + '/points/' + lat.toFixed(4) + ',' + lng.toFixed(4));
  const pp = (pt && pt.properties) || {};
  const zone = String(pp.county || '').split('/').pop();      // e.g. ORC017
  const m = /^([A-Z]{2})C(\d{3})$/.exec(zone);
  const rl = (pp.relativeLocation && pp.relativeLocation.properties) || {};
  hzCounty = {
    state: m ? m[1] : (rl.state || ''),
    countyFips: m ? m[2] : '',
    stateFips: m ? (STATE_FIPS[m[1]] || '') : '',
    city: rl.city || ''
  };
  hzCounty.fips = hzCounty.stateFips + hzCounty.countyFips;
  return hzCounty;
}

// ── 1. USGS earthquakes ───────────────────────────────────────────────
async function loadQuakes(lat, lng) {
  const url = 'https://earthquake.usgs.gov/fdsnws/event/1/query?format=geojson' +
    '&latitude=' + lat.toFixed(4) + '&longitude=' + lng.toFixed(4) +
    '&maxradiuskm=300&minmagnitude=2.5&orderby=time&limit=20';
  const j = await wxJson(url);
  const f = (j && j.features) || [];
  if (!f.length) {
    return hzEmpty('No magnitude 2.5+ earthquakes within 300 km in the USGS catalogue.');
  }
  let h = hzSec('M2.5+ within 300 km');
  f.forEach(function (q) {
    const p = q.properties || {}, c = (q.geometry && q.geometry.coordinates) || [];
    const d = kmBetween(lat, lng, c[1], c[0]);
    const mag = (p.mag === null || p.mag === undefined) ? '?' : Number(p.mag).toFixed(1);
    const cls = Number(p.mag) >= 5 ? 'big' : (Number(p.mag) >= 4 ? 'mid' : '');
    const meta = [];
    if (isFinite(d)) meta.push(Math.round(d) + ' km away');
    if (c[2] !== undefined && c[2] !== null) meta.push(Math.round(c[2]) + ' km deep');
    if (p.time) meta.push(hzAgo(Number(p.time)));
    h += hzRow(mag, cls, escHtml(p.place || 'Unknown location'), escHtml(meta.join('  ·  ')));
  });
  return h;
}

// ── 2. NIFC wildfire perimeters ───────────────────────────────────────
// ⚠️ This is the one endpoint I could not verify before shipping - the build
// sandbox's fetch proxy returned 403 before reaching ArcGIS. The shape below
// follows the WFIGS service definition; if the field names are wrong the panel
// will say so rather than silently showing nothing.
async function loadFires(lat, lng) {
  const env = { xmin: lng - 2, ymin: lat - 2, xmax: lng + 2, ymax: lat + 2,
                spatialReference: { wkid: 4326 } };
  const url = 'https://services3.arcgis.com/T4QMspbfLg3qTGWY/arcgis/rest/services/' +
    'WFIGS_Interagency_Perimeters_Current/FeatureServer/0/query?f=json&returnGeometry=false' +
    '&outFields=poly_IncidentName,poly_GISAcres,attr_FireDiscoveryDateTime,attr_POOState' +
    '&where=1%3D1&geometryType=esriGeometryEnvelope&inSR=4326' +
    '&spatialRel=esriSpatialRelIntersects&resultRecordCount=25' +
    '&geometry=' + encodeURIComponent(JSON.stringify(env));
  const j = await wxJson(url);
  if (j && j.error) {
    throw new Error('ArcGIS: ' + ((j.error && j.error.message) || 'query rejected'));
  }
  const f = (j && j.features) || [];
  if (!f.length) {
    return hzEmpty('No current NIFC fire perimeters within about 200 km.') +
           hzNote('This layer holds mapped perimeters only. A new fire can be burning ' +
                  'before a perimeter is published - NASA FIRMS satellite detections ' +
                  'are the faster signal, and they need an API key.');
  }
  let h = hzSec('Current perimeters nearby');
  f.forEach(function (x) {
    const a = x.attributes || {};
    const acres = Number(a.poly_GISAcres);
    const meta = [];
    if (isFinite(acres)) meta.push(Math.round(acres).toLocaleString() + ' acres');
    if (a.attr_FireDiscoveryDateTime) meta.push('discovered ' + hzAgo(Number(a.attr_FireDiscoveryDateTime)));
    if (a.attr_POOState) meta.push(String(a.attr_POOState).replace('US-', ''));
    h += hzRow('&#128293;', 'fire',
               escHtml(a.poly_IncidentName || 'Unnamed incident'),
               escHtml(meta.join('  ·  ')));
  });
  return h;
}

// ── 3. US Drought Monitor ─────────────────────────────────────────────
// Returns CSV, not JSON - verified. Columns:
// MapDate, FIPS, County, State, None, D0, D1, D2, D3, D4, ValidStart, ValidEnd, ...
// D0 abnormally dry .. D4 exceptional drought, each a PERCENT OF COUNTY AREA and
// cumulative (D1 is included inside D0), so the headline figure is the most
// severe class with a non-zero share.
const DROUGHT_LABEL = { D0: 'Abnormally dry', D1: 'Moderate drought',
                        D2: 'Severe drought', D3: 'Extreme drought',
                        D4: 'Exceptional drought' };
function parseCsv(text) {
  const lines = String(text || '').trim().split(/\r?\n/).filter(function (l) { return l.trim(); });
  if (lines.length < 2) return [];
  const head = lines[0].split(',').map(function (h) { return h.trim().replace(/^"|"$/g, ''); });
  return lines.slice(1).map(function (l) {
    const cells = l.split(',');
    const o = {};
    head.forEach(function (k, i) { o[k] = String(cells[i] == null ? '' : cells[i]).trim().replace(/^"|"$/g, ''); });
    return o;
  });
}
function usdmDate(d) { return (d.getMonth() + 1) + '/' + d.getDate() + '/' + d.getFullYear(); }
async function loadDrought(lat, lng) {
  const c = await resolveCounty(lat, lng);
  if (!c.fips || c.fips.length !== 5) {
    throw new Error('Could not determine the county FIPS code for this location');
  }
  const end = new Date(), start = new Date(Date.now() - 1000 * 60 * 60 * 24 * 70);
  const url = 'https://usdmdataservices.unl.edu/api/CountyStatistics/' +
    'GetDroughtSeverityStatisticsByAreaPercent?aoi=' + c.fips +
    '&startdate=' + encodeURIComponent(usdmDate(start)) +
    '&enddate=' + encodeURIComponent(usdmDate(end)) + '&statisticsType=1';
  const r = await fetch(url);
  if (!r.ok) throw new Error('HTTP ' + r.status + ' from the US Drought Monitor');
  const rows = parseCsv(await r.text());
  if (!rows.length) return hzEmpty('No Drought Monitor data returned for this county.');
  rows.sort(function (a, b) { return (Date.parse(b.MapDate) || 0) - (Date.parse(a.MapDate) || 0); });
  const now = rows[0];
  let worst = null;
  ['D4', 'D3', 'D2', 'D1', 'D0'].forEach(function (k) {
    if (!worst && Number(now[k]) > 0) worst = k;
  });
  let h = hzSec((now.County || 'County') + (now.State ? ', ' + now.State : ''));
  h += '<div class="wx-now"><div class="wx-now-top">' +
         '<div class="wx-temp" style="font-size:20px">' +
           (worst ? worst : 'None') + '</div>' +
         '<div class="wx-cond">' + (worst ? escHtml(DROUGHT_LABEL[worst]) : 'No drought conditions') +
         '</div></div><div class="wx-rows">';
  ['D0', 'D1', 'D2', 'D3', 'D4'].forEach(function (k) {
    const v = Number(now[k]);
    if (!isFinite(v) || v <= 0) return;
    h += '<div class="wx-k">' + k + '</div><div class="wx-v">' + v.toFixed(1) +
         '% of county <span class="hz-dim">' + escHtml(DROUGHT_LABEL[k]) + '</span></div>';
  });
  h += '</div><div class="wx-obs-src">week of ' + escHtml(now.MapDate || '') + '</div></div>';
  h += hzNote('Percentages are cumulative - the area in D1 is also counted in D0.');
  return h;
}

// ── 4. FEMA disaster declarations ─────────────────────────────────────
async function loadFema(lat, lng) {
  const c = await resolveCounty(lat, lng);
  if (!c.stateFips || !c.countyFips) {
    throw new Error('Could not determine the county for this location');
  }
  const filt = "fipsStateCode eq '" + c.stateFips + "' and fipsCountyCode eq '" + c.countyFips + "'";
  const url = 'https://www.fema.gov/api/open/v2/DisasterDeclarationsSummaries?$filter=' +
    encodeURIComponent(filt) + '&$orderby=declarationDate desc&$top=12';
  const j = await wxJson(url);
  const rows = (j && j.DisasterDeclarationsSummaries) || [];
  if (!rows.length) {
    return hzEmpty('No federal disaster declarations on record for this county.');
  }
  let h = hzSec('Declarations for ' + (rows[0].designatedArea || 'this county'));
  rows.forEach(function (d) {
    const yr = String(d.declarationDate || '').slice(0, 4);
    const meta = [];
    if (d.femaDeclarationString) meta.push(d.femaDeclarationString);
    if (d.declarationType) meta.push(d.declarationType === 'DR' ? 'Major disaster'
                                    : d.declarationType === 'EM' ? 'Emergency'
                                    : d.declarationType === 'FM' ? 'Fire management' : d.declarationType);
    h += hzRow(escHtml(yr), 'yr',
               escHtml(d.declarationTitle || d.incidentType || 'Declaration'),
               escHtml(meta.join('  ·  ')));
  });
  return h;
}

// ── 5. NOAA Space Weather ─────────────────────────────────────────────
// Verified: a flat array of {product_id, issue_datetime, message}. The message
// is a multi-line operator bulletin, so it is collapsed to its first line and
// expands on click - the same treatment the NWS alerts get.
async function loadSpace() {
  const j = await wxJson('https://services.swpc.noaa.gov/products/alerts.json');
  const rows = Array.isArray(j) ? j.slice(0, 12) : [];
  if (!rows.length) return hzEmpty('No active NOAA space weather bulletins.');
  let h = hzSec('Latest bulletins');
  rows.forEach(function (a, i) {
    const msg = String(a.message || '').trim();
    const first = (msg.split('\n').find(function (l) { return l.trim(); }) || '').trim();
    h += '<div class="wx-alert moderate">' +
           '<div class="wx-alert-row can-open" onclick="toggleSpace(' + i + ')">' +
             '<div class="wx-alert-ev" style="font-size:11.5px">' +
               escHtml(a.product_id || 'Bulletin') + '</div>' +
             '<span class="wx-alert-caret" id="hz-sp-c-' + i + '">&#9660;</span>' +
           '</div>' +
           '<div class="wx-alert-hd">' + escHtml(first) + '</div>' +
           '<div class="wx-alert-tm">' + escHtml(String(a.issue_datetime || '')) + ' UTC</div>' +
           '<div class="wx-alert-detail" id="hz-sp-d-' + i + '">' + escHtml(msg) + '</div>' +
         '</div>';
  });
  return h;
}
window.toggleSpace = function (i) {
  const d = document.getElementById('hz-sp-d-' + i);
  const c = document.getElementById('hz-sp-c-' + i);
  if (!d) return;
  const open = d.classList.toggle('open');
  if (c) c.classList.toggle('open', open);
};

const HZ_LOADERS = { quake: loadQuakes, fire: loadFires, drought: loadDrought,
                     fema: loadFema, space: loadSpace };

// ── panel plumbing ────────────────────────────────────────────────────
function buildHazardUi() {
  const rail = document.getElementById('tab-rail');
  HAZARDS.forEach(function (hz) {
    hzState[hz.id] = { loaded: false, loading: false };
    const b = document.createElement('button');
    b.id = 'hz-btn-' + hz.id;
    b.className = 'hz-toggle';
    b.textContent = hz.label;
    b.style.color = hz.accent;
    b.style.borderColor = hz.accent;
    b.onclick = function () { toggleHazard(hz.id); };
    rail.appendChild(b);

    const p = document.createElement('div');
    p.id = 'hz-panel-' + hz.id;
    p.className = 'hz-panel';
    p.innerHTML =
      '<div class="dp-head"><div><div class="dp-title">' + escHtml(hz.label) + '</div></div>' +
      '<button class="dp-close">&#10005;</button></div>' +
      '<div class="hz-body" id="hz-body-' + hz.id + '"></div>';
    p.querySelector('.dp-close').onclick = function () { toggleHazard(hz.id); };
    document.body.appendChild(p);
  });
}
// Every panel in the app, so opening any one closes the rest. Without a single
// list this becomes N-squared "close the other one" calls that drift apart.
function allPanels() {
  const out = [{ panel: 'dir-panel', btn: 'dir-toggle' },
               { panel: 'wx-panel',  btn: 'wx-toggle' }];
  HAZARDS.forEach(function (h) {
    out.push({ panel: 'hz-panel-' + h.id, btn: 'hz-btn-' + h.id });
  });
  return out;
}
window.closeAllPanels = function (exceptPanelId) {
  allPanels().forEach(function (e) {
    if (e.panel === exceptPanelId) return;
    const p = document.getElementById(e.panel), b = document.getElementById(e.btn);
    if (p) p.classList.remove('open');
    if (b) b.classList.remove('on');
  });
};
window.toggleHazard = function (id) {
  const p = document.getElementById('hz-panel-' + id);
  const b = document.getElementById('hz-btn-' + id);
  if (!p) return;
  const open = !p.classList.contains('open');
  closeAllPanels(open ? p.id : null);
  p.classList.toggle('open', open);
  if (b) b.classList.toggle('on', open);
  if (open) loadHazard(id);
  syncTabRail();
};
async function loadHazard(id) {
  const st = hzState[id];
  const hz = HAZARDS.filter(function (h) { return h.id === id; })[0];
  const body = document.getElementById('hz-body-' + id);
  if (!st || !hz || !body || st.loading || st.loaded) return;
  if (!isFinite(wxLat) || !isFinite(wxLng)) {
    body.innerHTML = hzEmpty('This property has no coordinates, so nothing can be looked up.');
    return;
  }
  st.loading = true;
  body.innerHTML = hzNote('Loading&hellip;');
  try {
    body.innerHTML = await HZ_LOADERS[id](wxLat, wxLng);
    st.loaded = true;
    dbg('Hazard loaded: ' + hz.label, 'ok');
  } catch (e) {
    body.innerHTML =
      hzNote('Could not load this source.<br><br>' + escHtml(e.message) +
             '<br><br><a href="' + escHtml(hz.site) + '" target="_blank" rel="noopener">' +
             escHtml(hz.siteName) + '</a><br><br>' +
             '<a href="#" onclick="retryHazard(\'' + id + '\');return false;">Retry</a>');
    dbg('Hazard FAILED (' + hz.label + '): ' + e.message, 'error');
  } finally {
    st.loading = false;
  }
}
window.retryHazard = function (id) {
  if (hzState[id]) { hzState[id].loaded = false; hzState[id].loading = false; }
  loadHazard(id);
};
// Buttons stay hidden until a property with coordinates is resolved - without
// a lat/lng none of these five can say anything.
function showHazardButtons() {
  HAZARDS.forEach(function (hz) {
    const b = document.getElementById('hz-btn-' + hz.id);
    if (b) b.style.display = 'block';
  });
}
if (!autocapture) buildHazardUi();
// ── Route in 3D ───────────────────────────────────────────────────────
function markCard(i, on) {
  const c = document.getElementById('rd-card-' + i);
  const b = document.getElementById('rd-btn-' + i);
  if (c) c.classList.toggle('on', on);
  if (b) { b.classList.toggle('on', on); b.textContent = on ? 'Hide from 3D' : 'Show in 3D'; }
}
function clearRoute3D() {
  unregisterLayerTargets(dirLayer);
  disposeLayer(dirLayer);
  dirLayer = null;
  if (activeDir >= 0) {
    markCard(activeDir, false);
    const p = document.getElementById('rd-prog-' + activeDir);
    if (p) p.textContent = '';
  }
  activeDir = -1;
}
window.toggleRoute3D = function (i) {
  if (dirBusy) { dbg('Busy placing another layer — try again in a moment', 'warn'); return; }
  const wasActive = (activeDir === i);
  clearRoute3D();
  if (wasActive) { dbg('Route hidden', 'info'); return; }
  const pts = metreRoute(dirList[i]);
  if (!pts || !modelRoot) return;
  activeDir = i;
  markCard(i, true);
  drapeRoute(pts, i);
};
// Spread RAY_BUDGET samples over the polyline in proportion to segment
// length, so a long straight run gets the intermediate ground samples a short
// turn does not need. Every original waypoint is always a sample.
function densify(pts) {
  const seg = [];
  for (let i = 0; i < pts.length - 1; i++) {
    seg.push(Math.hypot(pts[i + 1].x - pts[i].x, pts[i + 1].y - pts[i].y));
  }
  const total = seg.reduce(function (a, b) { return a + b; }, 0) || 1;
  const extra = Math.max(0, RAY_BUDGET - pts.length);
  const out = [];
  for (let i = 0; i < pts.length - 1; i++) {
    out.push({ x: pts[i].x, y: pts[i].y, wp: i });
    const n = Math.round(extra * seg[i] / total);
    for (let k = 1; k <= n; k++) {
      const t = k / (n + 1);
      out.push({ x: pts[i].x + (pts[i + 1].x - pts[i].x) * t,
                 y: pts[i].y + (pts[i + 1].y - pts[i].y) * t, wp: -1 });
    }
  }
  const lastPt = pts[pts.length - 1];
  out.push({ x: lastPt.x, y: lastPt.y, wp: pts.length - 1 });
  return out;
}
function drapeRoute(pts, idx) {
  const samples = densify(pts);
  const prog    = document.getElementById('rd-prog-' + idx);
  raycastGround(samples, prog, function (zs) {
    if (activeDir !== idx) return;
    fillGaps(zs);
    buildRouteObjects(samples, zs, pts, idx);
  });
}
function buildRouteObjects(samples, zs, pts, idx) {
  const lift   = liftBy();
  const radius = Math.max(0.22, modelSpan * 0.0020);
  const mark   = markerSize();
  const vecs   = samples.map(function (s, i) {
    return new THREE.Vector3(s.x, s.y, zs[i] + lift);
  });
  dirLayer = new THREE.Group();
  const curve = new THREE.CatmullRomCurve3(vecs, false, 'catmullrom', 0.15);
  const tube  = new THREE.TubeGeometry(curve, Math.max(32, vecs.length * 6), radius, 8, false);
  dirLayer.add(new THREE.Mesh(tube, new THREE.MeshBasicMaterial({ color: ROUTE_HEX })));
  // Ghost copy with depth testing off, so the path stays legible where the
  // residence or a tree stands between it and the camera.
  const ghost = new THREE.Mesh(tube, new THREE.MeshBasicMaterial({
    color: ROUTE_HEX, transparent: true, opacity: 0.28, depthTest: false }));
  ghost.renderOrder = 2;
  dirLayer.add(ghost);
  const last = pts.length - 1;
  samples.forEach(function (s, i) {
    if (s.wp < 0) return;
    const isStart = s.wp === 0, isEnd = s.wp === last;
    const bg = isStart ? '#22c55e' : (isEnd ? '#ef4444' : ROUTE_HEX);
    const fg = isEnd ? '#ffffff' : '#0b0e12';
    const sp = numberSprite(String(s.wp + 1), bg, fg, mark);
    sp.position.set(s.x, s.y, zs[i] + lift + mark * 0.5);
    sp.name = (isStart ? 'Start — ' : (isEnd ? 'Target — ' : 'Waypoint ' + (s.wp + 1) + ' — ')) +
              (dirList[idx].name || ('Route ' + (idx + 1)));
    registerLabelTarget(sp);
    dirLayer.add(sp);
  });
  scene.add(dirLayer);
  frameRoute(vecs);
  dbg('Route drawn: ' + (dirList[idx].name || ('#' + (idx + 1))) +
      ' (' + pts.length + ' waypoints, ' + samples.length + ' ground samples)', 'ok');
}
function frameRoute(vecs) {
  const b = new THREE.Box3();
  vecs.forEach(function (v) { b.expandByPoint(v); });
  const c = b.getCenter(new THREE.Vector3());
  const s = b.getSize(new THREE.Vector3());
  const d = Math.max(s.x, s.y, 20) * 1.7;
  flyTo(new THREE.Vector3(c.x, c.y - d * 0.8, c.z + d * 0.8), c);
}
function showErr(msg) {
  document.getElementById('loading').classList.add('hidden');
  document.getElementById('err-msg').textContent = msg;
  document.getElementById('err').classList.add('visible');
}

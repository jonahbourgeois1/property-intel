<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Highlands at Broken Top — HOA</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  html, body { margin: 0; height: 100%; background: #0e100c; color: #e7e4dc; font: 14px/1.45 "Segoe UI", sans-serif; }
  #app { display: flex; height: 100%; }
  #map { flex: 1; min-width: 0; background: #171910; }
  #side { width: 460px; display: flex; flex-direction: column; background: #141610; border-left: 1px solid #2c3126; min-width: 0; }
  header { padding: 14px 16px 8px; }
  h1 { font-size: 18px; font-weight: 650; margin: 0 0 4px; }
  .sub { margin: 0; color: #a39e92; font-size: 12px; }
  #tabs { display: flex; gap: 6px; padding: 0 16px 8px; }
  #tabs button, #tools button, #school-pick button, .chip { border: 1px solid #3a4032; background: #1c2018; color: #e7e4dc; border-radius: 999px; padding: 4px 10px; font: inherit; font-size: 12px; cursor: pointer; }
  #tabs button.on, #tools button.on, #school-pick button.on, .chip.on { border-color: #e2c27a; color: #f4e7c3; }
  #tools { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 16px 8px; }
  #tools i { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 6px; }
  input, select { margin: 0 16px 8px; padding: 8px 10px; border: 1px solid #3a4032; border-radius: 6px; background: #10120e; color: inherit; width: calc(100% - 32px); }
  #list { overflow: auto; max-height: 168px; border-top: 1px solid #2c3126; }
  .lot { display: block; width: 100%; text-align: left; padding: 7px 16px; border: 0; border-bottom: 1px solid #24281e; background: transparent; color: inherit; cursor: pointer; }
  .lot:hover, .lot.on { background: #23281c; }
  .lot b { font-weight: 650; }
  .lot span { display: block; color: #a39e92; font-size: 12px; }
  #browser { overflow: auto; flex: 1; border-top: 1px solid #2c3126; }
  .note { padding: 8px 16px; color: #a39e92; font-size: 12px; }
  .count { padding: 0 16px 8px; color: #a39e92; font-size: 12px; }
  .field { display: grid; grid-template-columns: minmax(140px, 42%) 1fr; gap: 8px; padding: 5px 16px; border-bottom: 1px solid #24281e; font-size: 12px; }
  .field b { font-weight: 550; color: #cfcabe; word-break: break-word; }
  .field span { word-break: break-word; white-space: pre-wrap; }
  .empty { color: #6f6a60; }
  table { border-collapse: collapse; font-size: 12px; }
  th, td { border-bottom: 1px solid #24281e; padding: 4px 8px; text-align: left; vertical-align: top; white-space: nowrap; }
  th { position: sticky; top: 0; background: #1c2018; color: #cfcabe; }
  #table-wrap { overflow: auto; max-height: 100%; }
  a { color: #e2c27a; }
  #dash-pane, #school-pick { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 16px 8px; }
  #dash-pane[hidden], #school-pick[hidden] { display: none; }
  .legend { display: flex; flex-wrap: wrap; gap: 8px 12px; margin: 0 16px 8px; color: #a39e92; font-size: 11px; }
  .legend i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 4px; }
  .gline { display: grid; grid-template-columns: 64px 1fr; gap: 8px; align-items: start; margin: 0 16px 8px; font-size: 12px; }
  .gline .meta { display: block; color: #a39e92; font-size: 11px; margin-top: 2px; }
  .stack { display: flex; height: 12px; border-radius: 4px; overflow: hidden; background: #2a2e24; }
  .stack i { display: block; height: 12px; }
  .leaflet-div-icon.school-pin { background: transparent; border: 0; }
  .school-pin .pin { color: #141610; font-size: 11px; font-weight: 700; line-height: 16px; text-align: center; border-radius: 999px; border: 2px solid #f7f4ee; box-shadow: 0 1px 4px rgba(0,0,0,.45); cursor: pointer; }
  .school-pin .pin.on { border-color: #f4e04d; }
  .kpis { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 4px 16px 8px; }
  .kpi { background: #1c2018; border: 1px solid #2c3126; border-radius: 8px; padding: 8px 10px; }
  .kpi b { display: block; font-size: 16px; font-weight: 650; }
  .kpi span { color: #a39e92; font-size: 11px; }
  .dash h2 { font-size: 13px; margin: 12px 16px 6px; }
  .dash .note { padding-top: 0; }
  .bar { display: grid; grid-template-columns: 108px 1fr 64px; gap: 6px; align-items: center; margin: 0 16px 5px; font-size: 12px; }
  .track { position: relative; height: 8px; background: #2a2e24; border-radius: 4px; }
  .track i { display: block; height: 8px; border-radius: 4px; }
  .track .mark { position: absolute; top: -3px; bottom: -3px; width: 1px; background: #e2c27a; }
  .bar em { font-style: normal; color: #a39e92; text-align: right; }
  .school { margin: 0 16px 8px; padding: 10px 12px; background: #1c2018; border: 1px solid #2c3126; border-radius: 8px; }
  .school h3 { margin: 0 0 2px; font-size: 14px; }
  .school p { margin: 0; color: #a39e92; font-size: 12px; }
  .rating { float: right; font-size: 16px; color: #f4e7c3; }
  .leaflet-container { background: #171910; font: inherit; }
</style>
</head>

<div id="app">
  <div id="map"></div>

      <h1>Highlands at Broken Top</h1>
      <p class="sub" id="summary"></p>

      <button id="tab-lot" class="on" type="button">Lot</button>

      <button id="tab-records" type="button">Retrieved records</button>
    </div>
    <div id="lot-pane">
      <div id="tools"></div>
      <input id="search" type="search" placeholder="Find an address" autocomplete="off">
      <div id="list"></div>
    </div>
    <div id="record-pane" hidden>
      <select id="dataset"></select>
      <p class="note" id="dataset-note"></p>
      <select id="rowpick" hidden></select>
    </div>
    <div id="dash-pane" hidden>
      <button id="dash-community" class="on" type="button">Community</button>
      <button id="dash-schools" type="button">Schools</button>
    </div>
    <div id="school-pick" hidden></div>
    <input id="field-search" type="search" placeholder="Filter fields" autocomplete="off">
    <p class="count" id="field-count"></p>
    <div id="browser"></div>
  </aside>
</div>

      }).filter(Boolean).join(" · ");
      const meta = (proficient ? pct(proficient.SCORE) + " proficient · " + commas(proficient.STUDENTS_TESTED_CNT) + " tested · " + pct(proficient.PARTICIPATION_RATE_PCT) + " participation" : "") + (split ? "<br>" + split : "");
      scoresHtml += '<div class="gline"><b>Grade ' + String(Number(grade)) + '</b><div><div class="stack">' + segs + '</div><span class="meta">' + meta + "</span></div></div>";
    });
  });
  const year = (scoreRows[0] && scoreRows[0].YEAR) || "";
  const test = (scoreRows[0] && scoreRows[0].TEST_CD) || "";
  document.getElementById("browser").innerHTML =
    '<div class="dash">' +
    '<div class="school"><span class="rating">' + esc(school.SCHOOL_RATING || "—") + "</span><h3>" + esc(school.SCHOOL_NM) + "</h3>" +
    "<p>Grades " + esc(school.GRADE_LOW) + "–" + esc(school.GRADE_HIGH) + " · " + commas(school.ENROLLMENT) + " students · " + esc(school.TEACHERS_FTE) + " teacher FTE · ratio " + esc(school.STUDENT_TEACHER_RATIO) + "</p>" +
    "<p>" + esc(school.ADDR_LINE_1) + ", " + esc(school.CITY) + " · " + esc(phone(school.PHONE)) + "</p></div>" +
    '<p class="note">' + esc(year) + " " + esc(test) + ". The four bands are this school's tested students and add to 100. Proficient and Above overlaps those bands, so it is written beside the grade and is not drawn as its own slice.</p>" +
    '<div class="kpis">' +
    '<div class="kpi"><b>' + commas(school.ENROLL_MALE) + "</b><span>Male students</span></div>" +
    '<div class="kpi"><b>' + commas(school.ENROLL_FEMALE) + "</b><span>Female students</span></div>" +
    '<div class="kpi"><b>' + commas(school.ENROLL_FREE_OR_REDUCED_LUNCH) + "</b><span>Free or reduced lunch</span></div>" +
    '<div class="kpi"><b>' + pct(school.ENROLLMENT_CHANGE_PCT) + "</b><span>Enrollment change, " + commas(school.ENROLLMENT_PRIOR_YEAR) + " prior year</span></div>" +
    "</div>" +
    "<h2>Enrollment by grade</h2>" + bars(enrollItems, enrollMax) +
    "<h2>Students by race and ethnicity</h2>" + bars(body, bodyMax) +
    scoresHtml + "</div>";
}
function showDash() {
  document.getElementById("dash-community").className = dashKind === "community" ? "on" : "";
  document.getElementById("dash-schools").className = dashKind === "schools" ? "on" : "";
  if (dashKind === "community") showCommunity(); else showSchools();
}
function setMode(next) {
  mode = next;
  document.getElementById("tab-lot").className = mode === "lot" ? "on" : "";
  document.getElementById("tab-dash").className = mode === "dash" ? "on" : "";
  document.getElementById("tab-records").className = mode === "records" ? "on" : "";
  document.getElementById("lot-pane").hidden = mode !== "lot";
  document.getElementById("dash-pane").hidden = mode !== "dash";
  document.getElementById("record-pane").hidden = mode !== "records";
  document.getElementById("field-search").hidden = mode === "dash";
  document.getElementById("field-count").hidden = mode === "dash";
  if (mode === "lot") showLot();
  else if (mode === "records") showDataset();
  else showDash();
  paintSchoolPick();
  paintSchoolPins();
}
const datasetSelect = document.getElementById("dataset");
PACK.datasets.forEach(function (dataset, i) {
  const opt = document.createElement("option");
  opt.value = String(i);
  opt.textContent = dataset.label + " · " + dataset.rows.length + " × " + dataset.columns.length;
  datasetSelect.appendChild(opt);
});
document.getElementById("tab-lot").onclick = function () { setMode("lot"); };
document.getElementById("tab-dash").onclick = function () { setMode("dash"); };
document.getElementById("tab-records").onclick = function () { setMode("records"); };
document.getElementById("dash-community").onclick = function () { dashKind = "community"; setMode("dash"); };
document.getElementById("dash-schools").onclick = function () { dashKind = "schools"; setMode("dash"); };
datasetSelect.onchange = showDataset;
document.getElementById("rowpick").onchange = showDataset;
document.getElementById("search").addEventListener("input", function (e) { renderList(e.target.value); });
document.getElementById("field-search").addEventListener("input", function () {
  if (mode === "dash") return;
  if (currentTable) tableRows(currentTable.columns, currentTable.rows, document.getElementById("field-search").value);
  else fieldRows(currentPairs, document.getElementById("field-search").value);
});
renderList("");
const jones = DATA.features.find(function (f) { return f.properties.jones; });
if (jones) select(jones.properties.apn, { keepView: true });
</script>
</body>

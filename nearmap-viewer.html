<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Nearmap Viewer</title>
<!--
  nearmap-viewer.html — Nearmap substrate for vyanet-viewer (v1.1.0, 2026-09-09)
  Standalone ?delivery= on a known trial property redirects into vyanet-viewer
  (same HOME / PRIVATE / COMMUNITY). embed=1 is the hub iframe.
  3D fills drape on the mesh. GIS facts = data/gis/{id}.json (same file as Private 2D/3D).
  Lot line = data/parcels/ (same grid as viewer.html).
-->
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; background: #111318; overflow: hidden; font-family: monospace; color: #8a93a2; }
  :root { --bar-h: 64px; --panel-w: 300px; }
  #bar { position: fixed; top: 0; left: 0; right: 0; z-index: 40; height: var(--bar-h); display: flex; align-items: center; gap: 8px; padding: 0 16px; background: #0b0e12; border-bottom: 1px solid rgba(255,255,255,0.10); }
  #bar .name { color: #f0f2f5; font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #bar .addr { font-size: 12px; color: #555f6e; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #bar .build { font-size: 10px; color: #555f6e; letter-spacing: 0.04em; }
  #bar .src { font-size: 10px; color: #4fd1c5; letter-spacing: 0.06em; text-transform: uppercase; padding: 3px 7px; border: 1px solid rgba(79,209,197,0.4); border-radius: 6px; }
  #bar button { font-family: monospace; font-size: 12px; letter-spacing: 0.06em; padding: 11px 14px; border-radius: 8px; cursor: pointer; background: rgba(0,0,0,0.35); color: #8a93a2; border: 1px solid #2a3040; flex-shrink: 0; }
  #bar button.on { color: #f0f2f5; border-color: #a855f7; background: rgba(168,85,247,0.16); }
  #bar button:disabled { opacity: 0.35; cursor: not-allowed; }
  #stage { position: fixed; top: var(--bar-h); left: 0; right: var(--panel-w); bottom: 0; }
  .view { position: absolute; inset: 0; display: none; }
  .view.on { display: block; }
  #map2d { position: absolute; inset: 0; }
  #gl3d { position: absolute; inset: 0; }
  #gl3d canvas { display: block; }
  #obl { position: absolute; inset: 0; overflow: auto; padding: 16px; display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 14px; align-content: start; }
  .obl-card { background: #0b0e12; border: 1px solid #2a3040; border-radius: 10px; overflow: hidden; cursor: zoom-in; }
  .obl-card img { display: block; width: 100%; aspect-ratio: 4 / 3; object-fit: cover; background: #000; }
  .obl-card .cap { padding: 8px 10px; font-size: 12px; color: #c9d1dc; display: flex; justify-content: space-between; }
  .obl-card .cap span { color: #555f6e; }
  #lightbox { position: fixed; inset: 0; background: rgba(0,0,0,0.92); display: none; align-items: center; justify-content: center; z-index: 60; cursor: zoom-out; }
  #lightbox.on { display: flex; }
  #lightbox img { max-width: 96vw; max-height: 92vh; object-fit: contain; }
  #panel { position: fixed; top: var(--bar-h); right: 0; bottom: 0; width: var(--panel-w); background: #0b0e12; border-left: 1px solid rgba(255,255,255,0.10); display: flex; flex-direction: column; z-index: 30; }
  #panel h2 { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: #555f6e; padding: 12px 14px 6px; }
  #panel .scroll { flex: 1; overflow: auto; padding: 0 14px 14px; }
  .layer-btns { display: flex; gap: 6px; margin: 4px 0 10px; }
  .layer-btns button, #panel .btn { font-family: monospace; font-size: 11px; padding: 6px 10px; border-radius: 6px; cursor: pointer; background: rgba(0,0,0,0.35); color: #8a93a2; border: 1px solid #2a3040; }
  .layer-row { display: flex; align-items: center; gap: 8px; padding: 5px 0; font-size: 12px; color: #c9d1dc; cursor: pointer; }
  .layer-row input { accent-color: #a855f7; }
  .swatch { width: 12px; height: 12px; border-radius: 3px; flex: 0 0 12px; border: 1px solid rgba(255,255,255,0.35); }
  .layer-row .n { margin-left: auto; color: #555f6e; }
  .layer-row.pins { border-top: 1px solid #2a3040; margin-top: 8px; padding-top: 10px; }
  #panel h2.sub { padding-top: 16px; border-top: 1px solid #2a3040; margin-top: 8px; }
  #pinList { list-style: none; margin: 6px 0 0; }
  #pinList li { display: flex; gap: 8px; align-items: baseline; padding: 4px 0; border-bottom: 1px solid #1a1f27; font-size: 12px; color: #c9d1dc; cursor: pointer; }
  #pinList li:hover { color: #f0f2f5; }
  #pinList li .num { color: #a855f7; font-weight: 700; min-width: 20px; }
  #pinList li .cls { color: #555f6e; margin-left: auto; font-size: 11px; }
  #status { padding: 10px 14px; font-size: 11px; color: #555f6e; border-top: 1px solid rgba(255,255,255,0.08); min-height: 34px; }
  #status.err { color: #ef4444; }
  #progress { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); background: rgba(11,14,18,0.9); border: 1px solid #2a3040; border-radius: 10px; padding: 14px 18px; font-size: 12px; color: #c9d1dc; display: none; z-index: 5; }
  #progress.on { display: block; }
  #pinLabel3d { position: absolute; left: 0; top: 0; transform: translate(-50%, -130%); background: rgba(11,14,18,0.92); border: 1px solid #a855f7; border-radius: 8px; padding: 6px 10px; font-size: 12px; color: #f0f2f5; pointer-events: none; display: none; white-space: nowrap; }
  #pinLabel3d.on { display: block; }
  #resetView { position: absolute; bottom: 16px; left: 16px; z-index: 6; display: none; background: #12161b; color: #8a93a2; border: 1px solid #2a3040; font-family: monospace; font-size: 11px; padding: 6px 12px; border-radius: 6px; cursor: pointer; transition: color 0.2s, background 0.15s; }
  #resetView.on { display: block; }
  #resetView:hover { color: #fff; background: #1a1f27; }
  #err { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; padding: 24px; color: #ef4444; font-size: 13px; text-align: center; z-index: 70; background: #111318; }
  #err.on { display: flex; }
  body.embed #bar .src, body.embed #bar .name, body.embed #bar .addr, body.embed #bar .build { display: none; }
  body.embed #bar { justify-content: flex-start; }
  .rd-card { margin: 8px 0 12px; border: 1px solid rgba(255,255,255,0.14); border-radius: 10px; background: #1a1f27; overflow: hidden; }
  .rd-head { padding: 12px 14px; display: flex; align-items: flex-start; gap: 10px; }
  .rd-num { width: 22px; height: 22px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 700; flex-shrink: 0; }
  .rd-titles { flex: 1; min-width: 0; }
  .rd-name { font-size: 12px; font-weight: 600; color: #f0f2f5; line-height: 1.35; }
  .rd-meta { font-size: 10px; color: #555f6e; margin-top: 4px; line-height: 1.45; }
  .rd-body { padding: 0 14px 14px; }
  .gis-group { font-size: 10px; font-weight: 600; color: #555f6e; letter-spacing: 0.08em; text-transform: uppercase; margin: 10px 0 4px; }
  .gis-group:first-child { margin-top: 0; }
  .gis-row { display: flex; align-items: flex-start; gap: 10px; padding: 5px 0; border-bottom: 1px solid rgba(255,255,255,0.06); }
  .gis-k { flex: 0 0 42%; font-size: 10px; color: #8a93a2; line-height: 1.45; }
  .gis-v { flex: 1; font-size: 11px; color: #f0f2f5; line-height: 1.45; overflow-wrap: anywhere; }
  .gis-sub { font-size: 10px; color: #8a93a2; margin-top: 2px; }
  .gis-empty { font-size: 11px; color: #555f6e; padding: 4px 0 10px; }
  @media (max-width: 760px) {
    :root { --panel-w: 0px; }
    #panel { display: none; }
    #bar .addr, #bar .build, #bar .src { display: none; }
  }
</style>
</head>
<body>
<div id="bar">
  <span class="src">Nearmap</span>
  <span class="name" id="nm">Nearmap Viewer</span>
  <span class="addr" id="addr"></span>
  <span class="build" id="build"></span>
  <button type="button" id="tab2d" class="on">2D</button>
  <button type="button" id="tab3d" disabled title="No 3D mesh for this delivery">3D</button>
  <button type="button" id="tabObl">Obliques</button>
</div>
<div id="stage">
  <div class="view on" id="view2d"><div id="map2d"></div></div>
  <div class="view" id="view3d"><div id="gl3d"></div><div id="progress"></div><div id="pinLabel3d"></div><button type="button" id="resetView" title="Back to the opening view">&#8593; Reset View</button></div>
  <div class="view" id="viewObl"><div id="obl"></div></div>
</div>
<aside id="panel">
  <h2>Property Facts</h2>
  <div class="scroll">
    <label class="layer-row"><input type="checkbox" id="lotToggle" checked><span class="swatch" style="background:#cd3333"></span>Lot line</label>
    <div id="gisBox"><div class="gis-empty">Loading GIS…</div></div>
    <h2 class="sub">AI layers</h2>
    <div class="layer-btns"><button type="button" id="aiAll">All</button><button type="button" id="aiNone">None</button><button type="button" id="reloadRegions" title="Re-read ai/edits/regions.json (picks up editor saves)" style="margin-left:auto">Reload</button></div>
    <div id="aiLayers"></div>
    <label class="layer-row pins"><input type="checkbox" id="pinsToggle" checked><span class="swatch" style="background:#a855f7"></span>Catalog pins<span class="n" id="pinCount">0</span></label>
    <ol id="pinList"></ol>
  </div>
  <div id="status">Loading…</div>
</aside>
<div id="lightbox"><img id="lightboxImg" alt=""></div>
<div id="err"></div>

<script type="importmap">
{ "imports": { "three": "https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.module.js" } }
</script>
<script type="module">
import { dataRoot, NEARMAP_DELIVERY_HUB } from './js/vyanet-viewer/property.js?v=1.8.15';
import { fetchPropertyGis, gisFactsHtml } from './js/vyanet-viewer/gis-facts.js?v=1.8.15';
const BUILD = 'v1.1.0';
const NM_API_URL = 'https://script.google.com/macros/s/AKfycbzHkj4fNRBJ7839babxL2Gp1A2ka9Em05rOQRZUNg_X0lMrOAMEKtEXEXxuU9_u7iKERA/exec';
const MAPS_KEY = 'AIzaSyD2tWrnRhCaicAwtp_32xe5zG5YGuntfuI';
const CF_TILES = 'https://d3fg47bqswi0rr.cloudfront.net/nearmap/';
const THREE_JSM = 'https://cdn.jsdelivr.net/npm/three@0.128.0/examples/jsm';
const DRACO_PATH = 'https://www.gstatic.com/draco/versioned/decoders/1.5.6/';
const VEGETATION_RE = /vegetation|tree overhang|natural/i;
const PARCEL_COUNTIES = [
  { name: 'deschutes', lat0: 43.61, lng0: -122.01, step: 0.07 },
  { name: 'lane',      lat0: 43.40, lng0: -124.20, step: 0.07 }
];

document.getElementById('build').textContent = 'nearmap ' + BUILD;

const qp = new URLSearchParams(location.search);
const siteNo = (qp.get('site_no') || qp.get('site') || '').trim();
let delivery = (qp.get('delivery') || '').trim();
const tilesBase = (qp.get('tiles') || CF_TILES).replace(/\/?$/, '/');
const EMBED = qp.get('embed') === '1';
const propertyId = (qp.get('property') || '').trim() || NEARMAP_DELIVERY_HUB[delivery] || '';
if (EMBED) document.body.classList.add('embed');
const HUB_REDIRECT = !EMBED && propertyId;
if (HUB_REDIRECT) {
  const u = new URL('vyanet-viewer.html', location.href);
  u.searchParams.set('property', propertyId);
  if (delivery) u.searchParams.set('delivery', delivery);
  if (siteNo) u.searchParams.set('site_no', siteNo);
  const tilesQ = qp.get('tiles');
  if (tilesQ) u.searchParams.set('tiles', tilesQ);
  ['gw', 'chekt', 'debug', 'dataRoot', 'role'].forEach((k) => {
    const v = qp.get(k); if (v) u.searchParams.set(k, v);
  });
  u.searchParams.set('stage', 'home');
  location.replace(u.href);
}

const state = {
  address: '', bounds: null, nadirUrl: '', obliques: {}, manifest: null,
  meshUrl: '', meshMeta: null, regions: null, classes: [], layerOn: {}, pins: [],
  catalog: {}, pinsOn: true, tab: '2d'
};
let map = null, mapReady = false, groundOverlay = null;
const shapes2d = {};   // class -> [google.maps.Polygon]
let markers2d = [];
let three = null;      // { renderer, scene, camera, controls, mesh, groups: {cls: Group}, pinGroup, heightmap }
let parcelPoly = null, parcelShown = true;

// ── helpers ──────────────────────────────────────────────────────────────────
const $ = (id) => document.getElementById(id);
function setStatus(t, err) { const el = $('status'); el.textContent = t || ''; el.className = err ? 'err' : ''; }
function fail(msg) { const el = $('err'); el.textContent = msg; el.classList.add('on'); }
function joinUrl(base, path) { return base.replace(/\/?$/, '/') + String(path).replace(/^\//, ''); }
function bust(url) { return url + (url.indexOf('?') === -1 ? '?' : '&') + '_=' + Date.now(); }
async function fetchJson(url, opt) {
  const r = await fetch(url, opt || {});
  if (!r.ok) throw new Error(r.status + ' ' + url);
  return r.json();
}
async function fetchJsonOptional(url) { try { return await fetchJson(bust(url), { cache: 'no-store' }); } catch (e) { return null; } }
function featureClass(f) { return (f && f.properties && (f.properties['class'] || f.properties.description)) || 'Unknown'; }
function featureRings(f) {
  const g = (f && f.geometry) || {};
  if (g.type === 'Polygon') return [g.coordinates];
  if (g.type === 'MultiPolygon') return g.coordinates || [];
  return [];
}
function colorForClass(name) {
  const fixed = {
    Building: '#e85d04', 'Building (Deprecated)': '#9d0208', Roof: '#dc2f02', 'Translucent Roofing': '#f48c06',
    Driveway: '#f72585', Asphalt: '#495057', 'Road (Driveable Surface)': '#343a40', 'Concrete Slab': '#adb5bd',
    'Solar Panel': '#3a86ff', 'Swimming Pool': '#4cc9f0', 'Water Body': '#0077b6', 'Residential Chimney': '#7b2cbf',
    Skylight: '#ffd166', 'Woody Vegetation': '#2d6a4f', 'Medium and High Vegetation (>2m)': '#40916c',
    'Medium and High Vegetation with Woody Vegetation': '#1b4332', 'Low Vegetation (0.5m-2m)': '#74c69d',
    'Very Low Vegetation (<0.5m)': '#95d5b2', 'Lawn Grass': '#52b788', 'Natural (soft)': '#b7e4c7',
    Car: '#4cc9f0', Dumpster: '#9d4edd', 'Tree Overhang': '#2d6a4f', 'Leaf-off Vegetation': '#95d5b2'
  };
  if (fixed[name]) return fixed[name];
  let h = 0;
  for (let i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) >>> 0;
  return 'hsl(' + (h % 360) + ',65%,55%)';
}
function pctToLatLng(x, y, b) {
  return { lat: b.north - (Number(y) / 100) * (b.north - b.south), lng: b.west + (Number(x) / 100) * (b.east - b.west) };
}
function latLngToPct(lat, lng, b) {
  return { u: (lng - b.west) / (b.east - b.west), v: (b.north - lat) / (b.north - b.south) };
}
// lat/lng -> local metres through the mesh frame corners (bilinear, same convention as model-viewer)
function localFromLatLng(lat, lng) {
  const c = state.meshMeta && state.meshMeta.local;
  const b = state.bounds;
  if (!c || !b) return null;
  const { u, v } = latLngToPct(lat, lng, b);
  const tx = c.nw[0] + (c.ne[0] - c.nw[0]) * u, ty = c.nw[1] + (c.ne[1] - c.nw[1]) * u;
  const bx = c.sw[0] + (c.se[0] - c.sw[0]) * u, by = c.sw[1] + (c.se[1] - c.sw[1]) * u;
  return { x: tx + (bx - tx) * v, y: ty + (by - ty) * v };
}
function pinName(id) { const p = state.catalog[id]; return (p && p.name) || ('#' + id); }

// ── data ─────────────────────────────────────────────────────────────────────
async function loadRow() {
  if (!siteNo) return null;
  const u = NM_API_URL + '?route=nearmap-elements&site_no=' + encodeURIComponent(siteNo) + '&_=' + Date.now();
  const r = await fetch(u, { redirect: 'follow' });
  const t = await r.text();
  if (t.trim().charAt(0) === '<') throw new Error('Apps Script returned a web page instead of JSON (transient) — reload');
  const row = JSON.parse(t);
  if (!row || row.ok === false) throw new Error('Sheet row: ' + ((row && row.error) || 'no row'));
  state.address = row.address || '';
  if (row.bounds && row.bounds.north != null) state.bounds = row.bounds;
  if (row.nadir_url) state.nadirUrl = row.nadir_url;
  state.obliques = { north: row.north_url, east: row.east_url, south: row.south_url, west: row.west_url };
  state.pins = Array.isArray(row.pins) ? row.pins : [];
  state.regionsEditsUrl = row.regions_edits_url || '';
  state.regionsOriginalUrl = row.regions_original_url || '';
  if (row.delivery_id && !delivery) delivery = String(row.delivery_id);
  return row;
}
async function loadManifest() {
  if (!delivery) return null;
  const man = await fetchJsonOptional(joinUrl(tilesBase, delivery + '/manifest.json'));
  if (!man) return null;
  state.manifest = man;
  if (!state.address) state.address = man.address || '';
  if (!state.bounds && man.bounds) state.bounds = man.bounds;
  const local = !!qp.get('tiles');
  const urls = man.urls || {};
  const pick = (k, file) => local ? joinUrl(tilesBase, delivery + '/' + file) : (urls[k] || joinUrl(tilesBase, delivery + '/' + file));
  if (!state.nadirUrl) state.nadirUrl = pick('vert', 'vert.jpg');
  if (!state.obliques.north) state.obliques = { north: pick('north', 'north.jpg'), east: pick('east', 'east.jpg'), south: pick('south', 'south.jpg'), west: pick('west', 'west.jpg') };
  if (urls.mesh || (man.mesh && man.mesh.glb)) {
    state.meshUrl = local ? joinUrl(tilesBase, delivery + '/' + (man.mesh && man.mesh.glb || 'mesh/model.glb')) : (urls.mesh || joinUrl(tilesBase, delivery + '/mesh/model.glb'));
    state.meshMetaUrl = local ? joinUrl(tilesBase, delivery + '/' + (man.mesh && man.mesh.meta || 'mesh/mesh.json')) : (urls.mesh_meta || joinUrl(tilesBase, delivery + '/mesh/mesh.json'));
  }
  if (!state.regionsEditsUrl) state.regionsEditsUrl = joinUrl(tilesBase, delivery + '/ai/edits/regions.json');
  if (!state.regionsOriginalUrl) state.regionsOriginalUrl = joinUrl(tilesBase, delivery + '/ai/original/regions.json');
  return man;
}
async function loadRegions() {
  let fc = await fetchJsonOptional(state.regionsEditsUrl);
  let src = 'edits';
  if (!fc || !Array.isArray(fc.features)) { fc = await fetchJsonOptional(state.regionsOriginalUrl); src = 'original'; }
  if (!fc || !Array.isArray(fc.features)) { state.regions = { features: [] }; return false; }
  const sig = (fc.saved || '') + ':' + fc.features.length;
  const changed = sig !== state.regionsSig;
  state.regionsSig = sig;
  state.regions = fc;
  state.regionsSource = src;
  const counts = {};
  fc.features.forEach((f) => { const c = featureClass(f); counts[c] = (counts[c] || 0) + 1; });
  state.classes = Object.keys(counts).sort();
  state.counts = counts;
  state.classes.forEach((c) => { if (state.layerOn[c] === undefined) state.layerOn[c] = !VEGETATION_RE.test(c) || c === 'Lawn Grass'; });
  return changed;
}
// Re-read the regions file (the editor may have saved since this tab loaded) and
// redraw both views when it changed. Runs on focus/visibility and on Reload.
let reloading = false;
async function reloadRegions(reason) {
  if (reloading || !state.bounds) return;
  reloading = true;
  try {
    const changed = await loadRegions();
    if (changed) {
      renderPanel();
      if (mapReady) draw2dRegions();
      if (three) draw3dRegions();
      applyLayers();
      setStatus(statusText() + (reason ? ' · reloaded (' + reason + ')' : ''));
    }
  } finally { reloading = false; }
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') reloadRegions('tab focus'); });
window.addEventListener('focus', () => reloadRegions('focus'));
async function loadCatalog() {
  try {
    const cat = await fetchJson('data/pin-catalog/pins-catalog.json');
    (cat.pins || []).forEach((p) => { state.catalog[p.id] = p; });
  } catch (e) { /* names fall back to #id */ }
}

// ── layer panel ──────────────────────────────────────────────────────────────
function renderPanel() {
  const host = $('aiLayers');
  host.innerHTML = '';
  state.classes.forEach((name) => {
    const row = document.createElement('label');
    row.className = 'layer-row';
    row.innerHTML = '<input type="checkbox" data-layer="' + name.replace(/"/g, '&quot;') + '"' + (state.layerOn[name] ? ' checked' : '') + '>' +
      '<span class="swatch" style="background:' + colorForClass(name) + '"></span>' + name +
      '<span class="n">' + (state.counts[name] || 0) + '</span>';
    host.appendChild(row);
  });
  $('pinCount').textContent = String(state.pins.length);
  const list = $('pinList');
  list.innerHTML = '';
  state.pins.forEach((p, i) => {
    const li = document.createElement('li');
    li.dataset.idx = String(i);
    li.innerHTML = '<span class="num">' + (i + 1) + '</span><span>' + pinName(p.id) + '</span><span class="cls">' + (p.ai_class || '') + '</span>';
    list.appendChild(li);
  });
}
function applyLayers() {
  Object.keys(shapes2d).forEach((cls) => shapes2d[cls].forEach((s) => s.setVisible(!!state.layerOn[cls])));
  markers2d.forEach((m) => m.setVisible(state.pinsOn));
  if (three) {
    const missing = state.classes.some((c) => state.layerOn[c] && !three.groups[c]);
    if (missing) draw3dRegions();
    else Object.keys(three.groups).forEach((cls) => { three.groups[cls].visible = !!state.layerOn[cls]; });
    if (three.pinGroup) three.pinGroup.visible = state.pinsOn;
  }
}

async function loadGisFacts() {
  const box = $('gisBox');
  if (!box) return;
  if (!propertyId) {
    box.innerHTML = '<div class="gis-empty">No property hub for this delivery — GIS facts live on data/gis/{id}.json.</div>';
    return;
  }
  try {
    const rec = await fetchPropertyGis(dataRoot(), propertyId);

    card.className = 'obl-card';
    card.innerHTML = '<img loading="lazy" alt="' + label + ' oblique" src="' + url + '"><div class="cap">' + label + ' oblique<span>' + (state.manifest && state.manifest.survey_date || '') + '</span></div>';
    card.addEventListener('click', () => { $('lightboxImg').src = url; $('lightbox').classList.add('on'); });
    host.appendChild(card);
  });
  if (state.nadirUrl) {
    const card = document.createElement('div');
    card.className = 'obl-card';
    card.innerHTML = '<img loading="lazy" alt="Nadir" src="' + state.nadirUrl + '"><div class="cap">Nadir (vertical)<span>' + (state.manifest && state.manifest.survey_date || '') + '</span></div>';
    card.addEventListener('click', () => { $('lightboxImg').src = state.nadirUrl; $('lightbox').classList.add('on'); });
    host.appendChild(card);
  }
}
$('lightbox').addEventListener('click', () => $('lightbox').classList.remove('on'));

// ── tabs + panel events ──────────────────────────────────────────────────────
function showTab(t) {
  state.tab = t;
  ['2d', '3d', 'Obl'].forEach((k) => {
    $('view' + k).classList.toggle('on', k.toLowerCase() === t.toLowerCase());
    $('tab' + k).classList.toggle('on', k.toLowerCase() === t.toLowerCase());
  });
  if (t === '3d') init3d().catch((e) => { $('progress').classList.remove('on'); setStatus('3D: ' + e.message, true); });
  if (t === '2d' && map) google.maps.event.trigger(map, 'resize');
}
$('tab2d').addEventListener('click', () => showTab('2d'));
$('tab3d').addEventListener('click', () => showTab('3d'));
$('tabObl').addEventListener('click', () => showTab('Obl'));
$('aiLayers').addEventListener('change', (ev) => {
  const t = ev.target;
  if (!t || t.type !== 'checkbox') return;
  state.layerOn[t.getAttribute('data-layer')] = t.checked;
  applyLayers();
});
$('aiAll').addEventListener('click', () => { state.classes.forEach((c) => { state.layerOn[c] = true; }); renderPanel(); applyLayers(); });
$('aiNone').addEventListener('click', () => { state.classes.forEach((c) => { state.layerOn[c] = false; }); renderPanel(); applyLayers(); });
$('pinsToggle').addEventListener('change', (ev) => { state.pinsOn = ev.target.checked; applyLayers(); });
$('lotToggle').addEventListener('change', (ev) => {
  parcelShown = ev.target.checked;
  if (parcelPoly) parcelPoly.setMap(parcelShown ? map : null);
});
$('reloadRegions').addEventListener('click', async () => {
  setStatus('Reloading regions…');
  const before = state.regionsSig;
  await reloadRegions('manual');
  if (state.regionsSig === before) setStatus(statusText() + ' · no change');
});
$('pinList').addEventListener('click', (ev) => {
  const li = ev.target.closest('li');
  if (!li) return;
  const i = parseInt(li.dataset.idx, 10);
  const p = state.pins[i];
  if (!p) return;
  if (state.tab === '3d') { focusPin3d(i); return; }
  if (state.tab !== '2d') showTab('2d');
  if (map) { map.panTo(pctToLatLng(p.x, p.y, state.bounds)); if (map.getZoom() < 20) map.setZoom(20); google.maps.event.trigger(markers2d[i], 'click'); }
});
function statusText() {
  const n = (state.regions && state.regions.features || []).length;
  let saved = '';
  if (state.regions && state.regions.saved) {
    const d = new Date(state.regions.saved);
    if (!isNaN(d)) saved = ' saved ' + d.toLocaleString([], { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
  }
  return delivery + ' · ' + n + ' regions (' + (state.regionsSource || 'none') + saved + ') · ' + state.pins.length + ' pins' +
    (state.meshUrl ? ' · 3D mesh' + (state.meshMeta && state.meshMeta.triangles ? ' ' + Math.round(state.meshMeta.triangles / 1000) + 'k tris' : '') : ' · no 3D mesh');
}

// ── boot ─────────────────────────────────────────────────────────────────────
(async function boot() {
  if (HUB_REDIRECT) return;
  try {
    if (!siteNo && !delivery) { fail('Need ?site_no= (from the Nearmap sheet) or ?delivery='); return; }
    setStatus('Loading Nearmap row…');
    try { await loadRow(); } catch (e) { setStatus(e.message, true); }
    setStatus('Loading delivery…');
    await loadManifest();
    if (!state.bounds) { fail('No nadir bounds for ' + (delivery || siteNo) + ' — import the registry row or check the delivery id.'); return; }
    $('nm').textContent = state.address || delivery;
    $('addr').textContent = delivery + (state.manifest && state.manifest.survey_date ? ' · flown ' + state.manifest.survey_date : '');
    document.title = 'Nearmap — ' + (state.address || delivery);
    if (state.meshUrl) { $('tab3d').disabled = false; $('tab3d').title = '3D mesh'; }
    await Promise.all([loadRegions(), loadCatalog(), loadGisFacts()]);
    renderPanel();
    renderObliques();
    setStatus('Loading map…');
    await bootMaps();
    init2d();
    setStatus(statusText());
    if (state.meshMetaUrl) fetchJsonOptional(state.meshMetaUrl).then((m) => { if (m) { state.meshMeta = m; setStatus(statusText()); } });
  } catch (e) {
    fail(String(e.message || e));
  }
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D Model Viewer</title>
<script src="https://cesium.com/downloads/cesiumjs/releases/1.114/Build/Cesium/Cesium.js"></script>
<link href="https://cesium.com/downloads/cesiumjs/releases/1.114/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; background: #111318; overflow: hidden; }
  #cesiumContainer { width: 100%; height: 100%; }
  #loading { position: fixed; inset: 0; background: #111318; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; z-index: 100; transition: opacity 0.6s ease; }
  #loading.hidden { opacity: 0; pointer-events: none; }
  .spin { width: 32px; height: 32px; border: 2px solid rgba(168,85,247,0.2); border-top-color: #a855f7; border-radius: 50%; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .load-text { font-family: monospace; font-size: 12px; color: #555f6e; }
</style>
</head>
<body>
<div id="cesiumContainer"></div>
<div id="loading"><div class="spin"></div><div class="load-text">Loading 3D model...</div></div>
<script>
  const params = new URLSearchParams(window.location.search);
  const tilesetUrl = params.get('tileset') ||
    'https://property-intel-tiles.s3.amazonaws.com/captures/tracy-residence-2026-06/b3dm/tileset.json';

  Cesium.Ion.defaultAccessToken = '';

  const viewer = new Cesium.Viewer('cesiumContainer', {
    animation: false, baseLayerPicker: false, fullscreenButton: false,
    geocoder: false, homeButton: false, infoBox: false,
    sceneModePicker: false, selectionIndicator: false, timeline: false,
    navigationHelpButton: false, skyBox: false, skyAtmosphere: false,
    imageryProvider: false, baseLayer: false
  });

  viewer.scene.backgroundColor = Cesium.Color.fromCssColorString('#111318');
  viewer.scene.globe.show = false;
  viewer.scene.highDynamicRange = false;
  viewer.scene.light = new Cesium.DirectionalLight({
    direction: Cesium.Cartesian3.normalize(
      new Cesium.Cartesian3(1.0, 1.0, -1.0),
      new Cesium.Cartesian3()
    ),
    intensity: 5.0
  });

  Cesium.Cesium3DTileset.fromUrl(tilesetUrl, {
    maximumScreenSpaceError: 2
  }).then(function(tileset) {
    viewer.scene.primitives.add(tileset);

    const bs = tileset.boundingSphere;
    const radius = bs.radius > 0 ? bs.radius : 500;
    const carto = Cesium.Ellipsoid.WGS84.cartesianToCartographic(bs.center);
    const lon = Cesium.Math.toDegrees(carto.longitude);
    const lat = Cesium.Math.toDegrees(carto.latitude);
    const alt = carto.height;

    // Start straight down so tiles get selected immediately
    viewer.camera.setView({
      destination: Cesium.Cartesian3.fromDegrees(lon, lat, alt + radius * 3.0),
      orientation: { heading: 0, pitch: Cesium.Math.toRadians(-90), roll: 0 }
    });

    // Once tiles are selected, hide loading and rotate to angled view
    // Stay at same altitude — just change pitch, don't fly up
    let transitioned = false;
    const unsub = viewer.scene.postRender.addEventListener(function() {
      if (transitioned) return;
      if (tileset.statistics.selected > 0) {
        transitioned = true;
        unsub();
        document.getElementById('loading').classList.add('hidden');

        // Orbit to angled view — same destination altitude, just tilt the camera
        viewer.camera.flyTo({
          destination: Cesium.Cartesian3.fromDegrees(
            lon - 0.002,  // slightly offset so we look toward center
            lat - 0.002,
            alt + radius * 2.5
          ),
          orientation: {
            heading: Cesium.Math.toRadians(45),
            pitch: Cesium.Math.toRadians(-35),
            roll: 0
          },
          duration: 2.0
        });
      }
    });

  }).catch(function(err) {
    document.getElementById('loading').innerHTML =
      '<div style="color:#ef4444;font-family:monospace;font-size:13px;text-align:center;padding:32px;">' +
      '<strong>Could not load 3D model</strong><br><br>' + (err.message || String(err)) + '</div>';
  });
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D Model Viewer</title>
<script src="https://cesium.com/downloads/cesiumjs/releases/1.114/Build/Cesium/Cesium.js"></script>
<link href="https://cesium.com/downloads/cesiumjs/releases/1.114/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; background: #000; overflow: hidden; }
  #cesiumContainer { width: 100%; height: 100%; }
  #debug { position: fixed; bottom: 0; left: 0; right: 0; max-height: 200px; overflow-y: auto; background: rgba(0,0,0,0.93); border-top: 1px solid rgba(59,130,246,0.4); font-family: monospace; font-size: 11px; z-index: 9999; padding: 6px 10px; }
  .dl { padding: 2px 0; border-bottom: 1px solid rgba(255,255,255,0.04); word-break: break-all; }
  .ok  { color: #22c55e; } .err { color: #ef4444; } .inf { color: #8a93a2; } .wrn { color: #f59e0b; }
</style>
</head>
<body>
<div id="cesiumContainer"></div>
<div id="debug"></div>
<script>
function dbg(msg, type) {
  const d = document.getElementById('debug');
  const t = new Date().toTimeString().slice(0,8);
  const el = document.createElement('div');
  el.className = 'dl ' + (type||'inf');
  el.textContent = t + ' ' + msg;
  d.appendChild(el);
  d.scrollTop = d.scrollHeight;
}

dbg('Starting', 'ok');
const params = new URLSearchParams(window.location.search);
const tilesetUrl = params.get('tileset') ||
  'https://property-intel-tiles.s3.amazonaws.com/captures/tracy-residence-2026-06/b3dm/tileset.json';
dbg('URL: ' + tilesetUrl, 'inf');

Cesium.Ion.defaultAccessToken = '';

const viewer = new Cesium.Viewer('cesiumContainer', {
  animation: false, baseLayerPicker: false, fullscreenButton: false,
  geocoder: false, homeButton: false, infoBox: false,
  sceneModePicker: false, selectionIndicator: false, timeline: false,
  navigationHelpButton: false, skyBox: false, skyAtmosphere: false,
  imageryProvider: false, baseLayer: false
});

// Dark background, no globe
viewer.scene.backgroundColor = Cesium.Color.fromCssColorString('#111318');
viewer.scene.globe.show = false;
viewer.scene.highDynamicRange = false;

// Strong light from above-front, high intensity so unlit B3DM textures show
viewer.scene.light = new Cesium.DirectionalLight({
  direction: Cesium.Cartesian3.normalize(
    new Cesium.Cartesian3(1.0, 1.0, -1.0),
    new Cesium.Cartesian3()
  ),
  intensity: 5.0
});

dbg('Viewer ready', 'ok');

Cesium.Cesium3DTileset.fromUrl(tilesetUrl, {
  maximumScreenSpaceError: 2,
  // Force unlit rendering — DJI Terra B3DM meshes have no lighting model
  imageBasedLightingFactor: new Cesium.Cartesian2(1.0, 1.0)
}).then(function(tileset) {
  dbg('Tileset loaded', 'ok');
  viewer.scene.primitives.add(tileset);

  // Override all tile materials to use unlit shading
  tileset.style = new Cesium.Cesium3DTileStyle({
    color: 'color("white", 1.0)'
  });

  const bs = tileset.boundingSphere;
  const radius = bs.radius > 0 ? bs.radius : 500;
  dbg('radius=' + radius.toFixed(0) + ' center=' + bs.center.x.toFixed(0) + ',' + bs.center.y.toFixed(0) + ',' + bs.center.z.toFixed(0), 'inf');

  const carto = Cesium.Ellipsoid.WGS84.cartesianToCartographic(bs.center);
  const lon = Cesium.Math.toDegrees(carto.longitude);
  const lat = Cesium.Math.toDegrees(carto.latitude);
  const alt = carto.height;
  dbg('lon=' + lon.toFixed(5) + ' lat=' + lat.toFixed(5) + ' alt=' + alt.toFixed(0), 'ok');

  viewer.camera.flyTo({
    destination: Cesium.Cartesian3.fromDegrees(lon, lat, alt + radius * 5.0),
    orientation: { heading: 0, pitch: Cesium.Math.toRadians(-45), roll: 0 },
    duration: 0
  });
  dbg('Camera set', 'ok');

  // Log what tiles are actually being rendered each frame for 3 seconds
  let frameCount = 0;
  const removeListener = viewer.scene.postRender.addEventListener(function() {
    frameCount++;
    if (frameCount === 30) {
      const stats = tileset.statistics;
      dbg('After 30 frames — selected:' + stats.selected + ' loaded:' + stats.numberOfTilesWithContentReady + ' total:' + stats.numberOfTilesTotal, 'wrn');
    }
    if (frameCount >= 90) removeListener();
  });

}).catch(function(err) {
  dbg('FAILED: ' + (err.message || String(err)), 'err');
});
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D Model Viewer</title>
<script src="https://cesium.com/downloads/cesiumjs/releases/1.114/Build/Cesium/Cesium.js"></script>
<link href="https://cesium.com/downloads/cesiumjs/releases/1.114/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; background: #000; overflow: hidden; }
  #cesiumContainer { width: 100%; height: 100%; }
  #error-msg { display: none; position: absolute; inset: 0; align-items: center; justify-content: center; flex-direction: column; gap: 12px; background: #0a0c0f; color: #8a93a2; font-family: monospace; font-size: 13px; text-align: center; padding: 32px; }
  #error-msg.visible { display: flex; }
  #error-msg strong { color: #ef4444; font-size: 15px; }
  #debug { position: fixed; bottom: 0; left: 0; right: 0; max-height: 220px; overflow-y: auto; background: rgba(0,0,0,0.93); border-top: 1px solid rgba(59,130,246,0.4); font-family: monospace; font-size: 11px; z-index: 9999; padding: 6px 10px; }
  .dl { padding: 2px 0; border-bottom: 1px solid rgba(255,255,255,0.04); word-break: break-all; }
  .ok  { color: #22c55e; }
  .err { color: #ef4444; }
  .inf { color: #8a93a2; }
  .wrn { color: #f59e0b; }
</style>
</head>
<body>
<div id="cesiumContainer"></div>
<div id="error-msg"><strong>Could not load 3D model</strong><span id="error-detail"></span></div>
<div id="debug"></div>
<script>
  function dbg(msg, type) {
    const d = document.getElementById('debug');
    const t = new Date().toTimeString().slice(0,8);
    const line = document.createElement('div');
    line.className = 'dl ' + (type||'inf');
    line.textContent = t + ' ' + msg;
    d.appendChild(line);
    d.scrollTop = d.scrollHeight;
  }

  dbg('cesium-viewer starting', 'ok');

  const params = new URLSearchParams(window.location.search);
  const tilesetUrl = params.get('tileset') ||
    'https://property-intel-tiles.s3.amazonaws.com/captures/tracy-residence-2026-06/b3dm/tileset.json';

  dbg('tileset URL: ' + tilesetUrl, 'inf');
  dbg('Cesium version: ' + Cesium.VERSION, 'inf');

  // Disable ion
  Cesium.Ion.defaultAccessToken = '';
  dbg('Ion token cleared', 'inf');

  let viewer;
  try {
    viewer = new Cesium.Viewer('cesiumContainer', {
      animation:            false,
      baseLayerPicker:      false,
      fullscreenButton:     false,
      geocoder:             false,
      homeButton:           false,
      infoBox:              false,
      sceneModePicker:      false,
      selectionIndicator:   false,
      timeline:             false,
      navigationHelpButton: false,
      skyBox:               false,
      skyAtmosphere:        false,
      imageryProvider:      false,
      baseLayer:            false
    });
    dbg('Viewer created OK', 'ok');
  } catch(e) {
    dbg('Viewer creation FAILED: ' + e.message, 'err');
  }

  try {
    viewer.scene.backgroundColor = Cesium.Color.fromCssColorString('#0a0c0f');
    viewer.scene.globe.show = false;
    viewer.scene.light = new Cesium.SunLight();
    dbg('Scene configured', 'ok');
  } catch(e) {
    dbg('Scene config error: ' + e.message, 'err');
  }

  // Probe tileset.json accessibility before loading
  dbg('Probing tileset.json...', 'inf');
  fetch(tilesetUrl, { method: 'HEAD' })
    .then(r => dbg('Tileset HEAD: HTTP ' + r.status + (r.ok ? ' OK' : ' FAIL'), r.ok ? 'ok' : 'err'))
    .catch(e => dbg('Tileset HEAD error: ' + e.message, 'err'));

  // Load tileset
  let tileset;
  try {
    tileset = new Cesium.Cesium3DTileset({
      url: tilesetUrl,
      maximumScreenSpaceError: 4
    });
    dbg('Cesium3DTileset created', 'ok');
  } catch(e) {
    dbg('Tileset creation FAILED: ' + e.message, 'err');
  }

  viewer.scene.primitives.add(tileset);
  dbg('Tileset added to scene', 'inf');

  const ECEF_CENTER = new Cesium.Cartesian3(-2391595.5, -3921345.0, 4412217.0);

  tileset.readyPromise
    .then(function() {
      dbg('Tileset readyPromise resolved', 'ok');
      const bs = tileset.boundingSphere;
      dbg('BoundingSphere center: ' + bs.center.x.toFixed(1) + ',' + bs.center.y.toFixed(1) + ',' + bs.center.z.toFixed(1), 'inf');
      dbg('BoundingSphere radius: ' + bs.radius.toFixed(1), 'inf');

      const center = (bs && bs.radius > 0) ? bs.center : ECEF_CENTER;
      const radius = (bs && bs.radius > 0) ? bs.radius : 500;

      const carto = Cesium.Ellipsoid.WGS84.cartesianToCartographic(center);
      const lon = Cesium.Math.toDegrees(carto.longitude);
      const lat = Cesium.Math.toDegrees(carto.latitude);
      const alt = carto.height;
      dbg('Cartographic: lon=' + lon.toFixed(5) + ' lat=' + lat.toFixed(5) + ' alt=' + alt.toFixed(1), 'ok');

      viewer.camera.flyTo({
        destination: Cesium.Cartesian3.fromDegrees(lon, lat, alt + radius * 3.5),
        orientation: { heading: 0, pitch: Cesium.Math.toRadians(-45), roll: 0 },
        duration: 1.5
      });
      dbg('Camera flyTo called', 'ok');
    })
    .catch(function(err) {
      dbg('readyPromise FAILED: ' + (err.message || String(err)), 'err');
      document.getElementById('error-detail').textContent = err.message || 'Unknown error';
      document.getElementById('error-msg').classList.add('visible');
    });
</script>
</body>
</html>

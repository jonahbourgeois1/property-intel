<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D Model Viewer</title>
<script src="https://cesium.com/downloads/cesiumjs/releases/1.114/Build/Cesium/Cesium.js"></script>
<link href="https://cesium.com/downloads/cesiumjs/releases/1.114/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; background: #111318; overflow: hidden; }
  #cesiumContainer { width: 100%; height: 100%; }
  #loading { position: fixed; inset: 0; background: #111318; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; z-index: 100; transition: opacity 0.6s ease; }
  #loading.hidden { opacity: 0; pointer-events: none; }
  .spin { width: 32px; height: 32px; border: 2px solid rgba(168,85,247,0.2); border-top-color: #a855f7; border-radius: 50%; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .load-text { font-family: monospace; font-size: 12px; color: #555f6e; }
  #err { display: none; position: fixed; inset: 0; align-items: center; justify-content: center; flex-direction: column; gap: 12px; background: #0a0c0f; color: #8a93a2; font-family: monospace; font-size: 13px; text-align: center; padding: 32px; z-index: 200; }
  #err.visible { display: flex; }
  #err strong { color: #ef4444; }
</style>
</head>
<body>
<div id="cesiumContainer"></div>
<div id="loading"><div class="spin"></div><div class="load-text">Loading 3D model...</div></div>
<div id="err"><strong>Could not load 3D model</strong><span id="err-msg" style="margin-top:8px;font-size:11px;opacity:0.6;"></span></div>
<script>
const params = new URLSearchParams(window.location.search);
const tilesetUrl = params.get('tileset');

Cesium.Ion.defaultAccessToken = '';

const viewer = new Cesium.Viewer('cesiumContainer', {
  animation: false, baseLayerPicker: false, fullscreenButton: false,
  geocoder: false, homeButton: false, infoBox: false,
  sceneModePicker: false, selectionIndicator: false, timeline: false,
  navigationHelpButton: false, skyBox: false, skyAtmosphere: false,
  imageryProvider: false, baseLayer: false
});

viewer.scene.backgroundColor = Cesium.Color.fromCssColorString('#111318');
viewer.scene.globe.show = false;
viewer.scene.highDynamicRange = false;
viewer.scene.light = new Cesium.DirectionalLight({
  direction: Cesium.Cartesian3.normalize(new Cesium.Cartesian3(1.0, 1.0, -1.0), new Cesium.Cartesian3()),
  intensity: 5.0
});

// ── Coordinate math ────────────────────────────────────────────────────
function localToEcef(M, lx, ly, lz) {
  // M is flat column-major 4x4 — extract R and T
  return [
    M[0]*lx + M[4]*ly + M[8]*lz  + M[12],
    M[1]*lx + M[5]*ly + M[9]*lz  + M[13],
    M[2]*lx + M[6]*ly + M[10]*lz + M[14]
  ];
}

function ecefToGeodetic(x, y, z) {
  const a = 6378137.0, e2 = 0.00669437999014;
  const b = a * Math.sqrt(1 - e2);
  const p = Math.sqrt(x*x + y*y);
  const theta = Math.atan2(z * a, p * b);
  let lat = Math.atan2(
    z + (e2/(1-e2)) * b * Math.pow(Math.sin(theta), 3),
    p - e2 * a * Math.pow(Math.cos(theta), 3)
  );
  for (let i = 0; i < 10; i++) {
    const sl = Math.sin(lat);
    const N = a / Math.sqrt(1 - e2 * sl * sl);
    const newLat = Math.atan2(z + e2 * N * sl, p);
    if (Math.abs(newLat - lat) < 1e-12) break;
    lat = newLat;
  }
  const lon = Math.atan2(y, x);
  const sl = Math.sin(lat);
  const N = a / Math.sqrt(1 - e2 * sl * sl);
  const h = p / Math.cos(lat) - N;
  return [lat * 180/Math.PI, lon * 180/Math.PI, h];
}

// ── Load tileset ───────────────────────────────────────────────────────
fetch(tilesetUrl)
  .then(r => r.json())
  .then(function(json) {
    // Extract transform and bounding box from tileset root
    const root = json.root;
    const M = root.transform;
    const box = root.boundingVolume.box;
    // box = [cx, cy, cz,  hx,0,0,  0,hy,0,  0,0,hz]
    const cx = box[0], cy = box[1], cz = box[2];
    const hx = box[3], hy = box[7], hz = box[11];

    // Convert local center to geodetic
    const ecef = localToEcef(M, cx, cy, cz);
    const [lat, lon, terrainAlt] = ecefToGeodetic(...ecef);

    // Camera altitude: high enough to see the full parcel
    // parcelSpan = max half-extent projected to ground
    const span = Math.max(hx, hy);
    // For 60° vertical FOV: altitude = span / tan(30°) = span * 1.73
    // Add terrain alt to get absolute altitude
    const camAlt = terrainAlt + span * 2.0;

    console.log(`Parcel: lat=${lat.toFixed(5)}, lon=${lon.toFixed(5)}, alt=${terrainAlt.toFixed(0)}m`);
    console.log(`Span: ${span.toFixed(0)}m, camera at ${camAlt.toFixed(0)}m ASL`);

    // Set camera BEFORE loading tileset so tiles in view start downloading immediately
    viewer.camera.setView({
      destination: Cesium.Cartesian3.fromDegrees(lon, lat, camAlt),
      orientation: {
        heading: Cesium.Math.toRadians(0),
        pitch: Cesium.Math.toRadians(-90),
        roll: 0
      }
    });

    return Cesium.Cesium3DTileset.fromUrl(tilesetUrl, { maximumScreenSpaceError: 4 });
  })
  .then(function(tileset) {
    viewer.scene.primitives.add(tileset);

    // Wait for first render, then hide loader
    const unsub = viewer.scene.postRender.addEventListener(function() {
      if (tileset.statistics.selected > 0) {
        unsub();
        document.getElementById('loading').classList.add('hidden');
        try { window.parent.postMessage('cesium-ready', '*'); } catch(e) {}
      }
    });

    // Safety fallback
    setTimeout(() => document.getElementById('loading').classList.add('hidden'), 6000);
  })
  .catch(function(err) {
    document.getElementById('loading').classList.add('hidden');
    document.getElementById('err-msg').textContent = err.message || String(err);
    document.getElementById('err').classList.add('visible');
    try { window.parent.postMessage('cesium-error', '*'); } catch(e) {}
  });
</script>
</body>
</html>

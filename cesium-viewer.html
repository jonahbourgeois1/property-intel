<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D Model Viewer</title>
<script src="https://cesium.com/downloads/cesiumjs/releases/1.114/Build/Cesium/Cesium.js"></script>
<link href="https://cesium.com/downloads/cesiumjs/releases/1.114/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; background: #111318; overflow: hidden; }
  #cesiumContainer { width: 100%; height: 100%; }
  #loading { position: fixed; inset: 0; background: #111318; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; z-index: 100; transition: opacity 0.6s ease; }
  #loading.hidden { opacity: 0; pointer-events: none; }
  .spin { width: 32px; height: 32px; border: 2px solid rgba(168,85,247,0.2); border-top-color: #a855f7; border-radius: 50%; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .load-text { font-family: monospace; font-size: 12px; color: #555f6e; }
  #err { display: none; position: fixed; inset: 0; align-items: center; justify-content: center; flex-direction: column; gap: 12px; background: #0a0c0f; color: #8a93a2; font-family: monospace; font-size: 13px; text-align: center; padding: 32px; z-index: 200; }
  #err.visible { display: flex; }
  #err strong { color: #ef4444; }
</style>
</head>
<body>
<div id="cesiumContainer"></div>
<div id="loading"><div class="spin"></div><div class="load-text">Loading 3D model...</div></div>
<div id="err"><strong>Could not load 3D model</strong><span id="err-msg" style="margin-top:8px;font-size:11px;opacity:0.6;"></span></div>
<script>
  const params = new URLSearchParams(window.location.search);
  const tilesetUrl = params.get('tileset') ||
    'https://property-intel-tiles.s3.amazonaws.com/captures/tracy-residence-2026-06/b3dm/tileset.json';

  Cesium.Ion.defaultAccessToken = '';

  const viewer = new Cesium.Viewer('cesiumContainer', {
    animation: false, baseLayerPicker: false, fullscreenButton: false,
    geocoder: false, homeButton: false, infoBox: false,
    sceneModePicker: false, selectionIndicator: false, timeline: false,
    navigationHelpButton: false, skyBox: false, skyAtmosphere: false,
    imageryProvider: false, baseLayer: false
  });

  viewer.scene.backgroundColor = Cesium.Color.fromCssColorString('#111318');
  viewer.scene.globe.show = true;
  viewer.scene.globe.baseColor = Cesium.Color.fromCssColorString('#1a1f27');
  viewer.scene.highDynamicRange = false;
  viewer.scene.light = new Cesium.DirectionalLight({
    direction: Cesium.Cartesian3.normalize(new Cesium.Cartesian3(1.0, 1.0, -1.0), new Cesium.Cartesian3()),
    intensity: 5.0
  });

  Cesium.Cesium3DTileset.fromUrl(tilesetUrl, {
    maximumScreenSpaceError: 2
  }).then(function(tileset) {
    viewer.scene.primitives.add(tileset);

    const bs = tileset.boundingSphere;
    const carto = Cesium.Ellipsoid.WGS84.cartesianToCartographic(bs.center);
    const lon = Cesium.Math.toDegrees(carto.longitude);
    const lat = Cesium.Math.toDegrees(carto.latitude);
    const alt = carto.height;

    // Use a fixed altitude that works for both single parcels and full captures
    // radius * 4 with a minimum of 400m so small parcels don't clip
    const radius = bs.radius > 0 ? bs.radius : 200;
    const camAlt = alt + Math.max(radius * 4.0, 400);

    // Nadir (straight down) — only view confirmed working with DJI Terra B3DM
    viewer.camera.setView({
      destination: Cesium.Cartesian3.fromDegrees(lon, lat, camAlt),
      orientation: { heading: 0, pitch: Cesium.Math.toRadians(-90), roll: 0 }
    });

    // Clamp zoom so camera never goes below the tileset surface
    viewer.scene.screenSpaceCameraController.minimumZoomDistance = 50;
    viewer.scene.screenSpaceCameraController.maximumZoomDistance = camAlt * 3;

    // Hide loading once tiles are actually selected for rendering
    let revealed = false;
    const unsub = viewer.scene.postRender.addEventListener(function() {
      if (!revealed && tileset.statistics.selected > 0) {
        revealed = true;
        unsub();
        document.getElementById('loading').classList.add('hidden');
        // Notify parent frame that model is ready
        try { window.parent.postMessage('cesium-ready', '*'); } catch(e) {}
      }
    });

  }).catch(function(err) {
    document.getElementById('loading').classList.add('hidden');
    document.getElementById('err-msg').textContent = err.message || String(err);
    document.getElementById('err').classList.add('visible');
    try { window.parent.postMessage('cesium-error', '*'); } catch(e) {}
  });
</script>
</body>
</html>

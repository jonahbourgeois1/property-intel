<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Property Intel — Your property</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="nadir-geo.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0a0c0f; --surface: #12161b; --surface2: #1a1f27;
    --border: rgba(255,255,255,0.08); --border2: rgba(255,255,255,0.14);
    --text: #f0f2f5; --text2: #8a93a2; --text3: #555f6e;
    --accent: #3b82f6;
  }
  html, body { height: 100%; }
  body {
    font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text);
    height: 100dvh; overflow: hidden; display: flex; flex-direction: column;
  }
  #header {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 10px 16px; min-height: 52px; background: var(--surface);
    border-bottom: 1px solid var(--border); flex-shrink: 0; z-index: 100;
  }
  #address-label {
    font-size: 14px; font-weight: 500; line-height: 1.35;
    min-width: 0;
  }
  #header-meta { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
  #lot-status, #version-badge {
    font-size: 11px; font-family: 'DM Mono', monospace; color: var(--text2);
    background: var(--surface2); border: 1px solid var(--border);
    padding: 4px 8px; border-radius: 4px; white-space: nowrap;
  }
  #version-badge { color: var(--text3); }
  #main { flex: 1; min-height: 0; position: relative; }
  #map { position: absolute; inset: 0; background: var(--bg); }
  #loading, #error {
    position: absolute; inset: 0; background: var(--bg);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 12px; z-index: 500; padding: 32px; text-align: center;
  }
  #loading.hidden { display: none; }
  #error { display: none; }
  #error.visible { display: flex; }
  .spinner {
    width: 32px; height: 32px; border: 2px solid var(--border2);
    border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading-text { font-size: 13px; color: var(--text3); font-family: 'DM Mono', monospace; }
  .error-title { font-size: 16px; font-weight: 600; }
  .error-msg { font-size: 13px; color: var(--text3); max-width: 320px; line-height: 1.5; }
  #parcel-toggle {
    display: none; position: absolute; left: 16px; bottom: 16px; z-index: 10;
    min-width: 44px; min-height: 44px; padding: 0 12px;
    border: 1px solid #cd3333; background: #3a1818; color: #f0a8a8;
    border-radius: 8px; font-family: 'DM Mono', monospace; font-size: 12px; font-weight: 700;
    letter-spacing: 0.04em; cursor: pointer;
    box-shadow: 0 2px 8px rgba(0,0,0,0.4);
  }
  #parcel-toggle.off { border-color: #3a444f; background: #232a33; color: #eef2f6; }
</style>
</head>
<body>
<header id="header">
  <div id="address-label"></div>
  <div id="header-meta">
    <span id="lot-status" hidden></span>
    <span id="version-badge"></span>
  </div>
</header>
<div id="main">
  <div id="map"></div>
  <div id="loading">
    <div class="spinner"></div>
    <div id="loading-text" class="loading-text">Locating property…</div>
  </div>
  <div id="error">
    <div id="error-title" class="error-title"></div>
    <div id="error-msg" class="error-msg"></div>
  </div>
  <button id="parcel-toggle" type="button" onclick="toggleParcel()">Lot</button>
</div>
<script>
const VERSION = 'v0.1.0';
// Same public browser key viewer.html loads in its Maps script tag.
// The JS geocoder uses this key. Do not swap in config.js GEOCODE_KEY:
// that value is for the REST geocode call viewer.html makes only when a
// record has no lat/lng, and a different key never finishes the geocoder.
const MAPS_KEY = 'AIzaSyD2tWrnRhCaicAwtp_32xe5zG5YGuntfuI';
// Lot sources match viewer.html v2.10.20. GitHub tiles first, then the
// county shards on CloudFront. Geometry match is NadirGeo.parcelMatch.
const PARCEL_BASE = 'https://raw.githubusercontent.com/jonahbourgeois1/property-intel/main/data/parcels/';
const PARCEL_CDN = 'https://d3fg47bqswi0rr.cloudfront.net/';
const PARCEL_COUNTIES = [
  { name: 'deschutes', lat0: 43.61, lng0: -122.01, step: 0.07 },
  { name: 'lane',      lat0: 43.40, lng0: -124.20, step: 0.07 },
  { name: 'josephine', lat0: 41.90, lng0: -124.20, step: 0.07 }
];
const PARCEL_CDN_COUNTIES = ['josephine', 'linn', 'douglas', 'lane', 'deschutes'];

const _qs = new URLSearchParams(window.location.search);
const ADDRESS = (_qs.get('addr') || '').trim();

let map = null;
let parcelPoly = null;
let parcelShown = true;

document.getElementById('version-badge').textContent = VERSION;
document.getElementById('address-label').textContent = ADDRESS;

function showError(title, msg) {
  const loading = document.getElementById('loading');
  loading.classList.add('hidden');
  document.getElementById('error-title').textContent = title;
  document.getElementById('error-msg').textContent = msg;
  document.getElementById('error').classList.add('visible');
}

function setLoading(text) {
  document.getElementById('loading-text').textContent = text;
}

function parcelFileFor(lat, lng, county) {
  const latCell = Math.floor((lat - county.lat0) / county.step) * county.step + county.lat0;
  const lngCell = Math.floor((lng - county.lng0) / county.step) * county.step + county.lng0;
  return county.name + '_' + latCell.toFixed(2) + '_' + lngCell.toFixed(2) + '.geojson';
}

function boundsHold_(b, lat, lng) {
  return !!b && lat >= b.south && lat <= b.north && lng >= b.west && lng <= b.east;
}

function lotLabel(props) {
  props = props || {};
  return String(props.MAPTAXLOT || props.TAXLOT || props.MapNum || props.PIN || props.PROP_ID || '');
}

// Same area rule as viewer.html: MAPACRES when the county published it,
// otherwise the outer-ring shoelace. Used only to pick among CDN shards.
function featArea(feat) {
  const acres = Number((feat.properties || {}).MAPACRES);
  if (isFinite(acres) && acres > 0) return acres;
  const g = feat.geometry;
  const polys = !g ? [] : g.type === 'Polygon' ? [g.coordinates]
              : g.type === 'MultiPolygon' ? g.coordinates : [];
  let sum = 0;
  for (let i = 0; i < polys.length; i++) {
    const ring = polys[i] && polys[i][0];
    if (!ring) continue;
    let a = 0;
    for (let j = 0, k = ring.length - 1; j < ring.length; k = j++) {
      a += ring[k][0] * ring[j][1] - ring[j][0] * ring[k][1];
    }
    sum += Math.abs(a) / 2;
  }
  return sum;
}

async function parcelFromTiles(lat, lng) {
  const files = PARCEL_COUNTIES.map(function (c) { return parcelFileFor(lat, lng, c); });
  for (let i = 0; i < files.length; i++) {
    try {
      const r = await fetch(PARCEL_BASE + files[i]);
      if (!r.ok) continue;
      const matched = NadirGeo.parcelMatch(await r.json(), lat, lng);
      if (matched) return matched;
    } catch (e) { /* next tile */ }
  }
  return null;
}

async function parcelFromCdn(lat, lng) {
  for (let c = 0; c < PARCEL_CDN_COUNTIES.length; c++) {
    const county = PARCEL_CDN_COUNTIES[c];
    try {
      const ir = await fetch(PARCEL_CDN + 'reference/parcels/' + county + '/index.json');
      if (!ir.ok) continue;
      const index = await ir.json();
      if (!boundsHold_(index.bounds, lat, lng)) continue;
      const shards = (index.shards || []).filter(function (s) { return boundsHold_(s.bounds, lat, lng); });
      let best = null;
      let bestArea = Infinity;
      for (let i = 0; i < shards.length; i++) {
        const sr = await fetch(PARCEL_CDN + shards[i].key);
        if (!sr.ok) continue;
        const m = NadirGeo.parcelMatch(await sr.json(), lat, lng);
        if (!m) continue;
        const area = featArea(m);
        if (area < bestArea) { best = m; bestArea = area; }
      }
      if (best) return best;
    } catch (e) { /* next county */ }
  }
  return null;
}

function drawParcel(feat) {
  const g = feat && feat.geometry;
  const polys = !g ? [] : g.type === 'Polygon' ? [g.coordinates]
              : g.type === 'MultiPolygon' ? g.coordinates : [];
  const paths = polys.map(function (poly) {
    return (poly[0] || []).map(function (pt) { return { lat: pt[1], lng: pt[0] }; });
  }).filter(function (ring) { return ring.length >= 3; });
  if (!paths.length || !map) return;
  parcelPoly = new google.maps.Polygon({
    paths: paths,
    strokeColor: '#cd3333',
    strokeOpacity: 1,
    strokeWeight: 4,
    fillOpacity: 0,
    map: map,
    clickable: false
  });
  const btn = document.getElementById('parcel-toggle');
  btn.style.display = 'block';
  const label = lotLabel(feat.properties);
  const status = document.getElementById('lot-status');
  if (label) {
    status.hidden = false;
    status.textContent = label;
  }
}

window.toggleParcel = function () {
  if (!parcelPoly || !map) return;
  parcelShown = !parcelShown;
  parcelPoly.setMap(parcelShown ? map : null);
  document.getElementById('parcel-toggle').classList.toggle('off', !parcelShown);
};

function openMap(lat, lng) {
  map = new google.maps.Map(document.getElementById('map'), {
    center: { lat: lat, lng: lng },
    zoom: 18,
    mapTypeId: google.maps.MapTypeId.SATELLITE,
    tilt: 0,
    rotateControl: false,
    maxZoom: 21,
    mapTypeControl: true,
    mapTypeControlOptions: {
      style: google.maps.MapTypeControlStyle.DROPDOWN_MENU,
      mapTypeIds: ['satellite', 'hybrid', 'roadmap'],
      position: google.maps.ControlPosition.TOP_LEFT
    },
    zoomControl: true,
    zoomControlOptions: { position: google.maps.ControlPosition.LEFT_CENTER },
    streetViewControl: false,
    fullscreenControl: true,
    fullscreenControlOptions: { position: google.maps.ControlPosition.LEFT_TOP },
    gestureHandling: 'greedy',
    scrollwheel: true
  });
  map.setTilt(0);
  new google.maps.Marker({
    position: { lat: lat, lng: lng },
    map: map,
    clickable: false,
    icon: {
      path: google.maps.SymbolPath.CIRCLE,
      scale: 5,
      fillColor: '#fff',
      fillOpacity: 0.9,
      strokeColor: '#3b82f6',
      strokeWeight: 2
    },
    zIndex: 1
  });
  document.getElementById('loading').classList.add('hidden');
  drawParcelBoundary(lat, lng);
}

async function drawParcelBoundary(lat, lng) {
  try {
    const matched = (await parcelFromTiles(lat, lng)) || (await parcelFromCdn(lat, lng));
    if (matched) drawParcel(matched);
  } catch (e) { /* map stays on the address */ }
}

function geocodeAddress(address) {
  return new Promise(function (resolve, reject) {
    const geocoder = new google.maps.Geocoder();
    geocoder.geocode({ address: address }, function (results, status) {
      if (status === 'OK' && results && results[0]) {
        const loc = results[0].geometry.location;
        resolve({ lat: loc.lat(), lng: loc.lng() });
      } else {
        reject(new Error(String(status || 'FAILED')));
      }
    });
  });
}

window.initGoogleMaps = function () {
  if (!ADDRESS) return;
  if (typeof NadirGeo === 'undefined' || typeof NadirGeo.parcelMatch !== 'function') {
    showError('Map geometry missing', 'nadir-geo.js did not load.');
    return;
  }
  setLoading('Locating property…');
  geocodeAddress(ADDRESS).then(function (loc) {
    openMap(loc.lat, loc.lng);
  }).catch(function (e) {
    showError('Could not locate that address', e.message);
  });
};

if (!ADDRESS) {
  showError('No address', 'Open this page with ?addr= set to the property address.');
} else {
  const s = document.createElement('script');
  s.src = 'https://maps.googleapis.com/maps/api/js?key=' + encodeURIComponent(MAPS_KEY) + '&callback=initGoogleMaps';
  s.async = true;
  s.defer = true;
  document.body.appendChild(s);
}
</script>
</body>
</html>

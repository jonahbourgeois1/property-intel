<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>Lane 1 review</title>
<style>
body { font: 16px/1.45 Georgia, serif; margin: 0; color: #1c1915; background: #faf8f4; }
#lock { max-width: 32rem; margin: 4rem auto; padding: 0 1rem; }
#lock label { display: block; margin-bottom: 0.8rem; }
#lock input { font: inherit; width: 100%; box-sizing: border-box; padding: 0.4rem 0.5rem; }
#lock button { font: inherit; }
#error { min-height: 1.2em; }
.app { display: flex; min-height: 100vh; align-items: stretch; }
.sidebar { width: 320px; flex: 0 0 320px; box-sizing: border-box; padding: 1rem; border-right: 1px solid #e4ddd0; background: #fff; overflow: auto; }
.main { flex: 1; min-width: 0; padding: 1.25rem 1.5rem 3rem; overflow: auto; }
.property-pack { max-width: 960px; }
h1 { font-size: 1.4rem; margin: 0 0 0.8rem; }
h2 { margin-top: 2.2rem; border-top: 1px solid #d9d2c5; padding-top: 1rem; }
code, pre { font-family: ui-monospace, monospace; font-size: 0.85rem; }
pre { white-space: pre-wrap; background: #fff; padding: 0.8rem; border: 1px solid #e4ddd0; }
table { border-collapse: collapse; width: 100%; background: #fff; }
th, td { border: 1px solid #e4ddd0; padding: 0.35rem 0.5rem; text-align: left; vertical-align: top; }
.banner { padding: 0.6rem 0.8rem; background: #fff; border-left: 4px solid #888; }
.banner.approved { border-color: #1d7a46; }
.banner.changes_requested { border-color: #a33b20; }
.banner.pending { border-color: #b58105; }
.cmd code { display: block; background: #fff; padding: 0.5rem; }
.cards { display: flex; flex-wrap: wrap; gap: 1rem; }
.card { width: 280px; background: #fff; padding: 0.5rem; border: 1px solid #e4ddd0; }
.card img { max-width: 100%; height: auto; }
dt { font-weight: bold; margin-top: 0.6rem; }
dd { margin-left: 0; }
.filters, .toolbar { display: flex; gap: 0.4rem; flex-wrap: wrap; align-items: center; }
.filters { margin: 0.6rem 0; }
.filters button, .toolbar button, .property-pick { font: inherit; }
.filters button.on { background: #1c1915; color: #faf8f4; }
#property-search { width: 100%; box-sizing: border-box; font: inherit; padding: 0.35rem 0.5rem; }
#property-list { list-style: none; margin: 0; padding: 0; }
#property-list li { margin: 0 0 0.45rem; }
.property-pick { width: 100%; text-align: left; background: #faf8f4; border: 1px solid #e4ddd0; padding: 0.5rem; }
li.selected .property-pick { outline: 2px solid #1c1915; }
.account { display: block; font-weight: bold; }
.address, .when { display: block; color: #5c564c; font-size: 0.85rem; }
.points { display: flex; flex-wrap: wrap; gap: 0.2rem; margin-top: 0.35rem; }
.chip { display: inline-block; padding: 0.05rem 0.4rem; border-radius: 999px; font-size: 0.75rem; background: #eee; }
.chip.pending { background: #f4e4c4; }
.chip.approved { background: #d9ead3; }
.chip.changes_requested { background: #f4d6d0; }
.chip.needs_clarification { background: #f3d48a; }
.toolbar { margin-bottom: 1rem; }
.decision { margin: 0.4rem 0 1rem; }
.decision-result { min-height: 1.2em; }
.pin-map { max-width: 100%; height: auto; background: #fff; }
fieldset.pin-choice { border: 1px solid #e4ddd0; margin: 0.5rem 0; background: #fff; }
[hidden] { display: none !important; }
</style>
</head>
<body>
<div id="lock">
<h1>Lane 1 review</h1>
<p>This review page is locked. The passphrase stays in this browser. Property data is loaded from CloudFront after it unlocks.</p>
<p><label>Passphrase <input id="passphrase" type="password" autocomplete="current-password"/></label>
<button type="button" id="unlock">Unlock</button></p>
<p id="error"></p>
</div>
<div id="app" class="app" hidden>
<aside class="sidebar">
<h1>Lane 1 review</h1>
<input id="property-search" type="search" placeholder="Search" autocomplete="off"/>
<p class="filters">
  <button type="button" data-filter="all" class="on">All</button>
  <button type="button" data-filter="pending">Pending</button>
  <button type="button" data-filter="changes_requested">Changes requested</button>
  <button type="button" data-filter="needs_clarification">Needs clarification</button>
  <button type="button" data-filter="approved">Approved</button>
</p>
<p id="list-empty" hidden>No properties match.</p>
<ul id="property-list"></ul>
</aside>
<main class="main">
<div class="toolbar">
  <button type="button" id="prev-property">Previous</button>
  <button type="button" id="next-property">Next</button>
  <label>Reviewer <select id="reviewer-name" required>
    <option value="">Choose</option>
    <option>Bot</option>
    <option>Eleanor</option>
    <option>Ross</option>
    <option>Steve</option>
    <option>Jonah</option>
  </select></label>
  <button type="button" id="export-decisions">Export decisions</button>
</div>
<div id="packs"></div>
</main>
</div>
<script>

var REVIEW_DATA_BASE = "https://d1h1on7f1v1lpy.cloudfront.net/review";
function reviewBytes(value) {
  var binary = atob(value);
  var out = new Uint8Array(binary.length);
  for (var i = 0; i < binary.length; i++) out[i] = binary.charCodeAt(i);
  return out;
}
function reviewDataUrl(file) {
  var base = String(REVIEW_DATA_BASE || "").replace(/\/$/, "");
  if (!base) return file;
  return base + "/" + String(file).replace(/^\//, "");
}
function reviewDerive(passphrase, saltB64, iterations) {
  return crypto.subtle.importKey("raw", new TextEncoder().encode(passphrase), "PBKDF2", false, ["deriveKey"])
    .then(function (material) {
      return crypto.subtle.deriveKey(
        {name: "PBKDF2", salt: reviewBytes(saltB64), iterations: iterations, hash: "SHA-256"},
        material,
        {name: "AES-GCM", length: 256},
        false,
        ["decrypt"]
      );
    });
}
function reviewDecrypt(key, ivB64, buffer) {
  return crypto.subtle.decrypt({name: "AES-GCM", iv: reviewBytes(ivB64)}, key, buffer);
}
function reviewInstallImages(key, hub, images) {
  var jobs = (images || []).map(function (image) {
    var chunks = image.chunks || [];
    return Promise.all(chunks.map(function (chunk) {
      return fetch(reviewDataUrl(hub + "/" + chunk.file), {cache: "no-store"}).then(function (response) {
        if (!response.ok) throw new Error("missing image");
        return response.arrayBuffer();
      }).then(function (buffer) {
        return reviewDecrypt(key, chunk.iv, buffer);
      });
    })).then(function (parts) {
      var total = 0;
      parts.forEach(function (part) { total += part.byteLength; });
      var joined = new Uint8Array(total);
      var offset = 0;
      parts.forEach(function (part) {
        joined.set(new Uint8Array(part), offset);
        offset += part.byteLength;
      });
      var url = URL.createObjectURL(new Blob([joined], {type: image.type || "application/octet-stream"}));
      var token = "review-blob:" + hub + ":" + image.id;
      document.querySelectorAll("[src], [href]").forEach(function (node) {
        ["src", "href"].forEach(function (attr) {
          if (node.getAttribute(attr) === token) node.setAttribute(attr, url);
        });
      });
    });
  });
  return Promise.all(jobs);
}
function reviewOpenPackage(passphrase, hub) {
  return fetch(reviewDataUrl(hub + "/package.enc"), {cache: "no-store"}).then(function (response) {
    if (!response.ok) throw new Error("missing package");
    return response.json();
  }).then(function (envelope) {
    return reviewDerive(passphrase, envelope.salt, envelope.iterations).then(function (key) {
      return reviewDecrypt(key, envelope.iv, reviewBytes(envelope.ciphertext)).then(function (plain) {
        return {key: key, hub: hub, data: JSON.parse(new TextDecoder().decode(plain))};
      });
    });
  });
}
function reviewUnlock() {
  var field = document.getElementById("passphrase");
  var error = document.getElementById("error");
  var passphrase = field.value;
  error.textContent = "";
  if (!passphrase) {
    error.textContent = "Enter the passphrase.";
    return;
  }
  fetch("manifest.json", {cache: "no-store"})
    .then(function (response) {
      if (!response.ok) throw new Error("missing package");
      return response.json();
    })
    .then(function (manifest) {
      var hubs = manifest.hubs || [];
      var chain = Promise.resolve();
      hubs.forEach(function (hub) {
        chain = chain.then(function () {
          return reviewOpenPackage(passphrase, hub).then(function (opened) {
            document.getElementById("property-list").insertAdjacentHTML("beforeend", opened.data.list_html || "");
            document.getElementById("packs").insertAdjacentHTML("beforeend", opened.data.packs_html || "");
            return reviewInstallImages(opened.key, hub, opened.data.images || []);
          });
        });
      });
      return chain;
    })
    .then(function () {
      field.value = "";
      document.getElementById("lock").hidden = true;
      document.getElementById("app").hidden = false;
      startReview();
    })
    .catch(function () {
      field.value = "";
      error.textContent = "That passphrase did not unlock this page.";
    });
}
document.getElementById("unlock").addEventListener("click", reviewUnlock);
document.getElementById("passphrase").addEventListener("keydown", function (event) {
  if (event.key === "Enter") reviewUnlock();
});

function startReview() {
  var REVIEWER_KEY = "safe-pipeline-reviewer";
  var DECISIONS_KEY = "safe-pipeline-review-decisions";
  var KIND = "safe-pipeline/review-decisions-v1";
  var filter = "all";

  function readDecisions() {
    try {
      var parsed = JSON.parse(localStorage.getItem(DECISIONS_KEY) || "[]");
      return Array.isArray(parsed) ? parsed : [];
    } catch (err) {
      return [];
    }
  }

  function writeDecisions(rows) {
    localStorage.setItem(DECISIONS_KEY, JSON.stringify(rows));
  }

  var REVIEWERS = ["Bot", "Eleanor", "Ross", "Steve", "Jonah"];
  var nameInput = document.getElementById("reviewer-name");
  if (nameInput) {
    var savedName = localStorage.getItem(REVIEWER_KEY) || "";
    if (REVIEWERS.indexOf(savedName) !== -1) nameInput.value = savedName;
    nameInput.addEventListener("change", function () {
      var chosen = nameInput.value.trim();
      if (REVIEWERS.indexOf(chosen) !== -1) localStorage.setItem(REVIEWER_KEY, chosen);
    });
  }

  var exportButton = document.getElementById("export-decisions");
  if (exportButton) {
    exportButton.addEventListener("click", function () {
      var payload = {kind: KIND, decisions: readDecisions()};
      var blob = new Blob([JSON.stringify(payload, null, 2)], {type: "application/json"});
      var link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = "review-decisions.json";
      link.click();
    });
  }

  var items = Array.prototype.slice.call(document.querySelectorAll("#property-list [data-slug]"));
  var search = document.getElementById("property-search");

  function visibleItems() {
    var query = search ? search.value.trim().toLowerCase() : "";
    return items.filter(function (item) {
      var status = item.getAttribute("data-status");
      if (filter !== "all" && status !== filter) return false;
      if (!query) return true;
      return (item.getAttribute("data-search") || "").indexOf(query) !== -1;
    });
  }

  function selectedSlug() {
    var current = document.querySelector(".property-pack:not([hidden])");
    return current ? current.getAttribute("data-slug") : "";
  }

  function show(slug) {
    var known = false;
    document.querySelectorAll(".property-pack").forEach(function (pack) {
      var on = pack.getAttribute("data-slug") === slug;
      pack.hidden = !on;
      if (on) known = true;
    });
    if (!known) return;
    items.forEach(function (item) {
      item.classList.toggle("selected", item.getAttribute("data-slug") === slug);
    });
    var visible = visibleItems();
    var index = -1;
    visible.forEach(function (item, i) {
      if (item.getAttribute("data-slug") === slug) index = i;
    });
    var prev = document.getElementById("prev-property");
    var next = document.getElementById("next-property");
    if (prev) prev.disabled = index <= 0;
    if (next) next.disabled = index === -1 || index >= visible.length - 1;
    if (window.history && window.history.replaceState) {
      window.history.replaceState(null, "", "#" + slug);
    }
  }

  function paintList() {
    var visible = visibleItems();
    items.forEach(function (item) {
      item.hidden = visible.indexOf(item) === -1;
    });
    var slug = selectedSlug();
    var stillVisible = visible.some(function (item) {
      return item.getAttribute("data-slug") === slug;
    });
    if (!stillVisible && visible.length) show(visible[0].getAttribute("data-slug"));
    else if (slug) show(slug);
    var empty = document.getElementById("list-empty");
    if (empty) empty.hidden = visible.length !== 0;
  }

  document.querySelectorAll(".filters [data-filter]").forEach(function (button) {
    button.addEventListener("click", function () {
      filter = button.getAttribute("data-filter") || "all";
      document.querySelectorAll(".filters [data-filter]").forEach(function (other) {
        other.classList.toggle("on", other === button);
      });
      paintList();
    });
  });

  if (search) search.addEventListener("input", paintList);

  items.forEach(function (item) {
    var button = item.querySelector("button");
    if (!button) return;
    button.addEventListener("click", function () {
      show(item.getAttribute("data-slug"));
    });
  });

  function move(delta) {
    var visible = visibleItems();
    var slug = selectedSlug();
    var index = -1;
    visible.forEach(function (item, i) {
      if (item.getAttribute("data-slug") === slug) index = i;
    });
    var target = visible[index + delta];
    if (target) show(target.getAttribute("data-slug"));
  }

  var prevButton = document.getElementById("prev-property");
  var nextButton = document.getElementById("next-property");
  if (prevButton) prevButton.addEventListener("click", function () { move(-1); });
  if (nextButton) nextButton.addEventListener("click", function () { move(1); });

  function collectPins(form) {
    var boxes = form.querySelectorAll("[data-pin-id]");
    if (!boxes.length) return null;
    var pins = [];
    for (var i = 0; i < boxes.length; i++) {
      var box = boxes[i];
      var checked = box.querySelector('input[type="radio"]:checked');
      if (!checked) return {error: "Choose approve, move, reject, or needs clarification for each pin."};
      var action = checked.value;
      var row = {id: box.getAttribute("data-pin-id"), action: action, status: action};
      if (action === "move") {
        var lat = box.querySelector("[name=lat]");
        var lng = box.querySelector("[name=lng]");
        var heading = box.querySelector("[name=heading]");
        var latText = lat ? lat.value.trim() : "";
        var lngText = lng ? lng.value.trim() : "";
        var headingText = heading ? heading.value.trim() : "";
        if (!latText || !lngText || !headingText) {
          return {error: "A moved pin needs lat, lng, and heading."};
        }
        row.lat = Number(latText);
        row.lng = Number(lngText);
        row.heading_deg = Number(headingText);
        row.heading = row.heading_deg;
        if (!isFinite(row.lat) || !isFinite(row.lng) || !isFinite(row.heading_deg)) {
          return {error: "A moved pin needs lat, lng, and heading."};
        }
      }
      if (action === "reject" || action === "needs_clarification") {
        var pinNote = box.querySelector("[name=pin-note]");
        row.note = pinNote ? pinNote.value.trim() : "";
        if (action === "needs_clarification" && !row.note) {
          return {error: "Needs clarification needs a note."};
        }
      }
      pins.push(row);
    }
    return {pins: pins};
  }

  document.querySelectorAll("form.decision button[data-status]").forEach(function (button) {
    button.addEventListener("click", function () {
      var form = button.closest("form");
      var result = form.querySelector(".decision-result");
      var reviewer = nameInput ? nameInput.value.trim() : "";
      var noteInput = form.querySelector("[name=note]");
      var note = noteInput ? noteInput.value.trim() : "";
      var status = button.getAttribute("data-status");
      if (REVIEWERS.indexOf(reviewer) === -1) {
        result.textContent = "Choose a reviewer. The choice is saved in this browser.";
        if (nameInput) nameInput.focus();
        return;
      }
      if (status === "changes_requested" && !note) {
        result.textContent = "Request changes needs a note.";
        return;
      }
      if (status === "needs_clarification" && !note) {
        result.textContent = "Needs clarification needs a note.";
        return;
      }
      var collected = collectPins(form);
      if (collected && collected.error) {
        result.textContent = collected.error;
        return;
      }
      var body = {
        slug: form.getAttribute("data-slug"),
        point: form.getAttribute("data-point"),
        status: status,
        reviewer: reviewer,
        note: note,
        hash: form.getAttribute("data-hash")
      };
      var record = {
        safe: form.getAttribute("data-safe"),
        slug: body.slug,
        point: body.point,
        point_id: body.point,
        status: status,
        reviewer: reviewer,
        note: note,
        hash: body.hash,
        section_hash: body.hash,
        timestamp: new Date().toISOString()
      };
      if (collected && collected.pins) {
        body.pins = collected.pins;
        record.pins = collected.pins;
      }
      if (window.history && window.history.replaceState) {
        window.history.replaceState(null, "", "#" + body.slug);
      }
      fetch("/api/review-approve", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify(body)
      }).then(function (response) {
        if (response.ok) {
          window.location.reload();
          return;
        }
        response.json().then(function (payload) {
          var message = (payload && payload.error) || (response.status === 409 ? "section hash does not match" : "not applied");
          result.textContent = message;
          if (response.status !== 400 && response.status !== 409) keepLocal(record, result);
        }).catch(function () {
          if (response.status === 409) result.textContent = "section hash does not match";
          else if (response.status !== 400) keepLocal(record, result);
          else result.textContent = "not applied";
        });
      }).catch(function () {
        keepLocal(record, result);
      });
    });
  });

  function keepLocal(record, result) {
    var rows = readDecisions().filter(function (row) {
      return !(row.slug === record.slug && row.point === record.point);
    });
    rows.push(record);
    writeDecisions(rows);
    result.textContent = "Saved in this browser. Export decisions to apply them.";
  }

  function mercLat(bounds, t) {
    var max = 85.05112878;
    function yOf(lat) {
      var clamped = Math.max(Math.min(lat, max), -max);
      var rad = clamped * Math.PI / 180;
      return Math.log(Math.tan(Math.PI / 4 + rad / 2));
    }
    var target = yOf(bounds.n) + t * (yOf(bounds.s) - yOf(bounds.n));
    return Math.atan(Math.sinh(target)) * 180 / Math.PI;
  }

  function installReviewMedia() {
    document.querySelectorAll("a.frame").forEach(function (link) {
      link.addEventListener("click", function (event) {
        event.preventDefault();
        var existing = document.getElementById("lightbox");
        if (existing) existing.remove();
        var box = document.createElement("div");
        box.id = "lightbox";
        box.style.cssText = "position:fixed;inset:0;background:rgba(0,0,0,.82);display:flex;align-items:center;justify-content:center;z-index:9";
        var img = document.createElement("img");
        img.alt = "";
        img.style.maxWidth = "92vw";
        img.style.maxHeight = "92vh";
        img.src = link.getAttribute("href");
        box.appendChild(img);
        box.addEventListener("click", function () { box.remove(); });
        document.body.appendChild(box);
      });
    });
    document.querySelectorAll(".pin-marker").forEach(function (marker) {
      marker.addEventListener("pointerdown", function (event) {
        event.preventDefault();
        var stage = marker.closest(".nadir-stage");
        if (!stage) return;
        var img = stage.querySelector("img");
        if (!img) return;
        var bounds = {
          n: Number(stage.getAttribute("data-n")),
          s: Number(stage.getAttribute("data-s")),
          e: Number(stage.getAttribute("data-e")),
          w: Number(stage.getAttribute("data-w"))
        };
        function place(clientX, clientY) {
          var rect = img.getBoundingClientRect();
          var x = (clientX - rect.left) / rect.width;
          var y = (clientY - rect.top) / rect.height;
          x = Math.max(0, Math.min(1, x));
          y = Math.max(0, Math.min(1, y));
          var lng = bounds.w + x * (bounds.e - bounds.w);
          var lat = mercLat(bounds, y);
          marker.style.left = (x * 100) + "%";
          marker.style.top = (y * 100) + "%";
          var pinId = marker.getAttribute("data-pin-id");
          var form = stage.closest("form") || document;
          var choice = form.querySelector('[data-pin-id="' + pinId + '"]');
          if (!choice) return;
          var latInput = choice.querySelector("[name=lat]");
          var lngInput = choice.querySelector("[name=lng]");
          var move = choice.querySelector('input[type="radio"][value="move"]');
          if (latInput) latInput.value = lat.toFixed(6);
          if (lngInput) lngInput.value = lng.toFixed(6);
          if (move) move.checked = true;
        }
        function onMove(ev) { place(ev.clientX, ev.clientY); }
        function onUp() {
          window.removeEventListener("pointermove", onMove);
          window.removeEventListener("pointerup", onUp);
        }
        window.addEventListener("pointermove", onMove);
        window.addEventListener("pointerup", onUp);
        place(event.clientX, event.clientY);
      });
    });
  }

  paintList();
  var initial = (window.location.hash || "").replace(/^#/, "");
  var known = items.some(function (item) { return item.getAttribute("data-slug") === initial; });
  if (known) show(initial);
  installReviewMedia();
}

</script>
</body>
</html>

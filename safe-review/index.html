<div class="lockscreen" id="lock"><div class="lbox"><div class="logo">S</div><h1>SAFE lane 1 review</h1>
<p class="muted small">This page is encrypted. Enter the review passphrase to unlock it.</p>
<form id="f" autocomplete="off"><input type="password" id="pw" placeholder="Review passphrase" autocomplete="current-password" autofocus><button id="go" type="submit">Unlock</button></form>
<p id="err" role="alert"></p><p class="muted small" style="margin-top:12px">&#128274; Decrypted in your browser with AES-GCM; the passphrase is never sent anywhere.</p></div></div>
<script>
function safeApp(META){
const REVIEWERS=META.reviewers;
const LS_REV='safe-review.reviewer', LS_STATE='safe-review.state.v2';
const LABEL={pending:'Pending',approved:'Approved',changes:'Changes requested',clarify:'Needs clarification'};
const ACT={approve:'approved',changes:'changes',clarify:'clarify'};
const PST={approve:'approved',move:'move',reject:'rejected',clarify:'clarify'};
const PLABEL={approve:'approved',move:'moved',reject:'rejected',clarify:'needs clarification'};
const HUB={}, SITE={}; META.pkgs.forEach(p=>{HUB[p.slug]=p.hub; SITE[p.slug]=p.site_no;});
const props=[...document.querySelectorAll('.pp')].map(e=>e.dataset.pp);
const st={decisions:{},pins:{},qchecks:{}};
const sel=document.getElementById('reviewer');
let placing=null;
function rev(){return sel.value||'';}
function now(){return new Date().toISOString();}
function toast(msg){let t=document.getElementById('toast'); if(!t){t=document.createElement('div');t.id='toast';document.body.appendChild(t);} t.textContent=msg; t.className='show'; clearTimeout(t._h); t._h=setTimeout(()=>t.className='',3200);}
function needRev(){ if(rev()) return true; sel.classList.add('need'); sel.focus(); toast('Choose who is reviewing (top right) before making a decision.'); return false; }
try{const r=localStorage.getItem(LS_REV); if(r&&REVIEWERS.includes(r)) sel.value=r;}catch(e){}
function revUI(){document.body.classList.toggle('norev',!rev()); sel.classList.toggle('need',!rev());}
sel.addEventListener('change',()=>{try{localStorage.setItem(LS_REV,rev());}catch(e){} revUI(); toast(rev()?('Reviewing as '+rev()):'No reviewer chosen');});
function save(){try{localStorage.setItem(LS_STATE,JSON.stringify({build:META.build,...st}));}catch(e){}}
function pick(slug,anchor){
  document.querySelectorAll('.pp').forEach(p=>p.classList.toggle('on',p.dataset.pp===slug));
  document.querySelectorAll('.prop').forEach(p=>p.classList.toggle('sel',p.dataset.slug===slug));
  if(anchor){const el=document.getElementById(anchor); if(el) el.scrollIntoView();} else window.scrollTo(0,0);
}
function route(){const h=decodeURIComponent(location.hash.slice(1))||props[0]; const i=h.indexOf('--'); const slug=i>0?h.slice(0,i):h; pick(props.includes(slug)?slug:props[0], i>0?h:null);}
window.addEventListener('hashchange',route);
function cardKey(card){return card.closest('.pp').dataset.pp+'|'+card.dataset.rid;}
function paintCard(card,status){
  const s=card.querySelector('.ch .status'); card.classList.remove('approved','changes','clarify');
  s.className='status '+status; s.textContent=LABEL[status];
  if(status!=='pending') card.classList.add(status);
  card.querySelectorAll('[data-act]').forEach(b=>b.classList.toggle('on',ACT[b.dataset.act]===status));
  const who=card.querySelector('.who'); const d=st.decisions[cardKey(card)];
  who.textContent=(d&&status!=='pending')?(LABEL[status]+' by '+d.reviewer+' · '+new Date(d.decided_at).toLocaleString()):'';
}
function setCard(card,status){
  const slug=card.closest('.pp').dataset.pp, rid=card.dataset.rid, note=card.querySelector(':scope > .cf textarea').value.trim();
  if(status==='pending'){delete st.decisions[cardKey(card)];}
  else st.decisions[cardKey(card)]={slug,point:rid,status,note,reviewer:rev(),decided_at:now(),hash:card.dataset.hash};
  paintCard(card,status); tally(); save();
}
// ---- pin geometry (web-mercator inverse of the stitched pin image)
function svgOf(tr){return tr.closest('.pp').querySelector('svg.pinsvg');}
function px2ll(svg,x,y){const g=JSON.parse(svg.dataset.geo), n=256*Math.pow(2,g.z); const wx=x/g.s+g.ox, wy=y/g.s+g.oy;
  return [Math.atan(Math.sinh(Math.PI*(1-2*wy/n)))*180/Math.PI, wx/n*360-180];}
function ll2px(svg,lat,lng){const g=JSON.parse(svg.dataset.geo), n=256*Math.pow(2,g.z); const wx=(lng+180)/360*n;
  const wy=(1-Math.log(Math.tan(lat*Math.PI/180)+1/Math.cos(lat*Math.PI/180))/Math.PI)/2*n; return [(wx-g.ox)*g.s,(wy-g.oy)*g.s];}
function drawMoved(tr){
  const svg=svgOf(tr); if(!svg) return; const id='mv-'+tr.dataset.row.replace(/[^A-Za-z0-9]/g,'_');
  let g=svg.querySelector('#'+id); const d=st.pins[tr.closest('.pp').dataset.pp+'|'+tr.dataset.row];
  if(!d||d.action!=='move'||d.lat==null){ if(g) g.remove(); return; }
  if(!g){g=document.createElementNS('http://www.w3.org/2000/svg','g'); g.id=id; g.setAttribute('class','mvpin'); svg.appendChild(g);}
  const [x,y]=ll2px(svg,d.lat,d.lng), r=JSON.parse(svg.dataset.geo).r||60, hd=d.heading;
  let w=''; if(hd!=null&&!isNaN(hd)){const a0=(hd-35)*Math.PI/180,a1=(hd+35)*Math.PI/180; w=`<path d="M${x},${y} L${x+r*Math.sin(a0)},${y-r*Math.cos(a0)} A${r},${r} 0 0 1 ${x+r*Math.sin(a1)},${y-r*Math.cos(a1)} Z"/>`;}
  const lab=(tr.querySelector('.num')||{}).textContent||'';
  g.innerHTML=w+`<circle cx="${x}" cy="${y}" r="22"/><text x="${x}" y="${y+8}">${lab}</text>`;
}
function paintPin(tr,a){
  tr.classList.remove('p-approve','p-move','p-reject','p-clarify','placing'); if(a) tr.classList.add('p-'+a);
  tr.querySelectorAll('[data-pa]').forEach(x=>x.classList.toggle('on',x.dataset.pa===a));
  const k=tr.closest('.pp').dataset.pp+'|'+tr.dataset.row, d=st.pins[k];
  const mv=tr.querySelector('.mv'); if(mv){ mv.hidden=!(a==='move'||placing===tr); const pll=mv.querySelector('.pll');
    pll.textContent=(d&&d.lat!=null)?(d.lat.toFixed(6)+', '+d.lng.toFixed(6)):'click the image to set it'; }
  tr.querySelector('.pstate').textContent=a?(PLABEL[a]+' · '+d.reviewer):(tr.dataset.placed==='1'?'pending':'needs placement');
  drawMoved(tr);
}
function startPlacing(tr){
  if(placing&&placing!==tr){const p=placing; placing=null; p.classList.remove('placing'); paintPin(p,(st.pins[p.closest('.pp').dataset.pp+'|'+p.dataset.row]||{}).action||null);}
  placing=tr; tr.classList.add('placing'); const mv=tr.querySelector('.mv'); if(mv) mv.hidden=false;
  const svg=svgOf(tr); if(!svg){toast('No pin image to place on for this property.'); return;}
  svg.classList.add('placing'); toast('Click the image where this camera actually is, then set its heading.');
}
document.addEventListener('click',e=>{
  const svg=e.target.closest('svg.pinsvg');
  if(svg&&placing&&svgOf(placing)===svg){
    const pt=svg.createSVGPoint(); pt.x=e.clientX; pt.y=e.clientY; const p=pt.matrixTransform(svg.getScreenCTM().inverse());
    const [lat,lng]=px2ll(svg,p.x,p.y); const tr=placing, slug=tr.closest('.pp').dataset.pp, k=slug+'|'+tr.dataset.row;
    const hd=parseFloat(tr.querySelector('.phd').value);
    st.pins[k]={slug,point:'R5',camera:tr.dataset.row.startsWith('pin:')?null:tr.dataset.row,pin_id:tr.dataset.pin||null,action:'move',note:tr.querySelector('.pnote').value.trim(),
      reviewer:rev(),decided_at:now(),hash:tr.closest('.card').dataset.hash,lat:+lat.toFixed(7),lng:+lng.toFixed(7),heading:isNaN(hd)?null:hd};
    placing=null; svg.classList.remove('placing'); paintPin(tr,'move'); tally(); save(); toast('Corrected position recorded.'); return;}
  const b=e.target.closest('[data-act]');
  if(b){ if(!needRev()) return; const card=b.closest('.card'); const want=ACT[b.dataset.act]; const ta=card.querySelector(':scope > .cf textarea');
    if((want==='changes'||want==='clarify')&&!ta.value.trim()){ta.classList.add('need');ta.focus();ta.placeholder=want==='clarify'?'Write your question: what is unclear?':'Say what needs to change so the pipeline can fix it';toast('A note is required for '+LABEL[want]+'.');return;}
    ta.classList.remove('need'); setCard(card,card.classList.contains(want)?'pending':want); return;}
  const p=e.target.closest('[data-pa]');
  if(p){ if(!needRev()) return; const tr=p.closest('tr'); const a=p.dataset.pa; const slug=tr.closest('.pp').dataset.pp; const k=slug+'|'+tr.dataset.row;
    const ta=tr.querySelector('.pnote'); const note=ta.value.trim();
    if(a==='clarify'&&!note){ta.classList.add('need');ta.focus();ta.placeholder='Write your question about this pin';toast('Write the question for this camera pin first.');return;}
    ta.classList.remove('need');
    if(a==='move'){ if(st.pins[k]&&st.pins[k].action==='move'){delete st.pins[k]; placing=null; const s=svgOf(tr); if(s) s.classList.remove('placing'); paintPin(tr,null); tally(); save(); return;} startPlacing(tr); return; }
    if(st.pins[k]&&st.pins[k].action===a){delete st.pins[k]; paintPin(tr,null);}
    else {st.pins[k]={slug,point:'R5',camera:tr.dataset.row.startsWith('pin:')?null:tr.dataset.row,pin_id:tr.dataset.pin||null,action:a,note,reviewer:rev(),decided_at:now(),hash:tr.closest('.card').dataset.hash,lat:null,lng:null,heading:null}; paintPin(tr,a);}
    tally(); save(); return;}
  const fe=e.target.closest('a[data-full]'); if(fe&&!fe.getAttribute('href')){e.preventDefault();}
});
document.addEventListener('change',e=>{
  const h=e.target.closest('input.phd');
  if(h){const tr=h.closest('tr'), k=tr.closest('.pp').dataset.pp+'|'+tr.dataset.row; if(st.pins[k]&&st.pins[k].action==='move'){const v=parseFloat(h.value); st.pins[k].heading=isNaN(v)?null:((v%360)+360)%360; st.pins[k].decided_at=now(); drawMoved(tr); save();} return;}
  const n=e.target.closest('textarea.pnote');
  if(n){const tr=n.closest('tr'), k=tr.closest('.pp').dataset.pp+'|'+tr.dataset.row; if(st.pins[k]){st.pins[k].note=n.value.trim(); save();} return;}
  const r=e.target.closest('input[data-q]');
  if(r){ if(!needRev()){r.checked=false;return;} const slug=r.closest('.pp').dataset.pp; st.qchecks[slug+'|'+r.dataset.q]={slug,point:'R7',question:r.dataset.q,verdict:r.value,reviewer:rev(),decided_at:now(),hash:r.closest('.card').dataset.hash}; save(); }
});
function tally(){
  let all=0,ok=0,qs=0;
  props.forEach(slug=>{
    const cards=document.querySelectorAll(`.pp[data-pp="${CSS.escape(slug)}"] .card`); let a=0,q=0;
    cards.forEach(c=>{if(c.classList.contains('approved'))a++; if(c.classList.contains('clarify'))q++;});
    Object.keys(st.pins).forEach(k=>{if(k.startsWith(slug+'|')&&st.pins[k].action==='clarify')q++;});
    all+=cards.length; ok+=a; qs+=q;
    const b=document.querySelector(`[data-badge="${CSS.escape(slug)}"]`); b.textContent=`${a}/${cards.length} approved`; b.classList.toggle('done',a===cards.length);
    const qb=document.querySelector(`[data-qbadge="${CSS.escape(slug)}"]`); qb.textContent=`Questions: ${q}`; qb.classList.toggle('has',q>0);
    document.querySelector(`[data-bar="${CSS.escape(slug)}"]`).style.width=(100*a/cards.length)+'%';
  });
  document.getElementById('gbar').style.width=(all?100*ok/all:0)+'%';
  document.getElementById('gtxt').textContent=`${ok} of ${all} points approved across ${props.length} properties`+(qs?` · ${qs} open question${qs>1?'s':''}`:'');
  document.querySelector('.gate').classList.toggle('open',all>0&&ok===all);
}
document.getElementById('export').addEventListener('click',()=>{
  if(!needRev()) return;
  const rows=[];
  Object.values(st.decisions).forEach(d=>rows.push({hub:HUB[d.slug],slug:d.slug,site_no:SITE[d.slug],point_id:d.point,pin_id:null,camera:null,status:d.status,note:d.note,reviewer:d.reviewer,
    section_hash:d.hash,timestamp:d.decided_at,corrected_lat:null,corrected_lng:null,corrected_heading:null}));
  Object.values(st.pins).forEach(d=>rows.push({hub:HUB[d.slug],slug:d.slug,site_no:SITE[d.slug],point_id:'R5',pin_id:d.pin_id,camera:d.camera,status:PST[d.action],note:d.note,reviewer:d.reviewer,
    section_hash:d.hash,timestamp:d.decided_at,corrected_lat:d.lat??null,corrected_lng:d.lng??null,corrected_heading:d.heading??null}));
  const out={kind:'safe-lane1-review',schema:'safe-review/lane1-export-v2',build_id:META.build,exported_by:rev(),exported_at:now(),
    decisions:rows,question_checks:Object.values(st.qchecks).map(q=>({hub:HUB[q.slug],slug:q.slug,point_id:'R7',question_id:q.question,verdict:q.verdict,reviewer:q.reviewer,section_hash:q.hash,timestamp:q.decided_at})),hashes:META.hashes};
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([JSON.stringify(out,null,2)],{type:'application/json'}));
  a.download='safe-lane1-decisions-'+rev().toLowerCase()+'-'+new Date().toISOString().slice(0,16).replace(/[:T]/g,'')+'.json'; document.body.appendChild(a); a.click(); a.remove();
});
try{const s=JSON.parse(localStorage.getItem(LS_STATE)||'null');
  if(s){
    Object.values(s.decisions||{}).forEach(d=>{const card=document.querySelector(`.pp[data-pp="${CSS.escape(d.slug)}"] .card[data-rid="${d.point}"]`); if(card&&card.dataset.hash===d.hash){st.decisions[d.slug+'|'+d.point]=d; card.querySelector(':scope > .cf textarea').value=d.note||''; paintCard(card,d.status);}});
    Object.entries(s.pins||{}).forEach(([k,d])=>{const row=k.slice(k.indexOf('|')+1); const tr=document.querySelector(`.pp[data-pp="${CSS.escape(d.slug)}"] tr[data-row="${CSS.escape(row)}"]`); if(tr&&tr.closest('.card').dataset.hash===d.hash){st.pins[k]=d; tr.querySelector('.pnote').value=d.note||''; if(d.heading!=null&&tr.querySelector('.phd')) tr.querySelector('.phd').value=d.heading; paintPin(tr,d.action);}});
    Object.values(s.qchecks||{}).forEach(d=>{const r=document.querySelector(`.pp[data-pp="${CSS.escape(d.slug)}"] input[data-q="${CSS.escape(d.question)}"][value="${d.verdict}"]`); if(r&&r.closest('.card').dataset.hash===d.hash){r.checked=true; st.qchecks[d.slug+'|'+d.question]=d;}});
  }}catch(e){}
document.getElementById('clearlocal').addEventListener('click',()=>{if(confirm('Clear all decisions saved in this browser?')){try{localStorage.removeItem(LS_STATE);}catch(e){} location.reload();}});
revUI(); tally(); route();
}

(function(){
const te=new TextEncoder(), td=new TextDecoder(), MAGIC='SRV1'; let KEYS={};
const REVIEWERS=['Bot','Eleanor','Ross','Steve','Jonah'];
async function keyFor(pw,salt,iter){const id=[...salt].join(',')+'|'+iter; if(KEYS[id]) return KEYS[id];
  if(iter<200000) throw new Error('KDF too weak');
  const base=await crypto.subtle.importKey('raw',te.encode(pw),'PBKDF2',false,['deriveKey']);
  return KEYS[id]=await crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);}
async function openPart(pw,base,hub,part){
  const r=await fetch(base+hub+'/'+part,{cache:'no-store',mode:'cors',credentials:'omit'}); if(!r.ok){const e=new Error('HTTP '+r.status+' for '+part); e.http=r.status; throw e;}
  const b=new Uint8Array(await r.arrayBuffer());
  if(td.decode(b.slice(0,4))!==MAGIC) throw new Error('not a review part');
  const salt=b.slice(4,20), iter=new DataView(b.buffer,20,4).getUint32(0), iv=b.slice(24,36);
  const key=await keyFor(pw,salt,iter);
  return new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv,additionalData:te.encode('safe-review/v1|'+hub+'|'+part)},key,b.slice(36)));}
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function loadImages(pw,base,pkgs){
  const jobs=[]; pkgs.forEach(p=>{for(let n=0;n<p.chunks;n++) jobs.push([p,n]);});
  let i=0;
  async function worker(){while(i<jobs.length){const [p,n]=jobs[i++]; const part='img-'+String(n).padStart(2,'0')+'.enc';
    try{const buf=await openPart(pw,base,p.hub,part);
      Object.entries(p.images).forEach(([iid,[c,off,len]])=>{ if(c!==n) return;
        const u=URL.createObjectURL(new Blob([buf.subarray(off,off+len)],{type:'image/jpeg'}));
        const scope=document.querySelector('.pp[data-hub="'+p.hub+'"]');
        scope.querySelectorAll('img[data-enc="'+iid+'"]').forEach(im=>im.src=u); scope.querySelectorAll('a[data-full="'+iid+'"]').forEach(a=>a.href=u);});
    }catch(e){console.warn(part,e); const d=document.createElement('div'); d.className='loaderr'; d.textContent='Images for '+p.label+' ('+part+') could not be loaded: '+(e.message||e); document.querySelector('.main').prepend(d);}}}
  await Promise.all([1,2,3,4].map(worker));
  await Promise.all([...document.querySelectorAll('img[data-enc]')].map(im=>im.complete?0:new Promise(r=>{im.onload=im.onerror=r;})));
  window.SAFE_IMAGES_DONE=true;}
document.getElementById('f').addEventListener('submit',async ev=>{
  ev.preventDefault(); const btn=document.getElementById('go'), err=document.getElementById('err'), pwi=document.getElementById('pw');
  const pw=pwi.value; if(!pw) return; KEYS={}; btn.disabled=true; btn.textContent='Unlocking…'; err.textContent='';
  let man, pkgs=[], fails=[];
  try{ const r=await fetch('manifest.json',{cache:'no-store'}); man=await r.json();
    const res=await Promise.allSettled(man.hubs.map(h=>openPart(pw,man.base,h,'package.enc')));
    res.forEach((x,i)=>{ if(x.status==='fulfilled'){const p=JSON.parse(td.decode(x.value)); if(p.hub!==man.hubs[i]) fails.push(['hub mismatch',man.hubs[i]]); else pkgs.push(p);} else fails.push([x.reason,man.hubs[i]]); });
    if(!pkgs.length){ const e=fails.find(f=>f[0]&&f[0].name==='OperationError'); throw e?e[0]:(fails[0]?fails[0][0]:new Error('no packages')); }
  }catch(e){ btn.disabled=false; btn.textContent='Unlock'; err.textContent=(e&&e.name==='OperationError')?'That passphrase did not work.':'Could not unlock: '+(e.message||e); pwi.select(); return; }
  pwi.value='';
  const hashes={}; pkgs.forEach(p=>hashes[p.slug]=p.hashes);
  const build=pkgs.map(p=>p.build).join('.'); const asof=pkgs.map(p=>p.built_at).sort().pop();
  const side=pkgs.map(p=>`<a class="prop" href="#${esc(p.slug)}" data-slug="${esc(p.slug)}"><div class="pn">${esc(p.label)} <span class="site">${esc(p.site_no)}</span></div>
<div class="pa">${esc(p.address)}</div><div class="pb"><span class="badge" data-badge="${esc(p.slug)}">0/8 approved</span><span class="qbadge" data-qbadge="${esc(p.slug)}">Questions: 0</span><span class="bar"><i data-bar="${esc(p.slug)}"></i></span></div></a>`).join('');
  const opts=REVIEWERS.map(r=>`<option value="${r}">${r}</option>`).join('');
  document.body.innerHTML=`<header class="top"><div class="brand"><div class="logo">S</div><div><h1>SAFE lane 1 review</h1><div class="sub">Security · Assets · Fire · Environment — pass 1 human review · build ${esc(build)} · data as of ${esc(asof)}</div></div></div>
<div class="tr"><span class="lock" title="Encrypted packages, unlocked with the review passphrase">&#128274; Password-locked</span><label class="rev">Reviewer <select id="reviewer" required><option value="">Choose reviewer…</option>${opts}</select></label><button class="b primary" id="export">Export decisions</button></div></header>
<div class="layout"><aside class="side"><div class="sh">Properties <span class="muted">(${pkgs.length})</span></div>${side}
<div class="legend"><div><span class="status pending">Pending</span></div><div><span class="status approved">Approved</span></div><div><span class="status changes">Changes requested</span></div><div><span class="status clarify">Needs clarification</span></div>
<p class="muted small">Choose your name before deciding. Every decision, note and pin call is stamped with the reviewer and time and kept in this browser until you export. Export the JSON and send it to the pipeline.</p><button class="ghostlink" id="clearlocal">Clear decisions saved in this browser</button></div></aside>
<main class="main">${pkgs.map(p=>p.html).join('')}</main></div>
<footer class="gate"><div class="gi">&#128274; <b>Environment, Assets, Fire and Security stay locked until every point is approved.</b> <span id="gtxt" class="muted"></span></div><div class="gbar"><i id="gbar"></i></div></footer>`;
  fails.forEach(([e,h])=>{const d=document.createElement('div'); d.className='loaderr'; d.textContent='One property package ('+h.slice(0,6)+'…) could not be opened: '+((e&&e.message)||e); document.querySelector('.main').prepend(d);});
  window.SAFE_IMAGES_DONE=false;
  safeApp({build,hashes,reviewers:REVIEWERS,pkgs:pkgs.map(p=>({hub:p.hub,slug:p.slug,site_no:p.site_no}))});
  loadImages(pw,man.base,pkgs);
});
})();
</script></body></html>

<!doctype html>
<html lang="en">
<head>
<link rel="icon" href="data:,">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'; img-src blob: data:; media-src blob:; connect-src 'self' blob: https://d1h1on7f1v1lpy.cloudfront.net/; worker-src blob:; base-uri 'none'; form-action 'none'">
<title>SAFE review</title>
<style>
:root{
  --bg:#f5f6f4; --panel:#ffffff; --ink:#1c2321; --ink2:#4a5551; --ink3:#7b8682; --line:#e3e7e4; --line2:#eef1ef;
  --accent:#1f5f57; --accent2:#e6f0ee; --amber:#a35d05; --amberbg:#fff4df; --amberline:#f3d29c;
  --miss:#8a3b3b; --missbg:#fbeeee; --ok:#2f7a4a; --okbg:#e8f4ec; --blue:#2c5d8f; --bluebg:#eaf1f8;
  --shadow:0 1px 2px rgba(20,30,25,.05),0 4px 14px rgba(20,30,25,.05);
  --r:12px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 "Inter","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{margin:0;font-weight:650;letter-spacing:-.01em}
a{color:var(--accent)}
button{font:inherit}
.num{font-variant-numeric:tabular-nums}
/* lock */
#lock{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;background:linear-gradient(160deg,#eef3f1,#f7f5ef)}
#lock .box{width:100%;max-width:400px;background:#fff;border-radius:16px;box-shadow:0 10px 40px rgba(20,40,30,.12);padding:34px 34px 28px}
#lock .eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:var(--ink3)}
#lock h1{font-size:24px;margin:6px 0 4px}
#lock p{color:var(--ink2);margin:0 0 20px;font-size:14px}
#lock input{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:10px;font-size:15px;outline:none}
#lock input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent2)}
#lock button{margin-top:12px;width:100%;padding:12px;border:0;border-radius:10px;background:var(--accent);color:#fff;font-weight:600;cursor:pointer}
#lock .err{color:var(--miss);font-size:13px;min-height:20px;margin-top:8px}
/* app */
#app{display:none;grid-template-columns:248px minmax(0,1fr);min-height:100vh}
aside{background:#17221f;color:#d7e0dc}
aside .inner{position:sticky;top:0;max-height:100vh;overflow:auto;padding:26px 16px}
aside .brand{padding:0 10px 22px;border-bottom:1px solid rgba(255,255,255,.08);margin-bottom:14px}
aside .brand .t{font-size:18px;font-weight:650;color:#fff}
aside .brand .s{font-size:12.5px;color:#9fb0aa;margin-top:2px}
aside nav a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;color:#c4d0cb;text-decoration:none;font-size:14px;margin-bottom:2px}
aside nav a .n{width:20px;height:20px;border-radius:6px;background:rgba(255,255,255,.07);display:inline-flex;align-items:center;justify-content:center;font-size:11px;color:#9fb0aa}
aside nav a .c{margin-left:auto;font-size:11.5px;color:#8fa29b}
aside nav a:hover{background:rgba(255,255,255,.05)}
aside nav a.on{background:#24403a;color:#fff}
aside nav a.on .n{background:#3c7a6f;color:#fff}
aside nav .navgrp{margin:12px 10px 4px;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:#7f948d;font-weight:700}
aside nav .navgrp b{display:inline-block;width:16px;height:16px;border-radius:4px;background:#2c4a43;color:#d6e4df;text-align:center;line-height:16px;margin-right:6px;font-size:10px}
aside a.dir-link{display:flex;align-items:center;gap:10px;margin:0 10px 12px;padding:9px 10px;min-height:44px;border-radius:8px;color:#c4d0cb;text-decoration:none;font-size:14px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.05)}
aside a.dir-link:hover{background:rgba(255,255,255,.08);color:#fff}
aside a.dir-link[hidden],.dir-link[hidden]{display:none !important}
.topbar,.nav-scrim{display:none}
.l2row{cursor:pointer;padding:9px 12px;border-bottom:1px solid var(--line,#e6e9e7);display:flex;gap:10px;align-items:flex-start}
.l2row:last-child{border-bottom:0}
.l2row:hover{background:rgba(60,122,111,.06)}
.l2row.sel{background:rgba(60,122,111,.13)}
.l2row .l2dot{width:10px;height:10px;border-radius:50%;flex:none;margin-top:5px}
.l2row .l2t{font-weight:600}
.l2row .l2s{font-size:12.5px;color:var(--ink2,#5b6964)}
.l2grp{padding:8px 12px;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2,#5b6964);background:rgba(0,0,0,.025);font-weight:700}
.l2legend{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;margin-top:8px}
.l2legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.rdy{padding:0;overflow:hidden}
.rdy-hd,.rdy-row>summary,div.rdy-row{display:grid;grid-template-columns:18px 56px 1fr 170px 120px;align-items:center;gap:8px;padding:9px 14px;font-size:13.5px}
.rdy-hd{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);font-weight:700;border-bottom:1px solid var(--line,#e4e2dc)}
.rdy-row{border-bottom:1px solid var(--line,#e4e2dc)}
details.rdy-row>summary{color:var(--ink);font-size:13.5px;width:100%;box-sizing:border-box}
details.rdy-row>summary:before{grid-column:1;color:var(--accent)}
details.rdy-row>summary:hover{background:rgba(0,0,0,.025)}
details.rdy-has .rdy-p{color:#c92a2a;font-weight:650;text-decoration:underline dotted}
details.rdy-note .rdy-p{color:var(--ink2);text-decoration:underline dotted}
.rdy-body{padding:2px 14px 12px 40px;background:#faf9f6}
.rdy-d{border:1px solid var(--line,#e4e2dc);border-radius:8px;background:#fff;padding:10px 12px;margin-top:8px}
.rdy-dh{display:flex;gap:8px;align-items:center;margin-bottom:6px}
.rdy-grid{display:grid;grid-template-columns:96px 1fr;gap:4px 10px;font-size:13px;line-height:1.45}
.rdy-k{color:var(--ink2);font-size:12px}
.rdy-v code,.rdy-kx code{font-size:12px;background:rgba(0,0,0,.04);padding:0 3px;border-radius:3px;word-break:break-all}
.rdy-kx summary{font-size:12.5px}

aside .foot{margin-top:24px;padding:14px 10px 0;border-top:1px solid rgba(255,255,255,.08);font-size:12px;color:#8fa29b;line-height:1.5}
main{padding:34px 44px 80px;min-width:0}
.wrap{max-width:1240px;margin:0 auto}
section.page{display:none}
section.page.on{display:block}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:22px}
.ph h2{font-size:26px}
.ph .lead{color:var(--ink2);margin-top:4px;max-width:760px}
.eyebrow{font-size:11.5px;text-transform:uppercase;letter-spacing:.12em;color:var(--ink3);font-weight:600}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.card.pad{padding:20px 22px}
.card h3{font-size:15.5px;margin-bottom:12px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.mt{margin-top:18px}.mt2{margin-top:28px}
.muted{color:var(--ink3)}.small{font-size:13px}.tiny{font-size:12px}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;color:var(--ink3);background:var(--line2);border-radius:999px;padding:1px 8px;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;border-radius:999px;padding:2px 9px;white-space:nowrap}
.b-prov{background:var(--amberbg);color:var(--amber);border:1px solid var(--amberline)}
.b-miss{background:var(--missbg);color:var(--miss)}
.b-ok{background:var(--okbg);color:var(--ok)}
.b-blue{background:var(--bluebg);color:var(--blue)}
.b-grey{background:var(--line2);color:var(--ink2)}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor;display:inline-block}
/* hero */
.hero{display:grid;grid-template-columns:1.25fr 1fr;gap:0;overflow:hidden}
.hero .l{padding:28px 30px}
.hero h1{font-size:34px;line-height:1.1}
.hero h1 span{font-weight:400;color:var(--ink3)}
.hero .addr{font-size:17px;color:var(--ink2);margin-top:8px}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 18px;margin-top:22px}
.kv div .k{font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink3)}
.kv div .v{font-size:15px;font-weight:550;margin-top:2px}
.hero .r{position:relative;background:#222;min-height:300px;cursor:pointer}
.hero .r svg{position:absolute;inset:0;width:100%;height:100%}
.hero .r .cap{position:absolute;left:12px;bottom:10px;color:#fff;font-size:12px;background:rgba(0,0,0,.45);padding:3px 9px;border-radius:999px}
.kpi{padding:16px 18px}
.kpi .k{font-size:12.5px;color:var(--ink2)}
.kpi .v{font-size:27px;font-weight:650;margin-top:4px;letter-spacing:-.02em}
.kpi .v small{font-size:14px;font-weight:500;color:var(--ink3);margin-left:4px}
.kpi .s{display:flex;gap:6px;align-items:center;margin-top:8px;flex-wrap:wrap}
.peril{display:flex;gap:16px;align-items:center}
.scorebar{display:flex;gap:4px;margin-top:6px}
.scorebar i{width:22px;height:8px;border-radius:3px;background:var(--line)}
.status{display:flex;align-items:stretch;overflow:hidden}
.status>div{flex:1;padding:16px 18px;border-right:1px solid var(--line)}
.status>div:last-child{border-right:0}
.status .v{font-size:22px;font-weight:650}
.status .k{font-size:12.5px;color:var(--ink2)}
.status .first{background:var(--okbg)}
.status .first .v{color:var(--ok)}
ul.clean{list-style:none;margin:0;padding:0}
ul.clean li{padding:9px 0;border-bottom:1px solid var(--line2)}
ul.clean li:last-child{border-bottom:0}
.prov-item{display:flex;gap:12px}
.prov-item b{min-width:132px;font-weight:600}
/* tables */
table{width:100%;border-collapse:collapse}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink3);font-weight:600;text-align:left;padding:10px 14px;border-bottom:1px solid var(--line);background:#fafbfa}
td{padding:12px 14px;border-bottom:1px solid var(--line2);vertical-align:top}
tr:last-child td{border-bottom:0}
.facts td.l{width:30%;color:var(--ink2)}
.facts td.v{font-weight:550}
.facts td.s{width:24%;text-align:right}
.facts tr.miss td.v{color:var(--miss);font-weight:500}
.why{font-size:13px;color:var(--ink2);margin-top:5px;font-weight:400;line-height:1.5}
details summary{cursor:pointer;color:var(--accent);font-size:12.5px;list-style:none;display:inline-flex;align-items:center;gap:4px;user-select:none}
details summary::-webkit-details-marker{display:none}
details summary:before{content:"▸";font-size:10px}
details[open] summary:before{content:"▾"}
details .body{font-size:13px;color:var(--ink2);margin-top:6px;line-height:1.55}
.tblhead{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 12px}
.tblhead h3{margin:0}
.hl{animation:hl 2.2s ease}
@keyframes hl{0%,40%{background:#fff2c4}100%{background:transparent}}
/* layers */
.layer{display:grid;grid-template-columns:220px 1fr 210px;gap:18px;padding:16px 20px;border-bottom:1px solid var(--line2)}
.layer:last-child{border-bottom:0}
.layer .nm{font-weight:600}
.layer .src{text-align:right}
/* map */
.mapbox{position:relative;background:#1b1f1d;border-radius:var(--r);overflow:hidden}
.mapbox svg{display:block;width:100%;height:auto}
.maptools{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.seg{display:inline-flex;background:#fff;border:1px solid var(--line);border-radius:9px;padding:3px}
.seg button{border:0;background:transparent;padding:5px 12px;border-radius:7px;cursor:pointer;font-size:13px;color:var(--ink2)}
.seg button.on{background:var(--accent);color:#fff}
.legend{display:flex;gap:8px;flex-wrap:wrap}
.legend label{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:4px 11px;cursor:pointer;user-select:none}
.legend label input{margin:0;accent-color:var(--accent)}
.sw{width:16px;height:3px;border-radius:2px;display:inline-block}
.svgtip{position:absolute;pointer-events:none;background:rgba(15,20,18,.92);color:#fff;font-size:12.5px;padding:6px 10px;border-radius:7px;white-space:nowrap;transform:translate(-50%,-130%);display:none;z-index:5}
/* gallery */
.gal{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.tile{cursor:pointer;overflow:hidden}
.tile .im{aspect-ratio:16/9;background:#ddd center/cover no-repeat;border-radius:var(--r) var(--r) 0 0}
.tile .cap{padding:11px 14px}
.tile .cap b{font-weight:600;font-size:14px}
.tile:hover .im{filter:brightness(1.05)}
#lb{position:fixed;inset:0;background:rgba(8,12,10,.92);display:none;align-items:center;justify-content:center;z-index:50;flex-direction:column}
#lb img{max-width:92vw;max-height:82vh;border-radius:8px;box-shadow:0 10px 40px rgba(0,0,0,.5)}
#lb .t{color:#fff;margin-top:14px;font-size:14px;text-align:center}
#lb .t span{color:#a9b6b1;margin-left:8px}
#lb .x,#lb .pv,#lb .nx{position:absolute;color:#fff;background:rgba(255,255,255,.1);border:0;border-radius:999px;width:44px;height:44px;font-size:20px;cursor:pointer}
#lb .x{top:20px;right:24px}#lb .pv{left:24px;top:50%}#lb .nx{right:24px;top:50%}
/* nearmap */
.packs{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.pack .n{font-size:30px;font-weight:650}
.pack .cls{margin-top:10px;font-size:12.5px;color:var(--ink2)}
.pack .cls div{display:flex;justify-content:space-between;gap:8px;padding:2px 0}
.zone{display:grid;grid-template-columns:110px 1fr 120px;gap:14px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line2)}
.zone:last-child{border-bottom:0}
.bar{height:12px;border-radius:6px;background:var(--line2);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.pcard{padding:20px 22px}
.pcard .big{font-size:44px;font-weight:700;line-height:1}
.pcard .big small{font-size:16px;color:var(--ink3);font-weight:500}
.pcard dl{display:grid;grid-template-columns:1fr auto;gap:6px 10px;margin:14px 0 0;font-size:13.5px}
.pcard dt{color:var(--ink2)}.pcard dd{margin:0;font-weight:600;text-align:right}
.callout{border-radius:10px;padding:12px 14px;font-size:13.5px;line-height:1.5}
.callout.amber{background:var(--amberbg);border:1px solid var(--amberline);color:#6b3f06}
.callout.blue{background:var(--bluebg);color:#1f466c}
.callout.grey{background:var(--line2);color:var(--ink2)}
.statrow{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line2);font-size:14px;gap:12px}
.statrow:last-child{border-bottom:0}
.statrow span:first-child{color:var(--ink2)}
.statrow span:last-child{font-weight:550;text-align:right}
/* measurements */
.mrow{cursor:pointer}
.mrow:hover td{background:#fafcfb}
.mrow.sel td{background:#eef6f4;box-shadow:none;border-left:0;border-right:0;border-top-color:transparent;border-bottom-color:transparent;}
.mrow.sel td:first-child{box-shadow:inset 3px 0 0 var(--accent);}
.mrow td.v{white-space:nowrap;font-weight:650;font-size:16px}
.mrow td.v small{font-weight:500;color:var(--ink3);font-size:13px;margin-left:3px}
.alts{margin-top:8px;background:#fafbfa;border:1px solid var(--line2);border-radius:8px;padding:6px 10px}
.alts div{display:flex;justify-content:space-between;gap:12px;font-size:13px;padding:3px 0;color:var(--ink2)}
.alts div b{font-weight:600;color:var(--ink)}
#mmap-status{min-height:1.35em;margin-top:6px}
#mmap-status.warn{color:#8a5a00}
#mmap-status.qmap-status.warn,#amap-status.qmap-status.warn,#zmap-status.qmap-status.warn,#cmap-status.qmap-status.warn{color:#ffd8a8}
#pg-cameras .cam.sel{box-shadow:0 0 0 2px var(--accent);background:#eef6f4}
.zrow{cursor:pointer}
.zrow:hover td{background:#fafcfb}
.zrow.sel td{background:#eef6f4;box-shadow:none;border-left:0;border-right:0;border-top-color:transparent;border-bottom-color:transparent}
.zrow.sel td:first-child{box-shadow:inset 3px 0 0 var(--accent)}
.zrow .zplace{white-space:nowrap}
.zrow .zplace.est{color:var(--amber)}
.zrow .zplace.sv{color:var(--ok);font-weight:650}
.zrow .zplace.off{color:var(--ink3)}
#mmap .qnorth{pointer-events:none}
#mmap .ly-parcel{pointer-events:none}
#mmap .mln,#mmap .marea,#mmap .mpt{cursor:pointer}
#mmap .marea{fill-opacity:.10}
#mmap .marea.hl{fill-opacity:.28}
#mmap .mlbl{font-family:Inter,Segoe UI,sans-serif;font-weight:650;paint-order:stroke fill;stroke:#111;stroke-linejoin:round;pointer-events:none;opacity:0}
#mmap .mfeat:hover .mlbl,#mmap .mfeat.hl .mlbl,#mmap .mpt:hover .mlbl,#mmap .mpt.hl .mlbl{opacity:1}
.amap-stage.qmap-stage,#amap.amap-stage,#mmap.amap-stage{height:auto;min-height:0;border-radius:0;flex:1 1 auto}
.qmap-tools .amap-zoom{background:#1c2321;border-color:#3a4440}
.qmap-tools .amap-zoom button{color:#d7e0dc;border-right-color:#3a4440}
.qmap-tools .amap-zoom button:hover{background:#2a3230}
.qmap #amap-status,.qmap #mmap-status{min-height:0;margin:0}
/* assets */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:4px 11px;font-size:12.5px;cursor:pointer;color:var(--ink2)}
.chip b{font-weight:600;color:var(--ink3);margin-left:4px}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.chip.on b{color:#cfe3de}
.assetwrap{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:18px;align-items:start}
.assetwrap .mapcol{position:sticky;top:20px}
.amap-zoom{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:#fff}
.amap-zoom button{border:0;background:transparent;width:34px;height:30px;cursor:pointer;font-size:18px;line-height:1;color:var(--ink);border-right:1px solid var(--line)}
.amap-zoom button:last-child{border-right:0}
.amap-zoom button:hover{background:#f4f2ee}
#amap .qnorth{pointer-events:none}
.atbl{table-layout:fixed}
.atbl .tag{white-space:normal;text-align:right;display:inline-block;margin:2px 0}
.atbl tr{cursor:pointer}
.atbl tr:hover td{background:#fafcfb}
.atbl tr.sel td{background:#eef6f4;box-shadow:none;border-left:0;border-right:0;border-top-color:transparent;border-bottom-color:transparent;}
.atbl tr.sel td:first-child{box-shadow:inset 3px 0 0 var(--accent);}
#amap-status{min-height:1.35em;margin-top:6px}
#amap-status.warn{color:#8a5a00}
#amap .pt.hl .halo{fill-opacity:.22}
#amap .pt.hl circle:not(.halo){stroke:#fff;stroke-width:1.5px}
#amap .rgn{cursor:pointer}
#amap .rgn.hl{paint-order:stroke fill}
#amap .rgn-halo{pointer-events:none}
#amap .pt.hl .halo{fill:#ffd43b;fill-opacity:.35;stroke:#fff;stroke-width:2px}
.regpanel{padding:0;overflow:hidden}
.regcat{border-bottom:1px solid var(--line)}
.regcat:last-child{border-bottom:0}
.regcat>summary{display:flex;width:100%;box-sizing:border-box;align-items:center;padding:10px 14px;color:var(--ink);font-size:13px;font-weight:650;cursor:pointer;background:#f6f5f2}
.regcat>summary:hover{background:#f0efeb}
.regcat>summary .n{font-weight:600;color:var(--ink3);font-size:12px;margin-left:8px}
.reglist{padding:0;margin:0}
.regitem{padding:8px 14px 8px 16px;border-top:1px solid var(--line2);cursor:pointer}
.regitem:hover{background:#fafcfb}
.regitem.sel{background:#eef6f4;box-shadow:inset 3px 0 0 var(--accent)}
.regmain{display:flex;gap:8px;align-items:flex-start}
.regcopy{min-width:0}
.regname{font-weight:550;line-height:1.3}

function syncPinDots(svg,s){
  if(!svg) return;
  svg.querySelectorAll('.ly-parcel').forEach(el=>el.setAttribute('stroke-width',String(1.6/s)));
  svg.querySelectorAll('text.maplab').forEach(t=>{const cy=+t.getAttribute('data-cy');t.setAttribute('font-size',String(12/s));t.setAttribute('stroke-width',String(3/s));if(isFinite(cy))t.setAttribute('y',String(cy-6/s));});
  svg.querySelectorAll('.cpin, .zpin, .l2pin').forEach(g=>{
    const dim=g.classList.contains('cpin-dim')||g.classList.contains('zpin-dim')||g.classList.contains('l2pin-dim');
    const r=(dim?7.5:11)/s;
    g.querySelectorAll('circle:not(.halo)').forEach(c=>{
      c.setAttribute('r',String(r));
      c.setAttribute('stroke-width',String((dim?1.6:2.1)/s));
    });
    g.querySelectorAll('circle.halo').forEach(c=>{
      c.setAttribute('r',String(r*1.85));
      c.setAttribute('stroke-width',String((dim?2:2.6)/s));
    });
    g.querySelectorAll('text.pinlab').forEach(t=>{
      const cx=+t.getAttribute('data-cx'), cy=+t.getAttribute('data-cy');
      const side=t.getAttribute('data-side')||'start';
      const dx=(side==='end'?-12:12)/s;
      if(isFinite(cx)&&isFinite(cy)){t.setAttribute('x',String(cx+dx));t.setAttribute('y',String(cy-12/s));}
      t.setAttribute('font-size',String(13/s));
      t.setAttribute('stroke-width',String(3.2/s));
    });
  });
}
function drawZoneOverlays(){
  const svg=ZMAP&&document.getElementById(ZMAP.svgId); if(!svg) return;
  const M=D.map||{};
  let h='';
  if(M.parcel) h+=`<polygon class="ly-parcel" points="${pts(M.parcel)}" fill="none" stroke="#efe39a" stroke-opacity="0.45" stroke-width="1.6"/>`;
  ((D.mas&&D.mas.zones)||[]).forEach(z=>{
    const key=zoneKey(z); if(ZSEL&&ZSEL.key===key) return;
    const pin=zonePinOf(z); const px=zonePx(pin); if(!px) return;
    const col=zoneIsSurveyed(pin)?'#2f7a4a':'#e67700';
    h+=zoneDotMarkup(px,col,z.label||('Zone '+(z.zone_id||'')),'zpin zpin-dim',{id:key,kind:'zone'});
  });
  if(ZSEL&&ZSEL.px){
    const col=ZSEL.surveyed?'#2f7a4a':'#e67700';
    const lab=(ZSEL.zone&&(ZSEL.zone.label||('Zone '+(ZSEL.zone.zone_id||''))))||'Zone';
    h+=zoneDotMarkup(ZSEL.px,col,lab,'zpin',{label:lab,id:ZSEL.key,kind:'zone'});
  }
  if(ZSEL&&ZSEL.cam&&ZSEL.cam.px){
    const clab=ZSEL.cam.label||'Camera';
    const same=ZSEL.px&&Math.hypot(ZSEL.cam.px[0]-ZSEL.px[0],ZSEL.cam.px[1]-ZSEL.px[1])<18;
    h+=zoneDotMarkup(ZSEL.cam.px,'#228be6',clab,'zpin zcam',{label:clab,side:same?'end':'start'});
  }
  nadirSetGeom(ZMAP,h);
  syncZoneHighlight();
}
function syncZoneHighlight(){
  if(!ZMAP) return;
  const s=Math.max(ZMAP.s,0.05);
  syncPinDots(document.getElementById(ZMAP.svgId),s);
}
function initAlarmMap(){
  const host=document.getElementById('z2d'), stage=document.getElementById('zmap');
  if(!host||!stage) return;
  if(!ZMAP||!document.getElementById('z2inner')){
    ZMAP=createNadirMap({
      hostId:'z2d', stageId:'zmap', prefix:'z2',
      defaultFit:'house',
      markUserOnPan:true,
      onApply(){ syncZoneHighlight(); }
    });
    if(!window._z2rz){
      window._z2rz=true;
      window.addEventListener('resize',()=>{
        const on=document.getElementById('pg-alarms');
        if(on&&on.classList.contains('on')) refreshNadirMap(ZMAP);
      });
    }
  }
  drawZoneOverlays();
  if(ZSEL&&ZSEL.px) fitNadirBounds(ZMAP,[ZSEL.px].concat((ZSEL.cam&&ZSEL.cam.px)?[ZSEL.cam.px]:[]));
  else scheduleNadirFit(ZMAP, ZCROP||'house');

}

let MSEL=null,MMAP=null,MCROP='house';
function setMmapStatus(msg,warn){
  const el=document.getElementById('mmap-status'); if(!el) return;

function looksLikePx(pt){
  if(!pt||pt.length<2||!isFinite(pt[0])||!isFinite(pt[1])) return false;
  const M=D.map||{};
  return pt[0]>=-40&&pt[1]>=-40&&pt[0]<=(M.w||2000)+40&&pt[1]<=(M.h||2000)+40;
}
function looksLikeLonLat(pt){
  return pt&&pt.length>=2&&Math.abs(pt[0])<=180&&Math.abs(pt[1])<=90&&(Math.abs(pt[0])>40||Math.abs(pt[1])>40);
}
function toMapPx(pt){
  if(!pt||pt.length<2) return null;
  if(looksLikePx(pt)) return [+pt[0],+pt[1]];
  if(looksLikeLonLat(pt)&&typeof pxOfLonLat==='function'&&D.cam_ctx&&D.cam_ctx.bounds){
    const px=pxOfLonLat(pt[0],pt[1]);
    return looksLikePx(px)?px:null;
  }
  return null;
}
function asPointList(v){
  if(!v) return null;
  if(Array.isArray(v)&&v.length>=2&&typeof v[0]==='number'){
    const p=toMapPx(v); return p?[p]:null;
  }
  if(Array.isArray(v)&&v.length&&Array.isArray(v[0])){
    if(typeof v[0][0]==='number'){
      const pts=v.map(toMapPx).filter(Boolean);
      return pts.length?pts:null;
    }
    if(Array.isArray(v[0][0])) return asPointList(v[0]);
  }
  if(v.coordinates) return asPointList(v.coordinates);
  return null;
}
function packedMeasGeom(r){
  const out=[];
  const pushLine=(a,b)=>{const p=toMapPx(a),q=toMapPx(b); if(p&&q) out.push({kind:'line',pts:[p,q]});};
  if(r.from_px&&r.to_px) pushLine(r.from_px,r.to_px);
  if(r.start&&r.end&&Array.isArray(r.start)) pushLine(r.start,r.end);
  if(Array.isArray(r.lines)) r.lines.forEach(l=>{const pts=asPointList(l); if(pts&&pts.length>=2) out.push({kind:'line',pts});});
  ['line','polyline','path','segment'].forEach(k=>{
    const pts=asPointList(r[k]); if(pts&&pts.length>=2) out.push({kind:'line',pts});
  });
  ['poly','polygon','ring','area','outline'].forEach(k=>{
    const pts=asPointList(r[k]); if(pts&&pts.length>=3) out.push({kind:'area',pts});
  });
  if(r.px&&typeof r.px[0]==='number'){const p=toMapPx(r.px); if(p) out.push({kind:'point',px:p,label:r.point_label?((isHeightId(r.id)||/^T\d/.test(String(r.point_label)))?String(r.point_label).replace(/(\d+(?:\.\d+)?)\s?m$/,(x,n)=>ftH(+n)):r.point_label):null});}
  if(Array.isArray(r.points)){
    r.points.forEach(it=>{
      const src=Array.isArray(it)?it:(it&&(it.px||it.point));
      const p=toMapPx(src); if(!p) return;
      out.push({kind:'point',px:p,label:(it&&it.label)||null});
    });
  }
  const g=r.geom||r.geometry;
  if(g){
    const typ=(g.type||'').toLowerCase();
    const pts=asPointList(g);
    if((typ==='linestring'||typ==='multilinestring'||!typ)&&pts&&pts.length>=2&&typ!=='polygon') out.push({kind:'line',pts});
    else if(pts&&pts.length>=3) out.push({kind:'area',pts});
    else if(pts&&pts.length===1) out.push({kind:'point',px:pts[0]});
  }
  return out;
}
function parseMeasNum(s){
  if(s==null) return NaN;
  const m=String(s).replace(/,/g,'').match(/-?\d+(?:\.\d+)?/);
  return m?parseFloat(m[0]):NaN;
}
function methodMeters(row){
  return [...String((row&&row.method)||'').matchAll(/(\d+(?:\.\d+)?)\s*m\b/g)].map(m=>+m[1]);
}
function pickTreeForRow(row){
  const trees=D.trees||[];
  if(!row||!trees.length) return null;
  const h=parseMeasNum(row.value);
  const meters=methodMeters(row);
  let best=null,score=1e9;
  trees.forEach(t=>{
    if(!t.px) return;
    let s=isFinite(h)?Math.abs(t.h-h):9;
    meters.forEach(v=>{s=Math.min(s,Math.abs(t.h-v),Math.abs((t.d||0)-v));});
    if(s<score){score=s;best=t;}
  });
  return score<=0.4?best:null;
}
function listMeasGeometry(){
  const out=[];
  const used=new Set();
  (D.meas||[]).forEach(g=>(g.rows||[]).forEach(r=>{
    packedMeasGeom(r).forEach(p=>out.push(Object.assign({id:r.id,ids:[r.id],label:r.label,value:r.value,unit:r.unit},p)));
  }));
  const link={};
  const byId={};
  (D.meas||[]).forEach(g=>(g.rows||[]).forEach(r=>{byId[r.id]=r;}));
  ['vegetation_height_m','veg10','veg15'].forEach(id=>{
    const t=pickTreeForRow(byId[id]);
    if(t&&t.px&&!used.has(t.rank)){link[t.rank]=id;used.add(t.rank);}
  });
  (D.trees||[]).forEach(t=>{
    if(!t.px||t.px.length<2||!looksLikePx(t.px)) return;
    const mid=link[t.rank];
    const ids=['tree-'+t.rank,'treetops'];
    if(mid) ids.unshift(mid);
    const label=`T${t.rank} ${ftH(t.h)}`;
    const hit=out.find(g=>g.kind==='point'&&g.px&&Math.hypot(g.px[0]-t.px[0],g.px[1]-t.px[1])<1.2);
    if(hit){
      hit.ids=[...new Set((hit.ids||[hit.id]).concat(ids))];
      if(!hit.label) hit.label=label;
      if(!hit.title) hit.title=`T${t.rank} · ${ftH(t.h)} · ${ftD(t.d)} from roof`;
      return;
    }
    out.push({id:mid||('tree-'+t.rank),ids,kind:'point',px:t.px,label,title:`T${t.rank} · ${ftH(t.h)} · ${ftD(t.d)} from roof`});
  });
  // Dedupe packed points that land on the same pixel (e.g. a height row and its tree).
  const pts=out.filter(g=>g.kind==='point'&&g.px);
  const kept=new Set();
  pts.forEach((g,i)=>{
    if(kept.has(g)) return;
    pts.slice(i+1).forEach(o=>{
      if(kept.has(o)) return;
      if(Math.hypot(g.px[0]-o.px[0],g.px[1]-o.px[1])<1.2){
        g.ids=[...new Set((g.ids||[g.id]).concat(o.ids||[o.id]))];
        if(!g.label) g.label=o.label;
        if(!g.title) g.title=o.title;
        kept.add(o);
      }
    });
  });
  return out.filter(g=>!kept.has(g));
}
function measHits(g,sel){
  if(!sel) return false;
  const id=sel.id||sel;
  return g.id===id||(g.ids||[]).includes(id);
}
function measFitPts(id){
  const pts=[];
  listMeasGeometry().forEach(g=>{
    if(!measHits(g,{id})) return;
    if(g.kind==='point'&&g.px) pts.push(g.px);
    (g.pts||[]).forEach(p=>pts.push(p));
  });
  return pts;
}
function fitMeasView(pts){

function ptsOnMap(pts){const M=D.map;if(!M||!M.w||!M.h)return true;return pts.some(p=>p&&p[0]>=0&&p[0]<=M.w&&p[1]>=0&&p[1]<=M.h);}

function measPts(row){

  if(row.ring&&row.ring.length) return {pts:row.ring,px:null,shape:'poly'};
  if(row.line&&row.line.length>=2) return {pts:row.line,px:null,shape:'line'};
  if(row.from_px&&row.to_px) return {pts:[row.from_px,row.to_px],px:null,shape:'line'};
  if(row.points&&row.points.length) return {pts:row.points,px:row.points[0],shape:'points'};

function featPtsPx(feat){
  if(!feat||!feat.geometry) return [];
  const g=feat.geometry, out=[];
  const push=ll=>{if(ll&&ll.length>=2){const p=pxOfLonLat(ll[0],ll[1]);if(p) out.push(p);}};
  if(g.type==='Polygon'||g.type==='MultiPolygon') ringsOf(feat).forEach(poly=>(poly[0]||[]).forEach(push));
  else if(g.type==='LineString') (g.coordinates||[]).forEach(push);
  else if(g.type==='MultiLineString') (g.coordinates||[]).forEach(line=>(line||[]).forEach(push));
  else if(g.type==='Point') push(g.coordinates);

}

function toUTM10(lat,lon){
  const a=6378137,f=1/298.257222101,k0=0.9996,lon0=-123*Math.PI/180,e0=500000;
  const e=Math.sqrt(2*f-f*f),ep2=e*e/(1-e*e);
  const latr=lat*Math.PI/180,lonr=lon*Math.PI/180,s=Math.sin(latr),c=Math.cos(latr);
  const N=a/Math.sqrt(1-e*e*s*s),T=(s/c)*(s/c),C=ep2*c*c,A=(lonr-lon0)*c;
  const e2=e*e,e4=e2*e2,e6=e4*e2;
  const M=a*((1-e2/4-3*e4/64-5*e6/256)*latr-(3*e2/8+3*e4/32+45*e6/1024)*Math.sin(2*latr)+(15*e4/256+45*e6/1024)*Math.sin(4*latr)-(35*e6/3072)*Math.sin(6*latr));
  return [k0*N*(A+(1-T+C)*A*A*A/6+(5-18*T+T*T+72*C-58*ep2)*A*A*A*A*A/120)+e0,
          k0*(M+N*(s/c)*(A*A/2+(5-T+9*C+4*C*C)*A*A*A*A/24+(61-58*T+T*T+600*C-330*ep2)*A*A*A*A*A*A/720))];
}

function regionGroup(t){
  const pts=[], ids=new Set();
  if(!t) return {pts,ids};
  (t.pts||[]).forEach(p=>pts.push(p));
  if(t.rid) ids.add(String(t.rid));
  if(t.rids){t.rids.forEach(id=>ids.add(String(id)));return {pts,ids};}
  if(!(t.rid&&typeof REGS!=='undefined'&&REGS)) return {pts,ids};
  const polys=typeof regionPolysPx==='function'?regionPolysPx(REGS):[];
  const main=polys.filter(p=>String(p.id)===String(t.rid));
  const cls=t.cls||(main[0]&&main[0].cls);
  main.forEach(p=>{(p.pts||[]).forEach(pt=>pts.push(pt));});
  if(!cls||!main.length) return {pts,ids};
  const seed=main.reduce((a,p)=>a.concat(p.pts||[]),[]);
  if(!seed.length) return {pts,ids};
  const [x0,y0,x1,y1]=boundsOfPx(seed);
  const cx=(x0+x1)/2, cy=(y0+y1)/2;
  const near=(40/(typeof nadirMPerPx==='function'?nadirMPerPx():0.43));
  polys.forEach(p=>{
    if(p.cls!==cls||ids.has(String(p.id))) return;
    const pb=boundsOfPx(p.pts||[]); if(!isFinite(pb[0])) return;
    const pcx=(pb[0]+pb[2])/2, pcy=(pb[1]+pb[3])/2;
    if(Math.hypot(pcx-cx,pcy-cy)<=near){
      ids.add(String(p.id));
      (p.pts||[]).forEach(pt=>pts.push(pt));
    }
  });
  return {pts,ids,cls};
}

function nadirMPerPx(){

function fitNadirBounds(map,pts){
  const {w,h,st}=nadirStageSize(map); if(!st||!map||!pts||!pts.length) return false;
  if(w<80||h<80){scheduleNadirFit(map,{pts:pts});return false;}

    const moved=renderQ3();
    if(Q3._interacting||moved){
      Q3.raf=requestAnimationFrame(step);
    }else{
      Q3._looping=false;
      Q3.raf=0;
    }
  };
  Q3.raf=requestAnimationFrame(step);
}
function wireQ3Demand(){
  if(!Q3||!Q3.controls||Q3._demandWired) return;
  Q3._demandWired=true;
  Q3.controls.addEventListener('start',()=>{Q3._interacting=true;startQ3Loop();});
  Q3.controls.addEventListener('end',()=>{Q3._interacting=false;startQ3Loop();});
}
function disposeQ3(){
  if(!Q3) return;
  if(Q3.raf){cancelAnimationFrame(Q3.raf);Q3.raf=0;}
  Q3._looping=false;Q3._interacting=false;
  if(!Q3.renderer){Q3=null;return;}
  try{
    const root=Q3.root, scene=Q3.scene, renderer=Q3.renderer;
    if(root){
      root.traverse(o=>{
        if(o.geometry&&o.geometry.dispose) o.geometry.dispose();
        const mats=o.material?(Array.isArray(o.material)?o.material:[o.material]):[];
        mats.forEach(mat=>{
          if(!mat) return;
          Object.keys(mat).forEach(k=>{const v=mat[k]; if(v&&v.isTexture&&v.dispose) v.dispose();});
          if(mat.dispose) mat.dispose();
        });
      });
      if(scene) scene.remove(root);
    }
    renderer.dispose();
    if(renderer.forceContextLoss) renderer.forceContextLoss();
    const el=renderer.domElement;
    if(el&&el.parentNode) el.parentNode.removeChild(el);
  }catch(e){}
  const host=document.getElementById('q3d');
  if(host) host.innerHTML='';
  Q3=null;
}
function ensureQ3(){
  const host=document.getElementById('q3d');if(!host)return;
  if(Q3&&Q3.ready){Q3.resize();demandQ3();return;}
  if(Q3&&Q3.loading)return Q3.loading;
  host.innerHTML='<div class="q3wait" id="q3wait">Loading the 3D model…</div>';
  Q3={loading:true,ready:false};
  Q3.loading=(async()=>{
    try{
      if(!window.SafeThree) await loadScript(SafeCrypto.ver?SafeCrypto.ver('vendor/three-viewer.js'):'vendor/three-viewer.js');
      const {THREE,OrbitControls,GLTFLoader}=window.SafeThree;
      const buf=await fetchQ3Mesh((a,b)=>{const e=document.getElementById('qmapstat');if(e)e.textContent=SafeCrypto.progressMsg(a,b);});
      const url=URL.createObjectURL(new Blob([buf],{type:'model/gltf-binary'}));
      const w=host.clientWidth||400,h=host.clientHeight||400;
      const scene=new THREE.Scene();scene.background=new THREE.Color(0x1b1f1d);
      const cam=new THREE.PerspectiveCamera(50,w/Math.max(1,h),0.4,4000);cam.up.set(0,0,1);
      const renderer=new THREE.WebGLRenderer({antialias:false,powerPreference:'high-performance',stencil:false,depth:true,alpha:false});
      renderer.setPixelRatio(Math.min(1.5,window.devicePixelRatio||1));
      renderer.setSize(w,Math.max(1,h));
      renderer.outputColorSpace=THREE.SRGBColorSpace;
      renderer.shadowMap.enabled=false;
      host.appendChild(renderer.domElement);
      const controls=new OrbitControls(cam,renderer.domElement);
      controls.enableDamping=true;controls.dampingFactor=0.08;controls.screenSpacePanning=true;
      controls.maxPolarAngle=Math.PI*0.58;
      scene.add(new THREE.AmbientLight(0xffffff,1));
      const root=await new Promise((res,rej)=>new GLTFLoader().load(url,g=>res(g),undefined,rej));
      URL.revokeObjectURL(url);
      scene.add(root.scene);
      let extras=(root.parser&&root.parser.json.meshes&&root.parser.json.meshes[0]&&root.parser.json.meshes[0].extras)||{};
      extras=meshFrameFix(THREE,root.scene,extras);
      Q3={THREE,scene,cam,renderer,controls,root:root.scene,extras,ready:true,loading:false,host,raf:0,_interacting:false,_looping:false,_draw:0,
        resize(){const w=host.clientWidth,h=Math.max(1,host.clientHeight);if(!w)return;cam.aspect=w/h;cam.updateProjectionMatrix();renderer.setPixelRatio(Math.min(1.5,window.devicePixelRatio||1));renderer.setSize(w,h);startQ3Loop();},
        marker:null,line:null,parcel:null};
      tuneQ3Materials();
      const wait=document.getElementById('q3wait');if(wait)wait.remove();
      wireQ3Demand();
      resetQ3();syncQ3Overlays();
      demandQ3();
    }catch(err){
      const w=document.getElementById('q3wait');
      if(w)w.textContent='Could not load the 3D model. Try again, or open the page over the review link.';
      Q3={ready:false,loading:false,error:String(err&&err.message||err)};
    }
  })();
  return Q3.loading;
}

function updateNorth3(){
  if(QMODE!=='3d'||!Q3||!Q3.ready){const n=document.getElementById('qnorth');if(n&&QMODE==='2d')n.style.transform='';return;}
  const THREE=Q3.THREE,t=Q3.controls.target.clone(),n=t.clone().add(new THREE.Vector3(0,20,0));
  t.project(Q3.cam);n.project(Q3.cam);
  const ang=Math.atan2(n.x-t.x,n.y-t.y);
  const el=document.getElementById('qnorth');if(el)el.style.transform=`rotate(${ang}rad)`;
}
function frameQ3(cx,cy,z,span){
  if(!Q3||!Q3.ready)return;
  const d=Math.max(80,span*1.35);
  Q3.controls.target.set(cx,cy,z);
  Q3.cam.position.set(cx,cy-d*0.55,z+d*0.95);
  Q3.controls.minDistance=12;Q3.controls.maxDistance=Math.max(900,span*5);
  Q3.cam.lookAt(cx,cy,z);Q3.controls.update();
}
function resetQ3(){
  if(!Q3||!Q3.ready)return;
  const ring=(D.cam_ctx&&D.cam_ctx.parcel)||[];const pts=ring.map(p=>llToMesh(p[1],p[0]));
  if(!pts.length){frameQ3(0,0,10,200);return;}
  const xs=pts.map(p=>p[0]),ys=pts.map(p=>p[1]);
  const cx=(Math.min(...xs)+Math.max(...xs))/2,cy=(Math.min(...ys)+Math.max(...ys))/2;
  const span=Math.max(Math.max(...xs)-Math.min(...xs),Math.max(...ys)-Math.min(...ys));
  frameQ3(cx,cy,heightAt(cx,cy),span);
  demandQ3();
}
function focusQ3(t){
  if(!Q3||!Q3.ready||!t)return;
  syncQ3Overlays();
  let cx,cy,z,span=40;
  if(t.ringsLL&&t.ringsLL[0]&&t.ringsLL[0].length){
    const pts=t.ringsLL[0].map(p=>llToMesh(p[1],p[0]));
    const xs=pts.map(p=>p[0]),ys=pts.map(p=>p[1]);
    cx=(Math.min(...xs)+Math.max(...xs))/2;cy=(Math.min(...ys)+Math.max(...ys))/2;
    span=Math.max(18,Math.max(...xs)-Math.min(...xs),Math.max(...ys)-Math.min(...ys));
  }else if(t.px&&D.cam_ctx&&D.cam_ctx.bounds){
    const b=D.cam_ctx.bounds,W=D.cam_ctx.img.w,H=D.cam_ctx.img.h;
    const lon=b.west+t.px[0]/W*(b.east-b.west),lat=b.north-t.px[1]/H*(b.north-b.south);
    const m=llToMesh(lat,lon);cx=m[0];cy=m[1];
  }else return;
  z=heightAt(cx,cy);
  frameQ3(cx,cy,z,Math.max(40,span*1.15));
  demandQ3();
}
function syncQ3Overlays(){
  if(!Q3||!Q3.ready)return;
  const THREE=Q3.THREE;
  const drop=k=>{if(Q3[k]){Q3.scene.remove(Q3[k]);Q3[k].geometry&&Q3[k].geometry.dispose();Q3[k].material&&Q3[k].material.dispose();Q3[k]=null;}};
  drop('parcel');drop('line');drop('marker');drop('zones');drop('hydrant');
  if(QMODE==='3d') return;
  const mkLine=(rings,color,width)=>{
    const grp=new THREE.Group();
    (rings||[]).forEach(ring=>{
      if(!ring||ring.length<2)return;
      const pts=ring.map(p=>{const m=llToMesh(p[1],p[0]);return new THREE.Vector3(m[0],m[1],heightAt(m[0],m[1])+0.7);});
      if(!pts[0].equals(pts[pts.length-1]))pts.push(pts[0].clone());
      const g=new THREE.BufferGeometry().setFromPoints(pts);
      const mat=new THREE.LineBasicMaterial({color,linewidth:width||2});
      grp.add(new THREE.Line(g,mat));
    });
    Q3.scene.add(grp);return grp;
  };
  if((typeof qlyOn==='function'? qlyOn('parcel') : true) && D.cam_ctx && D.cam_ctx.parcel) Q3.parcel=mkLine([D.cam_ctx.parcel],0xffe066,2);
  if((typeof qlyOn==='function'? qlyOn('zones') : true) && D.map && D.map.zones && D.cam_ctx && D.cam_ctx.bounds){
    const b=D.cam_ctx.bounds,W=D.cam_ctx.img.w,H=D.cam_ctx.img.h;
    const toLL=(x,y)=>[b.west+x/W*(b.east-b.west), b.north-y/H*(b.north-b.south)];
    const meta=D.map.zone_meta||[];
    const grp=new THREE.Group();
    D.map.zones.forEach((rings,i)=>{
      const col=parseInt(((meta[i]&&meta[i].color)||['#ff6b6b','#ffa94d','#ffd43b'][i]||'#ffd43b').slice(1),16);
      (rings||[]).forEach(r=>{
        if(!r||r.length<2)return;
        const pts=r.map(p=>{const ll=toLL(p[0],p[1]);const m=llToMesh(ll[1],ll[0]);return new THREE.Vector3(m[0],m[1],heightAt(m[0],m[1])+0.6);});
        if(!pts[0].equals(pts[pts.length-1]))pts.push(pts[0].clone());
        grp.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), new THREE.LineBasicMaterial({color:col,linewidth:2})));
      });
    });
    Q3.scene.add(grp);Q3.zones=grp;
  }
  const t=QSEL?linkTarget((D.questions.find(q=>q.id===QSEL)||{}).link):null;
  if(t&&t.ringsLL&&t.ringsLL.length) Q3.line=mkLine(t.ringsLL,0xffffff,2);
  let mx,my;
  if(t&&t.px&&D.cam_ctx&&D.cam_ctx.bounds){const b=D.cam_ctx.bounds,W=D.cam_ctx.img.w,H=D.cam_ctx.img.h;const lon=b.west+t.px[0]/W*(b.east-b.west),lat=b.north-t.px[1]/H*(b.north-b.south);const m=llToMesh(lat,lon);mx=m[0];my=m[1];}
  else if(t&&t.ringsLL&&t.ringsLL[0]){const pts=t.ringsLL[0].map(p=>llToMesh(p[1],p[0]));mx=pts.reduce((s,p)=>s+p[0],0)/pts.length;my=pts.reduce((s,p)=>s+p[1],0)/pts.length;}
  if(mx!=null){
    const z=heightAt(mx,my);
    const g=new THREE.SphereGeometry(1.6,16,12);
    const mat=new THREE.MeshBasicMaterial({color:0xffe066});
    const m=new THREE.Mesh(g,mat);m.position.set(mx,my,z+1.6);
    const stem=new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(mx,my,z-2),new THREE.Vector3(mx,my,z+8)]);
    const line=new THREE.Line(stem,new THREE.LineBasicMaterial({color:0xffe066}));
    const grp=new THREE.Group();grp.add(m);grp.add(line);Q3.scene.add(grp);Q3.marker=grp;
  }
}

*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:14px/1.45 "Inter","Segoe UI",system-ui,sans-serif;overflow:hidden}
#lock{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;background:linear-gradient(160deg,#141a18,#1a1814)}

<body>
<div id="lock">

<script>
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
let KEY=null, D=null, V=null;
async function fetchDec(f,opts){return SafeCrypto.fetchDec(f,opts);}
async function afterUnlock(){
  KEY=SafeCrypto.getKey();
  D=JSON.parse(new TextDecoder().decode(await fetchDec('data.bin')));
  document.getElementById('lock').remove();document.getElementById('app').style.display='block';
  await start();
}
SafeCrypto.wireUnlock({onReady:afterUnlock});

function toUTM10(lat,lon){
  const a=6378137,f=1/298.257222101,k0=0.9996,lon0=-123*Math.PI/180,e0=500000;
  const e=Math.sqrt(2*f-f*f),ep2=e*e/(1-e*e);
  const latr=lat*Math.PI/180,lonr=lon*Math.PI/180,s=Math.sin(latr),c=Math.cos(latr);
  const N=a/Math.sqrt(1-e*e*s*s),T=(s/c)*(s/c),C=ep2*c*c,A=(lonr-lon0)*c;
  const e2=e*e,e4=e2*e2,e6=e4*e2;
  const M=a*((1-e2/4-3*e4/64-5*e6/256)*latr-(3*e2/8+3*e4/32+45*e6/1024)*Math.sin(2*latr)+(15*e4/256+45*e6/1024)*Math.sin(4*latr)-(35*e6/3072)*Math.sin(6*latr));
  return [k0*N*(A+(1-T+C)*A*A*A/6+(5-18*T+T*T+72*C-58*ep2)*A*A*A*A*A/120)+e0,
          k0*(M+N*(s/c)*(A*A/2+(5-T+9*C+4*C*C)*A*A*A*A/24+(61-58*T+T*T+600*C-330*ep2)*A*A*A*A*A*A/720))];
}
/* Meshes cut by `safe mesh crop` are standard glTF (Y up, X east, Z south) in the export's offset frame with real
   elevations and no extras; the viewer works Z-up in local UTM metres. Rotate those into the viewer frame using the
   offset recorded in the payload (D.mesh_frame), and raycast from above the mesh top instead of z=80. */
function meshFrameFix(THREE,root,extras){
  const ex=extras||{};
  if(ex.offset_utm10n||!(typeof D!=='undefined'&&D&&D.mesh_frame))return ex;
  const mf=D.mesh_frame;
  if(mf.up==='y'){root.rotation.x=Math.PI/2;}
  root.updateMatrixWorld(true);
  const box=new THREE.Box3().setFromObject(root);
  return {offset_utm10n:mf.offset||[0,0,0],center_local_xyz:[0,0,0],z_top:box.max.z+20,z_ground:box.min.z};
}
function llToMesh(lat,lon){
  const [e,n]=toUTM10(lat,lon);const ex=(V&&V.extras)||{};
  const off=ex.offset_utm10n||[0,0,0],c=ex.center_local_xyz||[0,0,0];
  return [e-off[0]-c[0],n-off[1]-c[1]];
}
function heightAt(x,y){
  if(!V||!V.root)return 8;
  const THREE=V.THREE;
  const ex=V.extras||{};
  const ray=new THREE.Raycaster(new THREE.Vector3(x,y,ex.z_top!=null?ex.z_top:80),new THREE.Vector3(0,0,-1));
  const hits=ray.intersectObject(V.root,true);
  return hits.length?hits[0].point.z:(ex.z_ground!=null?ex.z_ground:8);
}
function stat(t){const e=document.getElementById('stat');if(e)e.textContent=t;}

async function start(){
  if(!window.SafeThree){stat('The 3D library did not load.');return;}
  const {THREE,OrbitControls,GLTFLoader}=window.SafeThree;
  const host=document.getElementById('view');
  const scene=new THREE.Scene();scene.background=new THREE.Color(0x101412);
  const w=host.clientWidth||800,h=host.clientHeight||600;
  const cam=new THREE.PerspectiveCamera(50,w/Math.max(1,h),0.4,4000);cam.up.set(0,0,1);
  const renderer=new THREE.WebGLRenderer({antialias:true});
  renderer.setPixelRatio(Math.min(2,window.devicePixelRatio||1));
  renderer.setSize(w,Math.max(1,h));
  renderer.outputColorSpace=THREE.SRGBColorSpace;
  renderer.toneMapping=THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure=1.05;
  host.appendChild(renderer.domElement);
  const controls=new OrbitControls(cam,renderer.domElement);
  controls.enableDamping=true;controls.dampingFactor=0.08;controls.screenSpacePanning=true;
  controls.maxPolarAngle=Math.PI*0.58;
  const hemi=new THREE.HemisphereLight(0xe8f0ff,0x3d3428,0.85);
  const sun=new THREE.DirectionalLight(0xfff3e0,1.05);
  sun.position.set(120,-80,180);
  const amb=new THREE.AmbientLight(0xffffff,0.28);
  scene.add(hemi,sun,amb);
  V={THREE,scene,cam,renderer,controls,host,root:null,extras:{},parcel:null,mats:[]};

  stat('Downloading the 3D model…'); const buf=await fetchDec('mesh.bin',{onProgress:(a,b)=>stat(SafeCrypto.progressMsg(a,b))});
  const url=URL.createObjectURL(new Blob([buf],{type:'model/gltf-binary'}));
  let gltf;
  try{gltf=await new Promise((res,rej)=>new GLTFLoader().load(url,res,undefined,rej));}
  catch(err){document.getElementById('wait').textContent='Could not load the 3D model.';stat('Load failed.');return;}
  URL.revokeObjectURL(url);
  V.root=gltf.scene;scene.add(V.root);
  V.extras=(gltf.parser&&gltf.parser.json.meshes&&gltf.parser.json.meshes[0]&&gltf.parser.json.meshes[0].extras)||{};
  V.extras=meshFrameFix(THREE,V.root,V.extras);
  V.root.traverse(o=>{
    if(!o.isMesh||!o.material)return;
    // a cropped export carries no normals; lit materials render black without them
    if(o.geometry&&!o.geometry.getAttribute('normal'))o.geometry.computeVertexNormals();
    const list=[].concat(o.material);
    const next=list.map(m=>{
      if(m.map)m.map.colorSpace=THREE.SRGBColorSpace;
      const std=new THREE.MeshStandardMaterial({
        map:m.map||null,color:0xffffff,roughness:0.92,metalness:0,side:THREE.FrontSide
      });
      if(std.map){std.map.needsUpdate=true;std.userData._map=std.map;}
      V.mats.push(std);
      return std;
    });
    o.material=next.length===1?next[0]:next;
  });
  const wait=document.getElementById('wait');if(wait)wait.remove();
  const v=V.extras, nV=v.vertices, nT=v.triangles;
  // extras may not have counts; don't require them
  stat('Nearmap textured mesh. Drag to move around the lot.');
  buildParcel();
  resetView(false);
  applyMats();
  const ro=new ResizeObserver(()=>{
    const w=host.clientWidth,h=Math.max(1,host.clientHeight);if(!w)return;
    cam.aspect=w/h;cam.updateProjectionMatrix();renderer.setSize(w,h);
  });
  ro.observe(host);
  const loop=()=>{requestAnimationFrame(loop);controls.update();renderer.render(scene,cam);updateNorth();};
  loop();
  document.getElementById('btnReset').onclick=()=>resetView(false);
  document.getElementById('btnTop').onclick=()=>resetView(true);
  document.getElementById('lyParcel').onchange=()=>{if(V.parcel)V.parcel.visible=document.getElementById('lyParcel').checked;};
  document.getElementById('lyTex').onchange=applyMats;
  document.getElementById('lyWire').onchange=applyMats;
}

function applyMats(){
  if(!V)return;
  const tex=document.getElementById('lyTex').checked;
  const wire=document.getElementById('lyWire').checked;
  V.mats.forEach(m=>{
    m.wireframe=wire;
    if(tex){m.map=m.userData._map||m.map;m.color.set(0xffffff);}
    else{if(m.map&&!m.userData._map)m.userData._map=m.map;m.map=null;m.color.set(0xc5c0b6);}
    m.needsUpdate=true;
  });
  // stash maps on first call
  V.mats.forEach(m=>{if(m.map&&!m.userData._map)m.userData._map=m.map;});
}
function buildParcel(){
  if(!V||!D||!D.cam_ctx||!D.cam_ctx.parcel)return;
  const THREE=V.THREE;
  const ring=D.cam_ctx.parcel;
  const pts=ring.map(p=>{const m=llToMesh(p[1],p[0]);return new THREE.Vector3(m[0],m[1],heightAt(m[0],m[1])+0.7);});
  if(!pts[0].equals(pts[pts.length-1]))pts.push(pts[0].clone());
  const g=new THREE.BufferGeometry().setFromPoints(pts);
  const line=new THREE.Line(g,new THREE.LineBasicMaterial({color:0xffe066}));
  V.scene.add(line);V.parcel=line;
}
function parcelSpan(){
  const ring=(D&&D.cam_ctx&&D.cam_ctx.parcel)||[];
  const pts=ring.map(p=>llToMesh(p[1],p[0]));
  if(!pts.length)return {cx:0,cy:0,span:200,z:10};
  const xs=pts.map(p=>p[0]),ys=pts.map(p=>p[1]);
  const cx=(Math.min(...xs)+Math.max(...xs))/2,cy=(Math.min(...ys)+Math.max(...ys))/2;
  const span=Math.max(Math.max(...xs)-Math.min(...xs),Math.max(...ys)-Math.min(...ys));
  return {cx,cy,span,z:heightAt(cx,cy)};
}
function resetView(top){
  if(!V)return;
  const {cx,cy,span,z}=parcelSpan();
  V.controls.target.set(cx,cy,z);
  if(top){
    V.cam.up.set(0,1,0);
    V.cam.position.set(cx,cy-0.2,z+Math.max(180,span*1.25));
  }else{
    V.cam.up.set(0,0,1);
    const d=Math.max(80,span*1.35);
    V.cam.position.set(cx,cy-d*0.55,z+d*0.95);
  }
  V.controls.minDistance=12;V.controls.maxDistance=Math.max(900,span*5);
  V.cam.lookAt(cx,cy,z);V.controls.update();
  const b=document.getElementById('btnTop');if(b)b.classList.toggle('on',!!top);
}
function updateNorth(){
  if(!V)return;
  const THREE=V.THREE,t=V.controls.target.clone(),n=t.clone().add(new THREE.Vector3(0,20,0));
  t.project(V.cam);n.project(V.cam);
  const ang=Math.atan2(n.x-t.x,n.y-t.y);
  const el=document.getElementById('qnorth');if(el)el.style.transform=`rotate(${ang}rad)`;
}
</script>

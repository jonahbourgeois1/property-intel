<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Sentinel Live</title>
<script src="sentinel/player/hls.min.js"></script>
<script src="sentinel/player/near_live_player.js"></script>
<script src="sentinel/player/partner-near-live.js"></script>
<script src="sentinel/player/partner-player.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%; background: #0a0c0f; color: #8a93a2;
    font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
    overflow: hidden;
  }
  body { display: flex; flex-direction: column; }
  #top {
    display: flex; align-items: center; gap: 12px;
    padding: 8px 10px; flex-shrink: 0;
  }
  #top h1 { font-size: 14px; font-weight: 600; color: #f0f2f5; }
  #site-switch { display: flex; gap: 6px; flex-wrap: wrap; }
  #site-switch button {
    font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
    font-size: 11px; font-weight: 600; padding: 5px 10px; border-radius: 6px;
    cursor: pointer; background: #12161b; color: #8a93a2;
    border: 1px solid rgba(255,255,255,0.14);
  }
  #site-switch button.on {
    color: #f0f2f5; border-color: #ef4444; background: rgba(239,68,68,0.16);
  }
  #build-chip {
    font-family: monospace; font-size: 10px; color: #555f6e; margin-left: auto;
  }
  #notice {
    font-family: monospace; font-size: 12px; line-height: 1.5;
    padding: 0 10px 6px; color: #8a93a2; flex-shrink: 0;
  }
  #notice:empty { display: none; }
  #notice.error { color: #ef4444; }
  #wall {
    position: relative; flex: 1; min-height: 0; min-width: 0;
    display: grid; gap: 8px; padding: 12px 16px 16px;
    overflow: auto;
  }
  #wall.feed-focus { overflow: hidden; }
  .site-block, .cameras { display: contents; }
  .site-block h2 {
    position: absolute; width: 1px; height: 1px; overflow: hidden;
    clip: rect(0, 0, 0, 0);
  }
  .cameras article {
    position: relative; background: #000; border-radius: 10px; overflow: hidden;
    border: 1px solid rgba(255,255,255,0.14); min-height: 120px;
  }
  #wall .cameras article.off {
    position: absolute; left: 8px; top: 8px; width: 16px; height: 16px;
    min-height: 0; overflow: hidden; opacity: 0.01; pointer-events: none; z-index: 0;
  }
  #wall:not(.feed-focus) .cameras article:not(.off) { cursor: pointer; }
  #wall:not(.feed-focus) .cameras article:not(.off):hover {
    border-color: rgba(239,68,68,0.75);
  }
  #wall.feed-focus .cameras article.focus {
    cursor: pointer; min-height: 0; border-color: rgba(239,68,68,0.55);
  }
  .cameras h3 {
    position: absolute; left: 8px; top: 8px; z-index: 2;
    max-width: calc(62% - 8px);
    padding: 3px 8px; border-radius: 5px;
    background: rgba(10,12,15,0.8); color: #f0f2f5;
    font-size: 11px; font-weight: 600;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .cameras h3 em {
    font-style: normal; font-weight: 500; opacity: 0.72; margin-right: 5px;
  }
  #wall.one-site .cameras h3 em { display: none; }
  .cameras video, .cameras img {
    position: absolute; inset: 0;
    width: 100%; height: 100%; object-fit: contain;
    background: #000; pointer-events: none;
  }
  .cameras video::-webkit-media-controls,
  .cameras video::-webkit-media-controls-enclosure { display: none !important; }
  .cameras img[hidden] { display: none; }
  .cameras p {
    position: absolute; right: 8px; top: 8px; z-index: 2;
    max-width: calc(38% - 8px);
    padding: 2px 7px; border-radius: 4px;
    font-family: monospace; font-size: 10px; color: #f0f2f5;
    background: rgba(10,12,15,0.8);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .cameras article[data-state="stale"] video,
  .cameras article[data-state="offline"] video {
    filter: grayscale(1); opacity: 0.6;
  }
  #pass-overlay {
    display: none; position: fixed; inset: 0; z-index: 1100;
    background: rgba(10,12,15,0.72);
    align-items: center; justify-content: center;
  }
  #pass-overlay.open { display: flex; }
  #pass-card {
    width: 340px; max-width: calc(100vw - 32px);
    background: #12161b; border: 1px solid rgba(255,255,255,0.14);
    border-radius: 10px; padding: 18px 18px 16px;
  }
  #pass-card .pass-title { font-size: 14px; font-weight: 600; color: #f0f2f5; }
  #pass-card .pass-sub {
    font-family: monospace; font-size: 11px; color: #8a93a2;
    line-height: 1.5; margin: 8px 0 14px;
  }
  #pass-err {
    display: none; font-family: monospace; font-size: 11px; color: #ef4444;
    margin: -6px 0 12px;
  }
  #pass-input {
    width: 100%; background: #0b0e12;
    border: 1px solid rgba(255,255,255,0.16); border-radius: 6px;
    color: #f0f2f5; font-family: monospace; font-size: 16px;
    padding: 9px 10px; outline: none;
  }
  #pass-input:focus { border-color: #ef4444; }
  .pass-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; }
  #pass-cancel, #pass-go, #retry-go {
    font-family: monospace; font-size: 11px; padding: 7px 12px;
    border-radius: 6px; cursor: pointer;
  }
  #pass-cancel { background: none; border: 1px solid #2a3040; color: #8a93a2; }
  #pass-go, #retry-go {
    background: rgba(239,68,68,0.18); border: 1px solid #ef4444; color: #ef4444;
    font-weight: 700;
  }
  #retry-go { display: none; margin: 0 16px 16px; }
</style>
</head>
<body>
<div id="top">
  <h1>Sentinel live</h1>
  <div id="site-switch"></div>
  <div id="build-chip">sentinel-viewer 0.3.0</div>
</div>
<div id="notice">Waiting for the viewer passcode.</div>
<button type="button" id="retry-go" onclick="retryWall()">Open again</button>
<div id="wall"></div>
<div id="pass-overlay" onclick="passOverlayClick(event)">
  <form id="pass-card" onsubmit="submitViewerPasscode(event)">
    <div class="pass-title">Sentinel live</div>
    <div class="pass-sub">Enter the viewer passcode. It is not the Sentinel API key. It stays in this tab only.</div>
    <div id="pass-err"></div>
    <input id="pass-input" type="password" autocomplete="current-password" placeholder="Viewer passcode">
    <div class="pass-actions">
      <button type="button" id="pass-cancel" onclick="cancelViewerPasscode()">Cancel</button>
      <button type="submit" id="pass-go">Open live</button>
    </div>
  </form>
</div>
<script type="module">
const BUILD = '0.3.0';
const GW_DEFAULT = 'https://im6g6y22fhejbaforkzyunpwhq0emuep.lambda-url.us-east-1.on.aws';
const SS_PASS = 'sentinelViewerPass';
const SS_SESSIONS = 'sentinelSessionIds';

const params = new URLSearchParams(window.location.search);
const gwRaw = params.get('gw');
const gw = (gwRaw === '0' ? '' : (gwRaw || GW_DEFAULT)).replace(/\/+$/, '');

let live = [];
let panels = [];
let panelMode = 'all';
let focusKey = '';
let opening = false;
let passWait = null;
let passResolve = null;

function stripPlayback(root) {
  (root || document).querySelectorAll('.cameras video').forEach(function (video) {
    if (!video.controls && !video.hasAttribute('controls')) return;
    video.controls = false;
    video.removeAttribute('controls');
  });
}

const wallNode = document.getElementById('wall');
const playbackObserver = new MutationObserver(function (records) {
  stripPlayback(wallNode);
  const structure = records.some(function (record) { return record.type === 'childList'; });
  if (structure && panels.length) applyPanel();
});
playbackObserver.observe(wallNode, {
  childList: true,
  subtree: true,
  attributes: true,
  attributeFilter: ['controls']
});

function wallGrid(n) {
  const count = Math.max(0, n | 0);
  let cols = 1;
  if (count <= 1) cols = 1;
  else if (count <= 4) cols = 2;
  else if (count <= 6) cols = 3;
  else cols = 4;
  return { cols: cols, rows: Math.max(1, Math.ceil(count / cols) || 1) };
}

function stampTiles() {
  panels.forEach(function (panel, index) {
    panel.grid.querySelectorAll('article').forEach(function (article, i) {
      article.setAttribute('data-panel', String(index));
      article.setAttribute('data-key', index + ':' + i);
      const title = article.querySelector('h3');
      if (!title || panels.length < 2) return;
      let em = title.querySelector('em');
      if (!em) {
        em = document.createElement('em');
        title.insertBefore(em, title.firstChild);
      }
      if (em.textContent !== panel.name) em.textContent = panel.name;
    });
  });
}

function applyPanel() {
  stampTiles();
  if (focusKey) {
    const focused = wallNode.querySelector('article[data-key="' + focusKey + '"]');
    const panel = focused ? Number(focused.getAttribute('data-panel')) : -1;
    const inPanel = focused && (panelMode === 'all' || panelMode === panel);
    if (!inPanel) focusKey = '';
  }
  let shown = 0;
  wallNode.querySelectorAll('.cameras article').forEach(function (article) {
    const panel = Number(article.getAttribute('data-panel'));
    const inPanel = panelMode === 'all' || panelMode === panel;
    const on = inPanel && (!focusKey || article.getAttribute('data-key') === focusKey);
    article.classList.toggle('off', !on);
    article.classList.toggle('focus', !!(on && focusKey));
    if (on) shown++;
  });
  if (focusKey) {
    wallNode.style.gridTemplateColumns = 'minmax(0, 1fr)';
    wallNode.style.gridTemplateRows = 'minmax(0, 1fr)';
  } else {
    const grid = wallGrid(shown);
    wallNode.style.gridTemplateColumns = 'repeat(' + grid.cols + ', minmax(0, 1fr))';
    wallNode.style.gridTemplateRows = 'repeat(' + grid.rows + ', minmax(120px, 1fr))';
  }
  wallNode.classList.toggle('one-site', panelMode !== 'all');
  wallNode.classList.toggle('feed-focus', !!focusKey);
  document.querySelectorAll('#site-switch button').forEach(function (button) {
    const value = button.getAttribute('data-panel');
    if (value === 'grid') return;
    const selected = panelMode === 'all' ? 'all' : String(panelMode);
    button.classList.toggle('on', value === selected);
  });
  let gridBtn = document.querySelector('#site-switch button[data-panel="grid"]');
  if (!focusKey) {
    if (gridBtn) gridBtn.remove();
  } else if (!gridBtn) {
    gridBtn = document.createElement('button');
    gridBtn.type = 'button';
    gridBtn.textContent = 'Grid';
    gridBtn.setAttribute('data-panel', 'grid');
    gridBtn.addEventListener('click', function () {
      focusKey = '';
      applyPanel();
    });
    document.getElementById('site-switch').appendChild(gridBtn);
  }
}

wallNode.addEventListener('click', function (event) {
  const article = event.target.closest('article');
  if (!article || !wallNode.contains(article) || article.classList.contains('off')) return;
  const key = article.getAttribute('data-key');
  if (!key) return;
  focusKey = focusKey === key ? '' : key;
  applyPanel();
});

window.addEventListener('keydown', function (event) {
  if (event.key !== 'Escape' || !focusKey) return;
  focusKey = '';
  applyPanel();
});

function renderSwitch() {
  const bar = document.getElementById('site-switch');
  bar.replaceChildren();
  if (panels.length < 2) return;
  function add(label, value) {
    const button = document.createElement('button');
    button.type = 'button';
    button.textContent = label;
    button.setAttribute('data-panel', value);
    button.addEventListener('click', function () {
      panelMode = value === 'all' ? 'all' : Number(value);
      focusKey = '';
      applyPanel();
    });
    bar.appendChild(button);
  }
  add('Both', 'all');
  panels.forEach(function (panel, index) { add(panel.name, String(index)); });
  applyPanel();
}

function notice(text, isError) {
  const el = document.getElementById('notice');
  el.textContent = text || '';
  el.className = isError ? 'error' : '';
}

function storedIds() {
  try {
    const raw = sessionStorage.getItem(SS_SESSIONS);
    const arr = raw ? JSON.parse(raw) : [];
    return Array.isArray(arr) ? arr.filter(function (id) { return /^[a-f0-9]{32}$/.test(id); }) : [];
  } catch (e) {
    return [];
  }
}

function saveIds(ids) {
  try { sessionStorage.setItem(SS_SESSIONS, JSON.stringify(ids)); } catch (e) {}
}

function readPass() {
  try { return sessionStorage.getItem(SS_PASS) || ''; } catch (e) { return ''; }
}

function writePass(value) {
  try {
    if (value) sessionStorage.setItem(SS_PASS, value);
    else sessionStorage.removeItem(SS_PASS);
  } catch (e) {}
}

function showPass(errText) {
  return new Promise(function (resolve) {
    passResolve = resolve;
    const ov = document.getElementById('pass-overlay');
    const err = document.getElementById('pass-err');
    const inp = document.getElementById('pass-input');
    err.textContent = errText || '';
    err.style.display = errText ? 'block' : 'none';
    inp.value = '';
    ov.classList.add('open');
    setTimeout(function () { inp.focus(); }, 40);
  });
}

function finishPass(value) {
  document.getElementById('pass-overlay').classList.remove('open');
  const resolve = passResolve;
  passResolve = null;
  if (resolve) resolve(value || '');
}

window.submitViewerPasscode = function (ev) {
  if (ev) ev.preventDefault();
  const k = (document.getElementById('pass-input').value || '').trim();
  if (!k) {
    const err = document.getElementById('pass-err');
    err.textContent = 'Enter the viewer passcode';
    err.style.display = 'block';
    return;
  }
  if (k.indexOf('spk_') === 0) {
    const err = document.getElementById('pass-err');
    err.textContent = 'That is the API key. The page takes the viewer passcode.';
    err.style.display = 'block';
    return;
  }
  writePass(k);
  finishPass(k);
};

window.cancelViewerPasscode = function () { finishPass(''); };

window.passOverlayClick = function (e) {
  if (e.target === e.currentTarget) window.cancelViewerPasscode();
};

async function passcode(force) {
  let k = readPass();
  if (k && !force) return k;
  if (passWait) return passWait;
  passWait = showPass(force ? 'Passcode not accepted. Try again.' : '');
  const v = await passWait;
  passWait = null;
  return (v || '').trim();
}

async function gwPost(path, payload, interactive) {
  const ask = interactive !== false;
  let k = await passcode(false);
  if (!k) throw new Error('no passcode entered');
  let r = await fetch(gw + path, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'x-viewer-key': k },
    body: JSON.stringify(payload || {})
  });
  if (r.status === 401 && ask) {
    writePass('');
    k = await passcode(true);
    if (!k) throw new Error('no passcode entered');
    r = await fetch(gw + path, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-viewer-key': k },
      body: JSON.stringify(payload || {})
    });
  }
  let body = null;
  try { body = await r.json(); } catch (e) { body = null; }
  if (!r.ok) {
    const msg = body && body.error && body.error.message
      ? body.error.message
      : ('gateway HTTP ' + r.status);
    const err = new Error(msg);
    err.http = r.status;
    throw err;
  }
  return body;
}

function stopViewers() {
  const ids = live.map(function (row) { return row.id; }).concat(storedIds());
  live.forEach(function (row) {
    try { row.viewer.destroy(); } catch (e) {}
  });
  live = [];
  panels = [];
  focusKey = '';
  document.getElementById('site-switch').replaceChildren();
  document.getElementById('wall').replaceChildren();
  const seen = {};
  return ids.filter(function (id) {
    if (!/^[a-f0-9]{32}$/.test(id) || seen[id]) return false;
    seen[id] = true;
    return true;
  });
}

function closeKept(ids) {
  if (!ids.length || !gw) return;
  fetch(gw + '/close', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'x-viewer-key': readPass() },
    body: JSON.stringify({ session_ids: ids }),
    keepalive: true
  }).catch(function () {});
}

async function openWall() {
  if (opening) return;
  opening = true;
  document.getElementById('retry-go').style.display = 'none';
  notice('Opening cameras...');
  const previous = stopViewers();
  try {
    const result = await gwPost('/wall', { close_ids: previous }, true);
    const sites = (result && result.sites) || [];
    const errors = (result && result.errors) || [];
    sites.forEach(function (row) {
      if (!row || !row.session || row.session.media_engine !== 'memory-v1') return;
      const block = document.createElement('section');
      block.className = 'site-block';
      const h = document.createElement('h2');
      h.textContent = row.name || row.site_id;
      if (row.account_number) {
        const span = document.createElement('span');
        span.textContent = row.account_number;
        h.appendChild(span);
      }
      const grid = document.createElement('div');
      grid.className = 'cameras';
      block.appendChild(h);
      block.appendChild(grid);
      document.getElementById('wall').appendChild(block);
      const viewer = new window.SentinelSiteViewer({
        container: grid,
        session: row.session,
        cameraNames: row.camera_names || {},
        renewSession: function (id) { return gwPost('/renew', { session_id: id }, false); }
      });
      live.push({ id: row.session.session_id, viewer: viewer });
      panels.push({ name: row.name || row.site_id, block: block, grid: grid });
    });
    stripPlayback(document.getElementById('wall'));
    renderSwitch();
    applyPanel();
    saveIds(live.map(function (row) { return row.id; }));
    if (!sites.length && errors.length) {
      notice(errors.map(function (e) { return e.message || e.code || 'open failed'; }).join(' '), true);
      document.getElementById('retry-go').style.display = 'inline-block';
    } else if (!sites.length) {
      notice('The key has no sites.', true);
    } else if (errors.length) {
      notice('Some sites did not open. ' + errors.map(function (e) { return e.message || e.code; }).join(' '), true);
    } else {
      notice('');
    }
  } catch (e) {
    const msg = (e && e.message) ? e.message : String(e);
    if (msg !== 'no passcode entered') notice(msg, true);
    else notice('Passcode cancelled.');
    document.getElementById('retry-go').style.display = 'inline-block';
    saveIds([]);
  } finally {
    opening = false;
  }
}

window.retryWall = function () { openWall(); };

window.addEventListener('pagehide', function () {
  const ids = stopViewers();
  saveIds([]);
  closeKept(ids);
});

if (!gw) {
  notice('Gateway URL is not set. After the Lambda exists, put its function URL in GW_DEFAULT, or open this page with ?gw=https://....lambda-url...');
} else if (typeof window.SentinelSiteViewer !== 'function') {
  notice('The Sentinel player scripts did not load.', true);
} else {
  openWall();
}
</script>
</body>
</html>

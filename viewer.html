<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Property Intel — Vyanet</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="config.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0a0c0f; --surface: #12161b; --surface2: #1a1f27;
    --border: rgba(255,255,255,0.08); --border2: rgba(255,255,255,0.14);
    --text: #f0f2f5; --text2: #8a93a2; --text3: #555f6e;
    --accent: #3b82f6; --green: #22c55e; --red: #ef4444;
    --orange: #f97316; --header-h: 52px;
  }
  body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); height: 100dvh; overflow: hidden; display: flex; flex-direction: column; }
  #header { display: flex; align-items: center; justify-content: space-between; padding: 0 16px; height: var(--header-h); background: var(--surface); border-bottom: 1px solid var(--border); flex-shrink: 0; z-index: 100; }
  .logo { display: flex; align-items: center; gap: 10px; }
  .logo-mark { width: 28px; height: 28px; background: var(--accent); border-radius: 6px; display: flex; align-items: center; justify-content: center; font-family: 'DM Mono', monospace; font-size: 12px; font-weight: 500; color: white; }
  .logo-text { font-size: 13px; font-weight: 500; color: var(--text); letter-spacing: 0.02em; }
  .logo-sub { font-size: 11px; color: var(--text3); }
  .header-right { display: flex; align-items: center; gap: 10px; }
  #property-name { font-size: 13px; font-weight: 500; color: var(--text2); font-family: 'DM Mono', monospace; background: var(--surface2); padding: 4px 10px; border-radius: 4px; border: 1px solid var(--border); max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #version-badge { font-size: 10px; font-family: 'DM Mono', monospace; color: var(--text3); background: var(--surface2); border: 1px solid var(--border); padding: 3px 8px; border-radius: 4px; white-space: nowrap; }
  #main { display: flex; flex: 1; overflow: hidden; min-height: 0; position: relative; }
  #map { flex: 1; background: var(--bg); min-width: 0; position: relative; }
  #loading { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; z-index: 500; transition: opacity 0.3s ease; pointer-events: all; }
  #loading.hidden { opacity: 0; pointer-events: none; }
  #error { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: var(--bg); display: none; flex-direction: column; align-items: center; justify-content: center; gap: 12px; z-index: 500; padding: 32px; text-align: center; pointer-events: all; }
  #error.visible { display: flex; }
  .spinner { width: 32px; height: 32px; border: 2px solid var(--border2); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading-text { font-size: 13px; color: var(--text3); font-family: 'DM Mono', monospace; }
  .error-icon { font-size: 32px; color: var(--red); }
  .error-title { font-size: 16px; font-weight: 600; color: var(--text); }
  .error-msg { font-size: 13px; color: var(--text3); max-width: 300px; line-height: 1.6; }
  #map-controls { position: absolute; bottom: 24px; left: 16px; z-index: 10; display: flex; flex-direction: column; gap: 8px; }
  .map-ctrl-btn { display: flex; align-items: center; gap: 7px; padding: 8px 12px; background: var(--surface); border: 1px solid var(--border2); border-radius: 7px; font-size: 11px; font-weight: 500; color: var(--text2); cursor: pointer; transition: all 0.15s; box-shadow: 0 2px 12px rgba(0,0,0,0.5); white-space: nowrap; font-family: 'DM Mono', monospace; letter-spacing: 0.02em; }
  .map-ctrl-btn:hover { background: var(--surface2); color: var(--text); }
  .map-ctrl-btn.active { background: rgba(59,130,246,0.15); border-color: rgba(59,130,246,0.4); color: var(--accent); }
  .map-ctrl-btn .ctrl-dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; flex-shrink: 0; }
  #panel { width: 360px; background: var(--surface); border-left: 1px solid var(--border); display: flex; flex-direction: column; overflow: hidden; flex-shrink: 0; transition: transform 0.3s ease, width 0.3s ease; }
  #panel.hidden { transform: translateX(360px); width: 0; }
  .panel-header { padding: 14px 16px 0; flex-shrink: 0; }
  .panel-title { font-size: 14px; font-weight: 600; color: var(--text); }
  .panel-address { font-size: 11px; color: var(--text3); margin-top: 3px; font-family: 'DM Mono', monospace; line-height: 1.4; }
  #view-tabs { display: flex; border-bottom: 1px solid var(--border); flex-shrink: 0; overflow-x: auto; scrollbar-width: none; margin-top: 12px; }
  #view-tabs::-webkit-scrollbar { display: none; }
  .view-tab { padding: 9px 14px; font-size: 12px; font-weight: 500; color: var(--text3); cursor: pointer; border-bottom: 2px solid transparent; white-space: nowrap; transition: all 0.15s; flex-shrink: 0; }
  .view-tab:hover { color: var(--text2); background: rgba(255,255,255,0.02); }
  .view-tab.active { color: var(--accent); border-bottom-color: var(--accent); }
  .view-tab[data-view="security"].active  { color: var(--green);  border-bottom-color: var(--green); }
  .view-tab[data-view="wildfire"].active  { color: var(--orange); border-bottom-color: var(--orange); }
  #panel-content { overflow-y: auto; flex: 1; scrollbar-width: thin; scrollbar-color: var(--border2) transparent; }
  .pin-group { padding: 14px 16px 6px; }
  .pin-group-label { font-size: 10px; font-weight: 600; color: var(--text3); letter-spacing: 0.08em; text-transform: uppercase; font-family: 'DM Mono', monospace; margin-bottom: 8px; }
  .pin-row { display: flex; align-items: flex-start; gap: 10px; padding: 8px 10px; border-radius: 6px; cursor: pointer; transition: background 0.12s; margin-bottom: 3px; border: 1px solid transparent; }
  .pin-row:hover { background: var(--surface2); }
  .pin-row.active { background: var(--surface2); border-color: var(--border2); }
  .pin-badge { width: 22px; height: 22px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 9px; font-weight: 700; color: white; flex-shrink: 0; font-family: 'DM Mono', monospace; margin-top: 1px; }
  .pin-badge.green  { background: var(--green); }
  .pin-badge.red    { background: var(--red); }
  .pin-badge.orange { background: var(--orange); }
  .pin-label { font-size: 12px; color: var(--text2); line-height: 1.5; flex: 1; padding-top: 2px; }
  .pin-row.active .pin-label { color: var(--text); }
  .pin-group-divider { height: 1px; background: var(--border); margin: 8px 16px; }
  .view-section { margin: 14px 16px; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; background: var(--surface2); }
  .view-header { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-bottom: 1px solid var(--border); cursor: pointer; user-select: none; transition: background 0.15s; }
  .view-header:hover { background: rgba(255,255,255,0.03); }
  .view-badge { width: 22px; height: 22px; border-radius: 5px; background: var(--accent); display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 600; color: white; flex-shrink: 0; font-family: 'DM Mono', monospace; }
  .view-badge.nadir  { background: #7c3aed; }
  .view-badge.deg360 { background: #059669; }
  .view-img-wrap.pin-wrap { position: relative; }
  .nadir-pin { position: absolute; transform: translate(-50%, -50%); width: 20px; height: 20px; border-radius: 50%; background: #dc2626; color: #fff; font-family: 'DM Mono', monospace; font-size: 10px; font-weight: 700; line-height: 16px; text-align: center; border: 2px solid #fff; box-shadow: 0 1px 4px rgba(0,0,0,0.6); cursor: pointer; z-index: 3; }
  .nadir-pin.element { background: var(--green); }
  .nadir-pin.concern { background: var(--red); }
  .pin-legend { padding: 6px 8px 10px; }
  .pin-legend-group-label { font-size: 10px; font-weight: 600; color: var(--text3); letter-spacing: 0.08em; text-transform: uppercase; font-family: 'DM Mono', monospace; margin: 8px 8px 4px; }
  .pin-legend-item { padding: 6px 8px; border-radius: 6px; cursor: pointer; transition: background 0.12s; }
  .pin-legend-item:hover { background: var(--surface); }
  .pin-legend-num { display: inline-block; width: 18px; height: 18px; border-radius: 50%; background: #dc2626; color: #fff; font-family: 'DM Mono', monospace; font-size: 9px; font-weight: 700; line-height: 18px; text-align: center; margin-right: 8px; vertical-align: middle; }
  .pin-legend-num.element { background: var(--green); }
  .pin-legend-num.concern { background: var(--red); }
  .pin-legend-name { font-size: 12px; font-weight: 600; color: var(--text2); vertical-align: middle; }
  .pin-legend-item.open .pin-legend-name { color: var(--text); }
  .pin-legend-def { display: none; margin: 5px 0 2px 26px; font-size: 11px; color: var(--text3); line-height: 1.6; }
  .pin-legend-item.open .pin-legend-def { display: block; }
  .view-label { font-size: 12px; font-weight: 500; color: var(--text); flex: 1; }
  .chevron { font-size: 10px; color: var(--text3); transition: transform 0.2s; }
  .view-body { display: block; }
  .view-body.collapsed { display: none; }
  .view-img-wrap { position: relative; cursor: zoom-in; overflow: hidden; }
  .view-img { width: 100%; aspect-ratio: 16/9; object-fit: cover; display: block; background: var(--surface); transition: transform 0.2s ease; }
  .view-img-wrap:hover .view-img { transform: scale(1.02); }
  .zoom-hint { position: absolute; bottom: 8px; right: 8px; background: rgba(0,0,0,0.6); color: white; font-size: 10px; padding: 3px 7px; border-radius: 4px; pointer-events: none; opacity: 0; transition: opacity 0.2s; }
  .view-img-wrap:hover .zoom-hint { opacity: 1; }
  .view-bullets { padding: 10px 14px; list-style: none; }
  .view-bullets li { font-size: 12px; color: var(--text2); padding: 4px 0; display: flex; align-items: flex-start; gap: 8px; line-height: 1.6; border-bottom: 1px solid rgba(255,255,255,0.03); }
  .view-bullets li:last-child { border-bottom: none; }
  .view-bullets li::before { content: ''; width: 4px; height: 4px; border-radius: 50%; background: var(--accent); flex-shrink: 0; margin-top: 7px; }
  .btn-360 { display: flex; align-items: center; justify-content: center; gap: 8px; margin: 8px 14px 14px; padding: 10px; background: var(--accent); color: white; border-radius: 6px; font-size: 12px; font-weight: 500; text-decoration: none; transition: opacity 0.15s; }
  .btn-360:hover { opacity: 0.85; }
  .panel-empty { padding: 40px 24px; text-align: center; color: var(--text3); font-size: 12px; line-height: 1.8; font-family: 'DM Mono', monospace; }
  .panel-pending { padding: 12px 16px 16px; font-size: 11px; color: var(--text3); font-family: 'DM Mono', monospace; }
  #toggle-panel { background: rgba(255,255,255,0.06); border: 1px solid var(--border2); border-radius: 6px; padding: 6px 12px; font-size: 11px; font-weight: 500; color: var(--text); cursor: pointer; display: flex; align-items: center; gap: 6px; transition: all 0.15s; white-space: nowrap; font-family: 'DM Sans', sans-serif; }
  #toggle-panel:hover { background: var(--surface2); }
  .status-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); animation: pulse 2s infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
  #mobile-toggle { display: none; position: fixed; bottom: 20px; right: 20px; z-index: 50; background: var(--surface); border: 1px solid var(--border2); border-radius: 8px; padding: 10px 14px; font-size: 12px; font-weight: 500; color: var(--text); cursor: pointer; align-items: center; gap: 6px; box-shadow: 0 4px 16px rgba(0,0,0,0.4); }
  #lightbox { position: fixed; inset: 0; background: rgba(0,0,0,0.92); z-index: 1000; display: none; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
  #lightbox.open { display: flex; }
  #lightbox-img { max-width: 100%; max-height: 75vh; object-fit: contain; border-radius: 8px; }
  #lightbox-caption { margin-top: 16px; text-align: center; }
  #lightbox-title { font-size: 14px; font-weight: 600; color: var(--text); margin-bottom: 4px; }
  #lightbox-bullets { list-style: none; display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; margin-top: 8px; max-width: 700px; }
  #lightbox-bullets li { font-size: 11px; color: var(--text2); background: var(--surface2); border: 1px solid var(--border); padding: 3px 10px; border-radius: 999px; }
  #lightbox-close { position: absolute; top: 16px; right: 16px; width: 36px; height: 36px; border-radius: 50%; background: var(--surface); border: 1px solid var(--border2); color: var(--text); font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  #lightbox-nav { display: flex; align-items: center; gap: 16px; margin-top: 16px; }
  .nav-btn { width: 36px; height: 36px; border-radius: 50%; background: var(--surface); border: 1px solid var(--border2); color: var(--text); font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  #lightbox-counter { font-size: 12px; color: var(--text3); font-family: 'DM Mono', monospace; }
  #debug-panel { position: fixed; bottom: 70px; left: 12px; width: 340px; max-height: 220px; background: rgba(10,12,15,0.97); border: 1px solid rgba(59,130,246,0.4); border-radius: 8px; z-index: 999; font-family: 'DM Mono', monospace; font-size: 11px; overflow: hidden; display: flex; flex-direction: column; box-shadow: 0 4px 20px rgba(0,0,0,0.6); }
  #debug-panel.collapsed #debug-log { display: none; }
  #debug-header { display: flex; align-items: center; justify-content: space-between; padding: 6px 10px; background: rgba(59,130,246,0.12); border-bottom: 1px solid rgba(59,130,246,0.2); cursor: pointer; user-select: none; }
  #debug-header span { color: var(--accent); font-size: 10px; font-weight: 500; letter-spacing: 0.05em; }
  #debug-toggle-btn { color: var(--accent); font-size: 10px; background: none; border: none; cursor: pointer; }
  #debug-log { overflow-y: auto; padding: 6px 10px; max-height: 180px; scrollbar-width: thin; scrollbar-color: var(--border2) transparent; }
  .debug-line { padding: 2px 0; border-bottom: 1px solid rgba(255,255,255,0.03); line-height: 1.5; }
  .debug-line.info  { color: var(--text2); }
  .debug-line.ok    { color: var(--green); }
  .debug-line.warn  { color: #f59e0b; }
  .debug-line.error { color: var(--red); }
  .debug-time { color: var(--text3); margin-right: 6px; }
  #debug-clear { padding: 4px 10px; border-top: 1px solid rgba(255,255,255,0.05); background: none; border: none; color: var(--text3); font-size: 10px; font-family: 'DM Mono', monospace; cursor: pointer; text-align: left; width: 100%; }
  #debug-clear:hover { color: var(--text2); }
  @media (max-width: 768px) {
    #property-name { display: none; }
    #toggle-panel { display: none; }
    #mobile-toggle { display: flex; }
    #map { position: absolute; inset: 0; width: 100%; height: 100%; }
    #loading { right: 0; } #error { right: 0; }
    #panel { position: fixed !important; left: 0; right: 0; bottom: 0; top: var(--header-h); width: 100% !important; height: calc(100dvh - var(--header-h)) !important; transform: translateY(100%) !important; transition: transform 0.35s ease !important; border-left: none !important; border-top: 1px solid var(--border2) !important; z-index: 40; }
    #panel.mobile-open { transform: translateY(0%) !important; }
    #debug-panel { width: calc(100vw - 24px); bottom: 80px; }
    #map-controls { bottom: 70px; }
  }
  .gm-style .gm-style-iw-c { background: #12161b !important; border-radius: 10px !important; padding: 0 !important; box-shadow: 0 4px 20px rgba(0,0,0,0.6) !important; }
  .gm-style .gm-style-iw-d { overflow: hidden !important; }
  .gm-style .gm-style-iw-t::after { background: #12161b !important; }
  .gm-style .gm-style-iw-tc::after { background: #12161b !important; }
  .gm-style-iw-chr { background: #12161b !important; border-radius: 10px 10px 0 0 !important; height: 0 !important; padding: 0 !important; }
  .gm-style-iw-chr button { filter: invert(1) !important; opacity: 0.6 !important; }
  .gm-style-iw-chr button:hover { opacity: 1 !important; }
  .gm-style-iw-chr button.gm-ui-hover-effect { display: none !important; }
  .rec-block { margin: 0 16px 14px; padding: 12px 14px; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; }
  .rec-label { font-size: 10px; font-weight: 600; color: var(--text3); letter-spacing: 0.08em; text-transform: uppercase; font-family: 'DM Mono', monospace; margin-bottom: 7px; }
  .rec-label.security { color: var(--green); }
  .rec-label.wildfire { color: var(--orange); }
  .rec-text { font-size: 12px; color: var(--text2); line-height: 1.7; }
  #immersive-overlay { position: absolute; top: 0; left: 0; right: 360px; bottom: 0; z-index: 30; display: none; flex-direction: column; background: var(--bg); transition: right 0.3s ease; }
  #immersive-overlay.visible { display: flex; }
  #immersive-overlay.panel-hidden { right: 0; }
  #immersive-frame { flex: 1; position: relative; background: #000; }
  #matterport-iframe { width: 100%; height: 100%; border: none; display: none; }
  #matterport-iframe.visible { display: block; }
  #street-view-div { width: 100%; height: 100%; display: none; }
  #street-view-div.visible { display: block; }
  .interior-launch-card { margin: 16px; border: 1px solid var(--border2); border-radius: 10px; overflow: hidden; background: var(--surface2); }
  .interior-card-header { padding: 14px 16px; border-bottom: 1px solid var(--border); }
  .interior-card-title { font-size: 13px; font-weight: 600; color: var(--text); margin-bottom: 3px; }
  .interior-card-sub { font-size: 11px; color: var(--text3); font-family: 'DM Mono', monospace; }
  .interior-card-actions { display: flex; flex-direction: column; gap: 8px; padding: 12px 16px; }
  .interior-action-btn { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-radius: 7px; border: 1px solid var(--border2); background: var(--surface); cursor: pointer; transition: all 0.15s; font-family: 'DM Sans', sans-serif; }
  .interior-action-btn:hover { background: var(--surface2); border-color: var(--accent); }
  .interior-action-btn.active { background: rgba(59,130,246,0.12); border-color: var(--accent); }
  .interior-action-text { flex: 1; }
  .interior-action-label { font-size: 12px; font-weight: 600; color: var(--text); }
  .interior-action-desc { font-size: 11px; color: var(--text3); margin-top: 1px; }
  .interior-action-arrow { font-size: 14px; color: var(--text3); }
  .interior-exit-btn { display: flex; align-items: center; justify-content: center; gap: 8px; margin: 0 16px 16px; padding: 9px 14px; border-radius: 7px; border: 1px solid rgba(205,51,51,0.5); background: rgba(205,51,51,0.08); color: var(--red); cursor: pointer; font-size: 12px; font-weight: 500; font-family: 'DM Sans', sans-serif; transition: all 0.15s; }
  .interior-exit-btn:hover { border-color: var(--red); background: rgba(205,51,51,0.18); color: #ff4444; }
  #ground-banner { display: flex; align-items: center; justify-content: space-between; padding: 10px 16px; background: rgba(205,51,51,0.08); border-bottom: 1px solid rgba(205,51,51,0.25); flex-shrink: 0; gap: 12px; }
  #ground-banner .ground-banner-label { font-size: 12px; font-family: 'DM Mono', monospace; color: var(--red); font-weight: 500; }
  #ground-banner .ground-banner-exit { display: flex; align-items: center; justify-content: center; padding: 8px 14px; border-radius: 7px; border: 1px solid rgba(205,51,51,0.5); background: rgba(205,51,51,0.08); color: var(--red); cursor: pointer; font-size: 12px; font-weight: 500; font-family: 'DM Sans', sans-serif; transition: all 0.15s; white-space: nowrap; flex-shrink: 0; }
  #ground-banner .ground-banner-exit:hover { border-color: var(--red); background: rgba(205,51,51,0.18); color: #ff4444; }
  @media (max-width: 768px) { #immersive-overlay { right: 0; } }
</style>
</head>
<body>
<div id="header">
  <div class="logo">
    <div class="logo-mark">VI</div>
    <div>
      <div class="logo-text">Vyanet Intel</div>
      <div class="logo-sub">First Responder Portal</div>
    </div>
  </div>
  <div class="header-right">
    <button id="toggle-panel" onclick="togglePanel()"><div class="status-dot"></div><span id="toggle-label">View Intel</span></button>
    <div id="version-badge">v2.9.0 — satellite split pins</div>
    <div id="property-name">Loading...</div>
  </div>
</div>
<div id="main">
  <div id="map"></div>
  <div id="immersive-overlay">
    <div id="immersive-frame">
      <div id="street-view-div"></div>
      <iframe id="matterport-iframe" allowfullscreen allow="xr-spatial-tracking; fullscreen; accelerometer; gyroscope; magnetometer"></iframe>
    </div>
  </div>
  <div id="map-controls">
    <button class="map-ctrl-btn" id="overlay-btn" onclick="toggleOverlay()" title="Toggle nadir image overlay">
      <span class="ctrl-dot"></span><span id="overlay-label">Show Overlay</span>
    </button>
  </div>
  <div id="loading"><div class="spinner"></div><div class="loading-text" id="loading-text">Loading property data...</div></div>
  <div id="error"><div class="error-icon">⚠</div><div class="error-title">Property not found</div><div class="error-msg" id="error-msg">No property data provided.</div></div>
  <div id="panel">
    <div class="panel-header">
      <div class="panel-title" id="panel-title">Property Details</div>
      <div class="panel-address" id="panel-address"></div>
    </div>
    <div id="view-tabs"></div>
    <div id="ground-banner" style="display:none;">
      <span class="ground-banner-label">Ground View Active</span>
      <button class="ground-banner-exit" onclick="exitImmersive()">✕ Exit Ground View</button>
    </div>
    <div id="panel-content"></div>
  </div>
</div>
<button id="mobile-toggle" onclick="mobileToggle()"><div class="status-dot"></div><span id="mobile-label">Show Intel</span></button>
<div id="debug-panel">

<script>
const VERSION     = 'v2.9.0';
const BASE_URL    = 'https://responder-intel.vyanet.com/data/satellite/';
const DATA_ROOT   = 'https://responder-intel.vyanet.com/data/';
const PARCEL_BASE = 'https://raw.githubusercontent.com/jonahbourgeois1/property-intel/main/data/parcels/';
const GEOCODE_KEY = (typeof CONFIG !== 'undefined') ? CONFIG.GEOCODE_KEY : '';
const PARCEL_LAT_MIN = 43.61, PARCEL_LNG_MIN = -122.01, PARCEL_CELL = 0.07;
const ELEMENT_LABELS = ['1','2','3','4','5','6','7','8','9','0'];
const CONCERN_LABELS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
const VIEW_ORDER  = ['security','wildfire','plane','drone','tour'];
const VIEW_LABELS = { security:'Security', wildfire:'Wildfire', tour:'Ground', plane:'Plane', drone:'Drone' };

// Maps each view suffix to the subfolder its JSON lives in
function viewBaseUrl(viewSuffix) {
  const subfolders = { drone: 'drone', plane: 'plane', interior: 'interior' };
  const sub = subfolders[viewSuffix];
  return sub ? DATA_ROOT + sub + '/' : BASE_URL;
}

let map, panelOpen = false, mobileIntelOpen = false;
let mapsApiReady = false, pendingEntry = null, pendingStoredRing = null;
let propertyIndex = null, currentViews = null, currentViewData = null;
let streetViewActive = false, matterportActive = false, djiViewerActive = false;
let frMode = false;
let activeMarkers = [], pendingPinSets = [], pendingOverlay = null;
let groundOverlay = null, overlayVisible = false;
let activePinId = null, infoWindow = null;
let lightboxViews = [], lightboxIndex = 0;
const isMobile = () => window.innerWidth <= 768;

// Merged, tagged pin catalog — fetched once; ids resolve to names and full
// definitions client-side (definitions never travel through Bedrock).
let pinCatalogById = null;
fetch(DATA_ROOT + 'pin-catalog/pins-catalog.json')
  .then(function (r) { return r.json(); })
  .then(function (c) {
    pinCatalogById = {};
    c.pins.forEach(function (p) { pinCatalogById[p.id] = p; });
    dbg('Pin catalog loaded: ' + c.pin_count + ' pins', 'ok');
  })
  .catch(function (e) { dbg('Pin catalog unavailable: ' + e.message, 'warn'); });

function dbg(msg, type) {
  type = type || 'info';
  const log = document.getElementById('debug-log');
  if (!log) return;
  const now = new Date();
  const t = [now.getHours(), now.getMinutes(), now.getSeconds()].map(n => String(n).padStart(2,'0')).join(':');
  const line = document.createElement('div');
  line.className = 'debug-line ' + type;
  line.innerHTML = '<span class="debug-time">' + t + '</span>' + msg;
  log.appendChild(line);
  log.scrollTop = log.scrollHeight;
}
function toggleDebug() {
  const p = document.getElementById('debug-panel'), b = document.getElementById('debug-toggle-btn');
  p.classList.toggle('collapsed');
  b.textContent = p.classList.contains('collapsed') ? '▲' : '▼';
}
function clearDebug() { const l = document.getElementById('debug-log'); if (l) l.innerHTML = ''; }
function togglePanel() {
  panelOpen = !panelOpen;
  document.getElementById('panel').classList.toggle('hidden', !panelOpen);
  document.getElementById('toggle-label').textContent = panelOpen ? 'Hide Intel' : 'View Intel';
  const overlay = document.getElementById('immersive-overlay');
  if (overlay) overlay.classList.toggle('panel-hidden', !panelOpen);
  setTimeout(() => { if (map) google.maps.event.trigger(map, 'resize'); }, 350);
}
function mobileToggle() {
  mobileIntelOpen = !mobileIntelOpen;
  document.getElementById('panel').classList.toggle('mobile-open', mobileIntelOpen);
  document.getElementById('mobile-label').textContent = mobileIntelOpen ? 'Show Map' : 'Show Intel';
  const overlay = document.getElementById('immersive-overlay');
  if (overlay) overlay.classList.toggle('panel-hidden', !mobileIntelOpen);
  setTimeout(() => { if (map) google.maps.event.trigger(map, 'resize'); }, 380);
}
function showError(msg) { hideLoading(); document.getElementById('error').classList.add('visible'); document.getElementById('error-msg').textContent = msg; dbg('ERROR: ' + msg, 'error'); }
function setLoading(msg) { const el = document.getElementById('loading-text'); if (el) el.textContent = msg; dbg(msg, 'info'); }
function hideLoading() { const el = document.getElementById('loading'); if (el) el.classList.add('hidden'); }
function formatDesc(desc) {
  if (!desc) return [];
  return desc.split('|').map(s => s.trim()).filter(s => s.length > 2);
}
function toggleSection(header) {
  const body = header.nextElementSibling;
  const chevron = header.querySelector('.chevron');
  body.classList.toggle('collapsed');
  chevron.style.transform = body.classList.contains('collapsed') ? 'rotate(-90deg)' : '';
}
function pixelToLatLng(centerLat, centerLng, zoom, xPct, yPct) {
  const size = 640;
  const pixelX = (xPct / 100) * size - size / 2;
  const pixelY = (yPct / 100) * size - size / 2;
  const mpp = (40075016.686 * Math.cos(centerLat * Math.PI / 180)) / (256 * Math.pow(2, zoom));
  return {
    lat: centerLat - (pixelY * mpp) / 110574,
    lng: centerLng + (pixelX * mpp) / (111320 * Math.cos(centerLat * Math.PI / 180))
  };
}
function extractZoom(url) {
  if (!url) return 19;
  const m = url.match(/[&?]zoom=(\d+)/);
  return m ? parseInt(m[1]) : 19;
}
function computeOverlayBounds(centerLat, centerLng, zoom) {
  const tl = pixelToLatLng(centerLat, centerLng, zoom, 0, 0);
  const br = pixelToLatLng(centerLat, centerLng, zoom, 100, 100);
  return new google.maps.LatLngBounds({ lat: br.lat, lng: tl.lng }, { lat: tl.lat, lng: br.lng });
}
function normalizePins(field) {
  if (!field) return [];
  if (Array.isArray(field)) return field;
  return field.split(';').map(s => ({ label: s.trim(), lat: null, lng: null })).filter(p => p.label.length > 0);
}
function parsePinsFromUrl(url) {
  if (!url) return [];
  const pins = [];
  const re = /[&?]markers=([^&]+)/g;
  let m;
  while ((m = re.exec(url)) !== null) {
    const seg = decodeURIComponent(m[1]);
    const parts = seg.split('|');
    const coordPart = parts[parts.length - 1];
    const coords = coordPart.split(',');
    if (coords.length === 2) {
      const lat = parseFloat(coords[0]), lng = parseFloat(coords[1]);
      if (!isNaN(lat) && !isNaN(lng)) pins.push({ lat, lng });
    }
  }
  return pins;
}
function mergePinsWithCoords(labels, urlPins, centerLat, centerLng) {
  return labels.map((item, i) => ({
    label: item.label,
    lat: (urlPins[i] ? urlPins[i].lat : null) || centerLat,
    lng: (urlPins[i] ? urlPins[i].lng : null) || centerLng
  }));
}
function clearMarkers() {
  activeMarkers.forEach(m => m.setMap(null));
  activeMarkers = [];
  activePinId = null;
  pendingPinSets = [];
  pendingOverlay = null;
  if (infoWindow) { infoWindow.close(); }
}
function makePinSvg(color, text) {
  const c = encodeURIComponent(color);
  return {
    url: `data:image/svg+xml;charset=UTF-8,<svg xmlns="http://www.w3.org/2000/svg" width="28" height="36" viewBox="0 0 28 36"><path d="M14 0C6.27 0 0 6.27 0 14c0 9.33 14 22 14 22S28 23.33 28 14C28 6.27 21.73 0 14 0z" fill="${c}" stroke="%23fff" stroke-width="1.5"/><text x="14" y="17" text-anchor="middle" dominant-baseline="middle" font-family="monospace" font-size="9" font-weight="700" fill="white">${encodeURIComponent(text)}</text></svg>`,
    scaledSize: new google.maps.Size(28, 36),
    anchor: new google.maps.Point(14, 36)
  };
}
function dropPins(pins, color, hexColor) {
  if (!map) { pendingPinSets.push({ pins, color, hexColor }); return; }
  const immersiveActive = matterportActive || streetViewActive || djiViewerActive;
  pins.forEach((pin, i) => {
    const label = (color === 'red' || color === 'orange') ? (CONCERN_LABELS[i] || String(i+1)) : (ELEMENT_LABELS[i] || String(i+1));
    const pinId = color + '-' + i;
    const marker = new google.maps.Marker({
      position: { lat: pin.lat, lng: pin.lng },
      map: immersiveActive ? null : map,
      icon: makePinSvg(hexColor, label), title: pin.label, zIndex: 10
    });
    marker._pinId = pinId; marker._label = label; marker._desc = pin.label; marker._hexColor = hexColor;
    marker.addListener('click', () => activatePin(pinId, marker, true));
    activeMarkers.push(marker);
  });
}
function activatePin(pinId, marker, fromMap) {
  document.querySelectorAll('.pin-row.active').forEach(r => r.classList.remove('active'));
  activePinId = pinId;
  const row = document.querySelector('.pin-row[data-pin-id="' + pinId + '"]');
  if (row) { row.classList.add('active'); row.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); }
  if (marker) {
    marker.setAnimation(google.maps.Animation.BOUNCE);
    setTimeout(() => marker.setAnimation(null), 700);
    if (!fromMap) map.panTo(marker.getPosition());
    if (!infoWindow) {
      infoWindow = new google.maps.InfoWindow({ disableAutoPan: false });
      map.addListener('click', function() { infoWindow.close(); });
      infoWindow.addListener('domready', function() {
        var iwOuter = document.querySelector('.gm-style-iw-a');
        if (iwOuter) iwOuter.addEventListener('click', function() { infoWindow.close(); });
      });
    }
    infoWindow.setContent(buildInfoWindowContent(marker._label, marker._desc, marker._hexColor));
    infoWindow.open({ anchor: marker, map, shouldFocus: false });
  }
}
function buildInfoWindowContent(label, desc, hexColor) {
  return '<div style="font-family:sans-serif;background:#12161b;color:#f0f2f5;border-radius:8px;padding:9px 12px;min-width:140px;max-width:220px;"><div style="display:flex;align-items:center;gap:8px;"><div style="width:20px;height:20px;border-radius:50%;background:' + hexColor + ';display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;color:white;font-family:monospace;flex-shrink:0;">' + label + '</div><span style="font-size:12px;font-weight:600;color:#f0f2f5;line-height:1.3;">' + desc + '</span></div></div>';
}
function pinRowClick(pinId) {
  const marker = activeMarkers.find(m => m._pinId === pinId);
  activatePin(pinId, marker, false);
}
function setOverlay(imageUrl, centerLat, centerLng, zoom) {
  if (groundOverlay) { groundOverlay.setMap(null); groundOverlay = null; }
  if (!imageUrl) return;
  if (!map) { pendingOverlay = { imageUrl, centerLat, centerLng, zoom }; return; }
  const bounds = computeOverlayBounds(centerLat, centerLng, zoom);
  groundOverlay = new google.maps.GroundOverlay(imageUrl, bounds, { opacity: 0.75 });
  if (overlayVisible) groundOverlay.setMap(map);
}
function flushPendingMapData() {
  if (pendingOverlay) {
    const po = pendingOverlay;
    pendingOverlay = null;
    if (po.bounds) { setOverlayFromBounds(po.imageUrl, po.bounds); }
    else { setOverlay(po.imageUrl, po.centerLat, po.centerLng, po.zoom); }
  }
  const sets = pendingPinSets.slice();
  pendingPinSets = [];
  sets.forEach(({ pins, color, hexColor }) => dropPins(pins, color, hexColor));
}
function toggleOverlay() {
  overlayVisible = !overlayVisible;
  const btn = document.getElementById('overlay-btn'), lbl = document.getElementById('overlay-label');
  if (overlayVisible) { btn.classList.add('active'); lbl.textContent = 'Hide Overlay'; if (groundOverlay) groundOverlay.setMap(map); }
  else { btn.classList.remove('active'); lbl.textContent = 'Show Overlay'; if (groundOverlay) groundOverlay.setMap(null); }
}
function pointInPolygon(lat, lng, ring) {
  let inside = false;
  for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
    const xi = ring[i][0], yi = ring[i][1], xj = ring[j][0], yj = ring[j][1];
    if (((yi > lat) !== (yj > lat)) && (lng < (xj - xi) * (lat - yi) / (yj - yi) + xi)) inside = !inside;
  }
  return inside;
}
function getParcelFile(lat, lng) {
  const latCell = Math.floor((lat - PARCEL_LAT_MIN) / PARCEL_CELL) * PARCEL_CELL + PARCEL_LAT_MIN;
  const lngCell = Math.floor((lng - PARCEL_LNG_MIN) / PARCEL_CELL) * PARCEL_CELL + PARCEL_LNG_MIN;
  return 'deschutes_' + latCell.toFixed(2) + '_' + lngCell.toFixed(2) + '.geojson';
}
function drawParcelBoundary(lat, lng, storedRing) {
  if (storedRing && storedRing.length >= 3) {
    const paths = storedRing.map(pt => ({ lat: pt.lat, lng: pt.lng }));
    new google.maps.Polygon({ paths, strokeColor: '#cd3333', strokeOpacity: 1.0, strokeWeight: 4, fillOpacity: 0.0, map });
    dbg('Parcel matched: stored ring (' + storedRing.length + ' pts)', 'ok');
    return;
  }
  fetch(PARCEL_BASE + getParcelFile(lat, lng))
    .then(r => r.ok ? r.json() : null)
    .then(geojson => {
      if (!geojson) return;
      const matched = geojson.features.find(f => {
        const c = f.geometry && f.geometry.coordinates;
        return c && c[0] && pointInPolygon(lat, lng, c[0]);
      });
      if (!matched) { dbg('No parcel matched', 'warn'); return; }
      dbg('Parcel matched: ' + (matched.properties.TAXLOT || 'ok'), 'ok');
      const paths = matched.geometry.coordinates.map(ring => ring.map(pt => ({ lat: pt[1], lng: pt[0] })));
      new google.maps.Polygon({ paths, strokeColor: '#cd3333', strokeOpacity: 1.0, strokeWeight: 4, fillOpacity: 0.0, map });
    })
    .catch(e => dbg('Parcel error: ' + e.message, 'error'));
}
function initMap(lat, lng, storedRing) {
  try {
    map = new google.maps.Map(document.getElementById('map'), {
      center: { lat, lng }, zoom: 18,
      mapTypeId: google.maps.MapTypeId.SATELLITE, tilt: 0,
      mapTypeControl: true, mapTypeControlOptions: { style: google.maps.MapTypeControlStyle.DROPDOWN_MENU, mapTypeIds: ['satellite','hybrid','roadmap'] },
      zoomControl: true, zoomControlOptions: { position: google.maps.ControlPosition.RIGHT_TOP },
      streetViewControl: true, streetViewControlOptions: { position: google.maps.ControlPosition.RIGHT_TOP },
      fullscreenControl: true, fullscreenControlOptions: { position: google.maps.ControlPosition.RIGHT_TOP }
    });
    new google.maps.Marker({
      position: { lat, lng }, map,
      icon: { path: google.maps.SymbolPath.CIRCLE, scale: 5, fillColor: '#fff', fillOpacity: 0.9, strokeColor: '#3b82f6', strokeWeight: 2 },
      zIndex: 1
    });
    drawParcelBoundary(lat, lng, storedRing || null);
    hideLoading();
    setTimeout(() => { if (map) { google.maps.event.trigger(map, 'resize'); map.setCenter({ lat, lng }); } }, 100);
    if (!isMobile()) setTimeout(() => { if (!panelOpen) togglePanel(); }, 700);
    dbg('Map ready at ' + lat.toFixed(5) + ',' + lng.toFixed(5), 'ok');
    flushPendingMapData();
  } catch(e) { dbg('initMap error: ' + e.message, 'error'); }
}
function resolveAndInitMap(entry, storedRing) {
  if (entry.lat && entry.lng) { initMap(entry.lat, entry.lng, storedRing); }
  else {
    setLoading('Locating property...');
    fetch('https://maps.googleapis.com/maps/api/geocode/json?address=' + encodeURIComponent(entry.address.replace(/^\s+/, '')) + '&key=' + GEOCODE_KEY)
      .then(r => r.json())
      .then(data => {
        if (data.status === 'OK' && data.results[0]) { const loc = data.results[0].geometry.location; initMap(loc.lat, loc.lng, storedRing); }
        else { dbg('Geocode failed: ' + data.status, 'error'); hideLoading(); if (!isMobile() && !panelOpen) togglePanel(); }
      })
      .catch(e => { dbg('Geocode error: ' + e.message, 'error'); hideLoading(); });
  }
}
function buildTabs(views, activeView) {
  const tabsEl = document.getElementById('view-tabs');
  tabsEl.innerHTML = '';
  VIEW_ORDER.forEach(v => {
    if (!views[v]) return;
    const tab = document.createElement('div');
    tab.className = 'view-tab' + (v === activeView ? ' active' : '');
    tab.textContent = VIEW_LABELS[v] || v;
    tab.setAttribute('data-view', v);
    tab.onclick = () => loadView(currentViews, v);
    tabsEl.appendChild(tab);
  });
}
// v2.9.0 (two-pass satellite): reads the new payload shape — a single clean
// nadir_url, a shared top-level elements[] array of {id,x,y}, and per-analysis
// fr.concerns[]/wildfire.concerns[] of {id,x,y} plus considerations +
// recommendations prose. x,y are percentages converted to lat/lng via
// pixelToLatLng (no bounds needed — it's a Maps overlay). Pin ids resolve to
// names/definitions through the merged catalog (pinDisplay).
function satElementLatLngPins_(d, centerLat, centerLng, zoom) {
  const els = Array.isArray(d.elements) ? d.elements : [];
  return els.map(function (p) {
    const ll = pixelToLatLng(centerLat, centerLng, zoom, p.x, p.y);
    return { label: pinDisplay(p).name, def: pinDisplay(p).def, lat: ll.lat, lng: ll.lng };
  });
}
function satConcernLatLngPins_(concerns, centerLat, centerLng, zoom) {
  const arr = Array.isArray(concerns) ? concerns : [];
  return arr.map(function (p) {
    const ll = pixelToLatLng(centerLat, centerLng, zoom, p.x, p.y);
    return { label: pinDisplay(p).name, def: pinDisplay(p).def, lat: ll.lat, lng: ll.lng };
  });
}
function satPinRowsHtml_(title, pins, colorClass, labelSet) {
  if (!pins.length) return '';
  let html = '<div class="pin-group"><div class="pin-group-label">' + title + '</div>';
  pins.forEach(function (el, i) {
    const label = (labelSet[i] || String(i + 1)), pinId = colorClass + '-' + i;
    html += '<div class="pin-row" data-pin-id="' + pinId + '" onclick="pinRowClick(\'' + pinId + '\')">' +
            '<div class="pin-badge ' + colorClass + '">' + label + '</div>' +
            '<div class="pin-label">' + el.label + '</div></div>';
  });
  return html + '</div>';
}
function buildSecurityPanel(d, centerLat, centerLng) {
  clearMarkers();
  const nadirUrl = d.nadir_url || '';
  const fr = d.fr || {};
  if (!nadirUrl) { document.getElementById('panel-content').innerHTML = '<div class="panel-empty">Security data not yet available.</div>'; return; }
  const zoom = extractZoom(nadirUrl);

  const elements = satElementLatLngPins_(d, centerLat, centerLng, zoom);
  const concerns = satConcernLatLngPins_(fr.concerns, centerLat, centerLng, zoom);

  setOverlay(nadirUrl, centerLat, centerLng, zoom);
  const _ob = document.getElementById('overlay-btn'); if (_ob) _ob.style.display = 'flex';
  dropPins(elements, 'green', '#22c55e');
  dropPins(concerns, 'red', '#ef4444');
  dbg('Security: ' + elements.length + ' elements, ' + concerns.length + ' FR concerns', 'ok');

  let html = '';
  html += satPinRowsHtml_('Property Elements', elements, 'green', ELEMENT_LABELS);
  if (concerns.length) {
    if (elements.length) html += '<div class="pin-group-divider"></div>';
    html += satPinRowsHtml_('Responder Concerns', concerns, 'red', CONCERN_LABELS);
  }
  if (!html) html = '<div class="panel-empty">No elements identified yet.</div>';
  if (fr.considerations) {
    html += '<div class="rec-block"><div class="rec-label security">Responder Considerations</div><div class="rec-text">' + fr.considerations + '</div></div>';
  }
  if (fr.recommendations) {
    html += '<div class="rec-block"><div class="rec-label security">First Responder Recommendations</div><div class="rec-text">' + fr.recommendations + '</div></div>';
  }
  document.getElementById('panel-content').innerHTML = html;
}
function buildWildfirePanel(d, centerLat, centerLng) {
  clearMarkers();
  const nadirUrl = d.nadir_url || '';
  const wf = d.wildfire || {};
  if (!nadirUrl) { document.getElementById('panel-content').innerHTML = '<div class="panel-empty">Wildfire data not yet available.</div>'; return; }
  const zoom = extractZoom(nadirUrl);

  const elements = satElementLatLngPins_(d, centerLat, centerLng, zoom);
  const concerns = satConcernLatLngPins_(wf.concerns, centerLat, centerLng, zoom);

  setOverlay(nadirUrl, centerLat, centerLng, zoom);
  const _ob = document.getElementById('overlay-btn'); if (_ob) _ob.style.display = 'flex';
  dropPins(elements, 'green', '#22c55e');
  dropPins(concerns, 'orange', '#f97316');
  dbg('Wildfire: ' + elements.length + ' elements, ' + concerns.length + ' WF concerns', 'ok');

  let html = '';
  html += satPinRowsHtml_('Property Elements', elements, 'green', ELEMENT_LABELS);
  if (concerns.length) {
    if (elements.length) html += '<div class="pin-group-divider"></div>';
    html += satPinRowsHtml_('Wildfire Concerns', concerns, 'orange', CONCERN_LABELS);
  }
  if (!html) html = '<div class="panel-empty">No elements identified yet.</div>';
  if (wf.considerations) {
    html += '<div class="rec-block"><div class="rec-label wildfire">Wildfire Considerations</div><div class="rec-text">' + wf.considerations + '</div></div>';
  }
  if (wf.recommendations) {
    html += '<div class="rec-block"><div class="rec-label wildfire">Wildfire Recommendations</div><div class="rec-text">' + wf.recommendations + '</div></div>';
  }
  document.getElementById('panel-content').innerHTML = html;
}
// ── Nadir pins (plane tab) ──────────────────────────────────────────
// Residential pins are {id,x,y}; ids resolve through the FR catalog to
// a name + full definition. Commercial pins are {label,x,y} (name only).
// v2.7.0: pins are split into two kinds — element_pins (green, "what is
// here") and concern_pins (red, "responder concern here"). Older, not-yet-
// resynced rows only carry the merged `pins` array; nadirPinSets_ falls
// back to treating those as a single concern-less "element" set so the
// viewer keeps working through the migration.
function nadirPinSets_(nadir) {
  if (!nadir) return { element: [], concern: [], legacy: false };
  const hasSplit = Array.isArray(nadir.element_pins) || Array.isArray(nadir.concern_pins);
  if (hasSplit) {
    return {
      element: Array.isArray(nadir.element_pins) ? nadir.element_pins : [],
      concern: Array.isArray(nadir.concern_pins) ? nadir.concern_pins : [],
      legacy: false
    };
  }
  // Fallback: single flat array, rendered in the pre-2.7.0 single style.
  return { element: Array.isArray(nadir.pins) ? nadir.pins : [], concern: [], legacy: true };
}
function pinDisplay(p) {
  if (p.label) return { name: p.label, def: '' };
  const c = pinCatalogById && pinCatalogById[p.id];
  return { name: c ? c.name : ('Pin ' + p.id), def: c ? (c.definition || '') : '' };
}
function buildPinnedNadirSection(v, idx) {
  const sets = nadirPinSets_(v.data);
  let markers = '', legend = '';

  // Elements — green, numbered 1..0. In legacy (un-resynced) rows this set
  // carries the whole flat `pins` array and is rendered in the original
  // single style (no green class), so nothing changes for old data.
  sets.element.forEach(function (p, i) {
    const n = ELEMENT_LABELS[i] || String(i + 1), disp = pinDisplay(p);
    const kind = sets.legacy ? '' : ' element';
    markers += `<div class="nadir-pin${kind}" style="left:${p.x}%;top:${p.y}%" onclick="event.stopPropagation();togglePinInfo(${idx},'e',${i})">${n}</div>`;
    legend  += `<div class="pin-legend-item" id="pin-info-${idx}-e-${i}" onclick="togglePinInfo(${idx},'e',${i})"><span class="pin-legend-num${kind}">${n}</span><span class="pin-legend-name">${disp.name}</span>${disp.def ? '<div class="pin-legend-def">' + disp.def + '</div>' : ''}</div>`;
  });
  let elementLegend = legend;
  legend = '';

  // Concerns — red, lettered A..Z. Empty in legacy rows.
  sets.concern.forEach(function (p, i) {
    const n = CONCERN_LABELS[i] || String(i + 1), disp = pinDisplay(p);
    markers += `<div class="nadir-pin concern" style="left:${p.x}%;top:${p.y}%" onclick="event.stopPropagation();togglePinInfo(${idx},'c',${i})">${n}</div>`;
    legend  += `<div class="pin-legend-item" id="pin-info-${idx}-c-${i}" onclick="togglePinInfo(${idx},'c',${i})"><span class="pin-legend-num concern">${n}</span><span class="pin-legend-name">${disp.name}</span>${disp.def ? '<div class="pin-legend-def">' + disp.def + '</div>' : ''}</div>`;
  });
  const concernLegend = legend;

  // Split legend: labeled groups, each hidden when empty. Legacy rows show a
  // single unlabeled list (matches pre-2.7.0 behavior).
  let legendHtml = '';
  if (sets.legacy) {
    legendHtml = elementLegend;
  } else {
    if (sets.element.length) legendHtml += '<div class="pin-legend-group-label">Property Elements</div>' + elementLegend;
    if (sets.concern.length) legendHtml += '<div class="pin-legend-group-label">Responder Concerns</div>' + concernLegend;
  }

  return `<div class="view-section"><div class="view-header" onclick="toggleSection(this)"><div class="view-badge ${v.cls}">${v.badge}</div><div class="view-label">${v.label}</div><div class="chevron">▼</div></div><div class="view-body"><div class="view-img-wrap pin-wrap" onclick="openLightbox(${idx})"><img class="view-img" src="${v.data.url}" alt="${v.label}" loading="lazy">${markers}<div class="zoom-hint">🔍 Tap to enlarge</div></div><div class="pin-legend">${legendHtml}</div></div></div>`;
}
function togglePinInfo(idx, kind, i) {
  const el = document.getElementById('pin-info-' + idx + '-' + kind + '-' + i);
  if (el) el.classList.toggle('open');
}
function dropNadirPinMapMarkers(d) {
  if (!d.nadir) return;
  const sets = nadirPinSets_(d.nadir);
  if (!sets.element.length && !sets.concern.length) return;
  const b = d.nadir.bounds;
  if (!b || b.north == null || b.south == null || b.east == null || b.west == null) {
    dbg('Nadir pins present but no bounds — map markers skipped', 'warn');
    return;
  }
  const toLatLng = function (p) {
    return {
      label: pinDisplay(p).name,
      lat: b.north - (p.y / 100) * (b.north - b.south),
      lng: b.west + (p.x / 100) * (b.east - b.west)
    };
  };
  if (sets.legacy) {
    // Un-resynced row: single flat set, original red styling.
    dropPins(sets.element.map(toLatLng), 'plane', '#dc2626');
    dbg('Nadir pins (legacy): ' + sets.element.length + ' map markers placed via bounds', 'ok');
    return;
  }
  if (sets.element.length) dropPins(sets.element.map(toLatLng), 'green', '#22c55e');
  if (sets.concern.length) dropPins(sets.concern.map(toLatLng), 'red', '#ef4444');
  dbg('Nadir pins: ' + sets.element.length + ' element + ' + sets.concern.length + ' concern markers placed via bounds', 'ok');
}
// Ground overlay from real geographic bounds (plane nadir). Unlike
// setOverlay (which estimates bounds from center+zoom for the
// Security/Wildfire tabs), the plane pipeline publishes exact
// north/south/east/west, so the nadir image lines up precisely.
function setOverlayFromBounds(imageUrl, b) {
  if (groundOverlay) { groundOverlay.setMap(null); groundOverlay = null; }
  if (!imageUrl || !b || b.north == null || b.south == null || b.east == null || b.west == null) return;
  if (!map) { pendingOverlay = { imageUrl: imageUrl, bounds: b }; return; }
  const bounds = new google.maps.LatLngBounds(
    { lat: b.south, lng: b.west }, { lat: b.north, lng: b.east });
  groundOverlay = new google.maps.GroundOverlay(imageUrl, bounds, { opacity: 0.75 });
  if (overlayVisible) groundOverlay.setMap(map);
}
function buildPanel(d) {
  clearMarkers();
  if (groundOverlay) { groundOverlay.setMap(null); groundOverlay = null; }
  dropNadirPinMapMarkers(d);
  // Plane-tab 2D nadir overlay: wire the overlay control to the real
  // published bounds when present, else hide the control (no overlay for
  // this property). setOverlayFromBounds respects the current
  // overlayVisible toggle state.
  const overlayCtl = document.getElementById('overlay-btn');
  if (d.nadir && d.nadir.url && d.nadir.bounds &&
      d.nadir.bounds.north != null && d.nadir.bounds.south != null &&
      d.nadir.bounds.east != null && d.nadir.bounds.west != null) {
    if (overlayCtl) overlayCtl.style.display = 'flex';
    setOverlayFromBounds(d.nadir.url, d.nadir.bounds);
  } else if (overlayCtl) {
    overlayCtl.style.display = 'none';
  }
  const views = [
    { label: 'Alpha', badge: 'A', cls: '', data: d.alpha }, { label: 'Bravo', badge: 'B', cls: '', data: d.bravo },
    { label: 'Charlie', badge: 'C', cls: '', data: d.charlie }, { label: 'Delta', badge: 'D', cls: '', data: d.delta },
    { label: 'Nadir', badge: 'N', cls: 'nadir', data: d.nadir }
  ];
  lightboxViews = [];
  views.forEach(v => { if (v.data && v.data.url) lightboxViews.push({ label: v.label, url: v.data.url, bullets: formatDesc(v.data.desc || '') }); });
  let html = '';
  if (d.viewer360) {
    html += `<div class="interior-launch-card"><div class="interior-card-header"><div class="interior-card-title">3D Aerial View</div><div class="interior-card-sub">Interactive drone model</div></div><div class="interior-card-actions"><div class="interior-action-btn${djiViewerActive ? ' active' : ''}" onclick="showDjiViewer()"><div class="interior-action-text"><div class="interior-action-label">Launch 3D Viewer</div><div class="interior-action-desc">Full interactive drone flyover</div></div><div class="interior-action-arrow">›</div></div></div></div>`;
  }
  let lbIndex = 0;
  views.forEach(v => {
    if (!v.data || !v.data.url) return;
    const idx = lbIndex++;
    if (v.cls === 'nadir') {
      const s = nadirPinSets_(v.data);
      if (s.element.length || s.concern.length) { html += buildPinnedNadirSection(v, idx); return; }
    }
    const bullets = formatDesc(v.data.desc);
    html += `<div class="view-section"><div class="view-header" onclick="toggleSection(this)"><div class="view-badge ${v.cls}">${v.badge}</div><div class="view-label">${v.label}</div><div class="chevron">▼</div></div><div class="view-body"><div class="view-img-wrap" onclick="openLightbox(${idx})"><img class="view-img" src="${v.data.url}" alt="${v.label}" loading="lazy"><div class="zoom-hint">🔍 Tap to enlarge</div></div><ul class="view-bullets">${bullets.map(b => '<li>' + b + '</li>').join('')}</ul></div></div>`;
  });
  if (d.considerations) {
    html += '<div class="rec-block"><div class="rec-label security">Responder Considerations</div><div class="rec-text">' + d.considerations + '</div></div>';
  }
  if (d.clarifications) {
    html += '<div class="rec-block"><div class="rec-label wildfire">Information Needing Clarification</div><div class="rec-text">' + d.clarifications + '</div></div>';
  }
  document.getElementById('panel-content').innerHTML = html;
  updateGroundBanner();
}
function buildInteriorPanel(d) {
  clearMarkers();
  if (groundOverlay) { groundOverlay.setMap(null); }
  const hasMatterport = !!(d.viewer360), hasStreetView = !!(d.lat && d.lng);
  let html = '<div class="interior-launch-card"><div class="interior-card-header"><div class="interior-card-title">Ground Views</div><div class="interior-card-sub">360° property walkthrough & street context</div></div><div class="interior-card-actions">';
  if (hasMatterport) html += `<div class="interior-action-btn${matterportActive?' active':''}" id="panel-btn-matterport" onclick="launchImmersive('matterport')"><div class="interior-action-text"><div class="interior-action-label">Property Tour</div><div class="interior-action-desc">360° interior & exterior walkthrough</div></div><div class="interior-action-arrow">›</div></div>`;
  if (hasStreetView) html += `<div class="interior-action-btn${streetViewActive?' active':''}" id="panel-btn-streetview" onclick="launchImmersive('streetview')"><div class="interior-action-text"><div class="interior-action-label">Street View</div><div class="interior-action-desc">Approach routes & surroundings</div></div><div class="interior-action-arrow">›</div></div>`;
  if (!hasMatterport && !hasStreetView) html += '<div class="panel-empty">No ground views available.</div>';
  html += '</div></div>';
  document.getElementById('panel-content').innerHTML = html;
}
function updateGroundBanner() {
  const b = document.getElementById('ground-banner');
  if (!b) return;
  if (matterportActive || streetViewActive) {
    b.style.display = 'flex';
    b.querySelector('.ground-banner-label').textContent = 'Ground View Active';
    b.querySelector('.ground-banner-exit').textContent = '✕ Exit Ground View';
    b.querySelector('.ground-banner-exit').onclick = exitImmersive;
  } else if (djiViewerActive) {
    b.style.display = 'flex';
    b.querySelector('.ground-banner-label').textContent = '3D View Active';
    b.querySelector('.ground-banner-exit').textContent = '✕ Exit 3D View';
    b.querySelector('.ground-banner-exit').onclick = exitDjiViewer;
  } else {
    b.style.display = 'none';
  }
}
function syncOverlayWidth() {
  const overlay = document.getElementById('immersive-overlay');
  if (overlay) overlay.classList.toggle('panel-hidden', !panelOpen);
}
function launchImmersive(mode) {
  document.getElementById('immersive-overlay').classList.add('visible');
  syncOverlayWidth();
  if (djiViewerActive) { document.getElementById('matterport-iframe').src = ''; document.getElementById('matterport-iframe').classList.remove('visible'); djiViewerActive = false; }
  activeMarkers.forEach(m => m.setMap(null));
  document.getElementById('map-controls').style.display = 'none';
  if (mode === 'matterport') { showMatterport(); } else { showStreetView(); }
}
function showMatterport() {
  const d = currentViewData;
  if (!d || !d.viewer360) { dbg('No Matterport URL', 'warn'); return; }
  document.getElementById('immersive-overlay').classList.add('visible');
  document.getElementById('map-controls').style.display = 'none';
  activeMarkers.forEach(m => m.setMap(null));
  document.getElementById('street-view-div').classList.remove('visible');
  document.getElementById('matterport-iframe').src = d.viewer360;
  document.getElementById('matterport-iframe').classList.add('visible');
  matterportActive = true; streetViewActive = false;
  updateGroundBanner(); buildInteriorPanel(d);
  dbg('Matterport tour loaded', 'ok');
}
function showStreetView() {
  const d = currentViewData;
  if (!d || !d.lat || !d.lng) { dbg('No coordinates for Street View', 'warn'); return; }
  document.getElementById('matterport-iframe').src = ''; document.getElementById('matterport-iframe').classList.remove('visible');
  activeMarkers.forEach(m => m.setMap(null));
  document.getElementById('map-controls').style.display = 'none';
  document.getElementById('immersive-overlay').classList.add('visible');
  document.getElementById('street-view-div').classList.add('visible');
  const panorama = new google.maps.StreetViewPanorama(document.getElementById('street-view-div'), { position: { lat: d.lat, lng: d.lng }, pov: { heading: 0, pitch: 0 }, zoom: 1, addressControl: false, fullscreenControl: false, motionTrackingControl: false });
  map.setStreetView(panorama);
  matterportActive = false; streetViewActive = true;
  updateGroundBanner(); buildInteriorPanel(d);
  dbg('Street View loaded at ' + d.lat.toFixed(5) + ',' + d.lng.toFixed(5), 'ok');
}
function exitImmersive() {
  document.getElementById('immersive-overlay').classList.remove('visible');
  document.getElementById('matterport-iframe').src = ''; document.getElementById('matterport-iframe').classList.remove('visible');
  document.getElementById('street-view-div').classList.remove('visible');
  if (map) { const sv = map.getStreetView(); if (sv) sv.setVisible(false); map.setStreetView(null); }
  document.getElementById('map-controls').style.display = '';
  matterportActive = false; streetViewActive = false; djiViewerActive = false;
  activeMarkers.forEach(m => m.setMap(map));
  updateGroundBanner();
  const activeTab = document.querySelector('.view-tab.active');
  const activeView = activeTab ? activeTab.getAttribute('data-view') : null;
  if (activeView && activeView !== 'tour' && currentViews && currentViews[activeView]) { loadView(currentViews, activeView); }
  else if (currentViewData) { buildInteriorPanel(currentViewData); }
  dbg('Exited ground view', 'info');
}
function showDjiViewer() {
  if (djiViewerActive) return;
  const d = currentViewData;
  if (!d || !d.viewer360) { dbg('No DJI viewer URL', 'warn'); return; }
  document.getElementById('immersive-overlay').classList.add('visible');
  syncOverlayWidth();
  document.getElementById('map-controls').style.display = 'none';
  document.getElementById('street-view-div').classList.remove('visible');
  const iframe = document.getElementById('matterport-iframe');
  iframe.src = d.viewer360;
  iframe.classList.add('visible');
  activeMarkers.forEach(m => m.setMap(null));
  djiViewerActive = true; buildPanel(d);
  updateGroundBanner();
  dbg('DJI 3D viewer loaded: ' + d.viewer360, 'ok');
}
function exitDjiViewer() {
  document.getElementById('immersive-overlay').classList.remove('visible');
  document.getElementById('matterport-iframe').src = '';
  document.getElementById('matterport-iframe').classList.remove('visible');
  document.getElementById('map-controls').style.display = '';
  activeMarkers.forEach(m => m.setMap(map));
  djiViewerActive = false;
  updateGroundBanner();
  const activeTab = document.querySelector('.view-tab.active');
  const activeView = activeTab ? activeTab.getAttribute('data-view') : null;
  if (activeView && currentViews && currentViews[activeView]) { loadView(currentViews, activeView); }
  else if (currentViewData) { buildPanel(currentViewData); }
  dbg('Exited DJI 3D viewer', 'info');
}
async function loadView(views, viewSuffix) {
  const hashedViewId = views[viewSuffix];
  if (!hashedViewId) return;
  document.querySelectorAll('.view-tab').forEach(t => t.classList.toggle('active', t.getAttribute('data-view') === viewSuffix));
  document.getElementById('panel-content').innerHTML = '<div class="panel-empty">Loading ' + viewSuffix + '...</div>';
  try {
    dbg('Loading ' + viewSuffix + '...', 'info');
    const res = await fetch(viewBaseUrl(viewSuffix) + hashedViewId + '.json');
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const d = await res.json();
    currentViewData = d;
    const centerLat = d.lat || (map ? map.getCenter().lat() : 0);
    const centerLng = d.lng || (map ? map.getCenter().lng() : 0);
    if (viewSuffix === 'security' && d.fr)            { buildSecurityPanel(d, centerLat, centerLng); }
    else if (viewSuffix === 'wildfire' && d.wildfire)  { buildWildfirePanel(d, centerLat, centerLng); }
    else if (viewSuffix === 'tour')                    { buildInteriorPanel(d); }
    else if (d.fr || d.wildfire)                      { clearMarkers(); document.getElementById('panel-content').innerHTML = '<div class="panel-empty">Use the <strong style="color:var(--green)">Security</strong> or <strong style="color:var(--orange)">Wildfire</strong> tabs.</div>'; }
    else                                               { buildPanel(d); }
    dbg('View loaded: ' + viewSuffix, 'ok');
  } catch(e) { dbg('View load failed: ' + e.message, 'error'); document.getElementById('panel-content').innerHTML = '<div class="panel-empty" style="color:var(--red)">Failed to load: ' + e.message + '</div>'; }
}
function openLightbox(index) { lightboxIndex = index; updateLightbox(); document.getElementById('lightbox').classList.add('open'); document.addEventListener('keydown', lightboxKey); }
function closeLightbox() { document.getElementById('lightbox').classList.remove('open'); document.removeEventListener('keydown', lightboxKey); }
function lightboxKey(e) { if (e.key === 'Escape') closeLightbox(); if (e.key === 'ArrowLeft') lightboxNav(-1); if (e.key === 'ArrowRight') lightboxNav(1); }
function lightboxNav(dir) { lightboxIndex = (lightboxIndex + dir + lightboxViews.length) % lightboxViews.length; updateLightbox(); }
function updateLightbox() {
  const v = lightboxViews[lightboxIndex];
  document.getElementById('lightbox-img').src = v.url;
  document.getElementById('lightbox-title').textContent = v.label;
  document.getElementById('lightbox-counter').textContent = (lightboxIndex + 1) + ' / ' + lightboxViews.length;
  document.getElementById('lightbox-bullets').innerHTML = v.bullets.map(b => '<li>' + b + '</li>').join('');
}
async function loadPropertyData() {
  dbg(VERSION + ' — Property Intel loaded', 'ok');
  const params = new URLSearchParams(window.location.search);
  const propertyHash = params.get('property'), tabParam = params.get('tab');
  frMode = params.get('mode') === 'fr';
  if (!propertyHash) { showError('No property ID provided.'); return; }
  if (frMode) dbg('FR mode — single view, tabs hidden', 'info');
  dbg('Property hash: ' + propertyHash.substring(0,12) + '...', 'info');
  try {
    setLoading('Loading property index...');
    // v2.8.0: per-property index file (data/index/{id}.json) replaces the
    // monolithic index.json. The file IS the entry — identity + views map.
    const indexRes = await fetch(DATA_ROOT + 'index/' + propertyHash + '.json');
    if (!indexRes.ok) { showError('Property not found.'); return; }
    const entry = await indexRes.json();
    if (!entry || !entry.views) { showError('Property not found.'); return; }
    dbg('Property found: ' + entry.name, 'ok');
    const propRes = await fetch(BASE_URL + propertyHash + '.json');
    const propData = propRes.ok ? await propRes.json() : null;
    const views = Object.assign({}, entry.views);
    if (propData && propData.viewer360) { views['tour'] = propertyHash; dbg('viewer360 found — Tour tab enabled', 'ok'); }
    currentViews = views;
    document.getElementById('property-name').textContent = entry.name;
    document.getElementById('panel-title').textContent = entry.name;
    document.getElementById('panel-address').textContent = (entry.address || '').replace(/^\s+/, '');
    if (frMode) document.getElementById('view-tabs').style.display = 'none';
    dbg('Available views: ' + Object.keys(views).join(', '), 'info');
    // v2.8.0: if a specific tab was requested but isn't published for this
    // property, say so plainly rather than silently loading a different view.
    if (tabParam && !views[tabParam]) {
      showError('The ' + (VIEW_LABELS[tabParam] || tabParam) + ' view isn’t published yet for ' + (entry.name || 'this property') + '.');
      return;
    }
    const firstView = (tabParam && views[tabParam]) ? tabParam : VIEW_ORDER.find(v => views[v]);
    if (!firstView) { showError('No views available.'); return; }
    if (!frMode) buildTabs(views, firstView);
    setLoading('Loading ' + firstView + '...');
    await loadView(views, firstView);
    const storedRing = currentViewData && currentViewData.parcel_ring || null;
    if (storedRing) dbg('Stored parcel ring found (' + storedRing.length + ' pts)', 'ok');
    if (mapsApiReady) { resolveAndInitMap(entry, storedRing); }
    else { pendingEntry = entry; pendingStoredRing = storedRing; }
  } catch(e) { showError('Failed to load property: ' + e.message); }
}
window.initGoogleMaps = function() {
  mapsApiReady = true;
  dbg('Google Maps API ready', 'ok');
  if (pendingEntry) { resolveAndInitMap(pendingEntry, pendingStoredRing || null); pendingEntry = null; pendingStoredRing = null; }
};
loadPropertyData();
</script>
<script async defer src="https://maps.googleapis.com/maps/api/js?key=AIzaSyD2tWrnRhCaicAwtp_32xe5zG5YGuntfuI&callback=initGoogleMaps"></script>

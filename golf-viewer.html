<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Golf Viewer — Property Intel</title>
<!--
  golf-viewer.html — map for one broken-out golf course (v1.0.2)

  Not linked from the responder hub. Each course sheet writes an
  Open map link on row 1 (columns I–J):
    golf-viewer.html?sheet=Awbrey%20Glen

  Pins, handmade descriptions, and Nearmap image URLs come from that
  course sheet via the critique web app:
    GET ?route=golf-course&sheet=

  The Golf tab is not read here. Nothing is saved from this page.
  Click a numbered marker for a card (same idea as the 2D camera card
  in viewer.html): image, pin name, description. Click the image
  to expand it.

  Maps key: the same browser Maps JavaScript key as golf-review.html.
  config.js GEOCODE_KEY is a different key and Google rejects it here.
-->
<style>
  :root {
    --ground:    #1b2027;
    --panel:     #232a33;
    --panel-2:   #2b333e;
    --line:      #3a444f;
    --ink:       #eef2f6;
    --ink-dim:   #9aa7b4;
    --ink-faint: #667380;
    --marker:    #ffd23f;
    --marker-ink:#1b2027;
    --hot:       #4fd1c5;
    --bad:       #ef6f6f;
    --radius:    10px;
    --mono: ui-monospace, "SF Mono", "Cascadia Code", "Roboto Mono", Menlo, monospace;
    --sans: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; }
  body {
    background: var(--ground);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 15px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  header {
    display: flex; align-items: baseline; gap: 14px;
    padding: 14px 20px;
    border-bottom: 1px solid var(--line);
    background: var(--panel);
  }
  header .kicker {
    font-family: var(--mono);
    font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase;
    color: var(--ink-faint);
  }
  header h1 { font-size: 15px; font-weight: 600; margin: 0; color: var(--ink); }
  header .addr { color: var(--ink-dim); font-weight: 400; }
  header .count {
    margin-left: auto;
    font-family: var(--mono); font-size: 12px; color: var(--ink-dim);
  }
  header .count b { color: var(--marker); font-weight: 600; }
  header .build {
    font-family: var(--mono); font-size: 10px; letter-spacing: 0.08em;
    color: var(--ink-faint); border: 1px solid var(--line);
    border-radius: 5px; padding: 2px 6px; margin-left: 10px;
  }
  main {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 320px;
    height: calc(100% - 51px);
  }
  @media (max-width: 900px) {
    html, body { height: auto; overflow: auto; }
    main { grid-template-columns: 1fr; height: auto; }
    .stage { min-height: 60vh; }
  }
  .stage { position: relative; overflow: hidden; background: #0a0c0f; }
  #map { position: absolute; inset: 0; width: 100%; height: 100%; }
  .map-loading, .error-box {
    position: absolute; inset: 0; z-index: 6;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 12px;
    background: rgba(10, 12, 15, 0.92);
    color: var(--ink-dim);
    text-align: center;
    padding: 24px;
  }
  .error-box { z-index: 7; color: var(--ink); }
  .error-box code {
    display: block; margin-top: 8px;
    font-family: var(--mono); font-size: 12px; color: var(--bad);
    white-space: pre-wrap;
  }
  .spinner {
    width: 28px; height: 28px; border-radius: 50%;
    border: 2px solid var(--line); border-top-color: var(--marker);
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .panel {
    background: var(--panel);
    border-left: 1px solid var(--line);
    display: flex; flex-direction: column;
    min-height: 0; min-width: 0;
  }
  .panel h2 {
    margin: 0;
    padding: 14px 18px 10px;
    font-family: var(--mono);
    font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase;
    color: var(--ink-faint);
    border-bottom: 1px solid var(--line);
  }
  .panel-scroll { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 8px 12px 16px; }
  #pinList { list-style: none; margin: 0; padding: 0; }
  #pinList li {
    display: flex; align-items: flex-start; gap: 8px;
    padding: 7px 6px;
    border-bottom: 1px solid var(--line);
    cursor: pointer;
    border-radius: 6px;
  }
  #pinList li:hover, #pinList li.on { background: rgba(79, 209, 197, 0.08); }
  #pinList .num {
    flex: 0 0 22px;
    font-family: var(--mono); font-size: 11px; font-weight: 700;
    color: var(--marker-ink);
    background: var(--marker);
    border-radius: 10px;
    text-align: center;
    line-height: 18px;
    margin-top: 1px;
  }
  #pinList .copy { min-width: 0; flex: 1 1 auto; }
  #pinList .name { font-size: 13px; color: var(--ink); }
  #pinList .meta { font-size: 11px; color: var(--ink-faint); }
  #pinList .thumb {
    margin-left: auto;
    width: 72px; height: 48px; flex: 0 0 72px;
    object-fit: cover; border-radius: 4px; background: #12161b;
  }
  .empty-note { color: var(--ink-faint); font-size: 13px; padding: 12px 6px; }

  /* Floating card, same job as viewer.html #cam-popup. Not a Maps InfoWindow. */
  #pin-popup {
    display: none; position: fixed; z-index: 71;
    transform: translate(-50%, -100%);
    width: 280px; background: rgba(10, 12, 15, 0.96);
    border: 1px solid #38bdf8; border-radius: 8px; overflow: hidden;
    box-shadow: 0 4px 18px rgba(0, 0, 0, 0.6); pointer-events: auto;
  }
  #pin-pop-img {
    width: 100%; height: 160px; object-fit: cover; display: none;
    cursor: zoom-in; border-bottom: 1px solid rgba(255, 255, 255, 0.10);
    background: #12161b;
  }
  #pin-pop-img.on { display: block; }
  #pin-pop-body { padding: 8px 10px 10px; }
  #pin-pop-name {
    font-size: 13px; font-weight: 600; color: #f0f2f5; line-height: 1.35;
    padding-right: 16px;
  }
  #pin-pop-meta {
    font-family: var(--mono); font-size: 10px; color: #8a93a2; margin-top: 3px;
  }
  #pin-pop-desc {
    margin-top: 8px;
    font-size: 12.5px; line-height: 1.45; color: #e7ebf0;
    white-space: pre-wrap;
    max-height: 140px; overflow-y: auto;
  }
  #pin-pop-desc.empty { color: #667380; font-style: italic; }
  #pin-pop-hint {
    font-family: var(--mono); font-size: 9px; color: #555f6e; margin-top: 6px;
    display: none;
  }
  #pin-pop-hint.on { display: block; }
  #pin-pop-close {
    position: absolute; right: 4px; top: 4px; width: 18px; height: 18px;
    border: none; border-radius: 4px; background: rgba(10, 12, 15, 0.75);
    color: #8a93a2; font-size: 12px; line-height: 1; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    z-index: 2;
  }
  #pin-pop-close:hover { color: #f0f2f5; }
  #pin-lightbox {
    display: none; position: fixed; inset: 0; z-index: 90;
    background: rgba(6, 8, 11, 0.92); padding: 24px;
    align-items: center; justify-content: center; flex-direction: column; gap: 12px;
  }
  #pin-lightbox.open { display: flex; }
  #pin-lb-img {
    max-width: min(92vw, 960px); max-height: 70vh; border-radius: 10px;
    border: 1px solid rgba(255, 255, 255, 0.14); display: block;
    object-fit: contain; background: #12161b;
  }
  #pin-lb-title { color: #f0f2f5; font-size: 14px; font-weight: 600; }
  #pin-lb-desc {
    max-width: min(92vw, 720px); color: #c5ced6; font-size: 13px;
    white-space: pre-wrap; text-align: center;
  }
  #pin-lb-close {
    border: 1px solid rgba(255, 255, 255, 0.2); background: transparent;
    color: #f0f2f5; border-radius: 6px; padding: 6px 14px; cursor: pointer;
    font-family: var(--sans); font-size: 13px;
  }
  #pin-lb-close:hover { border-color: #38bdf8; color: #38bdf8; }
</style>
</head>
<body>
  <header>
    <span class="kicker">Golf</span>
    <h1 id="title"><span id="courseName">Awbrey Glen</span> <span class="addr" id="addr"></span></h1>
    <span class="count" id="count"></span>
    <span class="build" id="build"></span>
  </header>
  <main id="app">
    <section class="stage" id="stage">
      <div id="map"></div>
      <div class="map-loading" id="mapLoading">
        <div class="spinner"></div>
        <div id="loadingText">Loading course sheet…</div>
      </div>
    </section>
    <aside class="panel">
      <h2>Pins</h2>
      <div class="panel-scroll">
        <ul id="pinList"></ul>
      </div>
    </aside>
  </main>
  <div id="pin-popup">
    <button type="button" id="pin-pop-close" onclick="hidePinPopup()">&#10005;</button>
    <img id="pin-pop-img" alt="" onclick="expandPinPopup()">
    <div id="pin-pop-body">
      <div id="pin-pop-name"></div>
      <div id="pin-pop-meta"></div>
      <div id="pin-pop-desc"></div>
      <div id="pin-pop-hint">click image to expand</div>
    </div>
  </div>
  <div id="pin-lightbox">
    <img id="pin-lb-img" alt="">
    <div id="pin-lb-title"></div>
    <div id="pin-lb-desc"></div>
    <button type="button" id="pin-lb-close" onclick="closePinLightbox()">Close</button>
  </div>
<script>
(function () {
  var BUILD = 'v1.0.2';
  var GOLF_API_URL = 'https://script.google.com/macros/s/AKfycbzHkj4fNRBJ7839babxL2Gp1A2ka9Em05rOQRZUNg_X0lMrOAMEKtEXEXxuU9_u7iKERA/exec';
  var MAPS_KEY = 'AIzaSyD2tWrnRhCaicAwtp_32xe5zG5YGuntfuI';

  var sheetName = 'Awbrey Glen';
  var pins = [];
  var map = null;
  var mapProj = null;
  var markers = [];
  var popupIdx = -1;
  var mapsStarted = false;
  var course = null;

  var buildEl = document.getElementById('build');
  if (buildEl) buildEl.textContent = BUILD;

  function qp(name) {
    var m = new RegExp('[?&]' + name + '=([^&]*)').exec(window.location.search);
    if (!m) return '';
    try { return decodeURIComponent(m[1].replace(/\+/g, ' ')); }
    catch (e) { return ''; }
  }

  var fromUrl = qp('sheet').trim();
  if (fromUrl) sheetName = fromUrl;

  function escapeHtml(s) {
    return String(s || '').replace(/[&<>"']/g, function (c) {
      return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c];
    });
  }

  function safeImageUrl(raw) {
    var s = String(raw || '').trim();
    if (!/^https:\/\//i.test(s)) return '';
    return s;
  }

  function hideLoading() {
    var el = document.getElementById('mapLoading');
    if (el) el.style.display = 'none';
  }

  function fail(msg, detail) {
    hideLoading();
    var stage = document.getElementById('stage');
    if (!stage) return;
    var box = document.createElement('div');
    box.className = 'error-box';
    box.innerHTML = escapeHtml(msg) + (detail ? '<code>' + escapeHtml(detail) + '</code>' : '');
    stage.appendChild(box);
  }

  function markerIcon() {
    return {
      path: google.maps.SymbolPath.CIRCLE,
      scale: 12,
      fillColor: '#ffd23f',
      fillOpacity: 1,
      strokeColor: '#1b2027',
      strokeWeight: 2
    };
  }

  function renderList() {
    var host = document.getElementById('pinList');
    if (!host) return;
    host.innerHTML = '';
    if (!pins.length) {
      var empty = document.createElement('div');
      empty.className = 'empty-note';
      empty.textContent = 'No pins on this sheet yet.';
      host.appendChild(empty);
      return;
    }
    pins.forEach(function (pin, i) {
      var li = document.createElement('li');
      li.id = 'pin-row-' + i;
      if (i === popupIdx) li.className = 'on';
      var bits = [];
      if (pin.id) bits.push('#' + pin.id);
      if (pin.section) bits.push(pin.section);
      if (pin.missing) bits.push('missing from Golf tab');
      var meta = bits.join(' · ');
      li.innerHTML =
        '<span class="num">' + escapeHtml(pin.pin) + '</span>' +
        '<span class="copy"><span class="name">' + escapeHtml(pin.name || ('Pin ' + pin.pin)) + '</span>' +
        '<div class="meta">' + escapeHtml(meta) + '</div></span>';
      var thumbUrl = safeImageUrl(pin.image_url);
      if (thumbUrl) {
        var thumb = document.createElement('img');
        thumb.className = 'thumb';
        thumb.alt = '';
        thumb.src = thumbUrl;
        li.appendChild(thumb);
      }
      li.addEventListener('click', function () { selectPin(i); });
      host.appendChild(li);
    });
  }

  function updateCount() {
    var el = document.getElementById('count');
    if (el) el.innerHTML = '<b>' + pins.length + '</b> pins';
  }

  function fillHeader() {
    var nameEl = document.getElementById('courseName');
    var addr = document.getElementById('addr');
    var name = (course && course.name) || sheetName;
    if (nameEl) nameEl.textContent = name;
    if (addr) addr.textContent = (course && course.address) || '';
    document.title = name + ' — Golf Viewer';
  }

  function dropMarkers() {
    markers.forEach(function (m) { m.setMap(null); });
    markers = [];
    if (!map) return;
    var bounds = new google.maps.LatLngBounds();
    var any = false;
    pins.forEach(function (pin, i) {
      var lat = Number(pin.lat);
      var lng = Number(pin.lng);
      if (!isFinite(lat) || !isFinite(lng)) return;
      var marker = new google.maps.Marker({
        map: map,
        position: { lat: lat, lng: lng },
        optimized: false,
        zIndex: 10 + (Number(pin.pin) || i + 1),
        icon: markerIcon(),
        label: {
          text: String(pin.pin),
          color: '#1b2027',
          fontSize: '11px',
          fontWeight: '700'
        },
        title: pin.name || ('Pin ' + pin.pin)
      });
      marker.addListener('click', function () { showPinPopup(i); });
      markers.push(marker);
      bounds.extend(marker.getPosition());
      any = true;
    });
    if (any) {
      if (pins.length === 1) {
        map.setCenter(bounds.getCenter());
        map.setZoom(18);
      } else {
        map.fitBounds(bounds, 48);
      }
    }
  }

  function updatePinPopup() {
    var el = document.getElementById('pin-popup');
    if (popupIdx < 0 || !el || el.style.display === 'none') return;
    var pin = pins[popupIdx];
    if (!pin) return;
    var proj = map && mapProj && mapProj.getProjection && mapProj.getProjection();
    if (proj) {
      var pt = proj.fromLatLngToContainerPixel(new google.maps.LatLng(pin.lat, pin.lng));
      if (pt && map) {
        var r = map.getDiv().getBoundingClientRect();
        el.style.visibility = 'visible';
        el.style.left = (r.left + pt.x) + 'px';
        el.style.top = (r.top + pt.y - 16) + 'px';
        return;
      }
    }
    var stage = document.getElementById('stage');
    var box = stage ? stage.getBoundingClientRect() : { left: 24, top: 80, width: 480 };
    el.style.visibility = 'visible';
    el.style.left = (box.left + Math.min(box.width * 0.5, 280)) + 'px';
    el.style.top = (box.top + 240) + 'px';
  }

  function showPinPopup(idx) {
    var pin = pins[idx];
    if (!pin) return;
    closePinLightbox();
    popupIdx = idx;
    var img = document.getElementById('pin-pop-img');
    var hint = document.getElementById('pin-pop-hint');
    var url = safeImageUrl(pin.image_url);
    if (img) {
      if (url) {
        img.src = url;
        img.alt = pin.name || 'Nearmap still';
        img.className = 'on';
      } else {
        img.removeAttribute('src');
        img.className = '';
      }
    }
    if (hint) hint.className = url ? 'on' : '';
    var nameEl = document.getElementById('pin-pop-name');
    if (nameEl) nameEl.textContent = pin.name || ('Pin ' + pin.pin);
    var bits = [];
    if (pin.section) bits.push(pin.section);
    bits.push('pin ' + pin.pin);
    if (pin.id) bits.push('#' + pin.id);
    if (pin.missing) bits.push('missing from Golf tab');
    var meta = document.getElementById('pin-pop-meta');
    if (meta) meta.textContent = bits.join('  ·  ');
    var desc = document.getElementById('pin-pop-desc');
    if (desc) {
      var text = String(pin.description || '').trim();
      desc.textContent = text || 'No description yet';
      desc.className = text ? '' : 'empty';
    }
    var pop = document.getElementById('pin-popup');
    if (pop) {
      pop.style.display = 'block';
      pop.style.visibility = 'hidden';
    }
    renderList();
    var row = document.getElementById('pin-row-' + idx);
    if (row && row.scrollIntoView) row.scrollIntoView({ block: 'nearest' });
    updatePinPopup();
  }

  function hidePinPopup() {
    popupIdx = -1;
    var el = document.getElementById('pin-popup');
    if (el) el.style.display = 'none';
    closePinLightbox();
    renderList();
  }

  function expandPinPopup() {
    if (popupIdx < 0) return;
    var pin = pins[popupIdx];
    if (!pin) return;
    var url = safeImageUrl(pin.image_url);
    if (!url) return;
    var img = document.getElementById('pin-lb-img');
    var title = document.getElementById('pin-lb-title');
    var desc = document.getElementById('pin-lb-desc');
    var box = document.getElementById('pin-lightbox');
    if (img) {
      img.src = url;
      img.alt = pin.name || 'Nearmap still';
    }
    if (title) title.textContent = pin.name || ('Pin ' + pin.pin);
    if (desc) desc.textContent = String(pin.description || '').trim();
    if (box) box.className = 'open';
  }

  function closePinLightbox() {
    var box = document.getElementById('pin-lightbox');
    if (box) box.className = '';
    var img = document.getElementById('pin-lb-img');
    if (img) img.removeAttribute('src');
  }

  function selectPin(i) {
    var pin = pins[i];
    if (!pin) return;
    if (map) map.panTo({ lat: Number(pin.lat), lng: Number(pin.lng) });
    showPinPopup(i);
  }

  function initMap() {
    if (map) return;
    var first = pins[0];
    var center = first
      ? { lat: Number(first.lat), lng: Number(first.lng) }
      : { lat: Number(course && course.lat), lng: Number(course && course.lng) };
    if (!isFinite(center.lat) || !isFinite(center.lng)) {
      center = { lat: 44.05, lng: -121.31 };
    }
    map = new google.maps.Map(document.getElementById('map'), {
      center: center,
      zoom: 16,
      mapTypeId: 'satellite',
      tilt: 0,
      rotateControl: false,
      streetViewControl: false,
      fullscreenControl: false,
      mapTypeControl: false,
      gestureHandling: 'greedy',
      clickableIcons: false
    });
    map.setTilt(0);
    map.addListener('click', function () { hidePinPopup(); });
    map.addListener('idle', function () { updatePinPopup(); });
    var helper = new google.maps.OverlayView();
    helper.onAdd = function () {};
    helper.draw = function () { updatePinPopup(); };
    helper.onRemove = function () {};
    helper.setMap(map);
    mapProj = helper;
    google.maps.event.addListenerOnce(map, 'tilesloaded', hideLoading);
    google.maps.event.addListenerOnce(map, 'idle', hideLoading);
    setTimeout(hideLoading, 12000);
    dropMarkers();
  }

  function loadMaps() {
    if (!MAPS_KEY) {
      fail('Maps key missing.');
      return;
    }
    if (window.google && window.google.maps) { initMap(); return; }
    if (mapsStarted) return;
    mapsStarted = true;
    window.golfViewerMapsReady = function () { initMap(); };
    var sc = document.createElement('script');
    sc.async = true;
    sc.defer = true;
    sc.src = 'https://maps.googleapis.com/maps/api/js?key=' + encodeURIComponent(MAPS_KEY) +
      '&callback=golfViewerMapsReady';
    sc.onerror = function () {
      fail('Google Maps failed to load.');
    };
    document.head.appendChild(sc);
  }

  function applyCourse(data) {
    course = data || {};
    pins = (course.pins || []).filter(function (p) {
      return p && isFinite(Number(p.lat)) && isFinite(Number(p.lng));
    }).map(function (p, i) {
      var n = parseInt(p.pin, 10);
      return {
        pin: isFinite(n) ? n : (i + 1),
        id: parseInt(p.id, 10) || 0,
        name: String(p.name || '').trim(),
        section: String(p.section || '').trim(),
        lat: Number(p.lat),
        lng: Number(p.lng),
        description: String(p.description || '').trim(),
        image_url: String(p.image_url || '').trim(),
        missing: p.missing === true
      };
    });
    fillHeader();
    updateCount();
    renderList();
    var loadingText = document.getElementById('loadingText');
    if (loadingText) loadingText.textContent = 'Loading map…';
    loadMaps();
  }

  window.hidePinPopup = hidePinPopup;
  window.expandPinPopup = expandPinPopup;
  window.closePinLightbox = closePinLightbox;

  var lightbox = document.getElementById('pin-lightbox');
  if (lightbox) {
    lightbox.addEventListener('click', function (e) {
      if (e.target === lightbox) closePinLightbox();
    });
  }

  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Escape') return;
    var box = document.getElementById('pin-lightbox');
    if (box && box.className === 'open') { closePinLightbox(); return; }
    hidePinPopup();
  });

  var loadingText = document.getElementById('loadingText');
  if (loadingText) loadingText.textContent = 'Loading ' + sheetName + '…';

  fetch(GOLF_API_URL + '?route=golf-course&sheet=' + encodeURIComponent(sheetName) + '&_=' + Date.now(), {
    redirect: 'follow'
  }).then(function (r) { return r.text(); })
    .then(function (t) {
      var j;
      try { j = JSON.parse(t); }
      catch (e) { throw new Error('Course API did not return JSON'); }
      if (!j || j.ok === false) throw new Error((j && j.error) || 'Course API error');
      applyCourse(j);
    })
    .catch(function (err) {
      fail('Could not load "' + sheetName + '".', err && err.message ? err.message : String(err));
    });
})();
</script>
</body>
</html>

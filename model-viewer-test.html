<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Property 3D Viewer</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; background: #111318; overflow: hidden; font-family: monospace; }
  canvas { display: block; }
  #loading {
    position: fixed; inset: 0; background: #111318;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 16px; z-index: 100; transition: opacity 0.5s ease;
  }
  #loading.hidden { opacity: 0; pointer-events: none; }
  .spin {
    width: 36px; height: 36px;
    border: 2px solid rgba(168,85,247,0.2);
    border-top-color: #a855f7;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .load-text { font-size: 12px; color: #555f6e; }
  #progress { font-size: 11px; color: #3d4752; margin-top: 4px; }
  #err {
    display: none; position: fixed; inset: 0;
    align-items: center; justify-content: center; flex-direction: column;
    gap: 12px; background: #0a0c0f; color: #8a93a2;
    font-size: 13px; text-align: center; padding: 32px; z-index: 200;
  }
  #err.visible { display: flex; }
  #err strong { color: #ef4444; font-size: 15px; }
  #hint {
    position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
    background: rgba(0,0,0,0.5); color: #555f6e; font-size: 11px;
    padding: 6px 14px; border-radius: 20px; pointer-events: none;
    transition: opacity 1s ease; z-index: 50;
  }
  #hint.hidden { opacity: 0; }
</style>
</head>
<body>
<div id="loading">
  <div class="spin"></div>
  <div class="load-text">Loading property model...</div>
  <div id="progress"></div>
</div>
<div id="err">
  <strong>Could not load model</strong>
  <span id="err-msg" style="font-size:11px;opacity:0.6;margin-top:6px;"></span>
</div>
<div id="hint">Left drag to pan · Middle drag to rotate · Right drag to zoom</div>
<button id="resetBtn" onclick="resetView()" style="
  position: fixed; bottom: 48px; right: 16px; z-index: 50;
  background: rgba(0,0,0,0.6); color: #8a93a2; border: 1px solid #2a3040;
  font-family: monospace; font-size: 11px; padding: 6px 12px;
  border-radius: 6px; cursor: pointer; transition: color 0.2s;
" onmouseover="this.style.color='#fff'" onmouseout="this.style.color='#8a93a2'">
  ↑ Reset View
</button>

<script type="importmap">
{
  "imports": {
    "three": "https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.module.js"
  }
}
</script>

<script type="module">
import * as THREE from 'three';

// Load GLTFLoader and OrbitControls from three.js examples CDN
const BASE = 'https://cdn.jsdelivr.net/npm/three@0.128.0/examples/jsm';

const { GLTFLoader }     = await import(`${BASE}/loaders/GLTFLoader.js`);
const { DRACOLoader }    = await import(`${BASE}/loaders/DRACOLoader.js`);
const { OrbitControls }  = await import(`${BASE}/controls/OrbitControls.js`);

// ── URL param ─────────────────────────────────────────────────────────
const params  = new URLSearchParams(window.location.search);
const glbUrl  = params.get('model');

// Optional programmatic camera positioning for headless capture
// (see capture_obliques.py). azimuth/polar are compass bearing + elevation
// angle in degrees, both measured the same way compute_frontage.py's
// output uses them: azimuth 0=north/90=east/180=south/270=west, polar =
// elevation of the camera above the horizon (45 matches the default
// hand-tuned "DJI-style" framing already used below).
const autocapture = params.get('autocapture') === '1';
const azimuthParam = parseFloat(params.get('azimuth'));
// zoom > 1 pulls the camera closer than the default full-parcel framing.
// The default distance is scaled to fit the WHOLE clipped parcel (including
// open land around the structure), which is often much wider than the
// house itself — zoom divides that distance down for a tighter crop.
const zoomParam = parseFloat(params.get('zoom'));
const zoom = isNaN(zoomParam) ? 1.0 : zoomParam;
// Address point's horizontal position in the GLB's local frame (computed
// by compute_frontage.py using the same ECEF transform as
// clip_parcel_textured.py). Used to center oblique framing on the actual
// house location instead of guessing from mesh geometry.
const focusXParam = parseFloat(params.get('focus_x'));
const focusYParam = parseFloat(params.get('focus_y'));
const hasFocusPoint = !isNaN(focusXParam) && !isNaN(focusYParam);
const polarParam   = parseFloat(params.get('polar'));
const hasCaptureAngles = !isNaN(azimuthParam) && !isNaN(polarParam);

if (!glbUrl) {
  showErr('No model URL provided. Add ?model=https://... to the URL.');
}

if (autocapture) {
  // Headless Chromium has no mouse — hide interactive chrome so it never
  // shows up in a screenshot, and don't wait on the 4s hint fade timer.
  document.getElementById('hint').classList.add('hidden');
  document.getElementById('resetBtn').style.display = 'none';
}

// Same axis convention as positionCameraForDefaultView below: Z-up,
// +Y = north, +X = east (confirmed by the existing default view's
// "-Y (south)" camera offset). azimuth = compass bearing of the camera's
// position relative to the model center (i.e. an azimuth of 180/south
// reproduces this file's original default view when polar=45).
function positionCameraCompass(camera, center, azimuthDeg, elevationDeg, distance) {
  const az = THREE.MathUtils.degToRad(azimuthDeg);
  const el = THREE.MathUtils.degToRad(elevationDeg);
  const horiz = distance * Math.cos(el);
  const up = distance * Math.sin(el);
  const east = horiz * Math.sin(az);
  const north = horiz * Math.cos(az);

  camera.position.set(center.x + east, center.y + north, center.z + up);
  camera.up.set(0, 0, 1);
  camera.lookAt(center);
}

// Samples the mesh's actual height (z) at a given horizontal (x, y)
// Finds the tallest cluster of geometry within a bounded radius of a
// given (x, y) anchor point. Used with two passes: a coarse pass anchored
// on the address point (which can be tens of meters from the actual
// house on larger lots — an address pin often sits near the road, not
// the structure), then a tight refinement pass anchored on the coarse
// result. This two-pass design is deliberate: a single wide pass risks
// sweeping in elevated terrain unrelated to the house (sloped high-desert
// lots can have a hillside taller/wider than the house itself); a single
// narrow pass risks missing the house entirely if it's far from the
// address point. Bounding to a local neighborhood (rather than scanning
// the whole parcel) also avoids the earlier failure mode where a wide
// sloped ridge out-competed a small house footprint for cluster size.
function findStructureNearPoint(model, allPoints, focusX, focusY, searchRadius, percentile) {
  const rSq = searchRadius * searchRadius;
  const nearby = [];
  for (let i = 0; i < allPoints.length; i += 3) {
    const dx = allPoints[i] - focusX, dy = allPoints[i + 1] - focusY;
    if (dx * dx + dy * dy <= rSq) {
      nearby.push(allPoints[i], allPoints[i + 1], allPoints[i + 2]);
    }
  }
  if (nearby.length === 0) return null;

  const zs = [];
  for (let i = 2; i < nearby.length; i += 3) zs.push(nearby[i]);
  zs.sort((a, b) => a - b);
  const heightThreshold = zs[Math.floor(percentile * (zs.length - 1))];

  let sumX = 0, sumY = 0, sumZ = 0, n = 0;
  let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
  for (let i = 0; i < nearby.length; i += 3) {
    const x = nearby[i], y = nearby[i + 1], z = nearby[i + 2];
    if (z < heightThreshold) continue;
    sumX += x; sumY += y; sumZ += z; n++;
    minX = Math.min(minX, x); maxX = Math.max(maxX, x);
    minY = Math.min(minY, y); maxY = Math.max(maxY, y);
  }
  if (n === 0) return null;

  return {
    center: new THREE.Vector3(sumX / n, sumY / n, sumZ / n),
    radius: Math.max(maxX - minX, maxY - minY) / 2,
  };
}

function getAllModelPoints(model) {
  const pts = [];
  model.updateMatrixWorld(true);
  const v = new THREE.Vector3();
  model.traverse((child) => {
    if (!child.isMesh || !child.geometry) return;
    const posAttr = child.geometry.attributes.position;
    if (!posAttr) return;
    for (let i = 0; i < posAttr.count; i++) {
      v.fromBufferAttribute(posAttr, i);
      v.applyMatrix4(child.matrixWorld);
      pts.push(v.x, v.y, v.z);
    }
  });
  return pts;
}

// ── Scene setup ───────────────────────────────────────────────────────
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(window.devicePixelRatio);
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color('#111318');

const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100000);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.screenSpacePanning = true;
controls.minDistance = 10;
controls.maxDistance = 5000;
controls.mouseButtons = {
  LEFT: THREE.MOUSE.PAN,
  MIDDLE: THREE.MOUSE.ROTATE,
  RIGHT: THREE.MOUSE.DOLLY
};
controls.enableZoom = true;
controls.zoomSpeed = 1.0;
// Hard lock: camera can only go from straight down (0) to horizon (90°)
// Cannot go underneath — matches DJI viewer behavior
controls.minPolarAngle = 0;
controls.maxPolarAngle = Math.PI / 2;

// Lighting
const ambient = new THREE.AmbientLight(0xffffff, 0.7);
scene.add(ambient);
const sun = new THREE.DirectionalLight(0xffffff, 1.2);
sun.position.set(1, 2, 2);
scene.add(sun);

// ── Load GLB ─────────────────────────────────────────────────────────
const dracoLoader = new DRACOLoader();
dracoLoader.setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.5.6/');

const loader = new GLTFLoader();
loader.setDRACOLoader(dracoLoader);

loader.load(
  glbUrl,
  function(gltf) {
    const model = gltf.scene;
    scene.add(model);

    // Compute bounding box
    const box = new THREE.Box3().setFromObject(model);
    const center = box.getCenter(new THREE.Vector3());
    const size = box.getSize(new THREE.Vector3());

    // DJI Terra OBJ uses Z-up.
    // Open at ~45° angle matching DJI viewer style — camera offset in Y and Z
    const maxSpan = Math.max(size.x, size.y);
    const camDist = maxSpan * 1.4;
    let orbitTarget = center;

    if (autocapture && hasCaptureAngles) {
      // Two-pass search finds WHERE the house is (this part is validated:
      // coarse pass anchored on the address point, tight pass refines
      // onto the structure). But framing DISTANCE should not come from
      // that same detected cluster — a "tallest 5-10% of points" cluster
      // is dominated by just the roof ridge/peak, not the whole house
      // footprint, so using its radius directly makes the crop too tight
      // and risks the camera clipping into geometry. Use a generous fixed
      // radius for distance instead, sized to comfortably fit a whole
      // single-family home + a little surrounding yard.
      let focusCenter = center;
      let detectionSucceeded = false;
      let driftDistance = null;
      // Real data across all 26 properties showed this detection approach
      // is inconsistent: most properties drift a reasonable 6-30m from
      // the (confirmed accurate) address point, but several drifted
      // 100-183m — clearly walking onto an unrelated tall feature
      // (entrance gates, distant trees) rather than refining onto the
      // house. Capping the allowed drift turns those catastrophic
      // failures into a graceful fallback instead of a broken render.
      const MAX_DRIFT_METERS = 20.0;
      if (hasFocusPoint) {
        const allPoints = getAllModelPoints(model);
        // Address points are confirmed accurate on the house itself (not
        // just somewhere inside the parcel), so this only needs to cover
        // normal GPS/geocoding uncertainty — NOT the whole parcel. (A
        // previous version widened this to the parcel's full span,
        // reasoning from address-to-EDGE distance — a different
        // measurement from address-to-HOUSE distance that doesn't apply
        // here — which let the 90th-percentile height search latch onto
        // unrelated tall features elsewhere on the property, like
        // entrance gate posts or ornamental trees near the road.)
        const coarseSearchRadius = 20.0;
        const coarse = findStructureNearPoint(model, allPoints, focusXParam, focusYParam, coarseSearchRadius, 0.90);
        if (coarse) {
          const refined = findStructureNearPoint(model, allPoints, coarse.center.x, coarse.center.y, 15.0, 0.95);
          const tallCenter = (refined || coarse).center;
          const footprint = findStructureNearPoint(model, allPoints, tallCenter.x, tallCenter.y, 15.0, 0.0);
          const detected = (footprint || refined || coarse).center;

          const dx = detected.x - focusXParam, dy = detected.y - focusYParam;
          driftDistance = Math.sqrt(dx * dx + dy * dy);

          if (driftDistance <= MAX_DRIFT_METERS) {
            focusCenter = detected;
            detectionSucceeded = true;
          } else {
            // Detection wandered too far — trust the address point
            // directly instead. Still sample a real mesh height at that
            // (x, y) rather than using the raw (unreliable) input z.
            const atAddress = findStructureNearPoint(model, allPoints, focusXParam, focusYParam, 8.0, 0.0);
            focusCenter = atAddress ? atAddress.center : new THREE.Vector3(focusXParam, focusYParam, center.z);
            detectionSucceeded = true;
          }
        }
      }
      // Smart zoom: scale framing distance to THIS property's actual size
      // (maxSpan, the parcel's diagonal — already reliably computed, no
      // detection needed), same philosophy as the existing nadir pipeline's
      // zoomForBounds() which sizes the satellite image zoom from real
      // parcel bounds rather than a fixed zoom level for every property.
      // PARCEL_SIZE_FACTOR calibrated against the validated test property old
      // (181102D000600, maxSpan=285.5m) targeting ~205m framing distance,
      // confirmed visually correct.
      const PARCEL_SIZE_FACTOR = 0.718;
      const smartDistance = maxSpan * PARCEL_SIZE_FACTOR;
      const distance = detectionSucceeded
        ? smartDistance / zoom
        : (camDist * Math.SQRT2 * 0.8) / zoom;

      // Diagnostics for capture_obliques.py to read via page.evaluate —
      // avoids needing a screenshot round-trip just to see whether
      // detection succeeded and what numbers it used.
      window.__debugInfo = {
        hasFocusPoint,
        focusInputX: focusXParam,
        focusInputY: focusYParam,
        detectionSucceeded,
        driftDistance,
        driftCapped: driftDistance !== null && driftDistance > MAX_DRIFT_METERS,
        focusCenter: { x: focusCenter.x, y: focusCenter.y, z: focusCenter.z },
        distance,
        maxSpan,
        smartDistance,
        zoom,
      };
      positionCameraCompass(camera, focusCenter, azimuthParam, polarParam, distance);
      orbitTarget = focusCenter;
      controls.enabled = false;
    } else {
      // Pull camera back and up at ~45° — offset in -Y (south) and +Z (up)
      camera.position.set(
        center.x,
        center.y - camDist * 0.8,  // back
        center.z + camDist * 0.8   // up
      );
      camera.up.set(0, 0, 1);
      camera.lookAt(center);
    }
    camera.updateProjectionMatrix();

    // Orbit target — MUST match whichever point the camera above was
    // actually pointed at (full-parcel center for the default view, or
    // the detected structure center in autocapture mode). OrbitControls
    // re-derives camera orientation from this target on every update()
    // call, even with mouse input disabled — if this doesn't match the
    // lookAt target used above, the rendered view silently snaps back
    // toward the wrong point on the very next frame.
    controls.target.copy(orbitTarget);
    controls.update();

    // Store initial camera state for reset
    const initPos = camera.position.clone();
    const initTarget = controls.target.clone();

    // Expose reset function to the button
    window.resetView = function() {
      camera.position.copy(initPos);
      controls.target.copy(initTarget);
      controls.update();
    };

    // Fade in
    document.getElementById('loading').classList.add('hidden');
    if (!autocapture) {
      setTimeout(() => document.getElementById('hint').classList.add('hidden'), 4000);
    }

    // Signal readiness for capture_obliques.py — wait two frames so the
    // canvas has actually painted the positioned view before a screenshot
    // is taken, not just the first uninitialized frame.
    requestAnimationFrame(() => {
      requestAnimationFrame(() => {
        window.__viewerReady = true;
      });
    });
  },
  function(xhr) {
    if (xhr.total) {
      const pct = Math.round(xhr.loaded / xhr.total * 100);
      document.getElementById('progress').textContent = pct + '%';
    }
  },
  function(err) {
    showErr(err.message || String(err));
  }
);

// ── Render loop ───────────────────────────────────────────────────────
function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

function showErr(msg) {
  document.getElementById('loading').classList.add('hidden');
  document.getElementById('err-msg').textContent = msg;
  document.getElementById('err').classList.add('visible');
}
</script>
</body>
</html>

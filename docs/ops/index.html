    font-size: 13px;

    width: 11px;
    height: 11px;
    border-radius: 2px;
    display: inline-block;
    flex: 0 0 11px;

  .sq.done { background: var(--done); }
  .sq.in_progress { background: var(--wip); }
  .sq.blocked { background: var(--blocked); }
  .sq.not_started { background: transparent; border: 1.5px solid #d0d4da; }
  .sq.unknown { background: transparent; border: 1.5px dashed #d0d4da; }
  h2 {
    color: var(--text);
    font-size: 13px;
    letter-spacing: 0.16em;
    font-variant: small-caps;
    text-transform: lowercase;
    font-weight: 600;
    margin: 4px 0 2px;
  }

    color: var(--gold);
    font-size: 16px;
    font-weight: 600;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--gold);
  }
  .item {
    display: grid;
    grid-template-columns: 14px 1fr;
    gap: 12px;
    padding: 14px 2px 2px;
    align-items: start;
  }
  .item .sq { margin-top: 5px; }
  .item .title { font-size: 15px; font-weight: 600; line-height: 1.35; }
  .item .title .st {

    font-variant: small-caps;
    letter-spacing: 0.04em;
  }

    color: var(--muted);

    line-height: 1.5;
    margin-top: 4px;
  }

    border: 1px solid var(--blocked);
    color: #f0b4b0;
    padding: 12px 14px;
    border-radius: 8px;
    margin-bottom: 16px;
  }
  #err.visible { display: block; }
  h2.log-h { margin-top: 48px; }
  .lede {
    color: var(--muted);
    font-size: 13.5px;
    line-height: 1.55;
    margin: 10px 0 6px;
    max-width: 760px;
  }

    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 18px 20px 14px;
    margin-top: 14px;
  }
  .day-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;

    padding-bottom: 10px;
    border-bottom: 1px solid var(--gold);

  .day-head h3 {
    color: var(--gold);
    font-size: 16px;
    font-weight: 600;
  }
  .pill {
    color: var(--muted);
    font-size: 11px;
    letter-spacing: 0.08em;
    font-variant: small-caps;
    text-transform: lowercase;
    white-space: nowrap;

  .day-intro { color: var(--muted); font-size: 13.5px; line-height: 1.55; }

  .day h4 {
    color: var(--muted);
    font-size: 11px;
    letter-spacing: 0.12em;
    font-variant: small-caps;
    text-transform: lowercase;
    font-weight: 600;
    margin: 16px 0 6px;
  }
  .day ul { list-style: none; }
  .day li {
    font-size: 14px;
    line-height: 1.5;
    padding: 7px 0;
    border-top: 1px solid var(--line);
  }
  .day li:first-of-type { border-top: 0; padding-top: 0; }
  .day p.block { color: var(--muted); font-size: 13.5px; line-height: 1.55; padding: 4px 0; }
  .day .empty { color: var(--muted); }

</style>

<script>
(function () {
  var s = window.PI_STATUS;
  var err = document.getElementById('err');
  if (!s || typeof s !== 'object') {
    err.textContent = 'No snapshot in this HTML.';
    err.className = 'visible';
    return;
  }
  var b = s.board || {};
  document.getElementById('title').textContent = b.title || 'Property Intel';
  document.getElementById('summary').textContent = b.summary || '';

  var meta = document.getElementById('meta');
  meta.textContent = '';
  function addMeta(label, value) {
    meta.appendChild(document.createTextNode(label + ' '));
    var strong = document.createElement('b');
    strong.textContent = value;
    meta.appendChild(strong);
    meta.appendChild(document.createElement('br'));
  }
  addMeta('As of', b.as_of || s.as_of || '');
  addMeta('Last status write', b.last_write || '');
  meta.appendChild(document.createTextNode(b.source || 'docs/ops'));

  var kpis = document.getElementById('kpis');
  kpis.textContent = '';
  (b.kpis || []).forEach(function (k) {
    var d = document.createElement('div');
    d.className = 'kpi';
    var lab = document.createElement('div');
    lab.className = 'k';
    lab.textContent = k.label || '';
    var val = document.createElement('div');
    val.className = 'v';
    val.textContent = k.value || '—';
    var sub = document.createElement('div');
    sub.className = 's';
    sub.textContent = k.sub || '';
    d.appendChild(lab);
    d.appendChild(val);
    d.appendChild(sub);
    kpis.appendChild(d);
  });

  var root = document.getElementById('pipelines');
  root.textContent = '';
  (b.pipelines || []).forEach(function (g) {
    var wrap = document.createElement('div');
    wrap.className = 'group';
    var h = document.createElement('h3');
    h.textContent = g.name;
    wrap.appendChild(h);
    (g.items || []).forEach(function (it) {
      if (!it || !it.title) return;
      var row = document.createElement('div');
      row.className = 'item';
      var sq = document.createElement('i');
      sq.className = 'sq ' + (it.status || 'unknown');
      var body = document.createElement('div');
      var t = document.createElement('div');
      t.className = 'title';
      var st = document.createElement('span');
      st.className = 'st';
      st.textContent = it.label || String(it.status || '').replace('_', '-').toUpperCase();
      t.appendChild(st);
      t.appendChild(document.createTextNode(' ' + it.title));
      body.appendChild(t);
      if (it.note) {
        var n = document.createElement('div');
        n.className = 'note';
        n.textContent = it.note;
        body.appendChild(n);
      }
      row.appendChild(sq);
      row.appendChild(body);
      wrap.appendChild(row);
    });
    root.appendChild(wrap);
  });

  function appendInline(el, raw) {
    var re = /(`[^`]+`|\*\*[^*]+\*\*|\b[0-9a-f]{7,40}\b)/g;
    var last = 0;
    var m;
    raw = String(raw);
    while ((m = re.exec(raw))) {
      if (m.index > last) el.appendChild(document.createTextNode(raw.slice(last, m.index)));
      var tok = m[0];
      var span;
      if (tok.charAt(0) === '`') {
        span = document.createElement('code');
        span.textContent = tok.slice(1, -1);
      } else if (tok.slice(0, 2) === '**') {
        span = document.createElement('strong');
        span.textContent = tok.slice(2, -2);
      } else {
        span = document.createElement('span');
        span.className = 'sha';
        span.textContent = tok;
      }
      el.appendChild(span);
      last = m.index + tok.length;
    }
    if (last < raw.length) el.appendChild(document.createTextNode(raw.slice(last)));
  }
  function parseDays(md) {
    if (!md) return [];
    var parts = String(md).split(/^## (\d{4}-\d{2}-\d{2})\s*$/m);
    var days = [];
    for (var i = 1; i < parts.length; i += 2) {
      days.push({ date: parts[i], body: parts[i + 1] || '' });
    }
    return days;
  }
  function parseSections(body) {
    var intro = [];
    var sections = [];
    var cur = null;
    String(body || '').split('\n').forEach(function (line) {
      var h = line.match(/^###\s+(.+?)\s*$/);
      if (h) {
        cur = { title: h[1], lines: [] };
        sections.push(cur);
        return;
      }
      if (cur) cur.lines.push(line);
      else intro.push(line);
    });
    return { intro: intro.join('\n').trim(), sections: sections };
  }
  function renderParagraphs(parent, text) {
    if (!text) return;
    text.split(/\n{2,}/).forEach(function (block) {
      var p = document.createElement('p');
      appendInline(p, block.replace(/\n/g, ' ').trim());
      parent.appendChild(p);
    });
  }
  function renderSection(parent, section) {
    var h = document.createElement('h4');
    h.textContent = section.title;
    parent.appendChild(h);
    var bullets = [];
    var other = [];
    section.lines.forEach(function (line) {
      var b = line.match(/^\s*-\s+(.*)$/);
      if (b) bullets.push(b[1]);
      else if (line.trim()) other.push(line.trim());
    });
    if (!bullets.length && !other.length) {
      var empty = document.createElement('p');
      empty.className = 'block empty';
      empty.textContent = 'None.';
      parent.appendChild(empty);
      return;
    }
    other.forEach(function (line) {
      var p = document.createElement('p');
      p.className = 'block';
      appendInline(p, line);
      parent.appendChild(p);
    });
    if (bullets.length) {
      var ul = document.createElement('ul');
      bullets.forEach(function (b) {
        var li = document.createElement('li');
        appendInline(li, b);
        ul.appendChild(li);
      });
      parent.appendChild(ul);
    }
  }
  function pillFor(parsed) {
    var shipped = parsed.sections.filter(function (sec) {
      return /^shipped/i.test(sec.title);
    })[0];
    if (!shipped) return 'log day';
    var hasBullet = shipped.lines.some(function (line) { return /^\s*-\s+/.test(line); });
    return hasBullet ? 'shipped' : 'nothing shipped';
  }
  var preamble = String(s.log_markdown || '').split(/^## \d{4}-\d{2}-\d{2}\s*$/m)[0] || '';
  preamble = preamble.replace(/^# [^\n]+\n+/, '').trim();
  var lede = document.getElementById('lede');
  lede.textContent = '';
  if (preamble) {
    preamble.split(/\n{2,}/).forEach(function (block) {
      var p = document.createElement('p');
      p.textContent = block.replace(/\n/g, ' ').trim();
      lede.appendChild(p);
    });
  }
  var logRoot = document.getElementById('log');
  logRoot.textContent = '';
  var days = parseDays(s.log_markdown);
  if (!days.length) {
    var none = document.createElement('p');
    none.className = 'empty';
    none.textContent = 'No daily log in this snapshot.';
    logRoot.appendChild(none);
  } else {
    days.forEach(function (day) {
      var parsed = parseSections(day.body);
      var art = document.createElement('article');
      art.className = 'day';
      var head = document.createElement('div');
      head.className = 'day-head';
      var dh = document.createElement('h3');
      dh.textContent = day.date;
      var pill = document.createElement('span');
      pill.className = 'pill';
      pill.textContent = pillFor(parsed);
      head.appendChild(dh);
      head.appendChild(pill);
      art.appendChild(head);
      if (parsed.intro) {
        var intro = document.createElement('div');
        intro.className = 'day-intro';
        renderParagraphs(intro, parsed.intro);
        art.appendChild(intro);
      }
      parsed.sections.forEach(function (sec) { renderSection(art, sec); });
      logRoot.appendChild(art);
    });
  }
})();
</script>
